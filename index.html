0 135\" style=\"width:100%;max-width:320px;height:auto;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px;\">\n      <text x=\"10\" y=\"16\" fill=\"var(--mu)\" font-size=\"11\" font-family=\"sans-serif\">Decaimento do Iodo-131: Massa (mg) × Tempo (dias)</text>\n      <!-- Axes -->\n      <line x1=\"45\" y1=\"105\" x2=\"295\" y2=\"105\" stroke=\"var(--tx)\" stroke-width=\"1.5\"/>\n      <line x1=\"45\" y1=\"105\" x2=\"45\" y2=\"25\" stroke=\"var(--tx)\" stroke-width=\"1.5\"/>\n      <text x=\"18\" y=\"32\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">100</text>\n      <text x=\"25\" y=\"65\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">50</text>\n      <text x=\"25\" y=\"85\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">25</text>\n      <text x=\"40\" y=\"118\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">0</text>\n      <text x=\"100\" y=\"118\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">8 d</text>\n      <text x=\"160\" y=\"118\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">16 d</text>\n      <text x=\"220\" y=\"118\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">24 d</text>\n      <!-- Curve -->\n      <path d=\"M 45 30 Q 80 60, 110 65 T 170 85 T 230 95\" fill=\"none\" stroke=\"var(--ac)\" stroke-width=\"2.5\"/>\n      <circle cx=\"110\" cy=\"65\" r=\"4\" fill=\"var(--ac)\"/>\n      <line x1=\"110\" y1=\"65\" x2=\"110\" y2=\"105\" stroke=\"var(--ln)\" stroke-dasharray=\"2,2\"/>\n      <circle cx=\"170\" cy=\"85\" r=\"4\" fill=\"var(--ac)\"/>\n      <circle cx=\"230\" cy=\"95\" r=\"4\" fill=\"var(--ac)\"/>\n    </svg>\n  </div>\n  A meia-vida do iodo-131 é de exatamente 8 dias. Um hospital recebeu um frasco lacrado contendo 80 mg desse radioisótopo para procedimentos oncológicos.","Qual a massa de iodo-131 que ainda permanecerá ativa no frasco após transcorridos exatamente 24 dias da entrega?",["40 mg","20 mg","5,0 mg","10 mg","Zero mg"],3,"Cálculo estequiométrico do decaimento por meia-vida: \n1) Número de meias-vidas transcorridas (n): \nn = tempo total / t_1/2 = 24 dias / 8 dias = 3 meias-vidas completas. \n2) Aplicação da relação m = m₀ / 2ⁿ: \n• Ao final de 8 dias (1ª meia-vida): 80 mg / 2 = 40 mg \n• Ao final de 16 dias (2ª meia-vida): 40 mg / 2 = 20 mg \n• Ao final de 24 dias (3ª meia-vida): 20 mg / 2 = 10 mg de iodo-131 restante. \nOu diretamente: m = 80 mg / 2³ = 80 / 8 = 10 mg. \nAlternativa A é a massa após 1 meia-vida (8 dias); B após 2 meias-vidas (16 dias); D após 4 meias-vidas (32 dias); E supõe desaparecimento completo da massa, violando a curva assintótica do decaimento exponencial."],"Fissão e fusão nuclear (energia e impactos)":["As reações nucleares de fissão e fusão envolvem transformações profundas na composição dos núcleos atômicos, liberando quantidades colossais de energia decorrentes da conversão de uma pequena fração de massa nuclear em energia térmica e radiante, governada pela célebre equação de Albert Einstein: E = Δm · c² (onde c = 3,0 × 10⁸ m/s). 1) Fissão Nuclear: consiste na partição induzida de um núcleo atômico pesado e instável (como o urânio-235 ou plutônio-239) quando bombardeado por um nêutron térmico lento. O núcleo quebra-se em dois fragmentos menores de massas intermediárias (como bário-141 e criptônio-92), liberando 2 a 3 novos nêutrons rápidos e imensa energia: ²³⁵₉₂U + ¹₀n → ¹⁴¹₅₆Ba + ⁹²₃₆Kr + 3 ¹₀n + energia. Os nêutrons liberados colidem com novos núcleos vizinhos de U-235 sustentando uma reação em cadeia autoalimentada. É o princípio das usinas nucleares (onde a reação é controlada por barras de cádmio ou boro moderadoras) e de bombas atômicas. O grande passivo ecológico da fissão é a geração de lixo atômico de alta radioatividade que exige confinamento hermético por milênios; 2) Fusão Nuclear: consiste na união forçada de dois núcleos atômicos extremamente leves para formar um núcleo mais pesado e estável (como a fusão de isótopos de hidrogênio deutério ²H e trítio ³H formando hélio ⁴He e 1 nêutron: ²₁H + ³₁H → ⁴₂He + ¹₀n + energia). Libera mais energia por unidade de massa do que a fissão, não emite gases de efeito estufa e não gera lixo de longa meia-vida, sendo a fonte de energia do Sol e de todas as estrelas; contudo, exige temperaturas extremas da ordem de 100 milhões de graus Celsius (plasma termonuclear) para vencer a barreira de repulsão eletrostática entre os núcleos positivos, estando ainda em fase experimental (reator ITER).",["Fissão nuclear: núcleo PESADO quebra-se em núcleos menores (U-235 + nêutron)","Fusão nuclear: núcleos LEVES unem-se formando núcleo mais pesado (²H + ³H → ⁴He + n)","Equivalência massa-energia: E = Δm · c² (o 'defeito de massa' converte-se em energia)","Reação em cadeia: nêutrons liberados na fissão provocam novas fissões sucessivas","Vantagem da fusão: combustível abundante (água do mar), sem lixo nuclear de longa vida"],"Cuidado no ENEM para não trocar os nomes: FISSÃO é a divisão (o núcleo pesado se fende ao meio, como nas usinas nucleares de Angra dos Reis); FUSÃO é a junção (núcleos leves se fundem, como no coração do Sol)!","A matriz energética mundial busca transições sustentáveis de baixo carbono para combater as mudanças climáticas globais. No setor nuclear, usinas em operação comercial no mundo baseiam-se na fissão de núcleos pesados de urânio, enquanto projetos internacionais de pesquisa de ponta (como o consórcio do reator ITER) tentam viabilizar usinas baseadas na fusão de núcleos de hidrogênio.","Comparando os dois processos nucleares, a fusão nuclear apresenta como vantagem primordial em relação à fissão nuclear convencional o fato de que a fusão:",["consome minérios raros e caros de urânio enriquecido como única matéria-prima.","não necessita de nenhuma energia de ativação ou alta temperatura para ocorrer na Terra.","produz quantidade consideravelmente menor de energia por grama de combustível que a fissão.","é uma reação endotérmica que absorve calor das cidades resfriando a atmosfera.","utiliza isótopos leves e abundantes de hidrogênio e não produz rejeitos radioativos de longa meia-vida (lixo nuclear)."],4,"A fusão nuclear é apontada como a fonte definitiva de energia limpa para a humanidade por apresentar vantagens estratégicas contundentes sobre a fissão nuclear: 1) Combustível quase inesgotável: seus reagentes principais são os isótopos de hidrogênio deutério (²H, extraído com facilidade e abundância da água do mar) e trítio (³H, gerado a partir do lítio natural); 2) Segurança intrínseca: a fusão não é uma reação em cadeia descontrolada; qualquer desestabilização do confinamento magnético do plasma resfria o reator e cessa instantaneamente a reação sem risco de colapso ou explosão; 3) Ausência de resíduos radiotóxicos duradouros: o produto nuclear primário da fusão é o gás hélio (⁴He), um elemento inerte, não tóxico e não radioativo, eliminando o dramático problema do armazenamento geológico de lixo atômico de alta intensidade por milênios (resíduo típico dos produtos de fissão como césio-137 e estrôncio-90). Além disso, a energia liberada por grama na fusão é cerca de 4 a 5 vezes superior à da fissão de urânio. Alternativa A confunde os combustíveis; B é falsa pois a fusão requer temperaturas superiores a 100 milhões de graus para superar a repulsão Coulombiana; C erra a densidade energética; E classifica erroneamente a fusão como endotérmica."],"Aplicações na medicina e datação por carbono-14":["As propriedades das emissões radioativas têm aplicações práticas revolucionárias na sociedade moderna, especialmente na arqueologia e na medicina diagnóstica e terapêutica: 1) Datação por Carbono-14: o isótopo radioativo carbono-14 (¹⁴C, meia-vida de 5 730 anos) é continuamente produzido na alta atmosfera pela colisão de nêutrons de raios cósmicos com átomos de nitrogênio (¹⁴₇N + ¹₀n → ¹⁴₆C + ¹₁p). O ¹⁴C oxida-se a CO₂ e é incorporado à biosfera através da fotossíntese vegetal e transferido pela cadeia alimentar a todos os animais. Enquanto o organismo está vivo e interagindo com o meio ambiente (respirando e se alimentando), a proporção entre o carbono-14 radioativo e o carbono-12 estável em seus tecidos orgânicos permanece rigorosamente constante. Quando o organismo morre, a absorção de carbono cessa imediatamente; a partir desse instante, a quantidade de ¹⁴C começa a diminuir progressivamente através do decaimento beta (¹⁴₆C → ¹⁴₇N + ⁰₋₁β) na taxa constante de sua meia-vida de 5 730 anos. Medindo-se a atividade radioativa residual por grama de carbono em fósseis (ossos, madeiras, tecidos), é possível calcular com precisão a data da morte do ser vivo em amostras de até cerca de 50 000 anos; 2) Medicina Nuclear: radioisótopos com meias-vidas curtas são empregados como traçadores em exames de tomografia por emissão de pósitrons (PET-Scan com flúor-18) e cintilografia (tecnécio-99m), bem como na destruição localizada de tumores cancerígenos por radioterapia externa (fontes de cobalto-60) ou braquiterapia interna (sementes de iodo-125).",["Carbono-14 (meia-vida = 5 730 anos): datação de fósseis e artefatos de origem biológica","Organismo vivo: razão ¹⁴C / ¹²C constante (renovação por fotossíntese e alimentação)","Organismo morto: cessa assimilação → ¹⁴C decai por emissão beta sem ser reposto","Medicina nuclear diagnóstica: radiofármacos com meia-vida curta (Tc-99m, F-18)","Medicina nuclear terapêutica: radioterapia com feixes gama de Co-60 e I-131 para tireoide"],"Cuidado no ENEM: o método do Carbono-14 só funciona para datar restos de seres VIVOS (madeira, ossos, tecidos) que morreram há menos de 50 a 60 mil anos! Não serve para datar rochas da época dos dinossauros (para isso usam-se métodos como Urânio-Chumbo ou Potássio-Argônio de bilhões de anos).","Arqueólogos descobriram um fragmento de remo de madeira em uma caverna pré-histórica submersa. A análise por espectrometria de massas com acelerador revelou que a quantidade de carbono-14 (¹⁴C) por grama de carbono na amostra de madeira arqueológica corresponde a exatamente 25% (ou 1/4) da quantidade encontrada em árvores vivas da mesma espécie na atualidade. Considere que a meia-vida do carbono-14 é de aproximadamente 5 730 anos.","A idade estimada do remo de madeira e o princípio que fundamenta a datação arqueológica são, respectivamente:",["11 460 anos; a partir da morte da árvore, a assimilação de carbono cessou e o carbono-14 sofreu duas meias-vidas de decaimento espontâneo.","5 730 anos; a madeira absorveu nêutrons cósmicos durante o sepultamento na caverna.","2 865 anos; o carbono-14 acelera seu decaimento na ausência de luz solar.","22 920 anos; a taxa de decomposição do carbono-12 ultrapassou a do carbono-14.","17 190 anos; o carbono-14 foi neutralizado pelas chuvas ácidas no interior da gruta."],0,"Resolução do cálculo de datação por Carbono-14: \n1) Fração restante de ¹⁴C: a amostra apresenta 25% da atividade original de um organismo vivo. \nComo 25% = 25/100 = 1/4 = (1/2)², decorreram exatamente 2 meias-vidas completas desde a morte do vegetal (n = 2). \n2) Cálculo do tempo transcorrido (idade do achado arqueológico): \nIdade = n × t_1/2 = 2 × 5 730 anos = 11 460 anos. \n3) Fundamento científico: enquanto a árvore estava viva, o ¹⁴C era continuamente incorporado pelas folhas através da fotossíntese a partir do CO₂ atmosférico, mantendo uma proporção fixa ¹⁴C/¹²C em equilíbrio dinâmico com a atmosfera. No momento em que a árvore foi cortada para confecção do remo (morte biológica), as trocas metabólicas com o ar cessaram por completo. A partir de então, o reservatório de ¹⁴C presente nas fibras celulósicas decaiu espontaneamente por emissão beta a cada 5 730 anos sem nenhuma reposição, permitindo datar com rigor a idade da peça. Alternativa C usa meia vida dividida por 2; B usa apenas 1 meia-vida (5 730 anos, o que daria 50% restante); D usa 4 meias-vidas (6,25%); E usa 3 meias-vidas (12,5%)."],"Séries radioativas naturais e transmutação nuclear":["Núcleos atômicos pesados instáveis encontrados na natureza (com número atômico Z > 83) desintegram-se espontaneamente através de sequências sucessivas e encadeadas de emissões de partículas alfa (⁴₂α) e partículas beta (⁰₋₁β) até atingirem uma configuração nuclear estável e não radioativa: são as Séries ou Famílias Radioativas Naturais. Existem três séries naturais principais: 1) Série do Urânio-238 (família 4n + 2, inicia no ²³⁸₉₂U e termina no isótopo estável chumbo-206, ²⁰⁶₈₂Pb, após 8 emissões alfa e 6 emissões beta); 2) Série do Tório-232 (família 4n, termina no chumbo-208); 3) Série do Actínio/Urânio-235 (família 4n + 3, termina no chumbo-207). Por sua vez, a Transmutação Nuclear consiste na transformação induzida de um elemento químico em outro através da alteração do número de prótons em seu núcleo. A primeira transmutação nuclear artificial da história foi realizada em 1919 por Ernest Rutherford, ao bombardear gás nitrogênio-14 com partículas alfa emitidas por fonte radioativa, produzindo oxigênio-17 e liberando prótons livres: ¹⁴₇N + ⁴₂α → ¹⁷₈O + ¹₁p. Esse experimento histórico comprovou a existência do próton como partícula constituinte do núcleo atômico e abriu as portas para a síntese de novos radioisótopos artificiais na medicina e a criação de elementos transurânicos (elementos com Z > 92, como plutônio ²³⁹₉₄Pu e amerício) sintetizados em aceleradores de partículas.",["Séries radioativas naturais: cadeias de decaimentos sucessivos (alfa e beta) que terminam sempre em isótopos estáveis de CHUMBO (Pb)","Família do Urânio-238: ²³⁸₉₂U → decai sucessivamente até ²⁰⁶₈₂Pb estável","Transmutação nuclear: transformação de um elemento químico em outro pela alteração de prótons no núcleo","Primeira transmutação artificial (Rutherford, 1919): ¹⁴₇N + ⁴₂α → ¹⁷₈O + ¹₁p (descoberta do próton)","Elementos transurânicos (Z > 92): todos artificiais e sintetizados pelo homem por transmutação nuclear em reatores ou aceleradores"],"Cuidado no ENEM: o sonho dos antigos alquimistas de 'transformar um elemento em outro' foi realizado pela química nuclear moderna através da TRANSMUTAÇÃO nuclear, onde núcleos são bombardeados alterando seu número atômico!","Em 1919, Ernest Rutherford realizou no Laboratório Cavendish a primeira transmutação nuclear artificial controlada pela humanidade, ao bombardear átomos estáveis de gás nitrogênio-14 com partículas alfa (núcleos de hélio, ⁴₂α) de alta energia, de acordo com a equação nuclear balanceada: \n¹⁴₇N + ⁴₂α → ᴬ_Z X + ¹₁p.","Pelas leis de conservação do número de massa e da carga elétrica nuclear, o isótopo produzido (ᴬ_Z X) e o significado histórico dessa reação para a ciência foram, respectivamente:",["¹⁶₈O (oxigênio-16); a comprovação da indivisibilidade do átomo de Dalton.","¹⁷₈O (oxigênio-17); a primeira comprovação de que o núcleo atômico pode ser artificialmente transmutado em outro elemento químico, com a identificação do próton (¹₁p) como partícula subatômica fundamental.","¹⁸₉F (flúor-18); a descoberta do primeiro gás nobre sintético.","¹²₆C (carbono-12); a demonstração de que reações nucleares criam matéria a partir do nada.","²⁰₁₀Ne (neônio-20); a invenção da pilha galvânica espontânea."],1,"Resolução: Em qualquer reação nuclear balanceada, devem vigorar rigorosamente duas leis de conservação: 1) Conservação do Número de Massa (soma dos índices superiores): \n14 + 4 = A + 1 → 18 = A + 1 → A = 17; \n2) Conservação do Número Atômico ou Carga Nuclear (soma dos índices inferiores): \n7 + 2 = Z + 1 → 9 = Z + 1 → Z = 8. \nO número atômico Z = 8 identifica universalmente o elemento químico Oxigênio (O). Portanto, o núcleo formado é o isótopo estável oxigênio-17 (¹⁷₈O). Historicamente, esse experimento foi de importância monumental: pela primeira vez na história, o ser humano conseguiu concretizar o antigo sonho dos alquimistas de transformar (transmutar) artificialmente um elemento químico (o gás nitrogênio) em um elemento químico inteiramente diferente (o gás oxigênio). Além disso, a partícula ejetada ¹₁p possuía massa 1 e carga elétrica unitária positiva +1, sendo batizada por Rutherford de 'próton' e reconhecida como constituinte estrutural de todos os núcleos atômicos da matéria. Alternativas A, C, D e E trazem coeficientes nucleares ou conclusões incorretas."],"Radiofármacos e aplicações na medicina diagnóstica":["A medicina nuclear utiliza compostos químicos ligados a radioisótopos — denominados radiofármacos — administrados aos pacientes em doses seguras para diagnóstico por imagem em tempo real de órgãos e funções metabólicas ou para terapia oncológica localizada. Um radiofármaco diagnóstico ideal deve atender a critérios rigorosos: 1) Possuir meia-vida biológica e física curta (de algumas horas a poucos dias), suficiente para permitir a realização do exame e a emissão das imagens sem expor o paciente a radiações desnecessárias a longo prazo; 2) Emitir preferencialmente radiação gama (γ) pura ou pósitrons (β⁺), que possuem alto poder de penetração e atravessam facilmente os tecidos corporais para serem detectados com nitidez por câmeras de cintilografia externas, sem causar ionizações destrutivas severas nos tecidos circundantes (radiações alfa e beta de alto poder ionizante são evitadas em diagnósticos); 3) Ser biocompatível e direcionar-se a órgãos específicos. O radioisótopo diagnóstico mais utilizado em hospitais no mundo (em mais de 80% dos procedimentos) é o Tecnécio-99m (⁹⁹ᵐTc, emissor gama puro com meia-vida de 6,0 horas, gerado a partir do decaimento do molibdênio-99). Outro exemplo revolucionário é a Tomografia por Emissão de Pósitrons (PET-Scan), que utiliza a fluordesoxiglicose marcada com Flúor-18 (¹⁸F, emissor de pósitrons com meia-vida de 110 minutos): células cancerosas tumorais têm taxa metabólica glicolítica acelerada, absorvendo avidamente a glicose radioativa e 'acendendo' nas imagens tomográficas.",["Radiofármacos diagnósticos: substâncias biológicas marcadas com radioisótopos emissores de radiação gama pura ou pósitrons","Critérios de segurança: meia-vida curta (horas) e radiação com alto poder de penetração que sai do corpo sem queimar tecidos","Tecnécio-99m (⁹⁹ᵐTc): emissor gama puro, meia-vida de 6 horas; usado em cintilografia óssea, cardíaca e renal","Flúor-18 (¹⁸F): emissor de pósitrons (β⁺) com meia-vida de 110 min, usado em PET-Scan para detectar metástases tumorais","Iodo-131 (¹³¹I): emissor beta e gama com afinidade natural pela tireoide, usado tanto no diagnóstico quanto na radioterapia oncológica"],"Cuidado no ENEM: para EXAME DIAGNÓSTICO usa-se radiação GAMA (γ) de meia-vida curta (horas), porque ela atravessa o corpo e chega na câmera externa sem destruir os órgãos do paciente!","A medicina nuclear diagnóstica utiliza amplamente o radioisótopo tecnécio-99m (⁹⁹ᵐTc) em exames de cintilografia para avaliar o funcionamento de órgãos como coração, ossos e rins. O tecnécio-99m possui meia-vida física de aproximadamente 6,0 horas e decai para o tecnécio-99 no estado fundamental emitindo exclusivamente radiação gama (γ).","As propriedades que tornam o tecnécio-99m o radioisótopo de escolha ideal para procedimentos de diagnóstico médico por imagem são:",["sua meia-vida extremamente longa de cem anos e sua emissão de partículas alfa de alto poder destrutivo local.","seu caráter puramente gasoso que é eliminado imediatamente pela respiração nos primeiros dez segundos de exame.","sua meia-vida curta de poucas horas, que minimiza a exposição do paciente à radiação após o exame, e a emissão de radiação gama de alta penetração, que atravessa os tecidos biológicos e pode ser detectada externamente por gama-câmaras.","sua capacidade de provocar combustão espontânea que queima tumores sem qualquer detector.","seu comportamento magnético que atrai os elétrons do sangue transformando o ferro em ouro."],2,"Resolução: A escolha criteriosa de radioisótopos em medicina nuclear diagnóstica busca maximizar a qualidade das imagens médicas geradas enquanto minimiza a dose de radiação absorvida pelo paciente (princípio radiológico ALARA: 'As Low As Reasonably Achievable'). O tecnécio-99m (⁹⁹ᵐTc) atende com perfeição a esses dois requisitos fundamentais: 1) Meia-vida de 6,0 horas: trata-se de um período de semidesintegração ideal, longo o bastante para permitir a preparação química do radiofármaco, administração intravenosa, captação pelo órgão-alvo e realização das imagens cintilográficas, porém suficientemente curto para decair rapidamente nas horas seguintes, fazendo com que a radioatividade residual no corpo do paciente caia para menos de 6% em apenas 24 horas; 2) Emissão gama (γ) pura de energia intermediária (~140 keV): os fótons gama possuem altíssimo poder de penetração, atravessando com facilidade os tecidos musculares e ossos do paciente para atingir os cristais detectores das gama-câmaras externas com mínima absorção no trajeto e sem causar ionizações celulares destrutivas intensas (ao contrário de emissores alfa ou beta, que transferem muita energia cinética aos tecidos adjacentes provocando lesões celulares e são evitados em diagnósticos). Alternativas A, C, D e E trazem alegações incompatíveis com a radioproteção médica."],"Acidentes nucleares históricos e gestão de rejeitos":["O uso da tecnologia nuclear na geração termelétrica e na medicina exige rigorosos protocolos de engenharia de segurança e contenção redundante para evitar a liberação de radionuclídeos tóxicos no ambiente. Dois acidentes históricos emblemáticos marcaram a regulação nuclear global: 1) Acidente de Chernobyl (Ucrânia, 1986): durante um teste de segurança mal conduzido no reator RBMK-1000, ocorreu uma excursão de potência descontrolada que provocou explosões térmicas de vapor e queima do grafite moderador, dispersando toneladas de material físsil e produtos de fissão altamente radiotóxicos na atmosfera (destacando-se iodo-131, césio-137 e estrôncio-90, que contaminaram solos e bacias hidrográficas em grande parte da Europa); 2) Acidente com o Césio-137 em Goiânia (Brasil, 1987): o maior acidente radiológico em área urbana da história ocorreu quando catadores de sucata violaram um cabeçote de radioterapia abandonado em um instituto médico desativado, encontrando cloreto de césio (¹³⁷CsCl), um sal pó branco que brilhava no escuro com luminescência azulada. O sal espalhou-se por contato manual, contaminando centenas de pessoas com queimaduras por radiação e ceifando vidas. O césio-137 emite partículas beta e radiação gama penetrante e possui meia-vida de cerca de 30 anos; no organismo, comporta-se quimicamente como análogo do potássio (K⁺), distribuindo-se por toda a musculatura. Rejeitos radioativos (lixo atômico) classificam-se em baixa, média e alta intensidade: rejeitos de alta atividade (combustível queimado de usinas nucleares) são imobilizados por vitrificação em blocos de vidro borossilicato selados em cilindros de aço e armazenados em depósitos geológicos subterrâneos profundos (a centenas de metros sob rochas graníticas impermeáveis estáveis) para garantir isolamento seguro durante milênios.",["Acidente de Chernobyl (1986): explosão de reator nuclear dispersando produtos de fissão (I-131, Cs-137, Sr-90)","Acidente de Goiânia (1987): maior acidente radiológico urbano do mundo, provocado pela violação de cápsula abandonada de Césio-137 (¹³⁷CsCl)","Césio-137: meia-vida de 30 anos, emissor beta e gama penetrante; assemelha-se quimicamente ao potássio (K⁺) acumulando-se nos músculos","Lixo atômico de alta intensidade: resíduos de combustível usado de reatores nucleares; exigem séculos de confinamento seguro","Vitrificação e depósitos geológicos profundos: confinamento em recipientes herméticos sob rochas subterrâneas estáveis sem contato com o lençol freático"],"Cuidado no ENEM: o acidente de Goiânia com o Césio-137 NÃO foi explosão de usina nuclear! Foi um acidente RADIOLÓGICO urbano provocado pelo abandono indevido de um aparelho de radioterapia em clínica desativada.","Em setembro de 1987, a cidade de Goiânia foi palco do maior acidente radiológico da história mundial, deflagrado quando uma fonte de radioterapia abandonada contendo cloreto de césio-137 (¹³⁷CsCl) foi rompida por sucateiros atraídos pelo fascinante brilho azul emitido pelo sal no escuro.","A respeito das propriedades do césio-137 e das medidas de segurança adotadas para a contenção definitiva das milhares de toneladas de rejeitos gerados na descontaminação da cidade, constata-se que o césio-137:",["é um gás nobre volátil de meia-vida de dois segundos que evaporou instantaneamente sem deixar contaminação no solo.","foi neutralizado completamente mediante a aspersão de suco de limão alcalino sobre as casas atingidas.","sofreu fissão nuclear explosiva que destruiu a atmosfera com cogumelo atômico.","é um isótopo radioativo de meia-vida de cerca de 30 anos que emite radiação ionizante penetrante, cujos resíduos sólidos foram selados e acondicionados em contêineres de concreto de alta durabilidade em depósito definitivo seguro na cidade de Abadia de Goiás.","é um material inócuo que apenas conferiu fosforescência estética à água de abastecimento público."],3,"Resolução: O césio-137 (¹³⁷Cs) é um radioisótopo artificial gerado como produto de fissão nuclear em reatores, com tempo de meia-vida de aproximadamente 30,1 anos. O composto presente no cabeçote de teleterapia violado era o cloreto de césio (¹³⁷CsCl), um sal sólido altamente solúvel e pulverulento. Ao decair por emissão de partículas beta e de radiação gama altamente energética e penetrante (através do bário-137m excitado), ele ioniza e quebra as moléculas de DNA celulares, causando queimaduras radiológicas agudas (radiodermite), supressão da medula óssea e óbitos. Como o sal foi manipulado e espalhado involuntariamente pelas famílias e ferros-velhos, a Comissão Nacional de Energia Nuclear (CNEN) teve que realizar uma gigantesca operação de descontaminação que recolheu cerca de 6 000 toneladas de rejeitos radioativos (materiais de construção, terra, móveis, roupas). Todo esse material contaminado foi criteriosamente classificado, acondicionado em tambores metálicos, caixas metálicas e super-contêineres de concreto blindado especialmente projetados para resistir a intempéries por centenas de anos, sendo armazenado no Centro Regional de Ciências Nucleares do Centro-Oeste (CRCN-CO), em depósito geológico definitivo em Abadia de Goiás (GO), monitorado continuamente. Alternativas A, C, D e E trazem formulações distorcidas ou absurdas sobre o acidente."]};

function vTrp(){
  const traps=[
    {t:"Concentrado ≠ Forte",d:"Força é grau de ionização (capacidade de liberar H⁺). Concentração é a quantidade de soluto dissolvido por volume. Exemplo clássico: HCl 0,01 mol/L é muito diluído e muito FORTE; já o ácido acético glacial puro é concentradíssimo e FRACO (Ka ~ 1,8 × 10⁻⁵)."},
    {t:"Massa ≠ Quantidade de Matéria (Mol)",d:"1 mol de diferentes substâncias possui o mesmo número de moléculas (6,02 × 10²³), mas massas completamente distintas! 1 mol de H₂ pesa apenas 2 g, enquanto 1 mol de O₂ pesa 32 g e 1 mol de C₆H₁₂O₆ pesa 180 g."},
    {t:"Catalisador NÃO desloca Equilíbrio Químico",d:"O catalisador apenas diminui a energia de ativação (Ea) acelerando as velocidades direta e inversa na MESMA proporção. Ele permite atingir o equilíbrio mais rápido, mas não altera as concentrações finais, não aumenta o rendimento e NÃO altera a constante Kc."},
    {t:"Ka maior indica Ácido mais Forte",d:"Quanto maior for a constante de ionização Ka, maior é a concentração de íons H⁺ liberados em solução aquosa e mais forte é o ácido. Cuidado: pKa = −log(Ka), portanto quanto MENOR o pKa, MAIS FORTE é o ácido!"},
    {t:"ΔH < 0 significa Reação Exotérmica",d:"O sinal do ΔH refere-se ao sistema químico: se ΔH < 0, a entalpia dos produtos é menor que a dos reagentes, ou seja, o sistema perdeu calor transferindo-o para a vizinhança (o ambiente esquenta). Em reações endotérmicas (ΔH > 0), o sistema absorve calor e o ambiente resfria."},
    {t:"D-O-R: Dá elétron → Oxida → Agente Redutor",d:"Oxidação é a PERDA de elétrons (aumento do NOX); a espécie que oxida causa a redução do outro, sendo o agente redutor. Redução é o GANHO de elétrons (diminuição do NOX); quem reduz é o agente oxidante."},
    {t:"C-R-A-O: Cátodo sempre Reduz; Ânodo sempre Oxida",d:"Vogal com vogal, consoante com consoante! Ânodo Oxida; Cátodo Reduz. Atenção à polaridade: na pilha galvânica espontânea, o cátodo é o polo positivo (+) e o ânodo é negativo (−); na eletrólise não espontânea forçada por fonte externa, o cátodo é negativo (−) e o ânodo é positivo (+)."},
    {t:"Pilha vs Eletrólise",d:"Pilha converte energia química em elétrica de forma espontânea (ΔE° > 0, ΔG < 0). Eletrólise usa eletricidade externa para forçar uma reação química não espontânea (energia elétrica → química, ΔE° < 0, ΔG > 0)."},
    {t:"Isômeros têm a Mesma Fórmula Molecular",d:"Dois compostos só são isômeros se tiverem RIGOROSAMENTE a mesma fórmula molecular (mesma contagem de cada átomo). Se diferirem em um único hidrogênio ou oxigênio, NÃO são isômeros!"},
    {t:"Alótropos são Substâncias Simples do Mesmo Elemento",d:"Alotropia ocorre entre substâncias simples diferentes formadas pelo mesmo elemento: Diamante e Grafite (ambos C); O₂ e O₃ (ambos O); Fósforo branco e vermelho (ambos P). Alótropos NÃO são isômeros."},
    {t:"Balanceie Sempre Antes de Calcular!",d:"Nunca aplique massas molares ou volumes gasosos antes de verificar se a equação química fornecida no enunciado está estequiometricamente balanceada. Uma equação desbalanceada invalida todo o raciocínio."},
    {t:"Temperatura de Gases SEMPRE em Kelvin (K)",d:"Nas equações de Clapeyron (PV = nRT) e transformações gasosas (P₁V₁/T₁ = P₂V₂/T₂), a temperatura NUNCA pode ser colocada em graus Celsius! Converta sempre somando 273: T(K) = T(°C) + 273."},
    {t:"Efeito Estufa Natural é Vital; o Problema é a Intensificação",d:"Sem o efeito estufa natural promovido pelo vapor de água e CO₂, a Terra seria congelada (−18 °C). O problema ambiental é a INTENSIFICAÇÃO antrópica gerada pela queima massiva de combustíveis fósseis e desmatamento retendo radiação infravermelha em excesso."},
    {t:"Chuva Não Poluída JÁ É Ácida (pH ~5,6)",d:"A água da chuva natural já dissolve CO₂ atmosférico formando o ácido carbônico fraco (H₂CO₃), resultando em pH ~5,6. Chuva ácida poluente é aquela com pH inferior a 5,6, provocada por óxidos de enxofre (SO_x) e nitrogênio (NO_x) gerando ácidos fortes (H₂SO₄ e HNO₃)."},

}

  let A=0,E=0;Object.values(S.res).forEach(r=>{A+=r.a;E+=r.e});const T=A+E;
  const cs=[["✅",doneN()+"/"+FLAT.length,"assuntos concluídos"],["🎯",T?Math.round(100*A/T)+"%":"—","taxa de acerto"],["✔",A,"acertos"],["✘",E,"erros"],["⏱",fmt(S.t),"tempo de estudo"],["📝",S.sims.length,"simulados feitos"]];
  return`<h1 class="a">📊 Estatísticas e Histórico</h1><div class="g3">${cs.map((c,k)=>`<div class="bx stat a" style="--i:${k}"><span>${c[0]}</span><b>${c[1]}</b><small>${c[2]}</small></div>`).join("")}</div><h2 class="a">Acertos e Erros por Módulo</h2><div class="bx a">${M.map((m,i)=>{const s=ms(i);return`<div class="mr"><span>${IC[i]} ${m.n}</span><div class="sb"><i class="g1" data-w="${s.t?100*s.a/s.t:0}"></i><i class="e1" data-w="${s.t?100*s.e/s.t:0}"></i></div><small>${s.t?`${s.a} certas · ${s.e} erradas · ${s.p}%`:"—"}</small></div>`}).join("")}</div><h2 class="a">Últimos Simulados Realizados</h2>${S.sims.length?`<div class="bx a">${S.sims.map(x=>`<div class="mr2"><span>${new Date(x.d).toLocaleDateString("pt-BR")} · ${x.t}</span><b>${x.s}/${x.n} (${Math.round(100*x.s/x.n)}%)</b><small>${fmt(x.sec)}</small></div>`).join("")}</div>`:`<p class="mu">Nenhum simulado registrado ainda. Inicie um simulado na aba Simulado.</p>`}<div class="row" style="margin-top:20px"><a class="bt gh" href="#/rv">🔁 Revisar questões erradas (${Object.keys(S.wrong).length})</a><button class="bt gh" onclick="rst()">Zerar estatísticas</button></div>`;
}

function rst(){
  if(confirm("Deseja realmente zerar acertos, erros, simulados e tempo de estudo? Seus tópicos concluídos e favoritos permanecerão salvos.")){
    S.res={};S.wrong={};S.sims=[];S.t=0;sv();render();
  }
}

function vRv(){
  const l=uniq(FLAT).filter(x=>S.wrong[x.n]);
  return`<h1 class="a">🔁 Caderno de Revisão de Erros</h1>`+(l.length?`<p class="a mu">Questões que você errou na última tentativa. Ao acertá-las em um novo teste, elas saem automaticamente desta lista.</p><div class="row a"><button class="bt" onclick="startRev()">▶ Refazer as ${l.length} erradas</button></div>`+l.map(row).join(""):(`<div class="bx empty a">🎉<p>Nenhuma questão pendente de revisão no momento! Continue praticando nos simulados.</p><a class="bt" href="#/sim">Fazer Simulado</a></div>`));
}

function vFv(){
  const l=FLAT.filter(x=>S.fav[x.i+"."+x.j]);
  return`<h1 class="a">⭐ Tópicos Favoritos</h1>`+(l.length?l.map(row).join(""):(`<div class="bx empty a">⭐<p>Toque na estrela de qualquer assunto para adicioná-lo à sua lista de revisão rápida.</p><a class="bt" href="#/">Ver todos os assuntos</a></div>`));
}

function render(){
  const p=location.hash.replace(/^#\/?/,"").split("/"),v=p[0];
  view=v;st.q=null;let o;
  if(v=="m")o=vMod(+p[1]);
  else if(v=="s"){cur={i:+p[1],j:+p[2]};o=vSub(cur.i,cur.j)}
  else if(v=="sim")o=vSim();
  else if(v=="q")o=vQ();
  else if(v=="fc")o=vFc(p[1]);
  else if(v=="map")o=vMap();
  else if(v=="gls")o=vGls();
  else if(v=="trp")o=vTrp();
  else if(v=="st")o=vSt();
  else if(v=="rv")o=vRv();
  else if(v=="fv")o=vFv();
  else{view="";o=vHome()}
  if(o==null)return;
  q("#app").innerHTML=o;bars();
  const act=["m","s",""].includes(view)?"":view=="q"?"sim":view;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r==act));
  scrollTo(0,0);
}

function th(){
  const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  S.theme=dark?"light":"dark";d.dataset.theme=S.theme;sv();
}
if(S.theme)document.documentElement.dataset.theme=S.theme;

const tick=()=>{
  const e=q("#tm");if(e)e.textContent=(run?"⏸ ":"⏱ ")+fmt(S.t);
  const t=q("#qt");if(t&&Q&&Q.k<Q.list.length)t.textContent="⏱ "+fmt(Math.floor((Date.now()-Q.t0)/1000));
};
function tmT(){run=!run;tick()}
setInterval(()=>{if(run){S.t++;if(S.t%5==0)sv()}tick()},1000);

addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){if(e.key=="Escape")e.target.blur();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k=="/"){const s=q("#sq")||q("#gsq");if(s){e.preventDefault();s.focus()}return}
  const oi=k.length==1&&"abcde".includes(k.toLowerCase())?"abcde".indexOf(k.toLowerCase()):"12345".indexOf(k);
  if((view=="s"||view=="q")&&oi>=0&&k.length==1){pick(oi);return}
  if(k=="ArrowRight"){if(view=="s")navS(1);else if(view=="q"&&Q&&Q.sel!=null)nextQ();else if(view=="fc")fcGo(1)}
  else if(k=="ArrowLeft"){if(view=="s")navS(-1);else if(view=="fc")fcGo(-1)}
  else if(k==" "&&view=="fc"){e.preventDefault();flipFc()}
  else if(k=="Enter"&&view=="q"&&Q&&Q.sel!=null)nextQ();
  else if(k=="Escape"&&view!="")go("");
});
addEventListener("pagehide",sv);addEventListener("hashchange",render);render();tick();
</script>
</body>
</html>
