 metálicos da solução que ganham elétrons e se depositam como metal neutro sobre ela); o ânodo é feito do próprio metal que se deseja depositar ou de material inerte; 2) Anodização (destacadamente do alumínio): a peça de alumínio é conectada como o ÂNODO da cuba eletrolítica (polo positivo) imersa em banho de ácido sulfúrico. A oxidação forçada da água no ânodo libera oxigênio nascente que reage com a superfície do metal formando uma camada espessa, compacta, uniforme e extremamente aderente de alumina ou óxido de alumínio (Al₂O₃). Essa camada protege o alumínio subjacente contra corrosão atmosférica e possui estrutura microporosa que pode absorver corantes orgânicos, gerando o alumínio anodizado colorido usado em esquadrias, smartphones e utensílios.",["Galvanoplastia: peça a revestir fica SEMPRE no CÁTODO (−) da eletrólise","Exemplos de galvanoplastia: cromagem de peças de carro, niquelação, douração de joias","Anodização do alumínio: peça de alumínio fica no ÂNODO (+) da eletrólise","Camada protetora da anodização: óxido de alumínio (Al₂O₃, alumina) compacto e passivador","Coloração do alumínio: poros da camada de Al₂O₃ absorvem corantes antes da selagem"],"Cuidado no ENEM: para dourar ou niquelar uma peça (galvanoplastia), a peça é o CÁTODO (−) onde o metal reduz; na anodização do alumínio, a peça é o ÂNODO (+) onde o alumínio oxida formando Al₂O₃ protetor!","A indústria automobilística e a de eletroeletrônicos utilizam amplamente peças de alumínio anodizado e para-choques cromados para conferir durabilidade, resistência à corrosão e beleza visual aos seus produtos.","Para recobrir um anel metálico de cobre com uma camada brilhante de prata por galvanoplastia eletrolítica e para produzir uma película protetora de óxido em uma peça de alumínio por anodização, as peças metálicas a serem tratadas devem ser conectadas, respectivamente, como:",["ânodo na galvanoplastia e cátodo na anodização.","cátodo em ambos os processos eletroquímicos.","cátodo na galvanoplastia e ânodo na anodização.","ânodo em ambos os processos eletroquímicos.","eletrodo neutro desconectado da fonte de corrente contínua."],2,"Resolução: 1) Na galvanoplastia (prateação do anel de cobre), o objetivo é depositar átomos neutros de prata metálica (Ag⁰) sobre a superfície da peça. Para que os íons prata em solução (Ag⁺) recebam elétrons e se reduzam (Ag⁺ + e⁻ → Ag⁰), o anel deve fornecer elétrons à solução, atuando obrigatoriamente como o CÁTODO da eletrólise (polo negativo da fonte). 2) Na anodização do alumínio, o objetivo é promover a oxidação superficial do metal para formar a camada espessa e protetora de óxido de alumínio (Al₂O₃, passivação anódica). Portanto, a peça de alumínio deve perder elétrons para a fonte, sendo conectada obrigatoriamente como o ÂNODO da cuba eletrolítica (polo positivo). Assim, temos: cátodo na galvanoplastia e ânodo na anodização. Alternativas A, C, D e E invertem ou igualam erroneamente os polos da eletrólise."],"Entalpia e reações exotérmicas e endotérmicas":["A termoquímica estuda as trocas de calor que acompanham as reações químicas e as mudanças de estado físico. A entalpia (H) representa o conteúdo energético total de um sistema a pressão constante. A variação de entalpia (ΔH) é a diferença entre a entalpia dos produtos e a dos reagentes: ΔH = H_produtos − H_reagentes. Reações exotérmicas liberam calor para as vizinhanças (ΔH < 0, pois H_produtos < H_reagentes), provocando aumento da temperatura do meio externo (ex: combustão, respiração celular, neutralização ácido-base). Reações endotérmicas absorvem calor das vizinhanças (ΔH > 0, pois H_produtos > H_reagentes), provocando diminuição da temperatura ao redor (ex: fotossíntese, bolsas térmicas instantâneas de nitrato de amônio, eletrólise da água).",["ΔH = H_produtos − H_reagentes","Reação exotérmica: ΔH < 0 (libera calor, aquece as vizinhanças)","Reação endotérmica: ΔH > 0 (absorve calor, resfria as vizinhanças)","Estados físicos: H(gás) > H(líquido) > H(sólido)","Evaporação/fusão = endotérmicas; condensação/solidificação = exotérmicas"],"Cuidado no ENEM: o sinal do ΔH refere-se ao SISTEMA reacional, não ao ambiente! Uma reação exotérmica perde calor (ΔH negativo para o sistema), mas a vizinhança esquenta.","Bolsas térmicas instantâneas de uso médico para primeiros socorros são constituídas por dois compartimentos selados: um contendo água líquida e outro contendo um sal inorgânico anidro em pó. Ao apertar a embalagem, a divisória interna rompe-se e o sal dissolve-se rapidamente na água. Em bolsas do tipo 'frio instantâneo', amplamente usadas no alívio de torções musculares de atletas, a temperatura da bolsa cai para cerca de 2 °C em poucos segundos após a dissolução de nitrato de amônio (NH₄NO₃).","O resfriamento imediato observado na bolsa térmica ocorre porque o processo de dissolução do sal é:",["uma combustão em baixa temperatura que consome todo o oxigênio da água.","exotérmico, transferindo calor do sal para a pele do atleta.","atérmico, não envolvendo nenhuma troca de energia com o meio externo.","endotérmico, absorvendo calor das vizinhanças para romper a estrutura cristalina do sal.","uma precipitação espontânea de gelo a partir da condensação do vapor de água."],3,"A dissolução do nitrato de amônio em água é um processo fortemente endotérmico (ΔH > 0). Para que a rede cristalina do sal se rompa e os íons sejam solvatados, o sistema precisa absorver energia térmica do ambiente circundante (a água da bolsa e, subsequentemente, a pele do usuário). Essa perda de energia térmica pelas vizinhanças acarreta a queda acentuada da temperatura, caracterizando a bolsa de gelo instantânea. Alternativa B cita processo exotérmico (que aqueceria a bolsa, como ocorre em bolsas quentes com CaCl₂); C afirma que não há troca térmica; D e E citam fenômenos fantasiosos."],"Diagramas de entalpia e calor de reação":["Os diagramas de entalpia (perfis energéticos de reação) representam a variação de entalpia ao longo do caminho da reação (coordenada de reação). O estado inicial corresponde aos reagentes e o estado final aos produtos. Para que a reação ocorra, os reagentes devem absorver uma quantidade mínima de energia denominada energia de ativação (Ea) para formar o complexo ativado (estado de transição de máxima energia e instabilidade). O uso de catalisadores oferece um caminho reacional alternativo com menor energia de ativação, aumentando consideravelmente a velocidade da reação. É fundamental destacar que o catalisador altera apenas a energia de ativação, NUNCA alterando a variação de entalpia global (ΔH) da reação nem a constante de equilíbrio.",["Energia de ativação (Ea): barreira energética para atingir o complexo ativado","Complexo ativado: espécie intermediária transitória de máxima energia potencial","Ação do catalisador: DIMINUI a energia de ativação (Ea) criando novo caminho","Catalisador NÃO altera: ΔH da reação, entalpia de reagentes/produtos, rendimento","Gráfico exotérmico: produtos em nível abaixo dos reagentes (ΔH < 0)"],"Cuidado no ENEM: o catalisador NUNCA altera o ΔH da reação! O ΔH (diferença entre patamar de produtos e reagentes) é rigorosamente idêntico com ou sem catalisador.","O gráfico abaixo ilustra a variação de entalpia para uma reação química genérica A + B → C + D, processando-se por dois caminhos distintos: I (linha contínua) e II (linha tracejada).\n  <div style=\"text-align:center;margin:12px 0;\">\n    <svg viewBox=\"0 0 320 140\" style=\"width:100%;max-width:320px;height:auto;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px;\">\n      <text x=\"10\" y=\"16\" fill=\"var(--mu)\" font-size=\"11\" font-family=\"sans-serif\">Perfil de Energia: Entalpia (H) × Caminho da Reação</text>\n      <!-- Axes -->\n      <line x1=\"40\" y1=\"115\" x2=\"295\" y2=\"115\" stroke=\"var(--tx)\" stroke-width=\"1.5\"/>\n      <line x1=\"40\" y1=\"115\" x2=\"40\" y2=\"25\" stroke=\"var(--tx)\" stroke-width=\"1.5\"/>\n      <text x=\"15\" y=\"30\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">H</text>\n      <!-- Reactants level -->\n      <line x1=\"40\" y1=\"70\" x2=\"80\" y2=\"70\" stroke=\"var(--tx)\" stroke-width=\"2\"/>\n      <text x=\"45\" y=\"65\" fill=\"var(--tx)\" font-size=\"11\" font-family=\"sans-serif\">A + B</text>\n      <!-- Products level -->\n      <line x1=\"240\" y1=\"100\" x2=\"285\" y2=\"100\" stroke=\"var(--tx)\" stroke-width=\"2\"/>\n      <text x=\"245\" y=\"95\" fill=\"var(--tx)\" font-size=\"11\" font-family=\"sans-serif\">C + D</text>\n      <!-- Curve I (uncatalyzed) -->\n      <path d=\"M 80 70 C 120 70, 130 30, 160 30 C 190 30, 200 100, 240 100\" fill=\"none\" stroke=\"var(--er)\" stroke-width=\"2\"/>\n      <text x=\"165\" y=\"30\" fill=\"var(--er)\" font-size=\"10\" font-family=\"sans-serif\">I (Ea sem cat)</text>\n      <!-- Curve II (catalyzed) -->\n      <path d=\"M 80 70 C 120 70, 130 50, 160 50 C 190 50, 200 100, 240 100\" fill=\"none\" stroke=\"var(--ok)\" stroke-width=\"2\" stroke-dasharray=\"3,3\"/>\n      <text x=\"165\" y=\"55\" fill=\"var(--ok)\" font-size=\"10\" font-family=\"sans-serif\">II (Ea com cat)</text>\n      <!-- Delta H arrow -->\n      <line x1=\"285\" y1=\"70\" x2=\"285\" y2=\"100\" stroke=\"var(--ac)\" stroke-width=\"1.5\"/>\n      <text x=\"290\" y=\"88\" fill=\"var(--ac)\" font-size=\"10\" font-family=\"sans-serif\">ΔH &lt; 0</text>\n    </svg>\n  </div>","A partir da análise do perfil energético, conclui-se corretamente que:",["o caminho II corresponde à reação catalisada, e a reação global é endotérmica com ΔH > 0.","a energia dos produtos é maior que a dos reagentes, tornando a reação não espontânea.","o caminho I corresponde à reação com catalisador, pois atinge maior energia no complexo ativado.","o catalisador do caminho II diminui o valor absoluto da variação de entalpia da reação.","o caminho II corresponde à reação catalisada, e a reação global é exotérmica com ΔH < 0."],4,"Análise detalhada do diagrama: 1) O patamar de entalpia dos produtos (C + D) situa-se abaixo do patamar dos reagentes (A + B), o que indica liberação de calor para as vizinhanças (H_produtos < H_reagentes, portanto ΔH < 0, reação exotérmica). 2) A curva II (tracejada) apresenta uma crista de energia inferior à da curva I, o que evidencia uma menor energia de ativação decorrente da ação de um catalisador químico. O catalisador acelera a velocidade ao reduzir Ea, mantendo o ΔH idêntico em ambos os caminhos. Alternativa A classifica erroneamente a reação como endotérmica; B inverte os caminhos; D supõe incorretamente alteração de ΔH pelo catalisador; E contradiz os níveis de energia mostrados no gráfico."],"Calorimetria e calor específico (Q = m·c·ΔT)":["A calorimetria quantifica a troca de calor entre corpos ou substâncias em processos físicos e reações químicas. O calor sensível (que altera a temperatura sem mudar o estado físico) é dado pela equação fundamental da calorimetria: Q = m · c · ΔT, onde m é a massa em gramas, c o calor específico da substância e ΔT = T_final − T_inicial a variação de temperatura em °C. A água possui calor específico elevado (c = 1,0 cal/(g·°C) = 4,18 J/(g·°C)), funcionando como excelente moderador térmico do clima planetário. Em um calorímetro ideal isolado adiabaticamente, a soma dos calores trocados entre os corpos em equilíbrio térmico é rigorosamente nula: Σ Q = 0 (o calor cedido pelas espécies quentes é integralmente absorvido pelas espécies frias).",["Equação fundamental: Q = m · c · ΔT","Calor específico da água: c = 1,0 cal/(g·°C) ≈ 4,18 J/(g·°C)","Densidade da água líquida: 1,0 g/mL (1,0 kg/L)","1 kcal = 1 000 cal; 1 kJ = 1 000 J","Equilíbrio térmico em sistema isolado: Q_cedido + Q_absorvido = 0"],"Cuidado no ENEM com unidades: se a massa for dada em litros de água, lembre-se de que 1 L de água = 1 000 g! Se o calor específico for em J/(g·°C), a resposta sai em Joules; se for em cal/(g·°C), sai em calorias.","Para determinar o poder calorífico de uma castanha-de-caju, um estudante queimou totalmente uma semente de 2,0 g em um calorímetro simples montado com uma lata de alumínio contendo 500 mL (500 g) de água. A temperatura da água no interior do calorímetro subiu de 20 °C para 44 °C. \n(Dados: calor específico da água = 1,0 cal/(g·°C); considere que 100% do calor liberado na combustão foi transferido para a água).","Qual a quantidade de calor absorvida pela água durante a queima dessa semente?",["12 000 cal (12 kcal)","48 cal","12 cal","1 200 cal","24 000 cal (24 kcal)"],0,"Cálculo calorimétrico: Q = m · c · ΔT. Dados fornecidos: m(água) = 500 g; c(água) = 1,0 cal/(g·°C); ΔT = 44 °C − 20 °C = 24 °C. Substituindo na fórmula: Q = 500 g × 1,0 cal/(g·°C) × 24 °C = 12 000 cal = 12 kcal. Alternativa C divide por 1 000 sem considerar a massa; B é apenas a multiplicação da massa da castanha pela variação de temperatura (2 × 24); C erra o fator de multiplicação de 500 por 24; E multiplica indevidamente pela massa de 2 g da castanha."],"Entalpia padrão de formação e de combustão":["A entalpia padrão de formação (ΔH°_f) é a variação de entalpia na formação de 1 mol de uma substância a partir de suas substâncias simples no estado padrão (25 °C, 1 atm e forma alotrópica mais estável). Por convenção termodinâmica internacional, toda substância simples no estado padrão tem entalpia padrão de formação igual a ZERO (ex: O₂(g), H₂(g), C(grafite), Fe(s) têm ΔH°_f = 0; mas O₃(g) e C(diamante) têm ΔH°_f ≠ 0). A variação de entalpia de qualquer reação química pode ser calculada pela diferença entre as entalpias de formação dos produtos e dos reagentes: ΔH°_reação = Σ [n_p · ΔH°_f(produtos)] − Σ [n_r · ΔH°_f(reagentes)]. A entalpia de combustão é sempre exotérmica (ΔH < 0) e refere-se à queima completa de 1 mol de combustível com oxigênio.",["Estado padrão: 25 °C, 1 atm, fase alotrópica mais estável","Substância simples no estado padrão: ΔH°_f = 0 (ex: O₂, N₂, H₂, C_grafite)","Fórmula geral: ΔH° = Σ ΔH°_f(produtos) − Σ ΔH°_f(reagentes)","Entalpia de combustão: SEMPRE negativa (exotérmica)","Multiplicar os valores tabelados pelos coeficientes estequiométricos da reação!"],"Substância simples não estável NÃO vale zero! C(grafite) = 0, mas C(diamante) ≠ 0. O₂(g) = 0, mas O₃(g) ≠ 0.","O biogás gerado na digestão anaeróbia de resíduos orgânicos tem como componente combustível principal o gás metano (CH₄). A combustão completa do metano é expressa por: \nCH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(l). \nConsidere as entalpias padrão de formação tabeladas a 25 °C e 1 atm: \n• ΔH°_f [CH₄(g)] = −75 kJ/mol \n• ΔH°_f [O₂(g)] = 0 kJ/mol \n• ΔH°_f [CO₂(g)] = −394 kJ/mol \n• ΔH°_f [H₂O(l)] = −286 kJ/mol","A variação de entalpia padrão de combustão (ΔH°_c) de 1 mol de metano é igual a:",["−605 kJ/mol","−891 kJ/mol","+891 kJ/mol","−966 kJ/mol","−1 041 kJ/mol"],1,"Cálculo pela entalpia de formação: ΔH°_reação = Σ ΔH°_f(produtos) − Σ ΔH°_f(reagentes). \n1) Produtos: 1 mol de CO₂ e 2 mols de H₂O: \nΣ H(produtos) = [1 × (−394)] + [2 × (−286)] = −394 − 572 = −966 kJ. \n2) Reagentes: 1 mol de CH₄ e 2 mols de O₂: \nΣ H(reagentes) = [1 × (−75)] + [2 × 0] = −75 kJ. \n3) Variação de entalpia: \nΔH° = (−966 kJ) − (−75 kJ) = −966 + 75 = −891 kJ/mol. \nO sinal negativo confirma a natureza fortemente exotérmica da queima. Alternativa A esquece de multiplicar o H₂O por 2; C erra o sinal do ΔH; D esquece de subtrair a entalpia do reagente CH₄ (−966 kJ); E soma a entalpia do metano em vez de subtrair (−966 − 75 = −1 041 kJ)."],"Lei de Hess":["A Lei de Hess estabelece que a variação de entalpia de uma reação química depende exclusivamente do estado inicial (reagentes) e do estado final (produtos), sendo totalmente independente do caminho ou do número de etapas intermediárias percorridas pelo processo (a entalpia é uma função de estado). As equações termoquímicas podem ser manipuladas algebricamente como equações matemáticas: 1) Se uma equação for invertida, o sinal do seu ΔH deve ser invertido (+ vira − e vice-versa); 2) Se uma equação for multiplicada ou dividida por um fator numérico n, o valor do seu ΔH deve ser multiplicado ou dividido pelo mesmo fator; 3) Somando-se as equações intermediárias ajustadas, o ΔH global da reação será a soma algébrica dos ΔH de cada etapa.",["Lei de Hess: ΔH_global = ΔH₁ + ΔH₂ + ΔH₃ + ...","Inverter a reação: troca o sinal do ΔH (+ vira −)","Multiplicar por n: multiplica o ΔH por n","Dividir por n: divide o ΔH por n","Cancelar espécies idênticas em lados opostos das equações intermediárias"],"Estratégia infalível no ENEM: olhe para a reação-alvo e procure onde está cada substância nas reações dadas. Ajuste uma por uma (inverta ou multiplique) e some tudo no final!","A conversão direta de carbono grafite em monóxido de carbono (CO) não pode ser medida com precisão em calorímetro porque parte do carbono sempre reage formando dióxido de carbono (CO₂). Para contornar essa dificuldade, um químico utilizou a Lei de Hess aplicando duas equações termoquímicas conhecidas: \n(1) C(grafite) + O₂(g) → CO₂(g)   ΔH₁ = −394 kJ/mol \n(2) CO(g) + ½ O₂(g) → CO₂(g)   ΔH₂ = −283 kJ/mol","A variação de entalpia para a formação de 1 mol de monóxido de carbono gasoso [C(grafite) + ½ O₂(g) → CO(g)] vale:",["−677 kJ/mol","−283 kJ/mol","−111 kJ/mol","+677 kJ/mol","+111 kJ/mol"],2,"Aplicação direta da Lei de Hess: \nReação desejada (alvo): C(grafite) + ½ O₂(g) → CO(g)   ΔH = ? \nAnálise das equações disponíveis: \n• O C(grafite) está nos reagentes da equação (1), na proporção de 1 mol. Mantemos a equação (1) inalterada: \nC(grafite) + O₂(g) → CO₂(g)   ΔH₁ = −394 kJ/mol. \n• O CO(g) deve estar nos produtos da reação-alvo, mas na equação (2) ele está nos reagentes. Devemos inverter a equação (2), invertendo o sinal de ΔH₂: \nCO₂(g) → CO(g) + ½ O₂(g)   ΔH₂' = +283 kJ/mol. \nSomando as duas equações manipuladas: \nC(grafite) + O₂(g) + CO₂(g) → CO₂(g) + CO(g) + ½ O₂(g) \nCancelando CO₂(g) em ambos os lados e subtraindo ½ O₂(g) de 1 O₂(g), sobra: \nC(grafite) + ½ O₂(g) → CO(g). \nΔH = ΔH₁ + ΔH₂' = −394 kJ/mol + 283 kJ/mol = −111 kJ/mol. \nAlternativa A soma os dois valores negativos (−394 − 283 = −677 kJ/mol); C inverte o sinal do resultado; D soma os valores com sinal trocado; E é apenas o valor da equação 2."],"Energia de ligação":["A energia de ligação é a quantidade média de energia necessária para quebrar 1 mol de ligações covalentes no estado gasoso a 25 °C e 1 atm. A quebra de ligações químicas é SEMPRE um processo endotérmico (absorve energia, ΔH > 0), pois exige fornecimento de trabalho contra a força de atração eletrostática entre os núcleos e elétrons compartilhados. A formação de novas ligações químicas é SEMPRE um processo exotérmico (libera energia, ΔH < 0), pois os átomos atingem um estado de menor energia e maior estabilidade. O cálculo do ΔH da reação por energias de ligação é dado pelo balanço energético: ΔH = Σ(energia das ligações rompidas nos reagentes) − Σ(energia das ligações formadas nos produtos).",["Quebra de ligações (reagentes): SEMPRE absorve energia (+ΔH)","Formação de ligações (produtos): SEMPRE libera energia (−ΔH)","Balanço: ΔH = Σ(E_ligações rompidas) − Σ(E_ligações formadas)","Atenção à multiplicidade de ligações: simples (σ) < dupla (σ + π) < tripla (σ + 2π)"],"Cuidado com o sinal na fórmula de energia de ligação: o sinal de menos já representa o fato de que a formação de ligações nos produtos LIBERA calor!","Considere as seguintes energias médias de ligação covalente: \n• H—H: 436 kJ/mol \n• Cl—Cl: 242 kJ/mol \n• H—Cl: 431 kJ/mol \nA reação de síntese do cloreto de hidrogênio gasoso a partir dos gases hidrogênio e cloro ocorre segundo a equação: \nH₂(g) + Cl₂(g) → 2 HCl(g).","A variação de entalpia (ΔH) para a formação de 2 mols de HCl(g) a partir de seus elementos gasosos é:",["+247 kJ","+184 kJ","−92 kJ","−184 kJ","−862 kJ"],3,"Cálculo por energia de ligação: \n1) Quebra de ligações nos reagentes (processo endotérmico, absorve energia): \n• Rompimento de 1 mol de ligação H—H = +436 kJ \n• Rompimento de 1 mol de ligação Cl—Cl = +242 kJ \nTotal absorvido = 436 + 242 = +678 kJ. \n2) Formação de ligações nos produtos (processo exotérmico, libera energia): \n• Formação de 2 mols de ligações H—Cl = 2 × 431 kJ = 862 kJ liberados (−862 kJ). \n3) Variação global de entalpia: \nΔH = (energia absorvida nas quebras) − (energia liberada nas formações) \nΔH = +678 kJ − 862 kJ = −184 kJ (para os 2 mols de HCl formados). \nAlternativa B inverte o sinal resultando em reação endotérmica; C é o valor para apenas 1 mol de HCl (−92 kJ/mol); D resulta de cálculo incorreto; E considera apenas a energia de formação das ligações H—Cl sem descontar as quebras dos reagentes."],"Entropia e energia livre de Gibbs":["A espontaneidade de um processo químico é governada por dois fatores fundamentais: a entalpia (tendência à mínima energia, ΔH < 0) e a entropia (S, tendência à máxima desordem molecular ou dispersão de energia, ΔS > 0). O estado gasoso possui maior entropia do que o líquido, que por sua vez tem maior entropia do que o sólido: S(gás) > S(líquido) > S(sólido). A Energia Livre de Gibbs (G) unifica os dois princípios na equação: ΔG = ΔH − T · ΔS, onde T é a temperatura absoluta em kelvin. Um processo é espontâneo se e somente se ΔG < 0; está em equilíbrio dinâmico quando ΔG = 0; e é não espontâneo no sentido direto quando ΔG > 0. Reações com ΔH < 0 e ΔS > 0 são espontâneas em qualquer temperatura.",["Equação de Gibbs: ΔG = ΔH − T · ΔS (T em Kelvin!)","Critério de espontaneidade: ΔG < 0 (espontâneo)","Equilíbrio químico: ΔG = 0","Entropia (S): mede a desordem molecular; S(gás) >> S(líquido) > S(sólido)","Se ΔH < 0 e ΔS > 0: ΔG é sempre negativo (espontâneo a qualquer T)"],"Cuidado no ENEM: uma reação endotérmica (ΔH > 0) PODE ser espontânea se houver grande aumento de entropia (ΔS > 0) e temperatura suficientemente alta (termo T·ΔS supera o ΔH)!","A dissolução do nitrato de amônio em água líquida é um processo espontâneo que ocorre com absorção de calor (processo endotérmico, ΔH > 0), como observado nas compressas térmicas de gelo instantâneo.","Considerando a termodinâmica química, como se explica o fato de uma transformação endotérmica (ΔH > 0) ocorrer de forma perfeitamente espontânea à temperatura ambiente?",["A variação de entropia do sistema é negativa, tornando o termo −T·ΔS positivo.","A temperatura em kelvin é negativa na escala absoluta, invertendo o sinal da energia livre.","A pressão atmosférica atua como catalisador térmico eliminando a variação de energia livre de Gibbs.","O processo viola a 2ª Lei da Termodinâmica porque a energia mecânica do solvente gera calor espontâneo.","A dissociação dos íons na solução líquida acarreta um grande aumento de entropia (ΔS > 0), de modo que o termo −T·ΔS supera o valor de ΔH, resultando em ΔG < 0."],4,"A espontaneidade de qualquer processo é determinada pelo sinal negativo da variação de energia livre de Gibbs: ΔG = ΔH − T·ΔS. Quando um sal sólido se dissolve em água gerando íons livres solvatados com maior liberdade translacional, a desordem do sistema cresce expressivamente, gerando um ΔS positivo elevado (ΔS > 0). À temperatura ambiente (T ≈ 298 K), a magnitude do termo entrópico T·ΔS torna-se superior ao valor endotérmico de ΔH. Logo, ΔG = ΔH − T·ΔS assume valor negativo (ΔG < 0), tornando a dissolução espontânea apesar de ser endotérmica. Alternativa A afirma que ΔS seria negativo; C inventa efeito de pressão como catalisador; D e E ferem princípios físicos fundamentais."],"Poder calorífico e eficiência de combustíveis":["O poder calorífico de um combustível mede a quantidade de calor liberada na combustão completa de uma quantidade unitária de massa (kJ/g ou MJ/kg) ou de volume (kJ/L ou MJ/m³) daquele combustível a 25 °C e 1 atm. Distingue-se entre Poder Calorífico Superior (PCS, que inclui o calor de condensação da água formada) e Poder Calorífico Inferior (PCI, no qual a água permanece na fase de vapor, mais próximo da realidade de motores e fornos industriais). Por unidade de massa (densidade gravimétrica de energia), o gás hidrogênio (H₂) possui o maior poder calorífico conhecido entre os combustíveis químicos usuais (~142 kJ/g = 142 MJ/kg), cerca de três vezes superior ao da gasolina (~44 a 47 kJ/g) e do óleo diesel (~45 kJ/g), e quatro vezes superior ao do bioetanol hidratado (~27 a 30 kJ/g). No entanto, por unidade de volume (densidade volumétrica), combustíveis líquidos com densidade elevada como o diesel e a gasolina fornecem muito mais energia por litro do que gases como o hidrogênio e o metano em condições normais, o que exige compressão a altíssimas pressões (350 a 700 atm) ou liquefação criogênica para o armazenamento veicular do hidrogênio.",["Poder calorífico: quantidade de calor liberada por unidade de massa (kJ/g) ou volume (kJ/L)","Hidrogênio (H₂): maior poder calorífico gravimétrico (~142 kJ/g)","Gasolina (~45 kJ/g) > Bioetanol (~30 kJ/g): o etanol queima liberando menos calor por grama devido aos átomos de oxigênio já presentes em sua molécula","Relação estequiométrica: combustão completa sempre libera CO₂ e H₂O","Comparação no posto: o etanol é vantajoso se o preço for até ~70% do preço da gasolina devido ao menor poder calorífico por litro"],"Regra dos 70% no ENEM: o motor flex consome mais etanol do que gasolina porque o bioetanol (C₂H₆O) tem oxigênio na molécula e possui poder calorífico (~30 kJ/g) cerca de 30% menor que o da gasolina hidrocarboneto pura (~45 kJ/g)!","Nos postos de combustíveis brasileiros, proprietários de veículos bicombustíveis (flex) costumam comparar os preços do etanol hidratado e da gasolina comum para decidir qual combustível é economicamente mais vantajoso abastecer, utilizando a regra prática dos 70%.","Essa diferença de autonomia veicular por litro abastecido fundamenta-se no fato de que o etanol apresenta, em relação à gasolina comercial:",["menor poder calorífico por litro, em virtude de conter átomos de oxigênio em sua molécula que reduzem a energia liberada na combustão.","maior poder calorífico por litro, liberando mais energia térmica durante a queima.","combustão exclusivamente endotérmica que absorve calor dos pistões do motor.","maior velocidade de oxidação que impede o funcionamento do motor a frio.","presença de metais pesados que diminuem a pressão dos gases na câmara."],0,"Resolução: A gasolina é constituída exclusivamente por hidrocarbonetos (alcanos e aromáticos de 5 a 10 carbonos, como o octano C₈H₁₈), nos quais todos os átomos de carbono encontram-se em estados de oxidação reduzidos (−2 a −3), prontos para serem totalmente oxidados a CO₂. Já o bioetanol (C₂H₆O ou CH₃CH₂OH) possui um átomo de oxigênio em sua molécula: o carbono ligado à hidroxila já se encontra parcialmente oxidado (NOX −1), o que diminui a quantidade líquida de energia liberada na oxidação completa com O₂. Em decorrência dessa estrutura molecular, o poder calorífico do etanol (~30 MJ/kg ou ~21 MJ/L) é cerca de 30% inferior ao da gasolina (~44 MJ/kg ou ~32 MJ/L). Como cada litro de etanol produz cerca de 70% da energia de um litro de gasolina, o veículo flex precisa queimar cerca de 30% a mais de volume de etanol para percorrer a mesma distância, justificando a clássica razão de preço de 0,70. Alternativa B inverte a relação energética; C classifica a combustão como endotérmica; D e E formulam proposições absurdas."],"Calor de neutralização ácido-base":["O calor de neutralização (ou entalpia de neutralização, ΔH_neutr) é a variação de entalpia associada à reação entre 1 mol de íons hidrogênio (H⁺ ou H₃O⁺) e 1 mol de íons hidróxido (OH⁻) para a formação de 1 mol de água líquida em solução aquosa diluída: H⁺(aq) + OH⁻(aq) → H₂O(l). Toda reação de neutralização ácido-base é um processo fortemente EXOTÉRMICO (libera calor para o meio aquoso, ΔH < 0). Uma das descobertas mais notáveis da termoquímica clássica (Lei de Hess e Arrhenius) é que a neutralização entre QUALQUER ácido forte (como HCl, HNO₃, HClO₄) e QUALQUER base forte solúvel (como NaOH, KOH, Ba(OH)₂) apresenta rigorosamente o MESMO calor de reação por mol de água formada a 25 °C: ΔH°_neutr ≈ −57,3 kJ/mol de H₂O (−13,7 kcal/mol). Esse valor é constante e universal porque ácidos e bases fortes estão 100% ionizados/dissociados em água, e os íons espectadores (como Na⁺ e Cl⁻) não participam da reação líquida. Quando um ácido fraco ou base fraca é utilizado (como ácido acético ou NH₄OH), o calor liberado é ligeiramente menor em módulo, pois parte da energia gerada é consumida na etapa endotérmica de ionização prévia da molécula fraca.",["Equação líquida de neutralização: H⁺(aq) + OH⁻(aq) → H₂O(l)","Processo sempre EXOTÉRMICO: ΔH < 0 (libera calor, aquece o béquer)","Ácido forte + Base forte: ΔH°_neutr ≈ −57,3 kJ/mol de H₂O formada (valor UNIVERSAL constante)","Íons espectadores (Na⁺, Cl⁻, K⁺, NO₃⁻): não reagem e não alteram o calor de neutralização","Ácido fraco (ex: CH₃COOH): libera menos calor porque parte da energia é absorvida para forçar a ionização prévia"],"Cuidado no ENEM: o calor de neutralização de ácido forte com base forte é SEMPRE cerca de −57,3 kJ/mol de água formada, NÃO IMPORTA qual seja o ácido forte ou a base forte!","Em um calorímetro isolado a 25 °C, um químico mediu a variação de entalpia resultante da mistura de volumes estequiométricos de três pares de soluções aquosas diluídas: \n• Experimento 1: HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)   ΔH₁ \n• Experimento 2: HNO₃(aq) + KOH(aq) → KNO₃(aq) + H₂O(l)   ΔH₂ \n• Experimento 3: HClO₄(aq) + NaOH(aq) → NaClO₄(aq) + H₂O(l)   ΔH₃","Comparando os calores de neutralização medidos por mol de água formada nesses três experimentos, conclui-se que:",["ΔH₁ é muito mais negativo que ΔH₂ porque o cloro possui maior eletronegatividade que o nitrogênio.","os três experimentos liberam rigorosamente a mesma quantidade de calor (ΔH₁ = ΔH₂ = ΔH₃ ≈ −57,3 kJ/mol), pois a reação química efetiva é em todos os casos a formação de água líquida a partir de íons H⁺ e OH⁻.","todos os experimentos são fortemente endotérmicos com absorção de calor do meio.","o experimento 3 não libera nem absorve calor por envolver um ânion tetraédrico inerte.","o calor de neutralização varia aleatoriamente conforme a massa molar do sal espectador formado."],1,"Resolução: Os ácidos clorídrico (HCl), nítrico (HNO₃) e perclórico (HClO₄) são ácidos fortes com grau de ionização praticamente total (α ≈ 100%), encontrando-se integralmente dissociados na forma de íons H⁺(aq) e seus respectivos ânions. Da mesma forma, os hidróxidos de sódio (NaOH) e potássio (KOH) são bases fortes solúveis de metais alcalinos 100% dissociadas em cátions metálicos e íons OH⁻(aq). Ao misturar as soluções aquosas em proporções estequiométricas, os cátions alcalinos (Na⁺, K⁺) e os ânions ácidos (Cl⁻, NO₃⁻, ClO₄⁻) atuam meramente como íons espectadores que permanecem solvatados e inalterados na solução líquida. A única transformação química real que ocorre em todos os três experimentos é a ligação entre os íons hidrogênio e hidroxila formando água: H⁺(aq) + OH⁻(aq) → H₂O(l). Como a equação iônica simplificada e as espécies envolvidas na quebra e formação de ligações são rigorosamente idênticas nos três casos, a variação de entalpia molar padrão é rigorosamente a mesma: ΔH₁ = ΔH₂ = ΔH₃ ≈ −57,3 kJ por mol de H₂O formada (processo exotérmico). Alternativas A, C, D e E trazem equívocos termodinâmicos."],"Ciclo de Born-Haber e energia reticular":["A estabilidade dos compostos iônicos cristalinos sólidos (como o cloreto de sódio, NaCl) fundamenta-se na energia reticular (ou energia de rede cristalina, U). A energia reticular é a quantidade de energia liberada quando íons gasosos isolados com cargas opostas se atraem eletrostaticamente no vácuo para organizar 1 mol do retículo cristalino iônico sólido ordenado: Na⁺(g) + Cl⁻(g) → NaCl(s) + U (processo fortemente exotérmico, ΔH_reticular < 0). Como a energia reticular não pode ser medida diretamente em um calorímetro, utiliza-se a Lei de Hess através do Ciclo termoquímico de Born-Haber, somando as seguintes etapas elementares: 1) Sublimação do metal sólido em vapor atômico [Na(s) → Na(g), endotérmica, +ΔH_subl]; 2) Dissociação da molécula do ametal gasoso [½ Cl₂(g) → Cl(g), endotérmica, +½ E_lig]; 3) Primeira Energia de Ionização do metal gasoso [Na(g) → Na⁺(g) + e⁻, endotérmica, +EI]; 4) Afinidade Eletrônica do ametal gasoso [Cl(g) + e⁻ → Cl⁻(g), exotérmica, −AE]; 5) Combinação dos íons gasosos formando o cristal iônico sólido sob liberação da Energia Reticular [Na⁺(g) + Cl⁻(g) → NaCl(s), −U]. Pela Lei de Hess, a soma dessas cinco etapas iguala a Entalpia Padrão de Formação experimental do sal sólido (ΔH°_f). A magnitude da energia reticular é diretamente proporcional ao produto das cargas dos íons e inversamente proporcional à distância interiônica.",["Energia reticular (U): energia liberada na formação do retículo cristalino sólido a partir de íons gasosos","Ciclo de Born-Haber: aplicação da Lei de Hess para calcular a energia reticular indiretamente","Etapas do ciclo: Sublimação do metal + Dissociação do ametal + Ionização do metal + Afinidade eletrônica + Energia reticular = ΔH°_f","Força da rede iônica: maior carga iônica (ex: Mg²⁺ e O²⁻) gera energia reticular MUITO maior que íons monovalentes (Na⁺ e Cl⁻)","Consequência física: maior energia reticular acarreta maiores pontos de fusão e dureza no cristal iônico"],"Cuidado no ENEM: o óxido de magnésio (MgO, formado por Mg²⁺ e O²⁻) possui ponto de fusão superior a 2 800 °C, enquanto o cloreto de sódio (NaCl, Na⁺ e Cl⁻) funde a 801 °C, porque o produto das cargas iônicas no MgO é 4 vezes maior (+2 × −2 = 4 contra +1 × −1 = 1), gerando uma energia reticular colossal!","O óxido de magnésio (MgO) é um material refratário utilizado no revestimento interno de fornos industriais de aciaria por suportar temperaturas extremas sem fundir, apresentando ponto de fusão de aproximadamente 2 850 °C, enquanto o sal de cozinha (NaCl) funde a 801 °C.","Com base na termoquímica dos sólidos iônicos e no Ciclo de Born-Haber, a excepcional estabilidade térmica do MgO decorre do fato de que:",["o magnésio é um metal líquido à temperatura ambiente que atua como refrigerante térmico.","o oxigênio no retículo do MgO estabelece ligações de hidrogênio intermoleculares com o magnésio.","a energia reticular do MgO é muito superior à do NaCl devido à atração eletrostática mais intensa entre íons bivalentes (Mg²⁺ e O²⁻) com cargas maiores.","o cloreto de sódio não é um composto iônico, mas sim um gás molecular polar volátil.","a rede do MgO é formada por átomos neutros unidos por fracas forças de dispersão de London."],2,"Resolução: A energia reticular (U) de um composto iônico cristalino é regida pela Lei de Coulomb aplicada às partículas carregadas no retículo: U é diretamente proporcional ao produto das cargas elétricas dos íons (|q₁ · q₂|) e inversamente proporcional à distância entre os núcleos (soma dos raios iônicos). No cloreto de sódio (NaCl), temos a atração entre cátions e ânions monovalentes: Na⁺ (carga +1) e Cl⁻ (carga −1), resultando em um produto de cargas igual a 1 (|(+1) · (−1)| = 1). No óxido de magnésio (MgO), temos a atração entre íons bivalentes: o cátion Mg²⁺ (carga +2) e o ânion óxido O²⁻ (carga −2), resultando em um produto de cargas igual a 4 (|(+2) · (−2)| = 4). Além disso, os raios dos íons Mg²⁺ e O²⁻ são consideravelmente menores que os de Na⁺ e Cl⁻, permitindo maior aproximação no retículo. Em consequência, a energia de rede eletrostática que mantém o cristal de MgO coeso é aproximadamente quatro a cinco vezes superior à do NaCl (~3 791 kJ/mol no MgO contra ~787 kJ/mol no NaCl). Para quebrar essa rede e fundir o sólido, é necessária uma energia térmica colossal, elevando o ponto de fusão do MgO para mais de 2 850 °C. Alternativas A, C, D e E trazem alegações infundadas."],"Equilíbrio químico dinâmico e constante Kc":["Um equilíbrio químico é um estado dinâmico atingido por reações reversíveis em sistemas fechados quando a velocidade da reação direta iguala a velocidade da reação inversa (v_direta = v_inversa). Nesse estado, as concentrações molares de reagentes e produtos permanecem constantes ao longo do tempo (as propriedades macroscópicas não variam, embora em nível microscópico a reação continue ocorrendo nos dois sentidos). A constante de equilíbrio em termos de concentração (Kc) expressa a razão entre as concentrações dos produtos e as dos reagentes, cada uma elevada ao seu respectivo coeficiente estequiométrico: a A + b B ⇌ c C + d D → Kc = [C]ᶜ·[D]ᵈ / ([A]ᵃ·[B]ᵇ). Substâncias sólidas puras e líquidos puros (solventes) não participam da expressão de Kc porque suas concentrações são invariáveis. O valor numérico de Kc depende unicamente da TEMPERATURA.",["Equilíbrio dinâmico: velocidade direta = velocidade inversa (v_d = v_i)","Concentrações: tornam-se constantes (mas não necessariamente iguais)","Expressão da constante: Kc = [Produtos] / [Reagentes] (elevados aos coeficientes)","Sólidos puros e líquidos puros NÃO entram no Kc","Único fator que altera o valor numérico de Kc: a TEMPERATURA"],"Cuidado com a pegadinha clássica do ENEM: no equilíbrio químico, as concentrações de reagentes e produtos NÃO precisam ser iguais! Elas apenas ficam CONSTANTES ao longo do tempo.","Em um reator fechado de 1,0 L mantido a 450 °C, gases foram adicionados para a síntese do iodeto de hidrogênio: \nH₂(g) + I₂(g) ⇌ 2 HI(g). \nApós atingir o equilíbrio químico, as análises revelaram as seguintes concentrações constantes no sistema: [H₂] = 0,10 mol/L, [I₂] = 0,20 mol/L e [HI] = 1,0 mol/L.","Qual é o valor numérico da constante de equilíbrio Kc dessa reação a 450 °C?",["5,0","25","100","50","0,02"],3,"Montando a expressão da constante de equilíbrio Kc para a reação: Kc = [HI]² / ([H₂] · [I₂]). \nSubstituindo os valores das concentrações no equilíbrio químico: \nKc = (1,0)² / (0,10 × 0,20) = 1,0 / 0,020 = 50. \nAlternativa A esquece de elevar a concentração do produto HI ao quadrado (1,0 / 0,02 = 50, enquanto 1,0 / 0,2 = 5); B divide por 0,04; D multiplica por 2 indevidamente; E inverte a expressão (reagentes / produtos = 0,02 / 1 = 0,02)."],"Deslocamento de equilíbrio (Princípio de Le Chatelier)":["O Princípio de Le Chatelier enuncia que, quando um sistema em equilíbrio sofre uma perturbação externa (alteração de concentração, pressão ou temperatura), o sistema se desloca espontaneamente no sentido que tende a contrabalançar e minimizar essa perturbação. 1) Efeito da concentração: adicionar uma substância desloca o equilíbrio para o lado oposto (para consumi-la); remover uma substância desloca para o mesmo lado (para repô-la). 2) Efeito da pressão (apenas em sistemas com gases): o aumento da pressão total desloca o equilíbrio para o lado de MENOR volume gasoso (menor número de mols gasosos); a redução da pressão desloca para o lado de maior volume gasoso. 3) Efeito da temperatura: o aumento da temperatura desloca o equilíbrio no sentido da reação ENDOTÉRMICA (que absorve calor); o resfriamento favorece o sentido EXOTÉRMICO. O uso de catalisador acelera a velocidade com que o equilíbrio é atingido, mas NUNCA desloca o equilíbrio nem altera as concentrações finais.",["Aumento de concentração de reagente → desloca para a DIREITA (produtos)","Aumento de pressão total → desloca para o lado com MENOR número de mols gasosos","Diminuição de pressão → desloca para o lado com MAIOR número de mols gasosos","Aumento de temperatura → favorece o sentido ENDOTÉRMICO (ΔH > 0)","Catalisador: NUNCA desloca o equilíbrio e NÃO altera o valor de Kc"],"Memorize para o ENEM: catalisador NÃO altera a posição do equilíbrio químico! Ele apenas diminui o tempo necessário para que o equilíbrio seja alcançado.","A síntese industrial da amônia através do processo Haber-Bosch é representada pela seguinte reação química em equilíbrio: \nN₂(g) + 3 H₂(g) ⇌ 2 NH₃(g)   ΔH = −92 kJ/mol. \nOs engenheiros químicos buscam continuamente condições operacionais que maximizem o rendimento e a quantidade de amônia produzida.","Para aumentar a quantidade de NH₃(g) formada no equilíbrio, deve-se:",["aumentar a temperatura do sistema e diminuir a pressão total do reator.","adicionar um catalisador metálico de ferro para deslocar o equilíbrio para a direita.","remover continuamente gás hidrogênio (H₂) do interior do reator.","aumentar o volume do reator para favorecer o lado de maior número de partículas gasosas.","aumentar a pressão total sobre a mistura gasosa e diminuir a temperatura do sistema."],4,"Análise pelo Princípio de Le Chatelier: \n1) Efeito da pressão: nos reagentes temos 1 mol de N₂ + 3 mols de H₂ = 4 mols de gases; nos produtos temos 2 mols de NH₃. Ao aumentar a pressão externa sobre o reator, o equilíbrio se desloca para o lado de menor volume gasoso (menor número de mols gasosos, ou seja, para a direita, favorecendo a formação de NH₃). \n2) Efeito da temperatura: a reação direta é exotérmica (ΔH = −92 kJ/mol, libera calor). Logo, diminuir a temperatura do sistema desloca o equilíbrio no sentido exotérmico para produzir calor, ou seja, para a direita, aumentando a concentração de amônia. \nPortanto, alta pressão e baixa temperatura maximizam a produção de NH₃. Alternativa A cita aumento de temperatura (deslocaria para a esquerda); B erra porque catalisador não desloca equilíbrio; D remover reagente deslocaria para a esquerda; E aumentar o volume equivale a diminuir a pressão."],"Produto iônico da água (Kw), pH e pOH":["A água pura sofre uma discretíssima autoionização: H₂O(l) + H₂O(l) ⇌ H₃O⁺(aq) + OH⁻(aq). A 25 °C, o produto iônico da água é constante: Kw = [H⁺] · [OH⁻] = 1,0 × 10⁻¹⁴. Na água pura (meio neutro), [H⁺] = [OH⁻] = 1,0 × 10⁻⁷ mol/L. A escala de pH (potencial hidrogeniônico), criada por Sørensen, é definida matematicamente por: pH = −log[H⁺] e pOH = −log[OH⁻]. Em virtude da relação de autoionização, a 25 °C temos sempre: pH + pOH = 14. Meio ácido: [H⁺] > 10⁻⁷ mol/L → pH < 7. Meio neutro: [H⁺] = 10⁻⁷ mol/L → pH = 7. Meio básico (alcalino): [H⁺] < 10⁻⁷ mol/L e [OH⁻] > 10⁻⁷ mol/L → pH > 7. Como a escala é logarítmica de base 10, a variação de 1 unidade de pH significa uma alteração de 10 VEZES na concentração de íons H⁺ (uma solução de pH 3 é 100 vezes mais ácida do que uma de pH 5).",["pH = −log[H⁺] e pOH = −log[OH⁻]","A 25 °C: Kw = [H⁺] · [OH⁻] = 1,0 × 10⁻¹⁴","Relação universal a 25 °C: pH + pOH = 14","Escala: pH < 7 (ácido), pH = 7 (neutro), pH > 7 (básico)","Propriedade logarítmica: variação de 1 unidade no pH = fator 10 na concentração de H⁺"],"Cuidado no ENEM: variação de pH 4 para pH 2 NÃO é o dobro de acidez! É 10² = 100 VEZES mais ácida!","A soda cáustica comercial (hidróxido de sódio, NaOH) é uma base forte amplamente utilizada para desentupir encanamentos de esgoto. Um técnico preparou uma solução aquosa de NaOH cuja concentração de íons hidroxila [OH⁻] foi medida como exatamente 1,0 × 10⁻³ mol/L a 25 °C.","Considerando o produto iônico da água Kw = 1,0 × 10⁻¹⁴ a 25 °C, quais são os valores de pOH e de pH dessa solução, respectivamente?",["pOH = 3 e pH = 11.","pOH = 11 e pH = 3.","pOH = 3 e pH = 7.","pOH = 7 e pH = 7.","pOH = 14 e pH = 0."],0,"Cálculo passo a passo: \n1) Cálculo do pOH: pOH = −log[OH⁻] = −log(1,0 × 10⁻³) = 3. \n2) Relação entre pH e pOH a 25 °C: pH + pOH = 14. \nSubstituindo o pOH: pH + 3 = 14 → pH = 14 − 3 = 11. \nComo o pH é 11 (pH > 7), a solução é francamente alcalina, como esperado para uma solução de base forte. Alternativa B inverte os valores de pH e pOH (encontraria uma solução ácida); C e D erram ao supor neutralidade; E supõe concentração 1 mol/L."],"Força de ácidos e bases (Ka e Kb)":["A força de um ácido ou de uma base mede sua capacidade de sofrer ionização ou dissociação em solução aquosa. Para um ácido genérico HA(aq) + H₂O ⇌ H₃O⁺ + A⁻, a constante de ionização ácida é dada por Ka = [H⁺]·[A⁻] / [HA]. Quanto maior o valor de Ka, maior é o grau de ionização (α), maior a concentração de íons H⁺ em equilíbrio e, portanto, MAIS FORTE é o ácido. Ácidos fortes (como HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄) possuem grau de ionização praticamente total (α > 50%, Ka >> 1), considerando-se que [H⁺] ≈ [ácido inicial]. Ácidos fracos (como ácido acético, ácido carbônico, HCN) possuem Ka pequeno (Ka < 10⁻⁴) e permanecem predominantemente não ionizados em solução aquosa. Da mesma forma, bases fortes (metais alcalinos como NaOH, KOH e alcalinoterrosos solúveis como Ca(OH)₂) dissociam-se totalmente; bases fracas (como NH₄OH e aminas) possuem constante Kb reduzida.",["Ka maior → ácido mais forte (maior grau de ionização α)","Kb maior → base mais forte","pKa = −log(Ka): quanto MENOR o pKa, MAIS FORTE é o ácido","Ácido concentrado ≠ ácido forte (concentração é quantidade dissolvida; força é grau de ionização!)","Ácido fraco: cálculo simplificado [H⁺] = √(Ka · M)"],"A maior pegadinha de química do ENEM: CONCENTRADO NÃO É FORTE! HCl 0,01 mol/L é diluído e FORTE; ácido acético puro (vinagre glacial) é super concentrado e FRACO.","Considere os valores das constantes de ionização ácida (Ka) a 25 °C para três soluções de mesma concentração molar (0,10 mol/L): \n• Ácido cloroacético (ClCH₂COOH): Ka = 1,4 × 10⁻³ \n• Ácido acético (CH₃COOH): Ka = 1,8 × 10⁻⁵ \n• Ácido cianídrico (HCN): Ka = 4,9 × 10⁻¹⁰","Comparando-se essas três soluções aquosas de mesma concentração, conclui-se que:",["o ácido cianídrico é o mais forte dos três e produzirá a solução de menor pH.","o ácido cloroacético é o mais forte e apresentará a maior condutibilidade elétrica.","o ácido acético é o que apresenta maior grau de ionização entre os três compostos.","todas as soluções apresentarão exatamente o mesmo valor de pH, pois possuem a mesma concentração molar.","a força ácida é inversamente proporcional à constante de ionização Ka."],1,"A constante Ka quantifica diretamente a força ácida: quanto maior o valor de Ka, maior o grau de ionização do ácido e maior a concentração de íons livres H⁺ e ânions gerados em solução. Comparando os valores: Ka(cloroacético) = 1,4 × 10⁻³ > Ka(acético) = 1,8 × 10⁻⁵ > Ka(cianídrico) = 4,9 × 10⁻¹⁰. Logo, o ácido cloroacético é o mais forte da série, possui o maior grau de ionização, a maior concentração de íons H⁺ (menor pH) e, consequentemente, a maior condutibilidade elétrica da corrente em solução. Alternativa A erra porque o HCN é o mais fraco (menor Ka); C erra porque o acético tem Ka intermediário; D confunde concentração molar com grau de ionização; E contradiz a definição termodinâmica de Ka."],"Hidrólise salina e caráter ácido-base de sais":["A hidrólise salina ocorre quando os íons de um sal dissolvido reagem quimicamente com a água modificando o pH do meio. A regra fundamental decorre da força dos ácidos e bases de origem: 1) Sal de ácido forte e base forte (ex: NaCl, KNO₃, Na₂SO₄): nem o cátion nem o ânion sofrem hidrólise apreciável; a solução permanece NEUTRA (pH = 7 a 25 °C). 2) Sal de ácido fraco e base forte (ex: NaHCO₃, CH₃COONa, Na₂CO₃): o ânion do ácido fraco reage com a água consumindo H⁺ e liberando íons hidroxila (A⁻ + H₂O ⇌ HA + OH⁻), tornando o meio BÁSICO (pH > 7). 3) Sal de ácido forte e base fraca (ex: NH₄Cl, FeSO₄, AlCl₃): o cátion da base fraca reage com a água liberando íons H⁺ (B⁺ + H₂O ⇌ BOH + H⁺), tornando o meio ÁCIDO (pH < 7). 4) Sal de ácido fraco e base fraca: ambos hidrolisam, e o pH dependerá da comparação direta entre Ka do ácido e Kb da base.",["Sal de ácido forte + base forte: neutro (pH = 7)","Sal de ácido fraco + base forte: BÁSICO (pH > 7) → ânion hidrolisa gerando OH⁻","Sal de ácido forte + base fraca: ÁCIDO (pH < 7) → cátion hidrolisa gerando H⁺","Bicarbonato de sódio (NaHCO₃): hidrólise básica, usado como antiácido estomacal","Sulfato de alumínio Al₂(SO₄)₃: hidrólise ácida, acidifica a água no tratamento"],"Cuidado no ENEM: antiácidos estomacais comuns (como bicarbonato de sódio NaHCO₃) são SAIS que sofrem hidrólise básica! O íon bicarbonato consome o excesso de H⁺ do estômago.","O bicarbonato de sódio (hidrogenocarbonato de sódio, NaHCO₃) é um sal de uso doméstico muito versátil, empregado tanto como fermento químico na culinária quanto como antiácido estomacal para combater a pirose (azia provocada pelo excesso de ácido clorídrico no estômago).","O efeito antiácido e a alteração de pH provocados pela dissolução do bicarbonato de sódio em água ocorrem porque o ânion bicarbonato (HCO₃⁻):",["sofre oxidação gerando ácido sulfúrico em solução aquosa neutra.","sofre hidrólise ácida, liberando cátions hidrônio H₃O⁺ que acidificam o suco gástrico.","reage com a água consumindo íons H⁺ e produzindo íons OH⁻, conferindo caráter alcalino (pH > 7) ao meio.","é uma base de Lewis insolúvel que precipita como óxido de sódio no esôfago.","destrói a molécula de água por eletrólise espontânea liberando gás cloro."],2,"O NaHCO₃ é um sal derivado de base forte (NaOH) e ácido fraco e instável (ácido carbônico, H₂CO₃). Ao se dissolver em água, o sal dissocia-se em Na⁺ e HCO₃⁻. O íon bicarbonato sofre hidrólise básica: HCO₃⁻(aq) + H₂O(l) ⇌ H₂CO₃(aq) + OH⁻(aq). A produção de íons OH⁻ na hidrólise confere caráter levemente alcalino à solução (pH > 7). No estômago, o bicarbonato reage diretamente com o ácido clorídrico (HCl): NaHCO₃ + HCl → NaCl + H₂O + CO₂(g), neutralizando o ácido gástrico em excesso. Alternativa A menciona ácido sulfúrico inexistente; B classifica erroneamente como hidrólise ácida; D e E inventam reações impossíveis."],"Solução-tampão no sangue e sistemas biológicos":["Uma solução-tampão (ou buffer) é uma solução que tem a notável propriedade de resistir a variações bruscas de pH quando pequenas quantidades de ácidos fortes ou bases fortes são adicionadas, ou quando a solução é diluída. É formada tipicamente por uma mistura de um ácido fraco e seu sal de base forte (ex: CH₃COOH e CH₃COONa) ou por uma base fraca e seu sal de ácido forte (ex: NH₃ e NH₄Cl). No organismo humano, a manutenção rigorosa do pH plasmático na estreita faixa de 7,35 a 7,45 é vital para que as proteínas e enzimas mantenham sua conformação funcional e não sofram desnaturação. O principal tampão extracelular do sangue é o sistema ácido carbônico / íon bicarbonato: CO₂(aq) + H₂O(l) ⇌ H₂CO₃(aq) ⇌ H⁺(aq) + HCO₃⁻(aq). Se entra ácido (H⁺), o bicarbonato consome o excesso formando H₂CO₃ que se converte em CO₂ eliminado pelos pulmões; se entra base (OH⁻), o H₂CO₃ doa H⁺ neutralizando a hidroxila.",["Solução-tampão: resiste a alterações de pH","Composição: ácido fraco + sal correspondente (ou base fraca + sal)","Tampão sanguíneo: CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻","pH normal do sangue: 7,35 a 7,45 (levemente alcalino)","Hiperventilação: expulsa muito CO₂ → desloca para a esquerda → diminui H⁺ → alcalose respiratória"],"Cuidado no ENEM: hiperventilação (respirar muito rápido por ansiedade ou exercício) elimina CO₂, diminuindo H⁺ no sangue e ELEVANDO o pH (alcalose respiratória)!","Durante uma crise aguda de pânico ou após corrida intensa, uma pessoa pode apresentar hiperventilação (respiração rápida e ofegante involuntária). Essa condição expulsa dióxido de carbono (CO₂) do sangue em ritmo muito superior à produção metabólica celular. O equilíbrio químico do tampão no plasma é dado por: \nCO₂(aq) + H₂O(l) ⇌ H₂CO₃(aq) ⇌ H⁺(aq) + HCO₃⁻(aq).","De acordo com o Princípio de Le Chatelier, a eliminação excessiva de CO₂ pela hiperventilação causará:",["deslocamento do equilíbrio para a direita, aumentando [H⁺] e provocando acidose sanguínea.","nenhuma alteração na concentração de íons H⁺, pois o sangue não é tamponado.","aumento da concentração de ácido carbônico e diminuição imediata do pH abaixo de 6,0.","deslocamento do equilíbrio para a esquerda, consumindo íons H⁺ e elevando o pH plasmático (alcalose respiratória).","precipitação de carbonato de cálcio nas artérias coronárias em decorrência do aumento de temperatura."],3,"Pelo Princípio de Le Chatelier, quando a concentração de um dos componentes do equilíbrio diminui, o sistema reage deslocando-se no sentido de repor a substância perdida. A hiperventilação elimina aceleradamente o CO₂(aq) dissolvido no sangue através da expiração pulmonar. Para compensar essa perda, o equilíbrio desloca-se para a esquerda: H⁺(aq) + HCO₃⁻(aq) → H₂CO₃(aq) → H₂O(l) + CO₂(aq). Ao deslocar-se para a esquerda, íons hidrônio H⁺ são continuamente consumidos. Como o pH = −log[H⁺], a diminuição da concentração de H⁺ acarreta a elevação do pH sanguíneo acima de 7,45, quadro clínico conhecido como alcalose respiratória. Alternativa A inverte o sentido do deslocamento; C nega o tamponamento sanguíneo; D afirma acúmulo de ácido quando na verdade ele é consumido; E inventa fenômeno inexistente."],"Produto de solubilidade (Kps) e precipitação":["O produto de solubilidade (Kps) é a constante do equilíbrio heterogêneo entre um sal ou hidróxido pouco solúvel (precipitado) e seus íons dissociados em solução aquosa saturada. Para um sal genérico pouco solúvel do tipo A_x B_y(s) ⇌ x Aʸ⁺(aq) + y Bˣ⁻(aq), a expressão é: Kps = [Aʸ⁺]ˣ · [Bˣ⁻]ʸ (o sólido puro não entra na expressão). Para um sal do tipo 1:1 como cloreto de prata (AgCl(s) ⇌ Ag⁺ + Cl⁻), se a solubilidade molar for 's', então Kps = s². Para prever a formação de precipitado ao misturar duas soluções, calcula-se o produto iônico (Q): 1) Se Q < Kps: solução insaturada (não há precipitação); 2) Se Q = Kps: solução exatamente saturada; 3) Se Q > Kps: solução supersaturada instável, ocorrendo PRECIPITAÇÃO do sólido até que as concentrações iônicas atinjam o valor de Kps. O efeito do íon comum diminui a solubilidade do sal.",["Kps: constante de solubilidade de sais pouco solúveis","Sal tipo AB (AgCl, BaSO₄): Kps = s² (onde s = solubilidade molar)","Sal tipo AB₂ (CaF₂, PbCl₂): Kps = (s)·(2s)² = 4s³","Critério de precipitação: se Q > Kps → PRECIPITA","Efeito do íon comum: adicionar íon presente no sal diminui sua solubilidade (desloca para o sólido)"],"Cuidado no ENEM: para exames radiológicos de estômago usa-se sulfato de bário (BaSO₄), que apesar de ter o cátion Ba²⁺ tóxico, pode ser ingerido porque seu Kps é tão minúsculo (~10⁻¹⁰) que a quantidade de íons livres dissolvidos é totalmente inofensiva!","O sulfato de bário (BaSO₄) é um sal inorgânico utilizado na medicina diagnóstica como contraste radiológico em exames de raios X do trato gastrointestinal. Embora os íons bário livres (Ba²⁺) sejam extremamente tóxicos ao sistema nervoso e cardiovascular, o paciente ingere a suspensão aquosa de BaSO₄ com total segurança. A 25 °C, a reação de dissolução e o produto de solubilidade desse sal são expressos por: \nBaSO₄(s) ⇌ Ba²⁺(aq) + SO₄²⁻(aq)   Kps = 1,0 × 10⁻¹⁰.","A viabilidade médica e a segurança toxicológica da ingestão do sulfato de bário fundamentam-se no fato de que:",["o bário é um metal alcalino de baixa toxicidade celular.","o sal sofre hidrólise ácida violenta gerando ácido sulfúrico que destrói o bário.","os íons bário reagem com as bactérias intestinais sendo reduzidos a bário gasoso inalado.","o sulfato de bário atravessa as paredes estomacais por osmose reversa sem interagir com as mucosas.","o baixíssimo valor de Kps indica que a solubilidade do sal em água é ínfima, gerando uma concentração insignificante de íons tóxicos Ba²⁺."],4,"O sulfato de bário é um sal de baixíssima solubilidade em meio aquoso, refletida pelo valor diminuto de Kps = 1,0 × 10⁻¹⁰ a 25 °C. Para a dissociação BaSO₄(s) ⇌ Ba²⁺(aq) + SO₄²⁻(aq), a solubilidade molar 's' na água é: Kps = s² → s = √(1,0 × 10⁻¹⁰) = 1,0 × 10⁻⁵ mol/L (apenas 0,0023 g por litro de água). Como praticamente nenhum íon Ba²⁺ é liberado na forma solúvel para ser absorvido pela corrente sanguínea, o sal passa inerte por todo o tubo digestivo atuando apenas como radiopaco aos raios X. Alternativa A é incorreta porque o bário é alcalinoterroso e altamente tóxico; B sugere hidrólise inexistente; D e E formulam proposições absurdas."],"Constante de equilíbrio em pressões parciais (Kp)":["Para reações químicas que envolvem substâncias no estado gasoso, o estado de equilíbrio pode ser quantificado tanto pela constante em concentrações molares (Kc) quanto pela constante de equilíbrio em termos de pressões parciais (Kp). A constante Kp é expressa pela razão entre o produto das pressões parciais dos gases produzidos e o produto das pressões parciais dos gases reagentes no equilíbrio, cada qual elevada ao seu coeficiente estequiométrico: para a A(g) + b B(g) ⇌ c C(g) + d D(g), Kp = (P_C)ᶜ · (P_D)ᵈ / [(P_A)ᵃ · (P_B)ᵇ]. Substâncias sólidas e líquidas puras NÃO participam da expressão de Kp, pois não exercem pressão parcial de vapor no sistema gasoso. A relação matemática fundamental entre Kp e Kc é dada por: Kp = Kc · (R · T)^Δn, onde R é a constante dos gases (0,082 atm·L/(mol·K)), T a temperatura absoluta em kelvin e Δn é a variação do número de mols gasosos (Δn = mols gasosos dos produtos − mols gasosos dos reagentes). Se Δn = 0 (mesmo número de mols de gás dos dois lados), então Kp = Kc.",["Constante de pressões parciais: Kp = (P_produtos) / (P_reagentes), elevados aos coeficientes","Apenas espécies GASOSAS entram na expressão de Kp (sólidos e líquidos são excluídos!)","Relação entre Kp e Kc: Kp = Kc · (R · T)^Δn","Variação de mols gasosos: Δn = n(gases produtos) − n(gases reagentes)","Se Δn = 0: Kp = Kc (ex: H₂(g) + I₂(g) ⇌ 2 HI(g), onde Δn = 2 − 2 = 0)"],"Cuidado no ENEM: sólidos NUNCA entram no Kp! Na calcinação do calcário CaCO₃(s) ⇌ CaO(s) + CO₂(g), temos Kp = P_CO₂ (simplesmente a pressão parcial do gás carbônico!).","Em um forno fechado de laboratório a 800 °C, atinge-se o equilíbrio químico da decomposição térmica do carbonato de cálcio sólido: \nCaCO₃(s) ⇌ CaO(s) + CO₂(g).","Qual é a expressão correta da constante de equilíbrio Kp para essa reação química?",["Kp = P_CO₂","Kp = [P_CaO · P_CO₂] / P_CaCO₃","Kp = P_CaCO₃ / [P_CaO · P_CO₂]","Kp = (P_CO₂)²","Kp = 1 / P_CO₂"],0,"Resolução: Na expressão da constante de equilíbrio em pressões parciais (Kp), participam exclusivamente as substâncias que se encontram no estado gasoso, uma vez que sólidos puros e líquidos puros não exercem pressões parciais variáveis em misturas gasosas e suas atividades termodinâmicas são unitárias. Na reação balanceada: CaCO₃(s) ⇌ CaO(s) + CO₂(g), tanto o carbonato de cálcio (CaCO₃) quanto o óxido de cálcio (CaO) são substâncias sólidas puras e, portanto, são totalmente omitidos da expressão da constante de equilíbrio. A única substância gasosa participante é o dióxido de carbono [CO₂(g)], cujo coeficiente estequiométrico é 1. Logo, a expressão da constante de equilíbrio em pressões parciais é simplesmente: Kp = P_CO₂. Isso significa que, a uma dada temperatura fixa, a decomposição do calcário mantém a pressão de CO₂ rigorosamente constante no recipiente fechado. Alternativa B inclui incorretamente os sólidos na expressão; C inverte produtos e reagentes; D eleva ao quadrado sem coeficiente estequiométrico correspondente; E inverte a pressão parcial do produto."],"Efeito do íon comum no equilíbrio iônico":["O efeito do íon comum é uma aplicação direta do Princípio de Le Chatelier aos equilíbrios químicos de ionização ou dissociação em solução aquosa. Ocorre quando se adiciona a uma solução em equilíbrio um eletrólito solúvel que contém um íon idêntico a um dos íons já presentes no sistema. De acordo com Le Chatelier, o aumento da concentração desse íon comum perturba o equilíbrio, forçando o sistema a se deslocar no sentido oposto para consumir o íon em excesso. Consequências fundamentais: 1) Em equilíbrios de ácidos fracos: ao adicionar um sal solúvel que contém o ânion do ácido (ex: adicionar acetato de sódio CH₃COONa a uma solução de ácido acético CH₃COOH ⇌ H⁺ + CH₃COO⁻), a alta concentração de CH₃COO⁻ desloca o equilíbrio para a ESQUERDA, reduzindo expressivamente o grau de ionização (α) do ácido acético e diminuindo a concentração de H⁺, o que acarreta a elevação do pH da solução; 2) Em equilíbrios de solubilidade (Kps): ao adicionar um sal solúvel com íon comum a uma solução saturada de um sal pouco solúvel (ex: adicionar NaCl a uma suspensão de cloreto de prata AgCl(s) ⇌ Ag⁺ + Cl⁻), o excesso de Cl⁻ desloca o equilíbrio para o sólido, DIMINUINDO a solubilidade do AgCl e provocando maior precipitação.",["Efeito do íon comum: adição de um íon já presente desloca o equilíbrio no sentido de consumi-lo","Ácido fraco + sal de íon comum: diminui a ionização do ácido e ELEVA o pH","Sal pouco solúvel + eletrólito com íon comum: DIMINUI a solubilidade do sal e aumenta o precipitado","Mecanismo: decorrência direta do Princípio de Le Chatelier","Base de formação de soluções-tampão: mistura de ácido fraco e sal de sua base conjugada"],"Cuidado no ENEM: o efeito do íon comum SEMPRE DIMINUI a ionização do ácido fraco e SEMPRE DIMINUI a solubilidade de um sal pouco solúvel!","Uma solução aquosa de ácido acético (vinagre, CH₃COOH) atinge o seguinte equilíbrio de ionização a 25 °C: \nCH₃COOH(aq) ⇌ H⁺(aq) + CH₃COO⁻(aq). \nA essa solução adiciona-se uma quantidade considerável de cristais de acetato de sódio sólido (CH₃COONa), um sal completamente solúvel e dissociado em água que fornece íons sódio (Na⁺) e íons acetato (CH₃COO⁻).","Em consequência da adição de acetato de sódio, observa-se que:",["o equilíbrio se desloca para a direita, aumentando a concentração de íons H⁺ e diminuindo o pH da solução.","o grau de ionização do ácido acético diminui em virtude do efeito do íon comum, deslocando o equilíbrio para a esquerda e elevando o pH da solução.","a constante de equilíbrio Ka dobra de valor numérico na mesma temperatura.","o ácido acético precipita como um sólido insolúvel no fundo do recipiente.","a condutibilidade elétrica da solução é zerada pela aniquilação completa dos íons."],1,"Resolução: O acetato de sódio (CH₃COONa) é um composto iônico que se dissocia 100% em meio aquoso: CH₃COONa(s) → Na⁺(aq) + CH₃COO⁻(aq). Ao ser dissolvido na solução de ácido acético, ele introduz uma quantidade maciça de íons acetato (CH₃COO⁻), que já estavam presentes no equilíbrio de ionização do ácido acético (íon comum). Pelo Princípio de Le Chatelier, o acréscimo abrupto de um produto desloca o equilíbrio químico no sentido de consumi-lo, isto é, para a esquerda (no sentido de regeneração das moléculas não ionizadas de CH₃COOH). Ao deslocar-se para a esquerda, íons hidrogênio livres H⁺ são consumidos (recombinam-se com o acetato), reduzindo a concentração de H⁺ em solução. Como pH = −log[H⁺], a redução da acidez acarreta a elevação do pH da solução (o meio fica menos ácido), além de reduzir o grau de ionização (α) do ácido acético. A constante Ka permanece rigorosamente inalterada, pois depende unicamente da temperatura. Alternativa A inverte o deslocamento e o pH; C afirma alteração de Ka a temperatura constante; D e E formulam fenômenos irreais."],"Indicadores ácido-base e curvas de titulação":["Indicadores ácido-base são substâncias orgânicas com propriedades de ácidos fracos (HIn) ou bases fracas que exibem cores distintas em suas formas protonada e desprotonada em virtude de alterações em sua estrutura de ressonância eletrônica conjugada: HIn(aq) [Cor A] ⇌ H⁺(aq) + In⁻(aq) [Cor B]. A cor observada visualmente depende da relação entre o pH do meio e o pKa do indicador (pKa = −log Ka_ind). Quando pH < pKa − 1, predomina a forma ácida HIn (Cor A); quando pH > pKa + 1, predomina a base conjugada In⁻ (Cor B); na faixa intermediária (faixa de viragem do indicador, tipicamente de 2 unidades de pH em torno do pKa), o olho humano detecta uma cor de transição mista. Indicadores clássicos: 1) Fenolftaleína: incolor em meio ácido e neutro (pH < 8,2) e rosa-cármen intenso em meio alcalino (pH > 10,0); 2) Azul de bromotimol: amarelo em meio ácido (pH < 6,0), verde em pH neutro (~7,0) e azul em meio alcalino (pH > 7,6); 3) Tornassol: vermelho em ácido e azul em base. Em titulações volumétricas, o indicador adequado é aquele cuja faixa de viragem coincide com o salto brusco de pH no ponto de equivalência: na titulação de ácido forte com base forte, o ponto de equivalência ocorre em pH = 7,0 (fenolftaleína ou azul de bromotimol são excelentes); na titulação de ácido fraco com base forte, o ponto de equivalência é alcalino (pH > 7, hidrólise básica do ânion), exigindo obrigatoriamente fenolftaleína.",["Equilíbrio do indicador: HIn [Cor Ácida] ⇌ H⁺ + In⁻ [Cor Básica]","Fenolftaleína: incolor em meio ácido/neutro (pH < 8,2); rosa intenso em meio alcalino (pH > 8,2)","Azul de bromotimol: amarelo em meio ácido (pH < 6,0); azul em meio básico (pH > 7,6)","Faixa de viragem: intervalo de pH em que o indicador muda gradualmente de cor (ΔpH ≈ 2)","Escolha do indicador em titulação: a faixa de viragem deve conter o pH do ponto de equivalência"],"Cuidado no ENEM: fenolftaleína NÃO fica rosa no ácido! Ela é INCOLOR em água pura e em ácidos (vinagre, HCl); ela só fica rosa em meio BÁSICO (soda cáustica, amônia, sabão).","Em uma aula de química forense e controle de qualidade, um estudante colocou três tubos de ensaio contendo líquidos transparentes e incolores: \n• Tubo 1: vinagre comercial (ácido acético diluído, pH ≈ 3) \n• Tubo 2: água destilada pura neutra (pH = 7) \n• Tubo 3: produto de limpeza contendo amoníaco (hidróxido de amônio, pH ≈ 11). \nEm seguida, ele adicionou duas gotas de solução alcoólica de fenolftaleína em cada um dos tubos.","As cores finais observadas nos tubos 1, 2 e 3 após a adição do indicador foram, respectivamente:",["rosa, rosa e incolor.","amarelo, verde e azul.","incolor, incolor e rosa-cármen.","vermelho, incolor e azul.","incolor, rosa e azul."],2,"Resolução: A fenolftaleína é um indicador ácido-base sintético cuja faixa de viragem ocorre entre pH 8,2 e 10,0. Em soluções com pH inferior a 8,2 (meio ácido e meio neutro), a fenolftaleína encontra-se predominantemente na sua forma ácida molecular protonada (HIn), que não absorve luz na faixa visível e é totalmente incolor. Portanto, no Tubo 1 (vinagre, pH ≈ 3) e no Tubo 2 (água destilada neutra, pH = 7), a solução permanece rigorosamente incolor. No Tubo 3, a presença de amoníaco (NH₄OH) confere caráter francamente alcalino à solução (pH ≈ 11 > 8,2). Em meio básico, os íons hidroxila (OH⁻) desprotonam a molécula do indicador gerando o ânion conjugado (In⁻) com sistema conjugado de elétrons pi estendido que absorve luz verde e transmite uma coloração rosa-cármen (ou magenta) muito intensa e característica. Assim, a sequência correta de cores é: incolor, incolor e rosa-cármen. Alternativa A inverte o teste; C descreveria o azul de bromotimol; D e E descrevem comportamentos impossíveis para a fenolftaleína."],"Ciclos biogeoquímicos (carbono, nitrogênio e enxofre)":["Os ciclos biogeoquímicos descrevem a circulação e reciclagem contínua de elementos químicos essenciais entre os seres vivos (biosfera) e o meio abiótico (atmosfera, hidrosfera e litosfera). No ciclo do carbono, o CO₂ atmosférico é fixado por organismos autotróficos através da fotossíntese (6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂) e devolvido à atmosfera pela respiração celular, decomposição e combustão de combustíveis fósseis. No ciclo do nitrogênio, o gás inerte N₂ (que compõe 78% do ar) é fixado por bactérias simbióticas (como <i>Rhizobium</i> nas raízes de leguminosas) convertendo-se em amônia/amônio (NH₃/NH₄⁺); a nitrificação converte o amônio em nitrito (NO₂⁻ por <i>Nitrosomonas</i>) e nitrato (NO₃⁻ por <i>Nitrobacter</i>), forma assimilável pelas plantas; bactérias desnitrificantes fecham o ciclo convertendo nitrato em N₂ gasoso. O aporte excessivo de nitratos e fosfatos em rios e lagos causa a eutrofização.",["Fotossíntese: consome CO₂ e libera O₂; Respiração/Combustão: consome O₂ e libera CO₂","Fixação de N₂: realizada por bactérias (<i>Rhizobium</i>), convertendo N₂ em NH₄⁺","Nitrificação: amônio (NH₄⁺) → nitrito (NO₂⁻) → nitrato (NO₃⁻)","Eutrofização: excesso de N e P → proliferação de algas → morte de algas → bactérias aeróbias esgotam o O₂ dissolvido → morte de peixes","Biomagnificação trófica: acúmulo crescente de poluentes não biodegradáveis ao longo da cadeia alimentar"],"Cuidado no ENEM com a eutrofização: o esgotamento do oxigênio NÃO é causado diretamente pelas algas vivas! É causado pelas BACTÉRIAS AERÓBIAS que se multiplicam para decompor a massa de algas mortas.","O lançamento contínuo de esgoto doméstico não tratado ou de efluentes agrícolas ricos em fertilizantes nitrogenados e fosfatados em corpos hídricos de água doce desencadeia o fenômeno da eutrofização, conforme a sequência de eventos resumida:\n  <div style=\"text-align:center;margin:12px 0;\">\n    <svg viewBox=\"0 0 350 110\" style=\"width:100%;max-width:350px;height:auto;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px;\">\n      <text x=\"10\" y=\"16\" fill=\"var(--mu)\" font-size=\"11\" font-family=\"sans-serif\">Sequência da Eutrofização Aquática</text>\n      <!-- Step 1 -->\n      <rect x=\"15\" y=\"30\" width=\"85\" height=\"40\" rx=\"4\" fill=\"none\" stroke=\"var(--ac)\" stroke-width=\"1.5\"/>\n      <text x=\"20\" y=\"47\" fill=\"var(--tx)\" font-size=\"10\" font-family=\"sans-serif\">Excesso de N e P</text>\n      <text x=\"20\" y=\"60\" fill=\"var(--mu)\" font-size=\"9\" font-family=\"sans-serif\">(fertilizantes/esgoto)</text>\n      <!-- Arrow -->\n      <text x=\"105\" y=\"55\" fill=\"var(--ac)\" font-size=\"14\" font-weight=\"bold\">→</text>\n      <!-- Step 2 -->\n      <rect x=\"125\" y=\"30\" width=\"95\" height=\"40\" rx=\"4\" fill=\"none\" stroke=\"var(--ok)\" stroke-width=\"1.5\"/>\n      <text x=\"130\" y=\"47\" fill=\"var(--tx)\" font-size=\"10\" font-family=\"sans-serif\">Floração de Algas</text>\n      <text x=\"130\" y=\"60\" fill=\"var(--mu)\" font-size=\"9\" font-family=\"sans-serif\">(bloqueia luz solar)</text>\n      <!-- Arrow -->\n      <text x=\"225\" y=\"55\" fill=\"var(--ac)\" font-size=\"14\" font-weight=\"bold\">→</text>\n      <!-- Step 3 -->\n      <rect x=\"245\" y=\"30\" width=\"95\" height=\"40\" rx=\"4\" fill=\"none\" stroke=\"var(--er)\" stroke-width=\"1.5\"/>\n      <text x=\"250\" y=\"47\" fill=\"var(--tx)\" font-size=\"10\" font-family=\"sans-serif\">Morte por Asfixia</text>\n      <text x=\"250\" y=\"60\" fill=\"var(--mu)\" font-size=\"9\" font-family=\"sans-serif\">(decomposição consome O₂)</text>\n      <text x=\"20\" y=\"95\" fill=\"var(--er)\" font-size=\"10\" font-family=\"sans-serif\">Consequência final: colapso da fauna aquática e dominância anaeróbia</text>\n    </svg>\n  </div>","O fator bioquímico determinante que acarreta a mortalidade em massa de peixes na fase avançada da eutrofização é a:",["elevação excessiva da concentração de gás oxigênio dissolvido na água.","transformação fotoquímica de todo o fósforo inorgânico em cianeto altamente letal.","acidificação extrema provocada pela dissolução de gás hélio de origem fóssil.","redução drástica do oxigênio dissolvido causada pela proliferação de bactérias decompositoras aeróbias.","neutralização dos sais minerais pelas chuvas que impede a natação dos peixes."],3,"Na fase avançada da eutrofização, a proliferação superficial maciça de algas (floração) impede a penetração da luz solar, inviabilizando a fotossíntese nas camadas mais profundas. Quando essas algas morrem, uma enorme biomassa vegetal se acumula no leito do rio ou lago. A decomposição dessa matéria orgânica por bactérias heterotróficas aeróbias consome aceleradamente o oxigênio dissolvido (OD) na água, levando à anóxia (esgotamento do O₂). Sem oxigênio para a respiração branquial, os peixes morrem por asfixia, seguindo-se a proliferação de bactérias anaeróbias que geram gases malcheirosos como H₂S e CH₄. Alternativa A diz o oposto; C cita gás hélio inerte; D e E mencionam transformações estapafúrdias."],"Efeito estufa e gases de aquecimento global":["O efeito estufa é um fenômeno natural e indispensável à vida que mantém a temperatura média da Terra em torno de +15 °C (sem ele, o planeta seria congelado a cerca de −18 °C). A radiação solar que atinge a Terra consiste principalmente de luz visível e radiação ultravioleta de comprimento de onda curto, que atravessam a atmosfera e aquecem a superfície terrestre. A Terra reemite essa energia na forma de radiação infravermelha de comprimento de onda mais longo (radiação térmica). Determinados gases na troposfera — os gases de efeito estufa (GEE) — absorvem essa radiação infravermelha excitando suas ligações químicas e a reemitem em todas as direções, retendo calor no planeta. Os principais GEE são: vapor de água (H₂O, maior contribuinte natural), dióxido de carbono (CO₂, principal causador do aquecimento antrópico pela queima de combustíveis fósseis e desmatamento), metano (CH₄, proveniente da pecuária bovina, decomposição em aterros e cultivo de arroz inundado, com potencial de aquecimento 25 vezes maior que o CO₂), óxido nitroso (N₂O) e compostos fluorados.",["Efeito estufa natural: essencial à vida (mantém média em +15 °C)","Mecanismo: superfície emite INFRAVERMELHO que é absorvido pelos GEE","Gases estufa principais: H₂O (vapor), CO₂, CH₄, N₂O, CFCs","Metano (CH₄): potencial de aquecimento global ~25 a 28 vezes maior que o CO₂","Fontes antrópicas: queima de fósseis (carvão, petróleo, gás), desmatamento e agropecuária"],"Cuidado no ENEM: o gás do efeito estufa retém radiação INFRAVERMELHA (calor), e NÃO radiação ultravioleta! Quem interage com radiação ultravioleta é o ozônio na estratosfera.","Estudos do Painel Intergovernamental sobre Mudanças Climáticas (IPCC) alertam que a queima de combustíveis fósseis e as atividades agropecuárias aumentaram substancialmente a concentração de CO₂ e CH₄ na troposfera, intensificando o efeito estufa e elevando a temperatura média global do planeta.","Do ponto de vista físico-químico, o aquecimento da troposfera decorre da capacidade das moléculas dos gases de efeito estufa de:",["reagir espontaneamente com o gás oxigênio do ar gerando chamas invisíveis de alta temperatura.","refletir a radiação visível do Sol antes que ela consiga atingir a crosta terrestre.","absorver a radiação ultravioleta emitida pelo Sol convertendo-a em nêutrons livres.","destruir a camada de ozônio permitindo a entrada direta de raios cósmicos de alta frequência.","absorver a radiação infravermelha térmica emitida pela superfície aquecida da Terra e reemiti-la para o ambiente."],4,"A superfície do planeta absorve a radiação eletromagnética solar (composta fundamentalmente por radiação ultravioleta e luz visível de comprimentos de onda curtos) e se aquece, passando a emitir radiação eletromagnética na faixa do infravermelho (comprimento de onda longo, associado à energia térmica). Moléculas triatômicas ou poliatômicas com dipolos oscilantes como CO₂ e CH₄ possuem modos vibracionais que absorvem especificamente fótons de radiação infravermelha, reemitindo essa energia termicamente em todas as direções e retendo calor na baixa atmosfera. Alternativa C confunde com proteção ultravioleta do ozônio; B descreveria resfriamento por albedo; D mistura efeito estufa com buraco na camada de ozônio; E inventa combustão inexistente."],"Chuva ácida e deposição ácida":["Toda chuva não poluída é naturalmente ligeiramente ácida (pH em torno de 5,6) em virtude da dissolução do CO₂ atmosférico na água da chuva, formando o ácido carbônico fraco: CO₂(g) + H₂O(l) ⇌ H₂CO₃(aq). A chuva ácida propriamente dita é aquela cujo pH é inferior a 5,6, resultante da queima de combustíveis fósseis que contêm impurezas de enxofre (óleo diesel, carvão mineral) e de reações a altas temperaturas nos motores veiculares. Principais precursores: 1) Óxidos de enxofre (SO₂ e SO₃): S + O₂ → SO₂; 2 SO₂ + O₂ → 2 SO₃; SO₃ + H₂O → H₂SO₄ (ácido sulfúrico, ácido forte); 2) Óxidos de nitrogênio (NO e NO₂): N₂ + O₂ → 2 NO; 2 NO + O₂ → 2 NO₂; 2 NO₂ + H₂O → HNO₃ (ácido nítrico forte) + HNO₂. Impactos ambientais graves: corrosão de monumentos históricos e estátuas de mármore e calcário (CaCO₃ + H₂SO₄ → CaSO₄ + CO₂ + H₂O), lixiviação de nutrientes e liberação de íons tóxicos de alumínio (Al³⁺) no solo e acidificação mortífera de lagos e rios.",["Chuva natural não poluída: pH ~5,6 (ácido carbônico fraco H₂CO₃)","Chuva ácida poluída: pH < 5,6 (presença de H₂SO₄ e HNO₃)","Principais gases causadores: SO₂ / SO₃ (queima de enxofre) e NO / NO₂ (motores veiculares)","Corrosão do mármore (CaCO₃): CaCO₃ + H₂SO₄ → CaSO₄ + H₂O + CO₂","Mitigação: dessulfurização de combustíveis (diesel S10) e uso de catalisadores automotivos"],"Cuidado no ENEM: chuva normal JÁ É ácida (pH ~5,6) pelo CO₂ do ar! Só chamamos de 'chuva ácida' o impacto poluente com pH abaixo de 5,6 causado por SO_x e NO_x gerando ácidos fortes (sulfúrico e nítrico).","Monumentos históricos esculpidos em mármore (constituído predominantemente por carbonato de cálcio, CaCO₃) e estruturas de ferro em centros urbanos industrializados sofrem acelerado desgaste químico e desmoronamento estético em decorrência da chuva ácida.","A reação química balanceada que explica a corrosão direta das estátuas de mármore pelo ácido sulfúrico presente na chuva ácida é:",["CaCO₃(s) + H₂SO₄(aq) → CaSO₄(s) + H₂O(l) + CO₂(g)","CaCO₃(s) + H₂SO₄(aq) → CaS(s) + 2 O₂(g) + H₂CO₃(aq)","CaCO₃(s) + 2 HCl(aq) → CaCl₂(s) + H₂(g) + O₂(g)","CaCO₃(s) + H₂SO₄(aq) → CaO(s) + SO₂(g) + CO₂(g)","CaCO₃(s) + H₂SO₄(aq) → Ca(s) + H₂SO₃(aq) + CO(g)"],0,"O mármore é constituído por carbonato de cálcio (CaCO₃), um sal de caráter básico derivado de ácido fraco (ácido carbônico). O ácido sulfúrico (H₂SO₄) dissolvido na chuva ácida é um ácido forte diprótico. Ao entrar em contato com o mármore, ocorre uma clássica reação de dupla troca seguida de decomposição do ácido carbônico: CaCO₃(s) + H₂SO₄(aq) → CaSO₄(s) + H₂CO₃(aq). Como o ácido carbônico se decompõe instantaneamente em água e gás carbônico, a equação global é: CaCO₃(s) + H₂SO₄(aq) → CaSO₄(s) + H₂O(l) + CO₂(g). O sulfato de cálcio formado é mais solúvel e mecanicamente frágil que o mármore, sendo lavado pelas chuvas e desfigurando as esculturas. Alternativas B, C, D e E contêm produtos estequiometricamente e termodinamicamente incorretos."],"Destruição da camada de ozônio (CFCs)":["A camada de ozônio (ozonosfera) localiza-se na estratosfera (entre 15 e 35 km de altitude) e cumpre a função vital de filtrar mais de 95% da radiação ultravioleta de alta energia do Sol (especialmente as faixas nocivas UV-B e UV-C), que causam mutações no DNA, câncer de pele, catarata e colapso no fitoplâncton marinho. O ozônio (O₃) é mantido em ciclo de formação e destruição natural: O₂ + UV → 2 O•; O• + O₂ → O₃. A degradação antrópica foi causada pelo uso em larga escala de clorofluorocarbonetos (CFCs, como o Freon-12, CF₂Cl₂), gases sintéticos outrora usados como propelentes de aerossóis, solventes e fluidos refrigerantes em geladeiras e aparelhos de ar-condicionado. Na estratosfera, a radiação UV rompe as ligações carbono-cloro dos CFCs liberando radicais livres de cloro (Cl•). O radical cloro atua como CATALISADOR na destruição do ozônio: Cl• + O₃ → ClO• + O₂ e ClO• + O• → Cl• + O₂, regenerando o átomo de cloro intacto. Um único átomo de cloro pode destruir mais de 100 000 moléculas de ozônio antes de ser inativado.",["Ozônio estratosférico (O₃): filtro natural dos raios UV-B e UV-C","CFCs (clorofluorocarbonetos): moléculas inertes na troposfera que atingem a estratosfera","Radical livre de cloro (Cl•): atua como CATALISADOR na quebra do O₃","Etapas catalíticas: Cl• + O₃ → ClO• + O₂ e ClO• + O• → Cl• + O₂","Protocolo de Montreal (1987): baniu globalmente os CFCs, substituindo-os por HFCs"],"Cuidado no ENEM: o átomo de cloro (Cl•) atua como CATALISADOR na destruição do ozônio porque acelera a quebra do O₃ e É REGENERADO no final de cada ciclo para reagir novamente!","O Protocolo de Montreal (1987) foi um marco histórico global no qual nações de todo o mundo concordaram em eliminar progressivamente a produção de clorofluorocarbonetos (CFCs) para deter a rarefação da camada de ozônio sobre a Antártida.","O papel exercido pelo radical livre de cloro (Cl•) liberado pela fotólise dos CFCs na estratosfera é o de:",["reagente estequiométrico que é consumido na proporção de 1 mol de cloro para cada 1 mol de ozônio destruído.","catalisador químico que acelera a decomposição do ozônio em oxigênio e é regenerado ao final de cada ciclo de
