! Escreva a lei da velocidade usando EXCLUSIVAMENTE os reagentes da ETAPA LENTA.","A decomposição em fase gasosa do dióxido de nitrogênio com monóxido de carbono ocorre de acordo com a equação global balanceada: \nNO₂(g) + CO(g) → NO(g) + CO₂(g). \nEstudos cinéticos experimentais comprovaram que a reação não é elementar, processando-se através de um mecanismo em duas etapas: \n• Etapa 1 (lenta): 2 NO₂(g) → NO₃(g) + NO(g) \n• Etapa 2 (rápida): NO₃(g) + CO(g) → NO₂(g) + CO₂(g)","Com base nesse mecanismo de reação, qual é a expressão correta da lei da velocidade e qual a ordem global do processo, respectivamente?",["v = k · [NO₂] · [CO]; ordem global igual a 2.","v = k · [NO₃] · [CO]; ordem global igual a 2.","v = k · [NO₂]²; ordem global igual a 2.","v = k · [NO₂]² · [CO]; ordem global igual a 3.","v = k · [NO] · [CO₂]; ordem global igual a 2."],2,"Para qualquer reação química cujo mecanismo envolva mais de uma etapa elementar, a etapa mais lenta funciona como o gargalo cinético que dita e restringe a taxa com que os produtos finais são sintetizados: a lei de velocidade da reação global é idêntica à lei de velocidade da sua etapa lenta. Na Etapa 1 (lenta), temos a colisão bimolecular entre duas moléculas de dióxido de nitrogênio: 2 NO₂(g) → NO₃(g) + NO(g). Sendo uma etapa elementar, seus expoentes coincidem com os coeficientes estequiométricos dos seus reagentes: v = k · [NO₂]². O monóxido de carbono (CO) não participa da etapa lenta, de modo que sua concentração não interfere na velocidade inicial da reação (ordem zero em relação ao CO). A ordem global da reação é a soma dos expoentes: 2 + 0 = 2 (segunda ordem global). Alternativa A baseia-se na equação global (erro clássico); C utiliza intermediário instável (NO₃); D soma as duas etapas; E utiliza produtos da reação global."],"Catálise enzimática e inibidores":["As enzimas são catalisadores biológicos de natureza proteica que aceleram em milhões de vezes as reações químicas vitais nos organismos vivos sob condições fisiológicas extremamente suaves de temperatura (~37 °C) e pH neutro. A catálise enzimática caracteriza-se pela altíssima especificidade substrato-enzima, tradicionalmente explicada pelo modelo da 'chave-fechadura' de Fischer ou pelo modelo do 'ajuste induzido' de Koshland: a molécula do reagente (substrato) liga-se a uma cavidade tridimensional específica da enzima denominada sítio ativo. As enzimas operam diminuindo drasticamente a energia de ativação da reação celular. A atividade enzimática é altamente dependente de fatores físicos e químicos: 1) Temperatura: a velocidade cresce com a temperatura até atingir uma temperatura ótima (~37 °C no corpo humano); acima dessa faixa térmica, o excesso de energia agita a cadeia polipeptídica rompendo as fracas ligações de hidrogênio e interações hidrofóbicas que mantêm a estrutura terciária da proteína, provocando a DESNATURAÇÃO térmica irreversível da enzima e perda total de sua função catalítica; 2) pH ótimo; 3) Inibidores enzimáticos (competitivos ou alostéricos), que bloqueiam a catálise.",["Enzimas: catalisadores proteicos biológicos com sítio ativo de alta especificidade","Mecanismo: Enzima + Substrato ⇌ Complexo E-S → Enzima + Produtos","Temperatura ótima: máxima velocidade metabólica (~37 °C no ser humano)","Desnaturação proteica: aquecimento excessivo (> 50-60 °C) destrói a conformação terciária da enzima sem quebrar a ligação peptídica","Inibição competitiva: inibidor se assemelha ao substrato e disputa o sítio ativo"],"Cuidado no ENEM: febre alta prolongada (> 41 °C) é perigosa para o corpo porque começa a DESNATURAR enzimas metabólicas vitais no cérebro e órgãos, paralisando reações químicas essenciais à vida!","A clara de ovo é constituída majoritariamente por água e por uma solução coloidal de proteínas globulares, destacando-se a ovalbumina e enzimas como a lisozima. Ao cozinhar o ovo em água fervente a 100 °C, a clara transparente e fluida transforma-se rapidamente em uma massa branca, opaca e rígida, perdendo de forma permanente sua atividade biológica original.","A alteração nas propriedades físicas da clara e a inativação catalítica das enzimas do ovo pelo cozimento devem-se à:",["hidrólise completa de todas as ligações peptídicas amídicas em aminoácidos isolados.","oxidação destrutiva de todos os átomos de carbono das cadeias peptídicas a gás CO₂.","redução eletroquímica dos átomos de nitrogênio das proteínas em gás amônia tóxico.","desnaturação proteica, processo no qual o calor rompe as interações intermoleculares que mantêm a conformação espacial terciária da proteína.","polimerização por adição dos aminoácidos formando macromoléculas de polietileno."],3,"A estrutura funcional de uma proteína ou enzima depende rigorosamente de sua conformação tridimensional espacial (estruturas secundária e terciária), estabilizada por interações intermoleculares frágeis como ligações de hidrogênio, interações hidrofóbicas, atrações iônicas e pontes dissulfeto entre os resíduos de aminoácidos. Ao submeter o ovo ao calor a 100 °C, a intensa agitação térmica supera essas fracas atrações conformacionais, desenrolando a cadeia polipeptídica em um processo conhecido como desnaturação proteica. As cadeias desenroladas expõem regiões hidrofóbicas que se aglomeram e formam uma rede insolúvel entrelaçada e opaca (coagulação). Como o sítio ativo tridimensional da enzima é desmantelado na desnaturação, a atividade catalítica cessa definitivamente, sem que nenhuma ligação peptídica primária (covalente) tenha sido rompida. Alternativa A afirma que houve hidrólise de ligações peptídicas (o cozimento desnatura, mas não hidrolisa proteínas em aminoácidos livres); C, D e E citam transformações químicas absurdas."],"Gráficos cinéticos e velocidade instantânea":["Os gráficos cinéticos representam quantitativamente a evolução temporal de uma reação química através da variação da concentração de reagentes ou produtos em função do tempo (curvas de concentração × tempo). Como os reagentes são continuamente consumidos, a curva de qualquer reagente é decrescente e côncava para cima, aproximando-se assintoticamente de zero (se o reagente for limitante em reação irreversível) ou de um valor constante não nulo (se a reação atingir o equilíbrio químico). Inversamente, a curva de concentração dos produtos parte de zero e é monotonicamente crescente até atingir o platô final. A inclinação da reta tangente à curva em um determinado instante (a derivada d[C]/dt) fornece o valor da VELOCIDADE INSTANTÂNEA da reação naquele ponto exato. Em qualquer reação típica, a velocidade é MÁXIMA no instante inicial (t = 0), momento em que as concentrações dos reagentes são as maiores possíveis e a frequência de colisões intermoleculares é máxima; à medida que o tempo avança e os reagentes são gastos, a concentração diminui e a velocidade instantânea decai progressivamente, tendendo a zero no término da reação.",["Gráfico Reagente × Tempo: curva decrescente assintótica (concentração diminui)","Gráfico Produto × Tempo: curva crescente assintótica (concentração aumenta)","Velocidade instantânea: dada pela inclinação da tangente à curva no ponto (tangente à curva no instante t)","Velocidade máxima: ocorre no início da reação (t = 0), onde a concentração de reagentes é máxima","Ao longo do tempo: a velocidade da reação SEMPRE diminui (pois a concentração cai e ocorrem menos colisões)"],"Cuidado no ENEM: a velocidade de uma reação NÃO é constante ao longo do tempo! Ela é máxima no início (t = 0) e vai diminuindo continuamente à medida que os reagentes são consumidos.","Em um estudo cinético de bancada para acompanhar a taxa de decomposição do peróxido de hidrogênio (água oxigenada, 2 H₂O₂ → 2 H₂O + O₂), registrou-se a concentração molar de H₂O₂ em função do tempo decorrido, obtendo-se uma curva decrescente contínua.","A respeito da velocidade de consumo do reagente ao longo do experimento e da forma da curva no gráfico cinético, constata-se que:",["a velocidade é mínima no início do experimento e atinge seu valor máximo no final da reação.","a velocidade instantânea independe da concentração de reagentes em soluções líquidas.","a reação ocorre com velocidade rigorosamente constante do início ao fim em qualquer reação química.","a curva de concentração do reagente é uma linha reta horizontal paralela ao eixo do tempo.","a velocidade é máxima no instante inicial (t = 0) e diminui progressivamente com o tempo, pois o consumo dos reagentes reduz a probabilidade de choques efetivos entre as moléculas."],4,"Resolução: Pela Lei da Ação das Massas de Guldberg-Waage (v = k·[reagentes]ⁿ), a velocidade de uma reação química é diretamente proporcional às concentrações molares das espécies reagentes elevadas às suas ordens de reação. No instante inicial (t = 0), o número de moléculas de reagente por unidade de volume encontra-se em seu ápice absoluto, proporcionando a frequência máxima de colisões eficazes por segundo: a velocidade instantânea de reação é máxima em t = 0. Conforme a reação se processa, os reagentes são convertidos em produtos e suas concentrações molares diminuem continuamente; com menos partículas reagentes colidindo por segundo no sistema, a taxa de transformação desacelera progressivamente ao longo do tempo. No gráfico de concentração × tempo, isso se traduz visualmente por uma curva exponencial decrescente cuja inclinação da reta tangente vai se tornando gradualmente menos inclinada até se estabilizar na horizontal no término da reação ou no equilíbrio. Alternativa A inverte a velocidade temporal; C supõe velocidade constante (que só ocorreria em ordem zero absoluta sob condições artificiais específicas); D e E violam princípios básicos da cinética."],"Inibição enzimática competitiva e alostérica":["A regulação da velocidade das reações metabólicas nas células biológicas e a ação farmacológica de inúmeros medicamentos e venenos operam através de mecanismos de inibição enzimática. Inibidores são substâncias que reduzem ou anulam a atividade catalítica de uma enzima ao se ligarem a ela. Os dois tipos clássicos cobrados em vestibulares e no ENEM são: 1) Inibição Competitiva: o inibidor possui conformação geométrica e química muito semelhante à do substrato natural e compete diretamente com ele pela ocupação do sítio ativo da enzima. O inibidor bloqueia fisicamente o sítio ativo, impedindo a ligação do substrato. Uma característica fundamental da inibição competitiva é que ela é REVERSÍVEL e pode ser superada aumentando-se consideravelmente a concentração do substrato natural (por ação de massa, o substrato em excesso desloca o inibidor e a velocidade máxima V_máx da reação ainda pode ser alcançada, embora exija maior concentração de substrato); 2) Inibição Não Competitiva ou Alostérica: o inibidor liga-se a um sítio regulador diferente do sítio ativo (sítio alostérico). Essa ligação induz uma alteração conformacional tridimensional na proteína que deforma o sítio ativo, impedindo que a enzima processe o substrato mesmo que ele se ligue. A inibição alostérica NÃO pode ser superada pelo aumento da concentração do substrato (reduz irreversivelmente a velocidade máxima V_máx da reação).",["Inibidor competitivo: tem estrutura parecida com o substrato e disputa diretamente o SÍTIO ATIVO da enzima","Superação da inibição competitiva: basta AUMENTAR muito a concentração do substrato natural!","Inibidor alostérico (não competitivo): liga-se fora do sítio ativo e deforma a enzima; NÃO adianta aumentar substrato","Exemplo medicinal: antibióticos (penicilina inibe enzimas da parede bacteriana) e estatinas (inibem síntese de colesterol)","Venenos enzimáticos: cianeto (bloqueia citocromo c oxidase da respiração celular) e inseticidas organofosforados"],"Cuidado no ENEM: para anular o efeito de um inibidor COMPETITIVO, basta inundar o meio com o substrato verdadeiro (aumentar a concentração do substrato)! Já no inibidor alostérico, aumentar o substrato não resolve.","O etilenoglicol é uma substância tóxica presente em aditivos de radiadores de automóveis. Em casos de ingestão acidental por humanos ou animais domésticos, a enzima hepática álcool desidrogenase oxida o etilenoglicol gerando ácido oxálico, que provoca falência renal aguda e morte. O tratamento médico de emergência consiste na administração intravenosa imediata de altas doses de etanol comum.","A eficácia clínica do etanol como antídoto para a intoxicação por etilenoglicol fundamenta-se no mecanismo de inibição enzimática:",["competitiva, pois o etanol possui afinidade pelo sítio ativo da mesma enzima, e sua elevada concentração impede a oxidação do etilenoglicol.","alostérica irreversível, destruindo permanentemente a estrutura primária da enzima.","radioativa, na qual o etanol transmuta o etilenoglicol em gás hélio inerte.","por congelamento celular, reduzindo a temperatura do fígado a zero absoluto.","ácido-base puramente inorgânica que precipita o etilenoglicol na forma de sal neutro."],0,"Resolução: A enzima álcool desidrogenase (ADH) presente no fígado tem como função fisiológica oxidar álcoois. O etilenoglicol (um diálcool: HO—CH₂—CH₂—OH) possui grande semelhança estrutural com o etanol (CH₃—CH₂—OH) e é reconhecido pelo mesmo sítio ativo da enzima ADH, sendo metabolizado em aldeídos e ácido oxálico altamente nefrotóxicos. Ao administrar etanol puro em concentrações elevadas no paciente intoxicado, o etanol atua como um potente inibidor competitivo: por possuir maior afinidade pela enzima e estar em grande excesso de concentração, as moléculas de etanol ocupam competitivamente os sítios ativos da enzima álcool desidrogenase, saturando-a. Como a enzima fica ocupada metabolizando o etanol em acetaldeído e ácido acético (não letais a curto prazo), o etilenoglicol tóxico é impedido de se ligar ao sítio catalítico, sendo excretado inalterado e com segurança pelos rins na urina do paciente. Alternativa B cita inibição alostérica irreversível com destruição primária; C, D e E formulam proposições absurdas."],"Tempo de meia-vida cinético de reações":["O tempo de meia-vida cinético (t_1/2) de uma reação química é o intervalo de tempo necessário para que a concentração molar de um reagente se reduza exatamente à metade do seu valor no início daquele intervalo. O comportamento da meia-vida depende criticamente da ordem global da reação: 1) Reações de Primeira Ordem (cinética de 1ª ordem, como o decaimento radioativo nuclear, a decomposição térmica de fármacos e a eliminação plasmática de muitos medicamentos pelo fígado e rins): a velocidade é proporcional à primeira potência da concentração (v = k · [A]¹). Uma característica matemática fundamental e exclusiva das reações de 1ª ordem é que o tempo de meia-vida é RIGOROSAMENTE CONSTANTE e independente da concentração inicial do reagente: t_1/2 = ln(2) / k ≈ 0,693 / k. Isso significa que, independentemente de a concentração inicial ser 10 mol/L ou 0,1 mol/L, o tempo necessário para cortar a quantidade pela metade é sempre rigorosamente o mesmo; 2) Na farmacocinética médica, o tempo de meia-vida de eliminação de um antibiótico ou analgésico dita os intervalos ideais de administração posológica entre as doses (ex: remédio tomado de 8 em 8 horas ou de 12 em 12 horas para manter o nível terapêutico sanguíneo na janela de eficácia sem atingir níveis tóxicos de sobredosagem).",["Meia-vida em reações de 1ª ordem: t_1/2 = 0,693 / k (é CONSTANTE e não depende da concentração inicial!)","A cada meia-vida: a concentração de reagente cai para 50% da que havia no início daquele intervalo","Após n meias-vidas: concentração restante C = C₀ / 2ⁿ","Farmacocinética médica: meia-vida do fármaco determina a posologia (intervalo de horas entre as pílulas)","Janela terapêutica: faixa de concentração no sangue entre o efeito curativo mínimo e a toxicidade"],"Cuidado no ENEM: em reações de 1ª ordem e em radioatividade, a meia-vida NÃO depende de quanta matéria você tem! Uma tonelada de substância demora os mesmos 10 minutos para cair pela metade do que 1 grama demoraria.","Na bula de um medicamento antibiótico administrado por via oral, informa-se que o fármaco apresenta cinética de eliminação plasmática de primeira ordem no organismo humano, com tempo de meia-vida biológica de exatamente 6 horas.","Se um paciente ingerir uma dose inicial que produz uma concentração sanguínea de 80 mg/L do princípio ativo, qual será a concentração do medicamento restante na corrente sanguínea após decorridas 18 horas da ingestão (sem novas doses)?",["40 mg/L","10 mg/L","20 mg/L","5,0 mg/L","Zero mg/L"],1,"Resolução: Em cinéticas químicas de primeira ordem, o tempo de meia-vida é constante: a cada intervalo fixo de 6 horas, a concentração do fármaco no sangue cai exatamente para a metade da concentração presente no início daquele período: \n1) Número de meias-vidas transcorridas em 18 horas: \nn = tempo total / t_1/2 = 18 horas / 6 horas = 3 meias-vidas completas. \n2) Cálculo sucessivo da concentração plasmática: \n• Início (t = 0): 80 mg/L \n• Após 6 horas (1ª meia-vida): 80 mg/L / 2 = 40 mg/L \n• Após 12 horas (2ª meia-vida): 40 mg/L / 2 = 20 mg/L \n• Após 18 horas (3ª meia-vida): 20 mg/L / 2 = 10 mg/L de princípio ativo restante. \nOu diretamente pela relação exponencial: C = C₀ / 2ⁿ = 80 / 2³ = 80 / 8 = 10 mg/L. \nAlternativa A é a concentração após 1 meia-vida (6 h); B após 2 meias-vidas (12 h); D após 4 meias-vidas (24 h); E supõe eliminação linear completa inexistente em cinéticas de 1ª ordem."],"Ácidos (classificação, ionização e nomenclatura)":["Segundo a teoria de Svante Arrhenius, ácidos são compostos moleculares que, em solução aquosa, sofrem ionização e liberam como único tipo de cátion o íon hidrogênio (H⁺), que se associa à água formando o íon hidrônio (H₃O⁺). Classificam-se quanto à presença de oxigênio em: 1) Hidrácidos (não contêm oxigênio): nomenclatura terminada em '-ídrico' (ex: HCl = ácido clorídrico, H₂S = ácido sulfídrico, HCN = ácido cianídrico); 2) Oxiácidos (contêm oxigênio): nomenclatura baseada no NOX do elemento central, com sufixos '-ico' (maior NOX ou ácido padrão) e '-oso' (menor NOX), podendo usar prefixos 'hipo-' e 'per-'. A força dos oxiácidos (H_a XO_b) é prevista pela regra de Pauling pela diferença (b − a): se (b − a) ≥ 2, o ácido é forte (ex: H₂SO₄ = 4 − 2 = 2; HNO₃ = 3 − 1 = 2; HClO₄ = 4 − 1 = 3); se (b − a) = 1, moderado (H₃PO₄ = 1); se (b − a) = 0, fraco (H₃BO₃). Exceção vital: o ácido carbônico (H₂CO₃) é fraco e altamente instável, decompondo-se em H₂O e CO₂.",["Ácido de Arrhenius: em água, sofre ionização liberando H⁺ (ou H₃O⁺)","Hidrácidos (sem oxigênio): terminação '-ídrico' (HCl, HBr, HI, H₂S, HCN)","Força dos oxiácidos (H_a XO_b): diferença (b − a) ≥ 2 → FORTE (H₂SO₄, HNO₃, HClO₄)","Ácido instável: H₂CO₃(aq) ⇌ H₂O(l) + CO₂(g) (responsável pelo gás dos refrigerantes)","Ácido fluorídrico (HF): ácido moderado que corrói vidro (SiO₂)"],"Cuidado no ENEM: o ácido carbônico (H₂CO₃) é um ácido FRACO e INSTÁVEL! Ele se decompõe espontaneamente em água e gás carbônico nas bebidas gaseificadas: H₂CO₃ → H₂O + CO₂.","Refrigerantes e águas com gás contêm gás carbônico dissolvido sob pressão que se hidrata formando ácido carbônico: CO₂(g) + H₂O(l) ⇌ H₂CO₃(aq). Ao abrir a garrafa de refrigerante à temperatura ambiente, a redução brusca de pressão provoca imediata efervescência de bolhas gasosas.","Esse fenômeno ocorre porque o ácido carbônico é classificado como uma espécie química:",["forte e não volátil, que se oxida espontaneamente pelo oxigênio do ar.","saturada e resistente a qualquer variação de temperatura ou pressão externa.","fraca e quimicamente instável, decompondo-se facilmente em água e dióxido de carbono gasoso.","inorgânica polimérica insolúvel que precipita como carbonato de cálcio.","redutora extremamente inflamável que entra em combustão espontânea com a luz."],2,"O ácido carbônico (H₂CO₃) é um oxiácido diprótico classificado como fraco (pKa₁ ≈ 6,35) e notavelmente instável em condições ambientes de temperatura e pressão. Ele existe em equilíbrio dinâmico reversível com a água líquida e o dióxido de carbono gasoso: H₂CO₃(aq) ⇌ H₂O(l) + CO₂(g). Quando a garrafa de refrigerante é aberta, a pressão interna cai de cerca de 3 a 4 atm para a pressão atmosférica ambiente (1 atm). Pelo Princípio de Le Chatelier, essa despressurização desloca o equilíbrio no sentido de formação do gás CO₂, forçando a rápida decomposição do ácido carbônico com liberação abundante de bolhas efervescentes. Alternativa A classifica erroneamente como ácido forte; C, D e E formulam proposições absurdas."],"Bases (dissociação e classificação)":["Segundo Arrhenius, bases (ou hidróxidos) são compostos que, em solução aquosa, sofrem dissociação iônica liberando como único tipo de ânion o íon hidróxido ou hidroxila (OH⁻). As bases são formadas pela união de um cátion metálico (ou do cátion amônio NH₄⁺) com a hidroxila. Quanto à força: são bases FORTES os hidróxidos formados por metais alcalinos (grupo 1: LiOH, NaOH, KOH) e pela maioria dos metais alcalinoterrosos (grupo 2: Ca(OH)₂, Sr(OH)₂, Ba(OH)₂), os quais possuem grau de dissociação praticamente total (α ≈ 100%). Todas as demais bases metálicas (como Fe(OH)₂, Fe(OH)₃, Al(OH)₃) são bases FRACAS e praticamente insolúveis em água. A grande exceção entre as bases solúveis é o hidróxido de amônio (NH₄OH), obtido pela dissolução do gás amônia em água (NH₃ + H₂O ⇌ NH₄⁺ + OH⁻), que é uma base SOLÚVEL porém FRACA (possui baixo grau de ionização).",["Base de Arrhenius: em água, dissocia liberando exclusivamente OH⁻","Bases fortes: metais alcalinos (NaOH, KOH) e alcalinoterrosos (Ca(OH)₂, Ba(OH)₂)","Bases fracas e insolúveis: hidróxidos dos demais metais (Al(OH)₃, Fe(OH)₃)","Exceção clássica: NH₄OH (amônia em água) é SOLÚVEL porém FRACA e volátil","Soda cáustica: NaOH; Cal hidratada ou extinta: Ca(OH)₂; Leite de magnésia: suspensão de Mg(OH)₂"],"Cuidado no ENEM: o leite de magnésia é uma suspensão aquosa de hidróxido de magnésio [Mg(OH)₂]. É pouco solúvel e de basicidade branda, por isso pode ser ingerido como laxante e antiácido estomacal sem queimar o esôfago!","O leite de magnésia é um medicamento popular utilizado tradicionalmente como antiácido estomacal para combater a azia e como laxante suave. Trata-se de uma suspensão aquosa branca e leitosa de hidróxido de magnésio [Mg(OH)₂].","O uso seguro do hidróxido de magnésio como antiácido de ingestão oral, sem provocar queimaduras cáusticas nas mucosas digestivas como faria a soda cáustica (NaOH), fundamenta-se no fato de que o Mg(OH)₂:",["é uma base de metal alcalino 100% dissociada que atua por osmose rápida.","possui caráter puramente oxidante que não altera o pH do trato digestório.","é um ácido de Lewis que se transforma em ácido clorídrico no estômago.","possui solubilidade em água extremamente baixa, liberando uma concentração muito pequena de íons hidroxila (OH⁻) livres na boca e esôfago.","sofre combustão imediata com os ácidos gástricos neutralizando a temperatura."],3,"O hidróxido de sódio (NaOH, soda cáustica) é extremamente solúvel em água e sofre dissociação total, gerando uma concentração colossal de íons OH⁻ livres que atacam e saponificam as membranas celulares das mucosas, provocando queimaduras químicas gravíssimas. Já o hidróxido de magnésio [Mg(OH)₂] é uma base de baixíssima solubilidade em água (Kps ≈ 5,6 × 10⁻¹²): na boca e no esôfago, a fração dissolvida de íons OH⁻ livres é ínfima, mantendo o pH moderadamente alcalino e inofensivo aos tecidos. No entanto, ao atingir o estômago, o excesso de íons H⁺ do ácido clorídrico (HCl) consome gradualmente as hidroxilas liberadas (H⁺ + OH⁻ → H₂O), deslocando continuamente a dissolução da suspensão até a completa e suave neutralização do ácido gástrico: Mg(OH)₂(s) + 2 HCl(aq) → MgCl₂(aq) + 2 H₂O(l). Alternativa A classifica erroneamente o magnésio como metal alcalino solúvel; C, D e E formulam hipóteses absurdas."],"Sais e reações de neutralização total e parcial":["Sais são compostos iônicos formados pela reação de neutralização entre um ácido e uma base (Ácido + Base → Sal + Água). O cátion do sal provém da base e o ânion provém do ácido. Na neutralização total, todos os hidrogênios ionizáveis (H⁺) do ácido reagem estequiometricamente com todas as hidroxilas (OH⁻) da base, formando um sal normal ou neutro (como NaCl, K₂SO₄, Ca₃(PO₄)₂). Quando a quantidade de base ou de ácido não é suficiente para neutralizar todos os grupos ionizáveis, ocorre neutralização parcial: 1) Hidrogenossal (sal ácido): sobra hidrogênio ionizável na estrutura do sal (ex: NaHCO₃, hidrogenocarbonato de sódio); 2) Hidroxissal (sal básico): sobra hidroxila na estrutura do sal (ex: Mg(OH)Cl, hidroxicloreto de magnésio). A nomenclatura dos sais deriva do ácido de origem: '-ídrico' vira '-eto' (HCl → NaCl, cloreto); '-ico' vira '-ato' (H₂SO₄ → Na₂SO₄, sulfato; HNO₃ → NaNO₃, nitrato); '-oso' vira '-ito' (H₂SO₃ → Na₂SO₃, sulfito; HNO₂ → NaNO₂, nitrito).",["Neutralização total: n(H⁺ do ácido) = n(OH⁻ da base) → Sal normal + H₂O","Regra de nomenclatura de sais: Ídrico vira ETO / Ico vira ATO / Oso vira ITO","Mnemônica clássica: 'Te mete no bico do pato, daquele urso esquisito'","Sal de ácido forte + base fraca: solução aquosa ácida (ex: NH₄Cl)","Sal de ácido fraco + base forte: solução aquosa básica (ex: Na₂CO₃, NaHCO₃)"],"Mnemônica indispensável para o ENEM: 'Bico do pato' (ácido -ico gera sal -ato) e 'Urso esquisito' (ácido -oso gera sal -ito)! Ex: ácido sulfúr-ICO forma sulf-ATO.","O sulfato de cálcio di-hidratado (CaSO₄·2H₂O) é o principal constituinte do gesso utilizado na construção civil e na imobilização ortopédica de fraturas ósseas na medicina.","A síntese do sal sulfato de cálcio por meio de uma reação de neutralização total pode ser obtida pela reação entre:",["ácido fosfórico (H₃PO₄) e carbonato de cálcio (CaCO₃).","ácido sulfuroso (H₂SO₃) e óxido de cálcio (CaO).","ácido clorídrico (HCl) e hidróxido de sódio (NaOH).","ácido nítrico (HNO₃) e hidróxido de potássio (KOH).","ácido sulfúrico (H₂SO₄) e hidróxido de cálcio [Ca(OH)₂]."],4,"Pela regra de nomenclatura inorgânica ('-ico' no ácido vira '-ato' no sal), o sal sulf-ATO de cálcio deriva necessariamente do ácido sulfúr-ICO (H₂SO₄). O cátion cálcio (Ca²⁺) é fornecido por uma base de cálcio, tipicamente o hidróxido de cálcio [Ca(OH)₂]. A equação balanceada da reação de neutralização total é: H₂SO₄(aq) + Ca(OH)₂(aq) → CaSO₄(s) + 2 H₂O(l). Cada 1 mol do diácido H₂SO₄ fornece 2 mols de H⁺ que reagem perfeitamente com os 2 mols de OH⁻ fornecidos por 1 mol de Ca(OH)₂, produzindo 1 mol do sal normal CaSO₄ e 2 mols de água. Alternativa C geraria cloreto de sódio (NaCl); B usaria ácido sulfuroso que geraria sulf-ITO de cálcio (CaSO₃); D geraria nitrato de potássio (KNO₃); E geraria fosfato de cálcio [Ca₃(PO₄)₂]."],"Óxidos (óxidos ácidos, básicos, neutros e anfóteros)":["Óxidos são compostos binários (formados por apenas dois elementos químicos) nos quais o oxigênio é o elemento mais eletronegativo (NOX do oxigênio geralmente −2). Classificam-se quanto ao comportamento químico: 1) Óxidos ácidos (anidridos de ácidos): formados predominantemente por ametais com elevado NOX (ex: CO₂, SO₂, SO₃, NO₂, P₂O₅) e alguns metais de transição com NOX alto (+6, +7, como CrO₃, Mn₂O₇). Reagem com água gerando oxiácidos (SO₃ + H₂O → H₂SO₄) e reagem com bases gerando sal e água (CO₂ + 2 NaOH → Na₂CO₃ + H₂O); 2) Óxidos básicos: formados por metais com baixo NOX (+1 e +2), destacando-se metais alcalinos e alcalinoterrosos (ex: Na₂O, CaO, BaO). Reagem com água formando bases (CaO + H₂O → Ca(OH)₂) e com ácidos formando sal e água (CaO + 2 HCl → CaCl₂ + H₂O); 3) Óxidos neutros (indiferentes): não reagem com água, ácidos nem bases minerais à temperatura ambiente. São apenas três óxidos moleculares fundamentais: monóxido de carbono (CO), monóxido de nitrogênio (NO) e monóxido de dinitrogênio (N₂O, óxido nitroso/gás hilariante); 4) Óxidos anfóteros: reagem tanto com ácidos fortes quanto com bases fortes (ex: ZnO, Al₂O₃).",["Óxido ácido: Ametal + Oxigênio (reage com água → ácido; com base → sal + água)","Óxido básico: Metal alcalino/alcalinoterroso + Oxigênio (reage com água → base; com ácido → sal + água)","Óxidos neutros (indiferentes): NÃO reagem com água, ácido nem base → CO, NO, N₂O (apenas esses 3!)","Óxidos anfóteros: comportam-se como ácido ou base dependendo do reagente (ZnO, Al₂O₃)","Cal virgem (CaO): óxido básico; ao reagir com água gera cal extinta Ca(OH)₂ liberando muito calor"],"Decore para o ENEM os três únicos óxidos neutros que caem na prova: CO (monóxido de carbono), NO (monóxido de nitrogênio) e N₂O (óxido nitroso)! Eles NÃO reagem com água nem alteram o pH.","Dentre os diversos gases lançados na atmosfera por atividades urbanas e industriais, encontram-se o dióxido de enxofre (SO₂), o monóxido de carbono (CO) e o óxido de cálcio (CaO, poeira de cimenteiras).","Quanto ao comportamento ácido-base em meio aquoso, esses três óxidos (SO₂, CO e CaO) são classificados, respectivamente, como:",["ácido, neutro e básico.","básico, neutro e ácido.","neutro, anfótero e básico.","ácido, anfótero e neutro.","básico, ácido e anfótero."],0,"Classificação criteriosa dos três óxidos: \n1) Dióxido de enxofre (SO₂): formado por ametal (enxofre, NOX = +4) e oxigênio. Ao reagir com a água da umidade atmosférica, forma o ácido sulfuroso (SO₂ + H₂O ⇌ H₂SO₃), atuando tipicamente como um óxido ácido (anidrido); \n2) Monóxido de carbono (CO): é um dos três óxidos moleculares clássicos classificados como neutros ou indiferentes (junto com NO e N₂O), não reagindo com água nem sofrendo neutralização por ácidos ou bases à temperatura ambiente; \n3) Óxido de cálcio (CaO): formado pelo metal alcalinoterroso cálcio (Ca²⁺) e oxigênio. Ao entrar em contato com a água, reage energicamente formando uma base forte, o hidróxido de cálcio (CaO + H₂O → Ca(OH)₂), tratando-se de um clássico óxido básico. \nPortanto, a sequência correta é: ácido, neutro e básico. Alternativas A, C, D e E invertem ou confundem essas funções inorgânicas."],"Poluição por óxidos e chuva ácida inorgânica":["A queima de combustíveis fósseis e a atividade minerometalúrgica lançam grandes quantidades de óxidos na atmosfera. O carvão mineral e frações pesadas de petróleo contêm enxofre como impureza: na queima, forma-se SO₂, que na atmosfera oxida-se lentamente a trióxido de enxofre (SO₃). O SO₃ reage com a água das nuvens formando ácido sulfúrico (SO₃ + H₂O → H₂SO₄), um dos principais agentes da chuva ácida. Por outro lado, para corrigir solos agrícolas excessivamente ácidos (muito comuns no bioma Cerrado brasileiro, onde o pH baixo reduz a fertilidade e solubiliza íons Al³⁺ tóxicos para as raízes das plantas), os agrônomos utilizam a prática da 'calagem'. A calagem consiste na incorporação ao solo de calcário moído contendo carbonato de cálcio (CaCO₃) e magnésio (calcário dolomítico) ou cal virgem (CaO). Os óxidos e carbonatos básicos reagem com a acidez do solo neutralizando os íons H⁺ e elevando o pH para níveis ideais de cultivo (em torno de 6,0 a 6,5).",["Poluição por SO₂/SO₃: queima de combustíveis com enxofre → gera chuva com H₂SO₄","Calagem: aplicação de óxido básico (CaO) ou calcário (CaCO₃) no solo","Objetivo da calagem: neutralizar acidez do solo (elevar o pH) e fornecer Ca²⁺ e Mg²⁺","Solo ácido no Cerrado: saturação por íons tóxicos Al³⁺ que inibem o crescimento vegetal","Reação de neutralização no solo: CaO + 2 H⁺(aq) → Ca²⁺(aq) + H₂O(l)"],"Cuidado no ENEM: para corrigir solo ÁCIDO (elevar o pH), usa-se cal (CaO) ou calcário (CaCO₃), que têm comportamento básico! Nunca use sulfato ou cloreto para calagem.","Solos do bioma Cerrado brasileiro apresentam frequentemente elevada acidez natural (pH abaixo de 5,0) associada à presença tóxica de íons alumínio (Al³⁺), o que limita severamente o rendimento das safras de soja e milho. Para viabilizar a agricultura em larga escala, os produtores rurais realizam rotineiramente a prática da calagem, adicionando calcário moído (rico em CaCO₃) ou cal virgem (CaO) ao solo antes do plantio.","A calagem favorece o desenvolvimento das culturas agrícolas porque os compostos adicionados:",["atuam como óxidos ácidos que reduzem ainda mais o pH do solo acelerando a absorção de nitrogênio.","possuem caráter básico, reagindo com os íons H⁺ do solo, elevando o pH e insolubilizando os íons tóxicos de alumínio.","são agentes oxidantes que convertem o ferro e o alumínio do solo em gases nobres protetores.","provocam a precipitação do oxigênio atmosférico criando um ambiente anaeróbio perfeito para as raízes.","atuam como pesticidas organoclorados sintéticos que exterminam as pragas da lavoura."],1,"A calagem utiliza óxido de cálcio (CaO, óxido básico) ou carbonato de cálcio (CaCO₃, sal de hidrólise básica). Em contato com a umidade do solo ácido, o CaO reage com a água formando hidróxido de cálcio: CaO + H₂O → Ca(OH)₂ → Ca²⁺ + 2 OH⁻. Os íons hidroxila (OH⁻) neutralizam os íons hidrônio H⁺ livres responsáveis pela acidez do solo: H⁺ + OH⁻ → H₂O. Com o consumo de H⁺, o pH do solo eleva-se para a faixa ideal (em torno de 6,0 a 6,5). Adicionalmente, o aumento da concentração de OH⁻ provoca a precipitação dos íons fitotóxicos de alumínio na forma de hidróxido de alumínio insolúvel [Al³⁺ + 3 OH⁻ → Al(OH)₃(s)], eliminando sua toxicidade para as raízes e disponibilizando cálcio e magnésio como macronutrientes essenciais. Alternativa A diz que a cal é ácida e abaixa o pH; C, D e E formulam hipóteses estapafúrdias."],"Teorias ácido-base de Brønsted-Lowry e de Lewis":["A teoria original de Arrhenius (1884) restringia o conceito de ácidos e bases a soluções aquosas contendo H⁺ e OH⁻. Duas teorias mais abrangentes e modernas revolucionaram a química: 1) Teoria Protônica de Brønsted-Lowry (1923): ÁCIDO é qualquer espécie química (molecular ou iônica) capaz de DOAR prótons (íons H⁺); BASE é qualquer espécie capaz de RECEBER prótons (íons H⁺). Um ácido só pode doar próton se houver uma base simultaneamente disponível para recebê-lo. Isso origina o conceito fundamental de PAR CONJUGADO ÁCIDO-BASE: quando um ácido doa um próton H⁺, transforma-se em sua base conjugada; quando uma base recebe um próton H⁺, transforma-se em seu ácido conjugado. Espécies como a água (H₂O) e o íon bicarbonato (HCO₃⁻) são anfotéricas ou anfipróticas (podem doar ou receber prótons conforme o meio); 2) Teoria Eletrônica de Gilbert Lewis (1923, a mais geral de todas): BASE DE LEWIS é toda espécie química que possui e DOA um par de elétrons não ligante para formar uma ligação covalente coordenada (ex: NH₃, H₂O, aminas, ânions); ÁCIDO DE LEWIS é toda espécie que ACEITA um par de elétrons por possuir orbital atômico vazio ou octeto incompleto (ex: BF₃, AlCl₃, cátions metálicos como Fe³⁺, Cu²⁺ e o próprio próton H⁺).",["Arrhenius: restrito à água (Ácido libera H⁺; Base libera OH⁻)","Brønsted-Lowry: Ácido DOA próton (H⁺); Base RECEBE próton (H⁺)","Par conjugado ácido-base: diferem entre si por EXATAMENTE UM próton H⁺ (ex: NH₄⁺ e NH₃; H₂O e OH⁻)","Lewis: Base DOA par de elétrons; Ácido RECEBE par de elétrons (forma aduto/ligação coordenada)","Todo ácido de Arrhenius é de Brønsted-Lowry; todo ácido de Brønsted é de Lewis (Lewis é a mais ampla!)"],"Cuidado no ENEM com pares conjugados de Brønsted: eles diferem em apenas UM próton H⁺! O ácido conjugado de NH₃ é NH₄⁺ (tem um H⁺ a mais); a base conjugada de HSO₄⁻ é SO₄²⁻ (tem um H⁺ a menos).","Considere a reação química entre o gás amônia e a água pura em equilíbrio líquido: \nNH₃(aq) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq).","De acordo com a teoria protônica de Brønsted-Lowry, nessa reação direta a molécula de água (H₂O) atua como:",["uma base de Brønsted-Lowry, pois recebe um elétron livre do nitrogênio.","uma espécie quimicamente inerte que atua apenas como catalisador de superfície.","um ácido de Brønsted-Lowry, pois doa um próton (H⁺) para a amônia, tendo o íon hidróxido (OH⁻) como sua base conjugada.","um ácido de Lewis que doa dois pares de elétrons para a dissociação do cátion amônio.","um composto orgânico que sofre combustão com descoloração de haletos."],2,"Resolução: Na teoria de Johannes Brønsted e Thomas Lowry, a classificação de ácido e base baseia-se estritamente na transferência de prótons (íons hidrogênio, H⁺). Na reação reversível: NH₃(aq) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq), a molécula de água líquida (H₂O) transfere um próton H⁺ para a molécula de amônia (NH₃). Ao doar o próton H⁺, a água atua indubitavelmente como um ÁCIDO de Brønsted-Lowry. Após a perda do próton, a água converte-se no íon hidróxido (OH⁻), que constitui a sua BASE CONJUGADA no membro dos produtos. Por outro lado, a amônia (NH₃) recebe o próton H⁺ da água, atuando como a BASE de Brønsted-Lowry da reação direta, e converte-se no cátion amônio (NH₄⁺), que é o seu ÁCIDO CONJUGADO correspondente. A água é uma espécie anfótera, pois na presença de ácidos fortes (como HCl + H₂O → H₃O⁺ + Cl⁻) ela recebe próton atuando como base. Alternativa A diz que a água recebe elétron; C afirma inércia; D confunde conceitos de Lewis e prótons; E é descabida."],"Peróxidos, superóxidos e água oxigenada":["Peróxidos e superóxidos são classes especiais de compostos inorgânicos oxigenados nos quais os átomos de oxigênio estão unidos diretamente entre si por uma ligação covalente simples oxigênio-oxigênio (ligação peroxo: —O—O—), apresentando estados de oxidação anômalos diferentes do habitual −2: 1) Peróxidos: contêm o ânion peróxido (O₂²⁻), no qual cada átomo de oxigênio possui número de oxidação NOX = −1. São formados predominantemente pelo hidrogênio (peróxido de hidrogênio, H₂O₂, popularmente conhecido em solução aquosa como água oxigenada) e por metais alcalinos e alcalinoterrosos (como peróxido de sódio Na₂O₂ e peróxido de bário BaO₂). Reagem com água ou ácidos liberando água oxigenada (Na₂O₂ + 2 H₂O → 2 NaOH + H₂O₂); 2) Superóxidos: contêm o ânion superóxido (O₂⁻), no qual o oxigênio apresenta NOX = −½ (ex: KO₂, superóxido de potássio, utilizado em submarinos e trajes de astronautas para absorver CO₂ e regenerar oxigênio O₂ respirável: 4 KO₂ + 2 CO₂ → 2 K₂CO₃ + 3 O₂); 3) Água oxigenada (H₂O₂): substância instável que sofre reação de dismutação ou desproporcionamento espontânea e exotérmica, acelerada por luz (por isso é guardada em frascos opacos escuros), calor ou catalisadores como dióxido de manganês (MnO₂) e a enzima catalase do sangue: 2 H₂O₂(aq) → 2 H₂O(l) + O₂(g). O NOX do oxigênio varia simultaneamente de −1 para −2 (redução na H₂O) e para 0 (oxidação no O₂). A efervescência observada ao passar água oxigenada em um ferimento com sangue decorre do escape vigoroso de gás oxigênio puro (O₂) catalisado pela enzima catalase dos glóbulos vermelhos.",["Peróxido: ânion O₂²⁻, onde o NOX do oxigênio é rigorosamente −1 (ex: H₂O₂, Na₂O₂, BaO₂)","Superóxido: ânion O₂⁻, onde o NOX do oxigênio é −½ (ex: KO₂ em submarinos)","Reação de dismutação (desproporcionamento) da água oxigenada: 2 H₂O₂ → 2 H₂O + O₂ (o oxigênio oxida e reduz ao mesmo tempo)","Ação antisséptica de ferimentos: a enzima catalase do sangue acelera a liberação de bolhas de O₂ puro, que elimina bactérias anaeróbias patogênicas como o bacilo do tétano","Armazenamento de H₂O₂: frascos de plástico opaco e escuro para evitar a decomposição fotoquímica induzida pela luz"],"Cuidado no ENEM: no peróxido de hidrogênio (H₂O₂), o NOX do oxigênio NÃO é −2! O NOX é −1. Ao jogar em um machucado, as bolhas que efervescem são de GÁS OXIGÊNIO (O₂) puro liberado pela enzima catalase do sangue!","Ao aplicar uma solução aquosa de água oxigenada a 10 volumes (peróxido de hidrogênio, H₂O₂, a ~3% m/v) sobre um corte na pele, observa-se imediatamente uma vigorosa efervescência de espuma borbulhante e branqueamento local com efeito antisséptico contra germes.","A efervescência imediata que ocorre no ferimento é explicada quimicamente pelo fato de que:",["o peróxido de hidrogênio reage com o cálcio dos ossos precipitando cal virgem.","a água oxigenada entra em combustão espontânea a frio consumindo todo o hidrogênio da pele.","o oxigênio da água oxigenada possui NOX = +2 e reduz-se violentamente a gás cloro letal.","a enzima catalase presente nas células sanguíneas catalisa a rápida decomposição (dismutação) do H₂O₂ em água líquida e gás oxigênio puro (O₂), cujas bolhas combatem microrganismos anaeróbios.","as moléculas de H₂O₂ sofrem polimerização gerando fibras insolúveis de teflon hospitalar."],3,"Resolução: O peróxido de hidrogênio (H₂O₂) é um peróxido inorgânico instável onde o oxigênio possui número de oxidação anômalo igual a −1. Quando colocado em contato com tecidos biológicos feridos e sangue, ele entra em contato com a enzima intracelular catalase (uma das enzimas com maior velocidade de renovação catalítica conhecida na biologia). A catalase atua como catalisador biológico extremamente veloz, acelerando a reação de dismutação (desproporcionamento) redox intramolecular do peróxido de hidrogênio: 2 H₂O₂(aq) → 2 H₂O(l) + O₂(g). O oxigênio sofre simultaneamente redução a −2 (na molécula de água H₂O) e oxidação a zero (no gás diatômico O₂). O desprendimento rápido de milhares de microbolhas de gás oxigênio puro produz a intensa efervescência e espuma visível no machucado. Esse oxigênio gasoso liberado oxida componentes celulares bacterianos e gera um ambiente aeróbio letal para bactérias anaeróbias estritas patogênicas que poderiam infectar a lesão (como o <i>Clostridium tetani</i>, agente causador do tétano). Alternativas A, C, D e E trazem alegações que violam os fatos químicos e toxicológicos."],"Sais hidratados, eflorescência e deliquescência":["Muitos sais inorgânicos cristalizam a partir de soluções aquosas incorporando um número quimicamente estequiométrico e bem definido de moléculas de água em sua rede cristalina sólida: são denominados sais hidratados (ou hidratos), e a água associada ao retículo cristalino é chamada de água de cristalização (ou de hidratação). Exemplos clássicos: o sulfato de cobre(II) penta-hidratado (CuSO₄·5H₂O, belos cristais azuis intensos que ao serem aquecidos perdem a água e se transformam no sulfato de cobre anidro branco CuSO₄), o gesso da construção civil (sulfato de cálcio di-hidratado, CaSO₄·2H₂O) e o sal de Epsom (sulfato de magnésio hepta-hidratado, MgSO₄·7H₂O). Três fenômenos de equilíbrio com a umidade atmosférica são cobrados no ENEM: 1) Eflorescência: processo em que um sal hidratado, exposto a um ar com baixa umidade relativa, perde espontaneamente parte ou a totalidade de sua água de hidratação para a atmosfera porque a pressão de vapor dos cristais é maior que a pressão de vapor de água no ar, transformando-se em um pó anidro opaco; 2) Higroscopicidade: propriedade de certas substâncias de absorver água do vapor atmosférico sem necessariamente se dissolver (ex: sílica-gel em sachês de eletrônicos e sapatos); 3) Deliquescência: grau extremo de higroscopicidade no qual o sólido exposto ao ar úmido absorve tanta água que acaba se dissolvendo completamente em sua própria água absorvida, transformando-se em uma solução líquida concentrada (ex: cloreto de cálcio CaCl₂ anidro e pastilhas de soda cáustica NaOH).",["Sal hidratado: contém proporção estequiométrica fixa de moléculas de água em sua rede cristalina (ex: CuSO₄·5H₂O azul)","Aquecimento do sal hidratado: perde água de cristalização e vira sal anidro (CuSO₄ anidro é pó branco)","Eflorescência: sal hidratado perde água espontaneamente para o ar seco tornando-se quebradiço e pulverulento","Higroscópico: substância que absorve umidade do ar (ex: sílica-gel contra mofo)","Deliquescência: absorve tanta umidade do ar que se dissolve espontaneamente na água absorvida (ex: CaCl₂ em antimofo de armário, NaOH)"],"Cuidado no ENEM: o potinho de antimofo do guarda-roupa que 'enche de água' sozinho contém CLORETO DE CÁLCIO (CaCl₂)! O sal é deliquescente: ele absorve a umidade do ar do armário até se dissolver totalmente na água puxada do ambiente.","Potes desumidificadores antimofo vendidos em supermercados contêm cristais brancos de cloreto de cálcio anidro (CaCl₂). Com o passar das semanas no interior de um guarda-roupa fechado, os cristais sólidos desaparecem gradualmente e o compartimento inferior do pote fica completamente preenchido por um líquido transparente acumulado, mesmo sem qualquer vazamento de encanamento.","O acúmulo de líquido no pote desumidificador antimofo ocorre porque o cloreto de cálcio apresenta a propriedade físico-química da:",["eflorescência, perdendo massa por sublimação gasosa para o teto do armário.","imiscibilidade osmótica reversa com a temperatura ambiente do quarto.","combustão hidrostática com o oxigênio que condensa a madeira em água líquida.","oxidação catalítica do ar atmosférico gerando ácido clorídrico gasoso inflamável.","deliquescência, absorvendo vapor de água do ar úmido em quantidade suficiente para se dissolver espontaneamente na própria água captada do ambiente."],4,"Resolução: O cloreto de cálcio anidro (CaCl₂) é uma substância iônica notavelmente higroscópica e deliquescente. O termo deliquescência designa a propriedade de determinados sólidos anidros ou pouco hidratados cuja pressão de vapor de água de saturação na superfície cristalina é consideravelmente inferior à pressão parcial de vapor de água presente no ar atmosférico ambiente. Ao ficar exposto ao ar de ambientes fechados e úmidos (como o interior de um armário ou closet sujeito a mofo), o cloreto de cálcio atrai e retém ativamente as moléculas de vapor de água da atmosfera por forças de hidratação iônica intensas. A quantidade de moléculas de água adsorvidas da atmosfera é tão volumosa que excede a quantidade necessária para saturar a superfície, formando gradualmente uma película líquida na qual o próprio sal se dissolve por completo. Esse processo contínuo faz o sólido original sumir e gera uma solução aquosa concentrada de cloreto de cálcio acumulada no fundo do recipiente, desumidificando o ar do armário e impedindo a proliferação de fungos bolores. Alternativa A descreve a eflorescência (que é o processo inverso: perda de água para ar seco); C, D e E trazem formulações fantasiosas."],"Evolução dos modelos atômicos":["A compreensão da estrutura da matéria evoluiu historicamente através de modelos atômicos sucessivos propostos com base em novas evidências experimentais: 1) Modelo de Dalton (1808, 'bola de bilhar'): o átomo é uma esfera maciça, indivisível, indestrutível e eletricamente neutra; fundamentou as leis ponderais das reações químicas; 2) Modelo de Thomson (1897, 'pudim de passas'): a partir dos experimentos com raios catódicos em tubos de vácuo (tubo de Crookes), Thomson descobriu a primeira partícula subatômica — o elétron —, demonstrando a divisibilidade e a natureza elétrica do átomo, imaginado como uma esfera positiva fluida com elétrons incrustados; 3) Modelo de Rutherford (1911, 'planetário'): bombardeando uma finíssima lâmina de ouro com partículas alfa (núcleos de hélio positivos) emitidas pelo polônio, observou que a imensa maioria atravessava a lâmina em linha reta e pouquíssimas ricocheteavam; concluiu que o átomo é formado por um núcleo central minúsculo, denso e positivo, cercado por uma eletrosfera imensa predominantemente vazia onde giram os elétrons; 4) Modelo de Bohr (1913): aplicou a física quântica aos elétrons de Rutherford, propondo que os elétrons orbitam em níveis circulares estacionários quantizados de energia sem emitir radiação; ao absorver energia, o elétron salta para um nível mais externo (estado excitado); ao retornar a um nível mais interno, emite um fóton de luz de comprimento de onda específico (fenômeno que explica os fogos de artifício e o teste de chama).",["Dalton: esfera maciça, indivisível, neutra (bola de bilhar)","Thomson: descobriu o elétron; esfera positiva com elétrons incrustados (pudim de passas)","Rutherford: lâmina de ouro com partículas alfa; núcleo denso e positivo + eletrosfera vazia","Bohr: níveis estacionários quantizados de energia; salto quântico e emissão de luz ao retornar","Fogos de artifício e teste de chama: explicados exclusivamente pelo modelo de Bohr (salto quântico)"],"Cuidado no ENEM: fogos de artifício coloridos (sódio amarelo, bário verde, estrôncio vermelho) são explicados pelo MODELO DE BOHR! O elétron absorve calor da pólvora, salta para nível externo e, ao voltar, emite luz visível característica.","O espetáculo pirotécnico dos fogos de artifício no Réveillon e em celebrações festivas encanta o público pela emissão de cores vivas e cintilantes no céu: amarelo pelo sódio, verde pelo bário e vermelho intenso por sais de estrôncio misturados à pólvora.","O modelo atômico que fundamenta cientificamente a emissão dessas cores distintas pelos diferentes cátions metálicos nos fogos de artifício é o de:",["Bohr, no qual elétrons absorvem energia térmica e saltam para camadas mais externas, emitindo luz visível de energia bem definida ao retornarem para níveis mais internos.","Thomson, no qual a esfera positiva do átomo perde massa térmica contínua sob a forma de fótons.","Rutherford, no qual as partículas alfa positivas do núcleo do átomo colidem com a atmosfera fria.","Dalton, no qual átomos esféricos e maciços colidem e fragmentam-se gerando chamas luminosas.","Mendeleev, no qual a massa atômica periódica quebra-se por fissão nuclear instantânea gerando luz pura."],0,"A produção de cores características em testes de chama e fogos de artifício encontra sua explicação teórica rigorosa nos postulados quânticos do modelo atômico de Niels Bohr. Na combustão da pólvora, os elétrons dos cátions metálicos (Na⁺, Ba²⁺, Sr²⁺) absorvem quantidades discretas de energia térmica e realizam saltos quânticos para níveis eletrônicos mais externos e energeticamente excitados. Como o estado excitado é instável, os elétrons retornam espontaneamente para seus níveis energéticos fundamentais mais próximos do núcleo. Nessa desexcitação, a diferença exata de energia entre os dois níveis quânticos (ΔE = E_final − E_inicial) é emitida sob a forma de um fóton de radiação eletromagnética, cuja frequência (f = ΔE / h) recai precisamente na faixa da luz visível. Como a estrutura dos níveis de energia de cada elemento químico é única, cada cátion emite comprimentos de onda específicos (sódio emite amarelo a 589 nm; bário emite verde; estrôncio emite vermelho). Alternativas A, B e C referem-se a modelos atômicos anteriores incapazes de explicar a quantização eletrônica; E cita o organizador da Tabela Periódica em um contexto fantasioso de fissão."],"Estrutura atômica (prótons, nêutrons e isótopos)":["O átomo é composto por um núcleo central extremamente compacto e denso contendo prótons (carga positiva +1 e massa relativa ~1 u) e nêutrons (carga elétrica nula e massa relativa ~1 u), e por uma eletrosfera periférica de volume imenso contendo elétrons (carga negativa −1 e massa desprezível, cerca de 1/1836 da massa do próton). O Número Atômico (Z) é o número de prótons existentes no núcleo e constitui a 'identidade química' do elemento (define qual elemento químico o átomo é). O Número de Massa (A) é a soma total de prótons e nêutrons no núcleo: A = Z + N. Em um átomo eletricamente neutro, o número de elétrons é rigorosamente igual ao número de prótons (nº de e⁻ = Z). Íons são espécies com desbalanço de carga: cátions perdem elétrons (carga positiva: nº de e⁻ = Z − carga); ânions ganham elétrons (carga negativa: nº de e⁻ = Z + |carga|). Relações atômicas: 1) Isótopos: átomos que possuem o MESMO número atômico Z (mesmo elemento), mas diferentes números de massa A e de nêutrons N (ex: carbono-12 e carbono-14; hidrogênio leve ¹H, deutério ²H e trítio ³H); possuem propriedades químicas praticamente idênticas; 2) Isóbaros: mesmo número de massa A, mas diferentes números atômicos Z e de nêutrons N (ex: ⁴⁰Ca e ⁴⁰Ar); 3) Isótonos: mesmo número de nêutrons N (A − Z), mas diferentes Z e A.",["Número Atômico (Z): número de prótons (Z = p); define o elemento químico","Número de Massa (A): prótons + nêutrons (A = Z + N)","Átomo neutro: número de prótons = número de elétrons","Cátion: perdeu elétrons (carga positiva); Ânion: ganhou elétrons (carga negativa)","Isótopos: mesmo Z (mesmo elemento), massas A e nêutrons N diferentes (propriedades químicas iguais)"],"Cuidado no ENEM: isótopos pertencem ao MESMO elemento químico e têm propriedades químicas IGUAIS (reagem da mesma forma)! O que muda entre isótopos é apenas a massa e as propriedades nucleares (como radioatividade).","O elemento químico cloro encontrado na natureza é constituído por uma mistura natural de dois isótopos estáveis: o cloro-35 (³⁵Cl, massa atômica ~35 u, abundância natural de 75%) e o cloro-37 (³⁷Cl, massa atômica ~37 u, abundância natural de 25%). O número atômico do cloro é Z = 17.","A respeito desses dois átomos de cloro (³⁵Cl e ³⁷Cl), conclui-se corretamente que eles:",["possuem o mesmo número de nêutrons e massas atômicas idênticas no núcleo.","são isótopos entre si, apresentando o mesmo número de prótons (17), mas números distintos de nêutrons (18 e 20, respectivamente).","possuem propriedades químicas completamente diferentes, sendo um deles um gás nobre e o outro um metal alcalino.","são isóbaros que apresentam o mesmo número de massa A e números atômicos diferentes.","possuem números atômicos 35 e 37 e exatamente a mesma quantidade de elétrons na camada K."],1,"Pela definição formal de isótopos: são átomos que pertencem ao mesmo elemento químico e, portanto, possuem rigorosamente o mesmo número atômico (Z = 17 prótons no núcleo), mas diferem no número de massa (A) em decorrência de quantidades distintas de nêutrons no núcleo. Para o cloro-35 (³⁵Cl): A = 35 e Z = 17 → Número de nêutrons N = A − Z = 35 − 17 = 18 nêutrons. Para o cloro-37 (³⁷Cl): A = 37 e Z = 17 → Número de nêutrons N = A − Z = 37 − 17 = 20 nêutrons. Por possuírem a mesma eletrosfera e mesma quantidade de elétrons de valência (7 elétrons no nível 3), ambos exibem propriedades químicas virtualmente indistinguíveis. A média ponderada de suas massas [(35 × 75 + 37 × 25) / 100 = 35,5 u] fornece a massa atômica que consta na Tabela Periódica. Alternativa A diz que têm o mesmo número de nêutrons; C erra ao afirmar propriedades químicas diferentes; D confunde isótopos com isóbaros; E confunde número de massa com número atômico."],"Distribuição eletrônica e tabela periódica moderna":["A Tabela Periódica moderna organiza os elementos químicos em ordem crescente de seus Números Atômicos (Z), segundo a Lei Periódica de Moseley. A distribuição eletrônica fundamental dos átomos nos subníveis de energia (s, p, d, f) segue o Diagrama de Linus Pauling segundo o princípio da energia crescente (1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, 4d, 5p, 6s, 4f...). A estrutura da Tabela correlaciona-se diretamente com a configuração eletrônica: 1) Períodos (linhas horizontais, 7 no total): o número do período ao qual o elemento pertence indica o número total de níveis (camadas eletrônicas K, L, M, N, O, P, Q) ocupados por elétrons no átomo no estado fundamental; 2) Grupos ou Famílias (colunas verticais, 1 a 18): elementos da mesma coluna vertical possuem a mesma configuração eletrônica na camada de valência (mesmo número de elétrons de valência), apresentando propriedades químicas análogas e comportamentos reacionais semelhantes. Elementos representativos (blocos s e p, grupos 1, 2 e 13 a 18): grupo 1 = metais alcalinos (ns¹); grupo 2 = alcalinoterrosos (ns²); grupo 16 = calcogênios (ns² np⁴); grupo 17 = halogênios (ns² np⁵); grupo 18 = gases nobres (ns² np⁶, estáveis com octeto completo). Elementos de transição (bloco d, grupos 3 a 12): preenchem subnível d mais interno.",["Organização da Tabela: ordem crescente de NÚMERO ATÔMICO Z (Moseley)","Período (linha horizontal): número de camadas eletrônicas ocupadas (1 a 7)","Família/Grupo (coluna vertical): mesma configuração na camada de valência → propriedades químicas semelhantes","Metais alcalinos (grupo 1): 1 elétron na valência (ns¹); Halogênios (grupo 17): 7 elétrons na valência (ns² np⁵)","Gases nobres (grupo 18): 8 elétrons na valência (ns² np⁶, exceto He com 1s²), inertes"],"Cuidado no ENEM: elementos da MESMA FAMÍLIA (mesma coluna) têm propriedades químicas semelhantes porque têm o mesmo número de elétrons na camada de valência (ex: sódio Na e potássio K reagem com água de forma quase idêntica)!","O elemento químico cálcio (Ca, Z = 20) é um macronutriente mineral essencial para a formação dos ossos e dentes em vertebrados, além de participar da coagulação sanguínea e contração muscular. Efetuando a distribuição eletrônica do átomo de cálcio no estado fundamental em ordem crescente de energia dos subníveis, obtém-se: \n1s² 2s² 2p⁶ 3s² 3p⁶ 4s².","Com base nessa distribuição eletrônica, o cálcio localiza-se na Tabela Periódica no:",["2º período e grupo 4 (metais de transição).","3º período e grupo 18 (gases nobres).","4º período e grupo 2 (metais alcalinoterrosos).","4º período e grupo 14 (família do carbono).","1º período e grupo 2 (metais alcalinos)."],2,"Análise da distribuição eletrônica do cálcio (Z = 20): 1s² 2s² 2p⁶ 3s² 3p⁶ 4s². \n1) Determinação do Período: o maior número quântico principal (n) alcançado na distribuição é n = 4 (camada N), o que significa que o átomo possui 4 níveis ou camadas eletrônicas preenchidas. Portanto, o elemento situa-se no 4º período da Tabela Periódica. \n2) Determinação do Grupo/Família: a camada de valência (camada mais externa, n = 4) é 4s², contendo exatamente 2 elétrons no subnível 's'. Os elementos representativos que terminam em ns² pertencem ao Grupo 2 (antiga família IIA), conhecidos universalmente como a família dos metais alcalinoterrosos (Be, Mg, Ca, Sr, Ba, Ra). Alternativa A inverte período e grupo; B e D atribuem períodos e grupos incorretos; E indica 1º período impossível para 20 elétrons."],"Propriedades periódicas (raio, ionização e eletronegatividade)":["Propriedades periódicas são grandezas físicas e químicas cujos valores variam de maneira regular, crescendo e decrescendo periodicamente ao longo dos grupos e períodos da Tabela com o aumento do número atômico: 1) Raio atômico: distância média do núcleo ao elétron mais externo; nos períodos, o raio cresce da DIREITA para a ESQUERDA (menor carga nuclear atrai mais fracamente os elétrons da mesma camada); nos grupos, cresce de CIMA para BAIXO (adição de novas camadas eletrônicas). O Frâncio (Fr) e o Césio (Cs) têm os maiores raios atômicos. Cátions são SEMPRE menores que seus átomos neutros de origem (perdem elétrons da valência e a carga nuclear atrai mais a nuvem restante: Na⁺ < Na); ânions são SEMPRE maiores que o átomo neutro (ganham elétrons aumentando a repulsão eletrônica: Cl⁻ > Cl); 2) Energia de ionização (EI): energia mínima necessária para remover 1 elétron de um átomo gasoso isolado no estado fundamental. Varia de forma inversa ao raio: cresce para a DIREITA e para CIMA (quanto menor o raio, mais próximo do núcleo está o elétron e mais difícil é arrancá-lo); 3) Eletronegatividade: tendência de um átomo em atrair o par de elétrons em uma ligação química covalente. Cresce para a DIREITA e para CIMA (excluindo os gases nobres), tendo o Flúor (F) como elemento de máxima eletronegatividade na escala de Pauling (F > O > N > Cl > Br > I > S > C > P > H).",["Raio atômico: cresce para a ESQUERDA e para BAIXO (maior: Fr, Cs)","Tamanho de íons: Cátion < Átomo neutro < Ânion (ex: Na⁺ < Na; Cl < Cl⁻)","Energia de ionização: cresce para a DIREITA e para CIMA (inversa ao raio)","Eletronegatividade: cresce para a DIREITA e para CIMA (F > O > N > Cl > Br...)","Eletropositividade (caráter metálico): cresce para a ESQUERDA e para BAIXO (metais doam e⁻)"],"Cuidado no ENEM: raio e eletronegatividade andam em sentidos OPOSTOS! Átomo pequeno (raio menor, no topo direito) atrai elétrons com força (alta eletronegatividade e alta energia de ionização). Flúor é o mais eletronegativo; Frâncio é o maior e mais eletropositivo.","Na Tabela Periódica, os elementos sódio (Na, Z = 11), magnésio (Mg, Z = 12) e cloro (Cl, Z = 17) pertencem todos ao mesmo período horizontal (3º período).","Comparando-se esses três elementos químicos vizinhos de período, constata-se que o átomo de cloro apresenta:",["maior raio atômico e menor eletronegatividade do que o átomo de sódio.","comportamento puramente metálico capaz de formar cátions trivalentes espontâneos.","menor número de prótons e menor energia de ionização que o magnésio.","menor raio atômico e maior energia de ionização do que o átomo de sódio, devido à sua maior carga nuclear efetiva atraindo a mesma camada eletrônica.","raio atômico rigorosamente idêntico ao do sódio, pois ambos possuem três camadas eletrônicas."],3,"Na Tabela Periódica, ao longo de um mesmo período horizontal (como o 3º período, onde Na, Mg e Cl possuem exatamente 3 camadas eletrônicas preenchidas: K, L e M), o número atômico (Z) aumenta progressivamente da esquerda para a direita: Z(Na) = 11, Z(Mg) = 12 e Z(Cl) = 17. O aumento do número de prótons no núcleo sem o acréscimo de novas camadas periféricas faz crescer substancialmente a carga nuclear efetiva que atua sobre os elétrons de valência. Com 17 prótons exercendo atração eletrostática muito mais intensa sobre os elétrons do nível 3 do que os 11 prótons do sódio, a nuvem eletrônica do cloro é puxada fortemente em direção ao núcleo, resultando em uma contração do átomo: o cloro possui menor raio atômico que o sódio. Por estar mais contraído e com os elétrons mais fortemente retidos pelo núcleo positivo, retirar um elétron do cloro exige muito mais energia: o cloro possui energia de ionização consideravelmente maior e máxima eletronegatividade no período. Alternativa A inverte ambas as tendências; B contradiz o número atômico (Cl tem 17 prótons > 12 do Mg); D classifica erroneamente o cloro como metal; E ignora a atração da carga nuclear sobre o raio."],"Modelo quântico de orbitais e princípio da incerteza":["O modelo atômico atual (modelo quântico ou da mecânica ondulatória) superou as limitações do modelo de órbitas circulares rígidas de Bohr através de três princípios fundamentais formulados na década de 1920: 1) Dualidade Onda-Partícula da Matéria (Louis de Broglie, 1924): toda partícula com massa e quantidade de movimento (como o elétron) possui um comprimento de onda associado dado por λ = h / (m · v); portanto, o elétron comporta-se simultaneamente como corpúsculo de massa e como onda de matéria; 2) Princípio da Incerteza de Werner Heisenberg (1927): é física e teoricamente impossível determinar de forma simultânea e com precisão absoluta a posição e o momento linear (velocidade) de uma partícula subatômica como o elétron: Δx · Δp ≥ h / (4π). Como consequência direta desse princípio, o conceito clássico de 'órbita' (trajetória circular fixa e previsível no espaço) perde totalmente o sentido na escala atômica; 3) Equação de Onda de Erwin Schrödinger (1926): descreve os elétrons através de funções de onda matemáticas (ψ). O quadrado da função de onda (|ψ|²) define o conceito moderno de ORBITAL ATÔMICO: a região do espaço tridimensional ao redor do núcleo atômico onde a probabilidade de encontrar o elétron é máxima (geralmente fixada em 90% a 95% de chance estatística). Os orbitais 's' são esféricos, e os orbitais 'p' têm formato de halteres bilobulados ao longo dos eixos cartesianos x, y e z.",["Dualidade de De Broglie: elétron é partícula e onda ao mesmo tempo (λ = h / mv)","Princípio da Incerteza de Heisenberg: impossível determinar com precisão e simultaneidade a POSIÇÃO e a VELOCIDADE do elétron","Abandono da 'órbita': elétrons não giram em trilhos circulares fixos como planetas","Conceito moderno de Orbital: região de MÁXIMA PROBABILIDADE estatística de encontrar o elétron (~90%)","Forma dos orbitais: subnível s (esférico); subnível p (halteres/bilobulado nos eixos x, y, z)"],"Cuidado no ENEM: no modelo atômico atual, elétron NÃO tem trajetória ou órbita circular fixa! O elétron está em um ORBITAL, que é uma nuvem de probabilidade estatística de encontrá-lo.","A transição do modelo atômico de Niels Bohr para o modelo atômico moderno da mecânica quântica representou uma profunda revolução conceitual na física e na química sobre a natureza fundamental do elétron na eletrosfera.","De acordo com a mecânica quântica contemporânea, a trajetória circular fixa do elétron (órbita) foi substituída pelo conceito de orbital atômico porque:",["o elétron possui massa nula e comporta-se exclusivamente como um raio gama de alta penetração.","a rotação do elétron em torno do núcleo gera uma força centrífuga que anula toda a mecânica ondulatória.","o núcleo atômico é oco e os elétrons colidem continuamente com os prótons no vácuo central.","os elétrons são partículas macroscópicas que obedecem rigidamente às leis da gravitação clássica de Newton.","pelo Princípio da Incerteza de Heisenberg e a dualidade onda-partícula, é impossível conhecer simultaneamente a posição e a velocidade do elétron, definindo o orbital como uma região de máxima probabilidade estatística de sua presença."],4,"Resolução: No modelo atômico clássico de Bohr (1913), imaginava-se que os elétrons descreviam trajetórias circulares perfeitamente definidas e previsíveis ao redor do núcleo, análogas às órbitas dos planetas ao redor do Sol. Todavia, a formulação da Mecânica Quântica demonstrou a dualidade onda-partícula do elétron (proposta por De Broglie) e o Princípio da Incerteza (enunciado por Werner Heisenberg). De acordo com Heisenberg, a própria tentativa de medir a posição exata de um elétron altera imprevisivelmente sua velocidade e vice-versa (Δx · Δp ≥ h / 4π). Dessa forma, torna-se cientificamente impossível atribuir uma trajetória geométrica contínua ('órbita') ao elétron. A equação de onda de Erwin Schrödinger substituiu a ideia determinística de órbita pelo conceito probabilístico de ORBITAL: uma região tridimensional da eletrosfera onde a probabilidade estatística de encontrar o elétron com determinado nível de energia é máxima (em torno de 90% a 95%). Alternativas A, C, D e E contêm proposições errôneas sobre a natureza atômica."],"Números quânticos e princípio de Pauli":["No modelo quântico, cada elétron em um átomo é identificado de forma única por um conjunto de quatro Números Quânticos que descrevem sua energia, o formato espacial e a orientação do seu orbital, além de seu momento magnético intrínseco de rotação: 1) Número Quântico Principal (n = 1, 2, 3, 4, 5, 6, 7): indica o nível de energia principal ou camada eletrônica (K, L, M, N, O, P, Q) e está relacionado à distância média do elétron ao núcleo; 2) Número Quântico Secundário ou Azimutal (l = 0 até n−1): define o subnível de energia e a forma geométrica tridimensional do orbital: l = 0 (subnível s, esférico), l = 1 (subnível p, bilobulado), l = 2 (subnível d, trevo de quatro folhas), l = 3 (subnível f); 3) Número Quântico Magnético (m_l = de −l até +l passando por zero): define a orientação espacial do orbital no espaço sob ação de campo magnético externo (o subnível s tem 1 orbital com m_l = 0; o p tem 3 orbitais com m_l = −1, 0, +1; o d tem 5 orbitais; o f tem 7 orbitais); 4) Número Quântico de Spin (m_s = +½ ou −½): descreve o momento angular intrínseco de rotação do elétron. O Princípio de Exclusão de Wolfgang Pauli estabelece que: 'Em um mesmo átomo, NUNCA podem existir dois elétrons com o mesmo conjunto de quatro números quânticos'. Como consequência direta de Pauli, cada orbital atômico individual pode comportar no MÁXIMO DOIS elétrons, e estes devem obrigatoriamente possuir spins opostos (antiparalelos). Pela Regra de Hund, os orbitais de mesmo subnível são preenchidos colocando-se primeiro um elétron com o mesmo spin em cada orbital antes de emparelhar.",["Número quântico principal (n): nível de energia / camada eletrônica (1 a 7)","Número quântico secundário (l): subnível e formato do orbital (s: l=0, p: l=1, d: l=2, f: l=3)","Número quântico magnético (m_l): orientação espacial do orbital (−l a +l)","Número quântico de spin (m_s): rotação intrínseca (+½ e −½)","Princípio de Exclusão de Pauli: NUNCA dois elétrons no mesmo átomo têm os 4 números quânticos iguais!","Capacidade máxima: cada orbital atômico comporta no máximo 2 elétrons de spins opostos (↑↓)"],"Cuidado no ENEM: o Princípio de Pauli é o que impede um orbital de ter 3 elétrons! Cada caixinha (orbital) só cabe no MÁXIMO 2 elétrons com spins contrários (um virado para cima ↑ e outro para baixo ↓).","Ao realizar a distribuição eletrônica dos elétrons na camada de valência do átomo de oxigênio (Z = 8, configuração 1s² 2s² 2p⁴), um estudante representou o subnível 2s preenchido com dois elétrons desenhados com setas apontando na mesma direção vertical (↑↑).","De acordo com os postulados fundamentais da mecânica quântica, essa representação (↑↑) no mesmo orbital está incorreta porque viola frontalmente o:",["Princípio de Exclusão de Pauli, que determina que dois elétrons em um mesmo orbital devem obrigatoriamente possuir spins opostos (antiparalelos) para não terem os mesmos quatro números quânticos.","Princípio de Conservação das Massas de Lavoisier.","Princípio da Incerteza de Heisenberg sobre o raio da camada de valência.","Modelo de Dalton das esferas maciças indivisíveis.","Postulado de Bohr sobre os níveis de energia circular quantizados."],0,"Resolução: O Princípio de Exclusão de Pauli, formulado pelo físico austríaco Wolfgang Pauli em 1925, estabelece como lei fundamental da física quântica que em um mesmo átomo é rigorosamente impossível que dois elétrons apresentem conjuntos idênticos de quatro números quânticos (n, l, m_l, m_s). Se dois elétrons ocupam o mesmo orbital atômico (como o orbital 2s), eles compartilham necessariamente o mesmo número quântico principal (n = 2), o mesmo número quântico secundário (l = 0 para o subnível s) e o mesmo número quântico magnético (m_l = 0). Portanto, para que os dois elétrons não possuam números quânticos idênticos (o que violaria a lei quântica), o quarto número quântico — o spin (m_s) — deve ser obrigatoriamente diferente para cada um: um elétron deve apresentar spin +½ (representado convencionalmente pela seta para cima ↑) e o outro deve apresentar spin −½ (seta para baixo ↓). A representação com duas setas no mesmo sentido (↑↑) atribuiria o mesmo valor de spin (+½ e +½) a ambos, violando frontalmente o Princípio de Exclusão de Pauli. Alternativas A, C, D e E citam princípios ou modelos que não regulam o emparelhamento de spins em orbitais."],"Afinidade eletrônica e eletronegatividade na prática":["A afinidade eletrônica (ou eletroafinidade, AE) é a quantidade de energia liberada (ou absorvida) quando um átomo neutro isolado no estado gasoso fundamental recebe um elétron, transformando-se em um ânion monovalente: X(g) + e⁻ → X⁻(g) + energia (na imensa maioria dos ametais é um processo exotérmico). Quanto maior a atração do núcleo atômico sobre o elétron adicionado, maior a energia liberada e maior a afinidade eletrônica do elemento. Na Tabela Periódica, a afinidade eletrônica cresce da ESQUERDA para a DIREITA ao longo dos períodos (com o aumento da carga nuclear efetiva) e de BAIXO para CIMA nos grupos (com a diminuição do raio atômico, aproximando o elétron da atração positiva dos prótons), excluindo-se os gases nobres estáveis. O elemento de maior afinidade eletrônica de toda a Tabela é o Cloro (Cl = −349 kJ/mol, ligeiramente superior à do flúor em razão da menor repulsão intereletrônica na camada 3p mais espaçosa do cloro). Por sua vez, a Eletronegatividade na escala de Linus Pauling mede a tendência de um átomo de atrair pares de elétrons compartilhados em ligações químicas covalentes. Ambas as propriedades explicam porque os halogênios (F, Cl, Br, I) são agentes oxidantes vigorosos que formam com extrema facilidade sais iônicos halogenetos (como NaCl, CaF₂, KI), capturando elétrons de metais eletropositivos.",["Afinidade Eletrônica (AE): energia liberada ao capturar 1 elétron no estado gasoso (X + e⁻ → X⁻ + energia)","Variação periódica: cresce para a DIREITA e para CIMA (máxima nos halogênios, grupo 17)","Elemento com MAIOR afinidade eletrônica da Tabela Periódica: Cloro (Cl)","Eletronegatividade: tendência de atrair elétrons na ligação covalente (máxima no Flúor F)","Reatividade dos ametais: depende da facilidade de ganhar elétrons (F > O > Cl > Br > I > S)"],"Curiosidade que cai em pegadinhas do ENEM: o elemento mais ELETRONEGATIVO é o Flúor (F); mas o elemento com maior AFINIDADE ELETRÔNICA (energia liberada ao receber e⁻) é o Cloro (Cl), porque o flúor é tão minúsculo que seus elétrons se repelem ao receber mais um!","Os halogênios (grupo 17 da Tabela Periódica: F, Cl, Br, I) são ametais de elevada reatividade química que reagem energicamente com metais alcalinos e alcalinoterrosos formando sais iônicos binários, como o cloreto de sódio (sal de cozinha) e o fluoreto de cálcio (fluorita).","Essa notável facilidade dos halogênios de formar ânions monovalentes estáveis (haletos: F⁻, Cl⁻, Br⁻, I⁻) fundamenta-se no fato de que esses elementos apresentam:",["grandes raios atômicos e baixíssima energia de ionização.","sete elétrons na camada de valência (ns² np⁵) e altíssima afinidade eletrônica, liberando grande quantidade de energia ao receber um elétron para completar o octeto estável de gás nobre.","comportamento redutor que cede espontaneamente sete elétrons em meio aquoso.","núcleos atômicos que sofrem fissão nuclear espontânea ao tocarem cátions metálicos.","ligações metálicas tridimensionais que retêm os elétrons livres no estado gasoso."],1,"Resolução: Os halogênios ocupam a penúltima coluna da Tabela Periódica (Grupo 17), possuindo configuração eletrônica na camada de valência do tipo ns² np⁵ (exatamente 7 elétrons de valência). Por apresentarem elevada carga nuclear efetiva e pequenos raios atômicos dentro de seus respectivos períodos, o núcleo positivo exerce uma fortíssima atração sobre elétrons externos. Ao capturarem um único elétron adicional (e⁻), os halogênios completam a camada de valência atingindo a configuração eletrônica extremamente estável do tipo ns² np⁶ (octeto completo, equivalente ao de um gás nobre). Em virtude dessa atração colossal, o processo de captura do elétron libera uma quantidade enorme de energia termodinâmica (elevadíssima afinidade eletrônica), favorecendo a formação espontânea dos ânions haleto (F⁻, Cl⁻, Br⁻, I⁻) e tornando os halogênios os agentes oxidantes mais poderosos da química inorgânica. Alternativa A inverte o raio e a energia de ionização; C afirma que são redutores (são oxidantes fortes); D e E trazem hipóteses sem cabimento na química atômica."],"Emissões radioativas (alfa, beta e gama) e leis de Soddy":["A radioatividade é o fenômeno natural ou artificial pelo qual núcleos atômicos instáveis (com desbalanço entre o número de prótons e nêutrons) sofrem desintegração espontânea, emitindo partículas e radiação eletromagnética para atingirem configurações mais estáveis de menor energia. Existem três modalidades clássicas de emissões nucleares: 1) Partícula Alfa (α ou ⁴₂α): constituída por 2 prótons e 2 nêutrons (idêntica ao núcleo do átomo de hélio), com carga elétrica +2 e número de massa 4. Possui alta massa e baixa velocidade (~5% da velocidade da luz), exibindo baixíssimo poder de penetração (é completamente bloqueada por uma simples folha de papel ou pelas camadas mortas da pele humana), porém tem altíssimo poder ionizante. Pela 1ª Lei da Radioatividade (Lei de Soddy): ao emitir uma partícula alfa, o núcleo perde 4 unidades de massa (A) e 2 unidades de número atômico (Z): ᴬ_Z X → ᴬ⁻⁴_{Z−2} Y + ⁴₂α; 2) Partícula Beta (β ou ⁰₋₁β): elétron ejetado do núcleo em alta velocidade (~90% da luz), originado pela desintegração de um nêutron intranuclear (1 nêutron → 1 próton + 1 elétron + 1 antineutrino). Carga elétrica −1 e massa desprezível (0). Possui médio poder de penetração (requer lâminas de alumínio ou acrílico para blindagem). Pela 2ª Lei da Radioatividade (Soddy-Fajans-Russell): o número de massa A permanece inalterado e o número atômico Z aumenta em 1 unidade: ᴬ_Z X → ᴬ_{Z+1} Y + ⁰₋₁β; 3) Radiação Gama (γ ou ⁰₀γ): onda eletromagnética de frequência e energia altíssimas (fótons gama), com carga zero e massa zero. Não altera A nem Z do núcleo. Apresenta o mais alto poder de penetração de todas as emissões, exigindo espessas paredes de chumbo ou blocos maciços de concreto para retenção.",["Partícula Alfa (⁴₂α): núcleo de Hélio (2p + 2n), carga +2, massa 4; barrada por papel","Partícula Beta (⁰₋₁β): elétron nuclear, carga −1, massa 0; barrada por lâmina de alumínio","Radiação Gama (⁰₀γ): onda eletromagnética pura (alta frequência), carga 0, massa 0; exige chumbo denso","1ª Lei de Soddy: emissão de 1 α → massa A diminui 4, número atômico Z diminui 2","2ª Lei de Soddy-Fajans: emissão de 1 β → massa A não muda, número atômico Z AUMENTA 1"],"Cuidado com a pegadinha clássica do ENEM: na emissão beta (β), o número atômico do elemento AUMENTA em uma unidade (Z vira Z + 1) porque um nêutron do núcleo se transformou em um próton!","O isótopo radioativo urânio-238 (²³⁸₉₂U) presente em rochas da crosta terrestre sofre decaimento espontâneo emitindo uma partícula alfa (⁴₂α). O núcleo-filho instável formado sofre imediatamente uma desintegração subsequente, emitindo uma partícula beta negativa (⁰₋₁β).","O número de massa (A) e o número atômico (Z) do isótopo resultante após a emissão sucessiva de uma partícula alfa e uma partícula beta são, respectivamente:",["A = 238 e Z = 92.","A = 234 e Z = 90.","A = 234 e Z = 91.","A = 236 e Z = 89.","A = 230 e Z = 88."],2,"Resolução pelas Leis da Radioatividade de Soddy e Fajans: \n1) Primeira etapa (decaimento alfa): o urânio-238 emite uma partícula alfa (⁴₂α): \n²³⁸₉₂U → ᴬ₁_{Z₁} Y + ⁴₂α. \nPela conservação de massa e carga: A₁ = 238 − 4 = 234; Z₁ = 92 − 2 = 90 (isótopo ²³⁴₉₀Th, tório). \n2) Segunda etapa (decaimento beta): o tório-234 emite uma partícula beta (⁰₋₁β): \n²³⁴₉₀Th → ᴬ₂_{Z₂} W + ⁰₋₁β. \nPela 2ª Lei da Radioatividade: o número de massa não varia (A₂ = 234 + 0 = 234) e o número atômico aumenta em 1 unidade (Z₂ = 90 − (−1) = 90 + 1 = 91, elemento protactínio, ²³⁴₉₁Pa). \nPortanto, após as duas emissões nucleares sucessivas, temos A = 234 e Z = 91. Alternativa A supõe que nada mudou; B considera apenas a emissão alfa (A = 234, Z = 90) esquecendo a emissão beta posterior; D e E cometem erros aritméticos nos coeficientes nucleares."],"Tempo de meia-vida e decaimento radioativo":["O tempo de meia-vida (ou período de semidesintegração, t_1/2) é o intervalo de tempo necessário para que a massa, o número de átomos ou a atividade radioativa de uma amostra de um radioisótopo se reduza exatamente à metade do seu valor inicial. Trata-se de uma propriedade físico-nuclear intrínseca e invariável de cada isótopo radioativo: a meia-vida é rigorosamente independente de fatores químicos ou físicos externos, não sendo alterada por variações de temperatura, pressão, estado físico ou ligações moleculares da substância. A relação matemática fundamental do decaimento radioativo é expressa por: m = m₀ / 2ⁿ, onde m₀ é a massa inicial, m a massa restante após o tempo decorrido, e n é o número de meias-vidas transcorridas (n = tempo total / t_1/2). Por exemplo, após 1 meia-vida sobra 50% (1/2); após 2 meias-vidas, sobra 25% (1/4); após 3 meias-vidas, sobra 12,5% (1/8); após 4 meias-vidas, resta apenas 6,25% (1/16) da amostra radioativa original.",["Meia-vida (t_1/2): tempo para a massa radioativa cair para a METADE","Fórmula do decaimento: m = m₀ / 2ⁿ","Número de meias-vidas: n = t_total / t_1/2","Fração restante após n meias-vidas: 1 / 2ⁿ","Propriedade nuclear: temperatura, pressão ou estado físico NÃO alteram a meia-vida!"],"Cuidado no ENEM: meia-vida NUNCA zera a massa da amostra! A cada meia-vida o valor divide por dois (50% → 25% → 12,5% → 6,25%...).","O gráfico a seguir representa a curva exponencial clássica de decaimento radioativo do iodo-131 (¹³¹I), amplamente empregado na medicina nuclear no diagnóstico e tratamento de distúrbios da glândula tireoide:\n  <div style=\"text-align:center;margin:12px 0;\">\n    <svg viewBox=\"0 0 32
