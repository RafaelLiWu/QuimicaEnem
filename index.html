ade, M) é o número de mols de soluto (n₁) dissolvidos por litro de solução (V): M = n₁ / V = m₁ / (MM₁ · V), expressa em mol/L. É a unidade de concentração padrão na química e na estequiometria de reações em meio aquoso, pois relaciona diretamente o número de entidades químicas (íons ou moléculas) segundo a constante de Avogadro (6,02 × 10²³ partículas/mol). Conhecendo-se a massa molar (g/mol), pode-se converter diretamente concentração comum (g/L) em molaridade através de C = M · MM.",["Molaridade: M = n₁ / V (mol/L)","Fórmula expandida: M = m₁ / (MM₁ · V)","Relação C e M: C = M · MM₁","Número de mols: n = m / MM"],"Sempre confira a unidade do volume: se o enunciado der em mL, divida por 1 000 para passar para L antes de calcular a molaridade!","Em uma aula de química analítica, um estudante deve preparar 500 mL (0,50 L) de uma solução aquosa de hidróxido de sódio (NaOH) para uso como padrão alcalino. A massa molar do NaOH é 40 g/mol. O estudante pesou rigorosamente 4,0 g de NaOH em uma balança analítica, dissolveu o sólido em água destilada e transferiu quantitativamente para um balão volumétrico, aferindo o menisco em 500 mL.","A concentração em quantidade de matéria (molaridade) da solução preparada é:",["2,0 mol/L","0,10 mol/L","0,08 mol/L","0,40 mol/L","0,20 mol/L"],4,"Número de mols de NaOH: n = m / MM = 4,0 g / (40 g/mol) = 0,10 mol. O volume da solução é 500 mL = 0,50 L. Concentração molar: M = n / V = 0,10 mol / 0,50 L = 0,20 mol/L. A alternativa B esquece de dividir pelo volume de 0,5 L (encontra 0,10 mol, que é apenas o número de mols); C divide m pelo volume sem a massa molar; D multiplica por 2 sem critério; E erra a casa decimal usando 0,05 L."],"Título, porcentagem e ppm":["O título em massa (τ) é a fração mássica de soluto em relação à massa total da solução: τ = m₁ / m_total. Quando multiplicado por 100, obtém-se o título em porcentagem mássica (% m/m). Para soluções líquidas, utiliza-se também o título em volume (% v/v), como na graduação alcoólica (°GL, que indica mL de etanol em 100 mL de bebida). Para soluções extremamente diluídas (poluentes no ar, metais pesados na água ou agrotóxicos em alimentos), adota-se a unidade de partes por milhão (ppm): 1 ppm equivale a 1 parte de soluto em 10⁶ partes de solução (para soluções aquosas diluídas de densidade 1 g/mL, 1 ppm = 1 mg de soluto por litro de água).",["Título em massa: τ = m₁ / (m₁ + m₂)","Porcentagem em massa: % = τ · 100","1 ppm = 1 mg de soluto / 1 kg de solução","Em água diluída (d = 1 g/mL): 1 ppm = 1 mg/L = 10⁻³ g/L","1 ppb = 1 μg/L (partes por bilhão)"],"Dica de ouro: em água doce, 1 ppm = 1 mg/L! Se a concentração máxima de chumbo na água permitida pelo Ministério da Saúde é 0,01 mg/L, isso equivale a 0,01 ppm.","A Portaria GM/MS nº 888 do Ministério da Saúde estabelece o limite máximo permitido de íons fluoreto (F⁻) na água potável para consumo humano em 1,5 ppm (partes por milhão) com o objetivo de prevenir a fluorose dentária sem perder o benefício de proteção contra cáries.","Uma estação de tratamento de água analisou uma amostra de 2 000 L de água fluoretada. Considerando a densidade da água igual a 1,0 kg/L, qual a massa máxima em gramas de fluoreto que pode estar dissolvida nesse volume para atender rigorosamente ao limite de 1,5 ppm?",["3,0 g","0,15 g","1,5 g","30 g","300 g"],0,"Como 1 ppm em solução aquosa diluída equivale a 1 mg de soluto por litro de solução (1 mg/L), a concentração máxima de 1,5 ppm corresponde a 1,5 mg de F⁻ por litro de água. Para um volume de 2 000 L de água: massa total de fluoreto = 1,5 mg/L × 2 000 L = 3 000 mg. Convertendo miligramas para gramas (dividindo por 1 000): 3 000 mg = 3,0 g de F⁻. Distrator A erra a conversão de unidades por fator 20; B é a massa para 1 000 L; D e E erram a potência de dez na conversão de mg para g."],"Diluição e mistura de soluções":["Diluição consiste na adição de solvente puro a uma solução já existente, aumentando o volume final sem alterar a quantidade de soluto. Como o soluto permanece constante (n_inicial = n_final ou m_inicial = m_final), a concentração diminui na proporção inversa do aumento de volume, valendo a equação fundamental: C₁·V₁ = C₂·V₂ ou M₁·V₁ = M₂·V₂. Na mistura de soluções de mesmo soluto, a quantidade total de soluto é a soma das partes: M_f·V_f = M₁·V₁ + M₂·V₂, onde V_f = V₁ + V₂. Na mistura de soluções de solutos diferentes que reagem entre si (como ácido e base), ocorre uma reação química que exige tratamento estequiométrico para identificar excesso e produtos.",["Diluição: C₁·V₁ = C₂·V₂","Molaridade na diluição: M₁·V₁ = M₂·V₂","Mistura de mesmo soluto: M_f · V_f = M₁·V₁ + M₂·V₂","Volume final: V_f = V₁ + V_adicionado (aditivo)"],"Cuidado com a pegadinha clássica do ENEM: 'adicionou-se 150 mL de água a 50 mL' significa que o volume FINAL V₂ é 50 + 150 = 200 mL, e não 150 mL!","Em um laboratório escolar, um professor necessita de uma solução aquosa de ácido clorídrico (HCl) de concentração 0,50 mol/L para uma demonstração experimental. No frasco de estoque, ele dispõe de uma solução concentrada de HCl de 2,0 mol/L. O professor pipetou 50 mL dessa solução de estoque e adicionou água destilada suficiente para atingir a marca de 200 mL em um balão volumétrico.","Qual a concentração em mol/L da solução de HCl resultante após a diluição?",["0,25 mol/L","0,50 mol/L","1,0 mol/L","1,5 mol/L","0,10 mol/L"],1,"Na diluição, a quantidade de matéria de soluto permanece inalterada: M₁·V₁ = M₂·V₂. Dados: M₁ = 2,0 mol/L, V₁ = 50 mL, V₂ = 200 mL. Logo: 2,0 mol/L × 50 mL = M₂ × 200 mL → M₂ = 100 / 200 = 0,50 mol/L. O volume quadruplicou (de 50 para 200 mL), logo a concentração caiu a 1/4 da inicial (2,0 / 4 = 0,50 mol/L). Alternativa A divide por 8; C supõe diluição pela metade; D subtrai volumes; E erra a conta básica."],"Titulação ácido-base":["A titulação ácido-base é um método quantitativo volumétrico para determinar a concentração desconhecida de uma solução de ácido (ou base) por meio de sua reação estequiométrica com uma solução padrão de base (ou ácido) de concentração rigorosamente conhecida. O ponto de equivalência (ou estequiométrico) é o momento exato em que o número de mols de íons H⁺ fornecidos pelo ácido iguala o número de mols de íons OH⁻ fornecidos pela base: n(H⁺) = n(OH⁻). O ponto final é sinalizado visualmente pela mudança de cor de um indicador ácido-base adequado (como a fenolftaleína, que vira de incolor para rosa pálido em pH ~8,2-10). Para ácidos e bases monopróticos: M_ácido · V_ácido = M_base · V_base. Para ácidos polipróticos (como H₂SO₄), deve-se multiplicar pelos coeficientes estequiométricos da reação de neutralização.",["Neutralização estequiométrica: n(H⁺) = n(OH⁻)","Ácido mono e base mono: M_a · V_a = M_b · V_b","Ácido diprótico (H₂SO₄) + base monohidroxilada (NaOH): 2 M_a · V_a = M_b · V_b","Ponto de equivalência: proporção molar estequiométrica exata","Indicador: muda de cor na faixa de viragem próxima ao ponto de equivalência"],"Atenção ao diácido H₂SO₄: cada 1 mol de H₂SO₄ fornece 2 mols de H⁺ e precisa de 2 mols de NaOH para neutralização total! H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O.","A curva esquemática de titulação de uma amostra de 25,0 mL de ácido sulfúrico (H₂SO₄, diácido) com uma solução padrão de hidróxido de sódio (NaOH) de concentração 0,50 mol/L está indicada abaixo:\n  <div style=\"text-align:center;margin:12px 0;\">\n    <svg viewBox=\"0 0 320 135\" style=\"width:100%;max-width:320px;height:auto;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px;\">\n      <text x=\"10\" y=\"16\" fill=\"var(--mu)\" font-size=\"11\" font-family=\"sans-serif\">Curva de Titulação: pH × Volume de NaOH</text>\n      <!-- Axes -->\n      <line x1=\"40\" y1=\"110\" x2=\"290\" y2=\"110\" stroke=\"var(--tx)\" stroke-width=\"1.5\"/>\n      <line x1=\"40\" y1=\"110\" x2=\"40\" y2=\"25\" stroke=\"var(--tx)\" stroke-width=\"1.5\"/>\n      <text x=\"15\" y=\"30\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">14</text>\n      <text x=\"20\" y=\"70\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">7</text>\n      <text x=\"20\" y=\"105\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">1</text>\n      <text x=\"155\" y=\"125\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">20,0 mL</text>\n      <!-- Curve -->\n      <path d=\"M 40 102 C 120 100, 145 95, 155 70 C 165 45, 190 32, 280 30\" fill=\"none\" stroke=\"var(--ac)\" stroke-width=\"2.5\"/>\n      <circle cx=\"155\" cy=\"70\" r=\"4\" fill=\"var(--er)\"/>\n      <line x1=\"155\" y1=\"70\" x2=\"155\" y2=\"110\" stroke=\"var(--er)\" stroke-dasharray=\"2,2\"/>\n      <text x=\"162\" y=\"68\" fill=\"var(--er)\" font-size=\"10\" font-family=\"sans-serif\">Ponto de Equivalência</text>\n    </svg>\n  </div>\n  O ponto de equivalência foi atingido com o consumo de exatamente 20,0 mL de NaOH 0,50 mol/L.","Qual é a concentração em quantidade de matéria (mol/L) do ácido sulfúrico na amostra analisada?",["0,10 mol/L","0,40 mol/L","0,20 mol/L","0,50 mol/L","0,05 mol/L"],2,"Equação balanceada de neutralização: H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O. Número de mols de NaOH consumidos: n(NaOH) = M_b × V_b = 0,50 mol/L × 0,020 L = 0,010 mol. Pela estequiometria (proporção 1 H₂SO₄ : 2 NaOH): n(H₂SO₄) = n(NaOH) / 2 = 0,010 / 2 = 0,005 mol de ácido. A concentração molar do ácido é: M(H₂SO₄) = n / V = 0,005 mol / 0,025 L = 0,20 mol/L. Alternativa B (0,40 mol/L) esquece de dividir por 2 devido ao diácido; A divide mais uma vez por 2; D supõe concentrações iguais; E comete erro decimal."],"Efeitos coligativos (tonoscopia e ebulioscopia)":["Propriedades coligativas são propriedades físicas das soluções que dependem exclusivamente do número de partículas de soluto dispersas no solvente, e não da natureza química do soluto. A tonoscopia estuda o abaixamento da pressão máxima de vapor do solvente provocado pela adição de um soluto não volátil: as moléculas de soluto ocupam espaço na superfície dificultando a evaporação do solvente. A ebulioscopia estuda a elevação da temperatura de ebulição da solução pelo mesmo motivo (para que a pressão de vapor iguale a pressão atmosférica, exige-se maior temperatura). Para solutos moleculares (como sacarose e glicose), 1 mol gera 1 mol de partículas. Para solutos iônicos (como sais e bases fortes), os íons se dissociam: 1 mol de NaCl gera ~2 mols de partículas (Na⁺ e Cl⁻), exercendo praticamente o dobro do efeito coligativo.",["Tonoscopia: adição de soluto não volátil diminui a pressão de vapor","Ebulioscopia: adição de soluto não volátil eleva o ponto de ebulição","Depende do número de partículas dispersas (concentração em mol de partículas)","Fator de Van 't Hoff: i = 1 + α(q − 1)","Comparação: 1 mol/L Al₂(SO₄)₃ (5 partículas) > 1 mol/L CaCl₂ (3) > 1 mol/L NaCl (2) > 1 mol/L Glicose (1)"],"Cuidado no ENEM: para efeito coligativo, multiplique a molaridade pelo número de íons gerados! 1 mol/L de NaCl gera 2 mol/L de partículas, logo eleva mais o ponto de ebulição do que 1 mol/L de glicose.","Em quatro recipientes idênticos e abertos ao nível do mar (pressão de 1 atm), foram colocadas soluções aquosas contendo solutos não voláteis: Frasco 1: 0,1 mol/L de glicose (molecular); Frasco 2: 0,1 mol/L de cloreto de sódio (NaCl, eletrólito 100% dissociado); Frasco 3: 0,1 mol/L de cloreto de cálcio (CaCl₂, eletrólito 100% dissociado); Frasco 4: água destilada pura.","Colocando-se as quatro amostras sob mesmo aquecimento gradual, qual solução apresentará a maior temperatura de início de ebulição?",["Frasco 4 (água pura).","Frasco 1 (solução de glicose).","Frasco 2 (solução de cloreto de sódio).","Frasco 3 (solução de cloreto de cálcio).","Todas iniciarão a ebulição na mesma temperatura de 100 °C."],3,"Pela ebulioscopia, quanto maior o número de partículas de soluto dispersas por volume de solvente, menor a pressão de vapor e maior a temperatura de ebulição. O Frasco 4 tem zero partículas (água ferve a 100 °C). No Frasco 1: glicose não se dissocia → 0,1 mol/L de partículas. No Frasco 2: NaCl → Na⁺ + Cl⁻ (2 íons) → 0,1 × 2 = 0,2 mol/L de partículas. No Frasco 3: CaCl₂ → Ca²⁺ + 2 Cl⁻ (3 íons) → 0,1 × 3 = 0,3 mol/L de partículas de soluto. Como o Frasco 3 possui a maior concentração de partículas de soluto em solução, sofrerá a maior elevação ebulioscópica e ferverá na maior temperatura. Alternativas A, B e C apresentam menor efeito coligativo; E desconsidera a lei da ebulioscopia."],"Crioscopia, osmose e pressão osmótica":["A crioscopia (ou criometria) estuda o abaixamento da temperatura de congelamento (fusão) de um solvente causado pela adição de soluto não volátil. É por isso que em países frios espalha-se sal (NaCl ou CaCl₂) nas pistas congeladas: a mistura sal+gelo tem ponto de fusão inferior a 0 °C (podendo chegar a −15 °C), derretendo o gelo. A osmose é o transporte espontâneo de solvente puro através de uma membrana semipermeável do meio menos concentrado (hipotônico) para o meio mais concentrado (hipertônico). A pressão osmótica (π) é a pressão externa necessária para impedir a passagem de solvente por osmose: π = M · R · T · i. A osmose reversa ocorre aplicando-se pressão superior a π no lado hipertônico, forçando a água a sair e deixando os sais retidos, método crucial na dessalinização da água do mar.",["Crioscopia: adição de soluto abaixa o ponto de congelamento (ΔTc = Kc · m · i)","Aplicação crioscópica: sal na neve / aditivo anticongelante no radiador (etilenoglicol)","Osmose: fluxo de solvente do meio hipotônico → meio hipertônico","Pressão osmótica: π = M · R · T · i (Equação de van 't Hoff)","Osmose reversa: pressão externa P > π dessaliniza água do mar"],"Cuidado no ENEM: aditivo de radiador tem dupla função! No calor eleva a temperatura de ebulição (ebulioscopia) e no frio abaixa a temperatura de congelamento (crioscopia).","Em regiões costeiras áridas, usinas de dessalinização convertem água do mar em água potável para consumo populacional através do processo de osmose reversa, utilizando membranas poliméricas sintéticas semipermeáveis.","Para que a água pura seja forçada a se separar dos sais e atravessar a membrana semipermeável no processo de osmose reversa, é indispensável:",["aquecer a salmoura sob refluxo até que ocorra a quebra catalítica dos íons sódio e cloreto.","adicionar glicose à água do mar para equilibrar as concentrações iônicas internas.","reduzir a temperatura da água do mar até seu ponto crioscópico de congelamento.","diminuir a pressão atmosférica circundante gerando vácuo absoluto no compartimento da salmoura.","aplicar sobre a água do mar uma pressão mecânica superior à sua pressão osmótica natural."],4,"Na osmose espontânea, a água migra naturalmente do meio hipotônico (água doce) para o meio hipertônico (água salgada). Para inverter esse fluxo natural (osmose reversa) e obter água purificada a partir da água salgada, deve-se aplicar no compartimento da água do mar uma pressão mecânica hidrostática superior à pressão osmótica da solução salina (cerca de 25 a 30 atm no caso da água do mar). Dessa forma, as moléculas de água são empurradas através dos microporos da membrana, retendo os íons solvatados. Alternativa C cita congelamento; B adicionaria mais soluto aumentando a pressão osmótica; D sugere vácuo que aceleraria a osmose direta; E sugere quebra irreal de íons por calor."],"Fração molar e molalidade":["A fração molar (X) é uma forma adimensional de expressar a concentração de uma solução, definida como a razão entre o número de mols de um determinado componente (n_i) e o número total de mols presentes na mistura (n_total = n_soluto + n_solvente): X_soluto = n₁ / (n₁ + n₂). A soma das frações molares de todos os constituintes de uma solução é sempre rigorosamente igual a 1 (X₁ + X₂ = 1). Já a molalidade (W ou m) expressa a quantidade de matéria de soluto (em mols) dissolvida por quilograma de SOLVENTE PURO: W = n₁ / m_solvente(kg) = m₁ / (MM₁ · m₂(kg)), com unidade em mol/kg (molal). Enquanto a molaridade (mol/L) varia com a temperatura porque líquidos dilatam ou contraem alterando o volume, a molalidade e a fração molar dependem exclusivamente de massas e de mols, sendo absolutamente INVARIANTES com a temperatura, o que as torna as grandezas ideais para o cálculo preciso de propriedades coligativas (ebulioscopia e crioscopia).",["Fração molar do soluto: X₁ = n₁ / (n₁ + n₂)","Soma das frações molares: X₁ + X₂ = 1","Molalidade: W = n₁ / m_solvente(kg) (em mol/kg)","Vantagem da molalidade: NÃO varia com a temperatura (massa não dilata)","Cuidado: molalidade divide pela massa do SOLVENTE (em kg), não pela massa da solução!"],"Pegadinha clássica do ENEM: Molaridade (mol/L) varia com a temperatura porque o volume da solução dilata; Molalidade (mol/kg) NÃO varia com a temperatura porque a massa de solvente é constante!","Em um laboratório termodinâmico, preparou-se uma solução anticongelante dissolvendo-se completamente 62 g de etilenoglicol (C₂H₆O₂, massa molar = 62 g/mol) em exatamente 500 g (0,50 kg) de água destilada pura.","Qual é a molalidade dessa solução de etilenoglicol em mol/kg de solvente?",["2,0 mol/kg","1,0 mol/kg","0,50 mol/kg","4,0 mol/kg","62 mol/kg"],0,"Resolução passo a passo: 1) Quantidade de matéria do soluto (etilenoglicol): n₁ = m₁ / MM₁ = 62 g / (62 g/mol) = 1,0 mol de etilenoglicol. 2) Massa do solvente em quilogramas: m₂(água) = 500 g = 0,50 kg. 3) Cálculo da molalidade (W): W = n₁ / m₂(kg) = 1,0 mol / 0,50 kg = 2,0 mol/kg de água. Alternativa C inverte a divisão (0,50 / 1); B esquece de dividir pela massa de solvente de 0,5 kg (encontrando apenas os mols); D multiplica por 2 indevidamente; E usa a massa em gramas."],"Coloides e Efeito Tyndall":["Dispersões dividem-se em três classes de acordo com o diâmetro médio das partículas dispersas: 1) Soluções verdadeiras (partículas < 1 nm): misturas homogêneas ótica e microscopicamente transparentes que não sedimentam e não são retidas por filtros ou membranas (ex: sal ou açúcar dissolvidos em água); 2) Dispersões coloidais ou coloides (partículas entre 1 nm e 1 000 nm): misturas heterogêneas ao ultramicroscópio que parecem homogêneas a olho nu, não sedimentam pela ação da gravidade comum e exibem o Efeito Tyndall (ex: neblina, fumaça, leite, maionese, sangue, gelatina); 3) Suspensões grosseiras (partículas > 1 000 nm): sedimentam espontaneamente e são retidas por papel de filtro comum (ex: água com barro). O Efeito Tyndall é o espalhamento óptico da luz provocado pelas partículas coloidais: quando um feixe luminoso atravessa um coloide, a trajetória da luz torna-se nitidamente visível como um cone iluminado (como faróis de carros na neblina ou frestas de sol em uma sala empoeirada), fenômeno que não ocorre em soluções verdadeiras transparentes.",["Solução verdadeira: diâmetro < 1 nm; homogênea, sem efeito Tyndall (ex: soro fisiológico)","Coloide: diâmetro entre 1 e 1 000 nm; heterogêneo ao ultramicroscópio, apresenta Efeito Tyndall","Suspensão: diâmetro > 1 000 nm; partículas visíveis que decantam por gravidade (ex: leite de magnésia)","Efeito Tyndall: dispersão da luz por partículas coloidais (torna o feixe de luz visível)","Movimento browniano: choque aleatório contínuo das moléculas do solvente impedindo a sedimentação do coloide"],"Cuidado no ENEM: o leite e o sangue NÃO são soluções homogêneas! São coloides (dispersões heterogêneas ao microscópio) e apresentam Efeito Tyndall espalhando a luz.","Ao dirigir um automóvel à noite em uma serra com neblina cerrada, o motorista percebe que os faróis iluminam nitidamente o caminho do feixe de luz no ar, formando feixes cônicos brilhantes que dificultam a visão ao longe, ao passo que em uma noite de ar limpo o feixe de luz é invisível lateralmente.","Esse fenômeno óptico de espalhamento da luz que identifica a neblina como uma dispersão coloidal é denominado:",["Efeito Fotoelétrico.","Efeito Tyndall.","Efeito Joule.","Efeito Doppler.","Ressonância Magnética."],1,"Resolução: A neblina é um aerossol líquido, isto é, uma dispersão coloidal constituída por gotículas microscópicas de água líquida dispersas no ar atmosférico, com dimensões que se situam na faixa de 1 nm a 1 000 nm. Quando a luz emitida pelos faróis atinge essas partículas coloidais, ocorre a difração e espalhamento da luz em todas as direções (espalhamento de Rayleigh/Tyndall). Como consequência desse espalhamento, a trajetória do feixe luminoso torna-se diretamente visível aos olhos do observador lateral, fenômeno clássico conhecido como Efeito Tyndall. Em soluções verdadeiras ou no ar puro e seco, as partículas moleculares são menores que 1 nm e não provocam espalhamento apreciável da luz visível. Alternativa A refere-se à ejeção de elétrons em metais; C refere-se à dissipação de calor em resistores elétricos; D refere-se à mudança aparente de frequência ondulatória; E é método diagnóstico nuclear."],"Osmose celular em meios isotônico, hipotônico e hipertônico":["A osmose através das membranas plasmáticas biológicas é um fenômeno vital governado pelas leis das propriedades coligativas: a água (solvente) move-se espontaneamente do meio hipotônico (menor concentração de solutos, menor pressão osmótica) para o meio hipertônico (maior concentração de solutos, maior pressão osmótica). Em relação ao comportamento de células animais desprovidas de parede celular rígida (como os glóbulos vermelhos/hemácias humanas, cujo citoplasma possui osmolaridade correspondente à solução fisiológica de NaCl a 0,9% m/v): 1) Meio isotônico (mesma pressão osmótica, ex: soro fisiológico a 0,9%): o fluxo de entrada e saída de água é equilibrado, e as hemácias mantêm seu volume e formato normais; 2) Meio hipertônico (ex: solução salina a 5% ou água do mar): a água sai da célula por osmose em direção ao meio mais concentrado; a célula desidrata-se, murcha e sofre 'crenação'; 3) Meio hipotônico (ex: água destilada pura): a água entra intensamente na célula por osmose; a hemácia incha até que a pressão interna rompe sua delicada membrana plasmática, sofrendo lise osmótica ('hemólise'). Em vegetais, a parede celulósica impede a lise, mantendo a célula túrgida.",["Meio isotônico: mesma pressão osmótica (ex: soro fisiológico NaCl 0,9%) → célula normal","Meio hipertônico: meio externo mais concentrado → célula perde água e murcha (crenação/plasmólise)","Meio hipotônico: meio externo menos concentrado → água entra na célula (incha e sofre lise/hemólise)","Soro fisiológico na veia: DEVE ser isotônico (0,9% NaCl) para não destruir as hemácias do sangue","Preservação de alimentos: charque e geleias usam muito sal ou açúcar (meio hipertônico que desidrata bactérias)"],"Cuidado no ENEM: injetar água destilada pura na veia de um paciente é FATAL! Como a água é hipotônica em relação ao sangue, ela entra nas hemácias até fazê-las explodir (hemólise).","Em hospitais e unidades de pronto atendimento, pacientes desidratados recebem infusão intravenosa direta de soro fisiológico comercial (solução aquosa estéril de cloreto de sódio a 0,9% m/v) e nunca de água destilada pura.","A exigência de que o soro administrado seja rigorosamente isotônico em relação ao plasma sanguíneo decorre do risco de que a infusão de água destilada (meio fortemente hipotônico) provocaria:",["a rápida saída de água das hemácias, fazendo-as murchar por crenação celular.","a precipitação instantânea de cloreto de cálcio sólido nas válvulas cardíacas.","a entrada contínua de água nas hemácias por osmose, provocando inchaço e ruptura celular por hemólise.","o aumento drástico da pressão atmosférica no interior dos capilares pulmonares.","a polimerização imediata da hemoglobina em cadeias insolúveis de colágeno."],2,"Resolução: As células do sangue (hemácias) estão delimitadas por uma membrana plasmática semipermeável e encontram-se em equilíbrio osmótico com o plasma sanguíneo, que possui uma concentração osmolar equivalente à de uma solução de NaCl a 0,9% (solução isotônica). Se fosse infundida água destilada pura na corrente sanguínea, o plasma se tornaria um meio intensamente hipotônico em relação ao meio intracelular das hemácias (hipertônico). Pela osmose, haveria um influxo massivo e incontrolável de moléculas de água para o interior das células vermelhas. Como a célula animal não dispõe de parede celular rígida para conter a turgidez, o volume interno aumentaria até exceder o limite de elasticidade da membrana, culminando no rompimento das hemácias (hemólise osmótica), com consequente liberação de hemoglobina livre no plasma e falência renal aguda. Alternativa A descreveria o efeito de meio hipertônico; C, D e E formulam hipóteses absurdas."],"Massa molar, mol e constante de Avogadro":["O mol é a unidade do Sistema Internacional para a quantidade de matéria e contém exatamente 6,02 × 10²³ entidades elementares (átomos, moléculas ou íons), valor conhecido como constante de Avogadro (N_A). A massa molar (M ou MM), expressa em g/mol, é numericamente igual à massa atômica ou molecular dada em unidades de massa atômica (u). Assim, a água (H₂O) tem massa molecular de 18 u e massa molar de 18 g/mol, o que significa que 18 g de água contêm exatamente 6,02 × 10²³ moléculas e 1,204 × 10²⁴ átomos de hidrogênio. A relação entre massa e número de mols é dada por n = m / MM.",["Constante de Avogadro: N_A = 6,02 × 10²³ entidades/mol","Quantidade de matéria: n = m / MM (mol = massa ÷ massa molar)","Número de partículas: N = n · N_A","Massa molar (g/mol): numericamente igual à massa molecular (u)"],"Não confunda: mol mede quantidade de matéria (número de entidades agrupadas), não mede massa nem volume. 1 mol de qualquer gás na CNTP ocupa 22,4 L, mas massas diferentes!","A glicose (C₆H₁₂O₆, massa molar = 180 g/mol) é o principal monossacarídeo que fornece energia imediata para o metabolismo celular através da respiração aeróbia. Um atleta consumiu um sachê de gel energético contendo exatamente 90 g de glicose pura.","Considerando a constante de Avogadro como 6,0 × 10²³ partículas/mol, qual é o número aproximado de moléculas de glicose ingeridas pelo atleta?",["1,5 × 10²³ moléculas","9,0 × 10²³ moléculas","6,0 × 10²³ moléculas","3,0 × 10²³ moléculas","1,8 × 10²⁴ moléculas"],3,"Número de mols de glicose ingeridos: n = m / MM = 90 g / (180 g/mol) = 0,50 mol. Como cada 1 mol contém 6,0 × 10²³ moléculas: Número de moléculas = n × N_A = 0,50 mol × 6,0 × 10²³ moléculas/mol = 3,0 × 10²³ moléculas de glicose. Alternativa A divide por 4; C supõe 1 mol inteiro (180 g); D multiplica 90 por 10²² sem dividir pela massa molar; E multiplica 180 por 10²²."],"Fórmulas mínima e molecular":["A fórmula molecular indica o número real de átomos de cada elemento presentes em uma molécula da substância (ex: glicose = C₆H₁₂O₆). A fórmula mínima (ou empírica) expressa a menor proporção inteira entre esses átomos (para a glicose: CH₂O). A fórmula percentual centesimal indica a porcentagem em massa de cada elemento químico no composto. A relação entre as massas molares da fórmula molecular e da fórmula mínima fornece o fator multiplicador inteiro k: MM_molecular = k · MM_mínima, donde (fórmula mínima)ₖ = fórmula molecular.",["Fórmula mínima: menor proporção inteira de átomos","Fórmula molecular = (Fórmula mínima)ₖ","Fator k = MM_molecular / MM_mínima","Cálculo: % de cada elemento ÷ massa atômica → divide pelo menor valor"],"Passo a passo no ENEM: suponha 100 g da amostra, converta as porcentagens em gramas, divida cada massa pela respectiva massa atômica para achar os mols e divida todos pelo menor valor encontrado para achar a proporção inteira!","A combustão completa de uma amostra de um hidrocarboneto gasoso puro em laboratório de análise orgânica revelou que o composto é constituído por 80% de carbono (C) e 20% de hidrogênio (H) em massa. Em um experimento complementar de densidade gasosa, determinou-se que a massa molar do composto é de 30 g/mol. (Massas atômicas: C = 12 g/mol; H = 1 g/mol).","A fórmula mínima e a fórmula molecular desse hidrocarboneto são, respectivamente:",["CH₂ e C₂H₄ (eteno).","CH₄ e CH₄ (metano).","C₃H₈ e C₃H₈ (propano).","C₂H₅ e C₄H₁₀ (butano).","CH₃ e C₂H₆ (etano)."],4,"Em 100 g do composto temos 80 g de C e 20 g de H. Quantidade de matéria: n(C) = 80 / 12 = 6,67 mol; n(H) = 20 / 1 = 20 mol. Dividindo pelo menor valor (6,67): C = 6,67 / 6,67 = 1; H = 20 / 6,67 = 3. Logo, a fórmula mínima é CH₃ (massa molar da fórmula mínima = 12 + 3·1 = 15 g/mol). Fator multiplicador k = MM_molecular / MM_mínima = 30 / 15 = 2. Fórmula molecular = (CH₃)₂ = C₂H₆ (etano). Alternativa A corresponde a 85,7% de C (CH₂); B é o metano (75% C); D teria fórmula molecular C₄H₁₀ com MM = 58 g/mol; E teria MM = 44 g/mol."],"Balanceamento de equações químicas":["O balanceamento de equações químicas fundamenta-se na Lei de Conservação das Massas (Lei de Lavoisier: 'na natureza nada se cria, nada se perde, tudo se transforma') e na Lei das Proporções Definidas (Proust). O número total de átomos de cada elemento deve ser rigorosamente igual nos reagentes (primeiro membro) e nos produtos (segundo membro). Os coeficientes estequiométricos são números inteiros e positivos que multiplicam as fórmulas químicas inteiras, sem nunca alterar os índices numéricos das substâncias. Um método prático para reações orgânicas e inorgânicas simples é a regra do MACHO: balancear primeiro Metais, depois Ametais, Carbonos, Hidrogênios e, por último, Oxigênios.",["Lei de Lavoisier: massa dos reagentes = massa dos produtos","Coeficientes estequiométricos: multiplicam o número de mols de cada substância","Regra prática MACHO: Metal → Ametal → Carbono → Hidrogênio → Oxigênio","Nunca altere os índices atômicos das fórmulas (ex: O₂ nunca vira O₃ no balanceamento!)"],"Cuidado no ENEM: sempre confira se a equação dada na questão já está balanceada! Se não estiver, balanceie antes de fazer qualquer cálculo de massa, mol ou volume.","O gás liquefeito de petróleo (GLP) utilizado em residências contém como componente majoritário o propano (C₃H₈). A equação química não balanceada da combustão completa do propano com oxigênio atmosférico gerando gás carbônico e vapor de água é expressa por: \nC₃H₈(g) + O₂(g) → CO₂(g) + H₂O(g).","Efetuando o balanceamento estequiométrico correto com os menores coeficientes inteiros possíveis, qual é a soma de todos os coeficientes dos reagentes e produtos dessa equação?",["13","12","15","10","18"],0,"Seguindo a regra de balanceamento para o C₃H₈: (1) Carbono: há 3 carbonos no reagente, logo colocamos 3 na frente do CO₂ → 3 CO₂. (2) Hidrogênio: há 8 hidrogênios no propano, logo colocamos 4 na frente da H₂O (4 × 2 = 8) → 4 H₂O. (3) Oxigênio: nos produtos temos (3 × 2) + (4 × 1) = 6 + 4 = 10 átomos de oxigênio. Para igualar nos reagentes, colocamos 5 O₂ (5 × 2 = 10). A equação balanceada fica: 1 C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O. A soma dos coeficientes inteiros é: 1 + 5 + 3 + 4 = 13. Alternativa D esquece o coeficiente 1 do propano e erra o O₂; B usa 4 O₂; D e E superestimam os coeficientes estequiométricos."],"Cálculo estequiométrico fundamental":["O cálculo estequiométrico permite determinar teoricamente as quantidades de reagentes consumidos ou produtos formados a partir de proporções fixadas pela equação química balanceada. As relações estequiométricas podem ser calculadas em quantidade de matéria (mols), massa (gramas), volume de gases ou número de moléculas. O roteiro padrão de resolução consiste em: 1) Escrever a equação química balanceada; 2) Identificar a proporção em mols entre a substância dada e a pedida; 3) Converter os mols nas unidades exigidas pelo problema (usando massas molares ou volume molar gasoso); 4) Montar a regra de três e resolver.",["Roteiro: Equação balanceada → Relação em mols → Conversão de unidades → Regra de três","Proporção estequiométrica: dada pelos coeficientes da reação","Massa molar do CO₂ = 44 g/mol; do H₂O = 18 g/mol; do C₂H₆O = 46 g/mol","Volume molar nas CNTP (0 °C e 1 atm): 22,4 L/mol"],"Confira sempre o que o enunciado pede: massa (g), volume (L) ou quantidade de matéria (mol)? Uma resposta calculada em gramas quando foi pedida em mols é um distrator comum.","O bioetanol (C₂H₆O, massa molar = 46 g/mol) é um biocombustível renovável amplamente utilizado na frota de veículos flex no Brasil. Sua combustão completa ocorre de acordo com a equação química balanceada: \nC₂H₆O(l) + 3 O₂(g) → 2 CO₂(g) + 3 H₂O(g). \n(Dados: massas molares: C = 12 g/mol; O = 16 g/mol; H = 1 g/mol; CO₂ = 44 g/mol).","Qual a massa de gás carbônico (CO₂) liberada na queima completa de 92 g de bioetanol puro?",["88 g","176 g","44 g","132 g","264 g"],1,"Cálculo estequiométrico passo a passo: 1 mol de C₂H₆O (46 g) reage produzindo 2 mols de CO₂ (2 × 44 g = 88 g de CO₂). Como a massa de etanol queimada é 92 g (ou seja, 92 / 46 = 2,0 mols de etanol), a quantidade de CO₂ produzida dobra proporcionalmente: 2,0 mols de C₂H₆O produzem 4,0 mols de CO₂. Massa de CO₂ = 4,0 mol × 44 g/mol = 176 g. Alternativa A (88 g) é a massa gerada por apenas 1 mol de etanol (46 g); C (44 g) é a massa molar de 1 mol de CO₂; D (132 g) corresponderia a 3 mols de CO₂; E resulta de multiplicar por fator 3 indevido."],"Reagente limitante e reagente em excesso":["Quando reagentes são misturados em proporções diferentes daquelas estabelecidas pelos coeficientes da equação química balanceada, um deles se esgotará primeiro, parando a reação: este é o reagente limitante. O outro reagente que sobra sem reagir é o reagente em excesso. Todos os cálculos de rendimento teórico e quantidade de produtos formados devem ser obrigatoriamente baseados na quantidade do reagente limitante. Para identificar o limitante: divide-se o número de mols disponível de cada reagente pelo seu respectivo coeficiente estequiométrico na equação balanceada; o menor quociente aponta o reagente limitante.",["Reagente limitante: consumido totalmente, determina a quantidade de produto","Reagente em excesso: sobra parte sem reagir após o fim da reação","Identificação: n_disponível / coeficiente estequiométrico (o menor é o limitante)","Cálculo de produtos: SEMPRE feito a partir do limitante!"],"Jamais calcule produtos a partir do reagente em excesso! Calcule primeiro quantos mols você tem de cada reagente e descubra quem acaba primeiro.","No processo Haber-Bosch de síntese industrial da amônia, misturam-se gás nitrogênio e gás hidrogênio em reator catalítico pressurizado conforme a equação: \nN₂(g) + 3 H₂(g) → 2 NH₃(g). \n(Massas molares: N₂ = 28 g/mol; H₂ = 2 g/mol; NH₃ = 17 g/mol). \nEm um reator de bancada, foram introduzidos exatamente 2,0 mols de N₂(g) e 3,0 mols de H₂(g).","Considerando consumo total do reagente que limita a reação, qual é o reagente limitante e a massa máxima de amônia (NH₃) produzida, respectivamente?",["N₂ é o limitante; produz 34 g de NH₃.","N₂ é o limitante; produz 68 g de NH₃.","H₂ é o limitante; produz 34 g de NH₃.","H₂ é o limitante; produz 68 g de NH₃.","Ambos reagem totalmente em proporção equimolar sem sobras; produz 51 g de NH₃."],2,"Pela equação balanceada: 1 mol de N₂ necessita de 3 mols de H₂ para reagir totalmente. Temos disponíveis 2,0 mols de N₂ e 3,0 mols de H₂. Como 3,0 mols de H₂ requerem apenas 1,0 mol de N₂, os 3,0 mols de H₂ serão integralmente consumidos enquanto restará 1,0 mol de N₂ em excesso. Portanto, o hidrogênio (H₂) é o reagente limitante. A quantidade de amônia formada depende estequiometricamente do H₂: 3 mols de H₂ produzem 2 mols de NH₃. Como tínhamos exatamente 3,0 mols de H₂, formam-se 2,0 mols de NH₃. Massa de NH₃ = 2,0 mol × 17 g/mol = 34 g. Alternativa B supõe N₂ como limitante; C identifica o limitante errado; D erra o cálculo da massa de produto; E ignora a estequiometria 1:3 da reação."],"Rendimento e pureza em reações químicas":["Na indústria e em laboratório, reações raramente ocorrem com reagentes 100% puros e rendimento de 100%. A pureza (p) indica a fração da massa total de uma matéria-prima que corresponde à substância de interesse: m_pura = p · m_amostra (as impurezas não reagem gerando o produto desejado). O rendimento (R) expressa a porcentagem do produto obtido experimentalmente em relação ao rendimento teórico máximo previsto pela estequiometria: R = (quantidade real / quantidade teórica) · 100%. Para resolver problemas com pureza e rendimento: aplica-se a pureza logo no início sobre o reagente e aplica-se o rendimento no final sobre o produto previsto.",["Grau de pureza: % de substância pura na matéria-prima inicial","Rendimento: % de produto efetivamente obtido em relação ao teórico","Roteiro: Massa bruta → aplica % pureza → estequiometria teórica → aplica % rendimento","Perdas de rendimento: reações paralelas, equilíbrio químico incompleto, perdas mecânicas"],"Dica do ENEM: impureza você desconta do reagente NO INÍCIO; rendimento você desconta do produto NO FIM!","A cal virgem ou cal viva (óxido de cálcio, CaO, 56 g/mol) é obtida industrialmente pela decomposição térmica (calcinação) do carbonato de cálcio (CaCO₃, 100 g/mol) presente no calcário mineral: \nCaCO₃(s) → CaO(s) + CO₂(g). \nUma indústria de cimento submeteu à calcinação 100 kg de uma amostra de calcário que possui 80% de pureza em CaCO₃. No final do processo, constatou-se que o rendimento real da reação foi de 90%.","Qual a massa real de óxido de cálcio (CaO) obtida nesse lote industrial?",["56,0 kg","50,4 kg","44,8 kg","40,32 kg","36,28 kg"],3,"Resolução com pureza e rendimento: 1) Massa de reagente puro: em 100 kg de calcário a 80% de pureza, m(CaCO₃ puro) = 0,80 × 100 kg = 80 kg. 2) Rendimento teórico: 100 g de CaCO₃ produzem 56 g de CaO. Logo, 80 kg de CaCO₃ puro produziriam teoricamente: m_teórica(CaO) = 80 kg × (56 / 100) = 44,8 kg de CaO. 3) Rendimento real de 90%: m_real(CaO) = 44,8 kg × 0,90 = 40,32 kg. Alternativa A supõe calcário 100% puro e 100% de rendimento (56 kg); B aplica apenas o rendimento sobre 56 kg (50,4 kg); C é o rendimento teórico com a pureza mas sem aplicar o rendimento de 90% (44,8 kg); E aplica pureza ao quadrado."],"Gases, equação de Clapeyron e misturas gasosas":["Os gases ideais obedecem à Equação de Estado de Clapeyron: P · V = n · R · T, onde P é a pressão absoluta, V o volume, n o número de mols, T a temperatura absoluta em kelvin (K = °C + 273) e R a constante universal dos gases (0,082 atm·L/(mol·K) ou 8,314 J/(mol·K)). Nas Condições Normais de Temperatura e Pressão (CNTP: 0 °C = 273 K e 1 atm), o volume molar de qualquer gás ideal é de aproximadamente 22,4 L/mol. Pela Lei de Dalton das pressões parciais, a pressão total de uma mistura gasosa é a soma das pressões parciais de seus constituintes: P_total = P_A + P_B + ..., e a pressão parcial de um gás é proporcional à sua fração molar: P_A = X_A · P_total.",["Equação de Clapeyron: P · V = n · R · T","Temperatura absoluta: T(K) = T(°C) + 273","Volume molar na CNTP (0 °C, 1 atm) = 22,4 L/mol","Constante universal: R = 0,082 atm·L/(mol·K)","Pressão parcial de Dalton: P_i = X_i · P_total (onde X_i = n_i / n_total)"],"Cuidado crucial: temperatura de gás NUNCA pode ser inserida em graus Celsius na fórmula PV = nRT! Converta sempre para Kelvin somando 273.","Airbags automotivos são dispositivos de segurança inflados instantaneamente em colisões pelo gás nitrogênio (N₂) liberado pela decomposição química ultrarrápida da azida de sódio (NaN₃): \n2 NaN₃(s) → 2 Na(s) + 3 N₂(g). \n(Dados: R = 0,082 atm·L/(mol·K); T = 27 °C = 300 K; P = 1,0 atm). \nEm um teste de segurança veicular, a reação produziu exatamente 2,0 mols de gás nitrogênio.","Qual o volume ocupado pelo gás nitrogênio dentro do airbag a 27 °C e 1,0 atm de pressão?",["22,4 L","24,6 L","67,2 L","44,8 L","49,2 L"],4,"Aplicando a equação de Clapeyron dos gases ideais: P · V = n · R · T. Dados: P = 1,0 atm; n = 2,0 mol; R = 0,082 atm·L/(mol·K); T = 27 + 273 = 300 K. Substituindo os valores: 1,0 · V = 2,0 × 0,082 × 300 → V = 2,0 × 24,6 = 49,2 L. Alternativa A usa o volume molar na CNTP para 1 mol (22,4 L); B é o volume de apenas 1 mol a 27 °C (24,6 L); C é o volume de 2 mols na CNTP (2 × 22,4 = 44,8 L), que desconsidera que a temperatura é de 27 °C (300 K); E é o volume de 3 mols na CNTP."],"Leis ponderais e volumétricas (Lavoisier, Proust e Gay-Lussac)":["As leis ponderais e volumétricas constituem as bases empíricas sobre as quais se ergueu a química moderna quantitativa: 1) Lei da Conservação da Massa (Antoine Lavoisier, 1789): 'Em um sistema fechado, a massa total antes da reação é rigorosamente igual à massa total após a reação' (a massa dos reagentes consumidos é igual à massa dos produtos formados); 2) Lei das Proporções Definidas (Joseph Louis Proust, 1799): 'Uma determinada substância química pura é sempre constituída pelos mesmos elementos combinados exatamente na mesma proporção em massa, independentemente de sua origem ou processo de obtenção' (se duplicar a massa de um reagente, a massa de todos os outros reagentes e produtos duplicará proporcionalmente); 3) Lei Volumétrica das Combinações Gasosas (Gay-Lussac, 1808): 'Nas mesmas condições de temperatura e pressão, os volumes de gases que reagem e que são produzidos em uma reação química mantêm entre si uma proporção de números inteiros e pequenos'. A Hipótese de Avogadro explicou Gay-Lussac: volumes iguais de gases quaisquer, nas mesmas condições de T e P, contêm o mesmo número de moléculas.",["Lei de Lavoisier: Σ massas dos reagentes = Σ massas dos produtos (em sistema fechado!)","Lei de Proust: proporção fixa e constante entre as massas dos reagentes e produtos","Lei de Gay-Lussac: proporção volumétrica inteira entre gases sob mesma T e P","Hipótese de Avogadro: V é proporcional a n (volumes iguais contêm o mesmo número de moléculas)","Na queima da palha de aço (bombril) ao ar livre, a massa final AUMENTA porque o oxigênio do ar se incorporou ao ferro formando Fe₂O₃"],"Clássica do ENEM: se você queimar palha de aço em balança aberta, a massa AUMENTA (porque o O₂ do ar entra no óxido); se queimar carvão ou vela em balança aberta, a massa DIMINUI (porque CO₂ e H₂O gasosos fogem para o ar). Mas em frasco fechado, a massa NÃO MUDA em nenhum dos casos (Lavoisier)!","Em um experimento histórico de aula, um professor colocou um chumaço de palha de aço (ferro metálico puro) sobre o prato de uma balança analítica aberta ao ar e ateou fogo. Ao término da queima completa, os estudantes constataram com surpresa que a balança marcava uma massa final superior à massa inicial do chumaço de aço.","A elevação da massa registrada na balança após a combustão da palha de aço em sistema aberto é explicada pelo fato de que:",["o ferro metálico reagiu com o gás oxigênio do ar incorporando átomos de oxigênio em sua estrutura na forma de óxido de ferro sólido.","a Lei de Lavoisier é inválida para reações químicas que envolvem metais de transição.","a queima do metal destruiu o campo gravitacional local reduzindo o empuxo do ar.","o nitrogênio atmosférico se fundiu nuclearmente com o ferro gerando novos nêutrons pesados.","a palha de aço absorveu umidade ambiente transformando-se em hidrogênio gasoso denso."],0,"Resolução: A reação química que ocorre na queima da palha de aço é a oxidação rápida do ferro metálico pelo gás oxigênio presente no ar atmosférico, produzindo óxidos de ferro sólidos (predominantemente óxido férrico ou magnetita): 4 Fe(s) + 3 O₂(g) → 2 Fe₂O₃(s). Como o experimento foi realizado em um recipiente aberto sobre a balança, a massa inicial pesava unicamente o ferro metálico sólido (Fe). Durante a combustão, átomos de oxigênio do ar atmosférico circundante ligaram-se quimicamente aos átomos de ferro, passando a integrar o sólido depositado sobre o prato. Portanto, a massa final do sólido (Fe₂O₃) é a soma da massa do ferro original com a massa do oxigênio atmosférico incorporado, resultando em um valor numericamente maior na balança. Em um recipiente fechado e lacrado, a massa total do sistema permaneceria estritamente constante, confirmando a Lei de Lavoisier. Alternativa B nega a lei de conservação; C, D e E trazem hipóteses contrárias às leis da física e da química."],"Densidade dos gases e efusão de Graham":["A densidade absoluta de um gás ideal (d) pode ser deduzida diretamente a partir da Equação de Clapeyron (PV = nRT = (m/MM)RT): d = m / V = (P · MM) / (R · T). Isso demonstra que, a uma mesma temperatura e pressão, a densidade de um gás é DIRETAMENTE PROPORCIONAL à sua massa molar (MM). O ar atmosférico seco é uma mistura gasosa com massa molar média aparente de aproximadamente 28,96 g/mol (~29 g/mol, composta por ~78% de N₂ com MM = 28 g/mol e ~21% de O₂ com MM = 32 g/mol). Gases com massa molar inferior a 29 g/mol (como H₂ = 2 g/mol, He = 4 g/mol, CH₄ = 16 g/mol, NH₃ = 17 g/mol e CO = 28 g/mol) são MENOS DENSOS que o ar e tendem a subir na atmosfera (por isso balões de hélio sobem e vazamentos de metano acumulam-se no teto); gases com massa molar superior a 29 g/mol (como CO₂ = 44 g/mol, C₃H₈ = 44 g/mol, Cl₂ = 71 g/mol) são MAIS DENSOS que o ar e descem acumulando-se no piso. Pela Lei de Graham da efusão e difusão gasosa, a velocidade de escape de um gás por um orifício microscópico é inversamente proporcional à raiz quadrada de sua massa molar: v₁ / v₂ = √(MM₂ / MM₁).",["Densidade de gás ideal: d = (P · MM) / (R · T)","Massa molar aparente do ar atmosférico ≈ 29 g/mol","Gás sobe no ar se MM < 29 g/mol (ex: He = 4, CH₄ = 16)","Gás desce e acumula no chão se MM > 29 g/mol (ex: GLP/propano = 44, CO₂ = 44)","Lei de Graham: gases mais leves (menor massa molar) difundem-se e escapam MAIS RÁPIDO!"],"Dica essencial de segurança no ENEM: o metano (gás natural, CH₄ = 16 g/mol) é mais leve que o ar e sobe; já o GLP (botijão de gás, propano/butano ~44 a 58 g/mol) é mais pesado que o ar e acumula no chão e ralos!","Em um evento comemorativo, duas bexigas de borracha idênticas e de mesmo volume foram infladas sob a mesma pressão e temperatura: a bexiga 1 foi preenchida com gás hélio (He, massa molar = 4 g/mol) e a bexiga 2 foi preenchida com gás carbônico (CO₂, massa molar = 44 g/mol). Considere a massa molar média do ar atmosférico igual a 29 g/mol.","Ao soltar as duas bexigas no interior de uma sala fechada e observar o comportamento nas horas seguintes, constata-se que:",["ambas as bexigas caem imediatamente no chão com a mesma aceleração da gravidade.","a bexiga 1 sobe em direção ao teto por ser menos densa que o ar, e ela murcha mais rápido que a bexiga 2 por apresentar maior taxa de efusão através dos microporos da borracha.","a bexiga 2 sobe para o teto porque o gás carbônico possui maior massa molar.","a bexiga 1 permanece congelada no ar em levitação magnética perpétua.","a bexiga 2 desce ao solo e se expande espontaneamente até explodir por combustão com o látex."],1,"Resolução: 1) Densidade e empuxo: a densidade de um gás sob mesma P e T é proporcional à sua massa molar [d = (P·MM)/(R·T)]. Como a massa molar do hélio (4 g/mol) é muito inferior à do ar atmosférico (29 g/mol), o gás hélio possui menor densidade que o ar circundante; pelo Princípio de Arquimedes, o empuxo do ar supera o peso do conjunto e a bexiga 1 sobe em direção ao teto. Já a bexiga 2 contém CO₂ (massa molar 44 g/mol > 29 g/mol), sendo mais densa que o ar e caindo imediatamente ao chão. 2) Efusão gasosa (Lei de Graham): a velocidade com que as moléculas de gás escapam pelos microporos da parede de borracha da bexiga (efusão) é inversamente proporcional à raiz quadrada de sua massa molar (v ∝ 1/√MM). Sendo as moléculas de hélio minúsculas e muito mais leves que as de CO₂, o hélio efunde muito mais rapidamente, fazendo a bexiga 1 murchar em poucas horas, enquanto a de CO₂ permanece inflada por muito mais tempo. Alternativas A, C, D e E contêm erros diretos de densidade e efusão."],"Estequiometria de reações sucessivas e em cadeia":["Em processos industriais e geoquímicos, produtos de uma reação química frequentemente atuam como reagentes da etapa subsequente em uma sequência de reações consecutivas (em cadeia). O exemplo clássico na indústria química pesada é a produção industrial do ácido sulfúrico (H₂SO₄) a partir do mineral pirita (dissulfeto de ferro, FeS₂) através do processo de contato, realizado em três etapas consecutivas: \n1) Tostação da pirita: 4 FeS₂(s) + 11 O₂(g) → 2 Fe₂O₃(s) + 8 SO₂(g) \n2) Oxidação catalítica do dióxido de enxofre: 2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g) \n3) Hidratação do trióxido de enxofre: SO₃(g) + H₂O(l) → H₂SO₄(l). \nPara efetuar o cálculo estequiométrico global sem calcular cada etapa isoladamente, ajustam-se os coeficientes estequiométricos das reações intermediárias de modo que as substâncias intermediárias (aqui SO₂ e SO₃) se cancelem mutuamente na soma das equações. Multiplicando a etapa 2 por 4 e a etapa 3 por 8, constata-se a relação estequiométrica fundamental: cada 4 mols de FeS₂ geram 8 mols de H₂SO₄, ou seja, 1 mol de FeS₂ produz teoricamente 2 mols de H₂SO₄.",["Reações sucessivas: o produto de uma reação é consumido como reagente da seguinte","Método de resolução: ajustar coeficientes para cancelar os intermediários e somar na equação global","Produção de ácido sulfúrico por pirita: 1 FeS₂ produz estequiometricamente 2 H₂SO₄","Massa molar: FeS₂ = 120 g/mol; H₂SO₄ = 98 g/mol","Atenção ao rendimento e pureza: aplicam-se sobre as proporções molares da reação global"],"Dica de ouro no ENEM: em reações em etapas, você NÃO precisa fazer três regras de três! Some as equações cancelando os intermediários e faça uma única regra de três direta entre a substância inicial e o produto final.","A indústria química produz fertilizantes fosfatados utilizando ácido sulfúrico (H₂SO₄, 98 g/mol) obtido pela queima e processamento de pirita de ferro (FeS₂, massa molar = 120 g/mol) através das três etapas sucessivas: \n• Etapa 1: 4 FeS₂ + 11 O₂ → 2 Fe₂O₃ + 8 SO₂ \n• Etapa 2: 2 SO₂ + O₂ → 2 SO₃ \n• Etapa 3: SO₃ + H₂O → H₂SO₄ \nConsidere rendimento global de 100% no processo.","Qual é a massa teórica de ácido sulfúrico (H₂SO₄) que pode ser produzida a partir da queima completa de 240 kg de pirita pura?",["98 kg","196 kg","392 kg","480 kg","588 kg"],2,"Resolução por equação global das reações sucessivas: \n1) Multiplicamos a Etapa 2 por 4: 8 SO₂ + 4 O₂ → 8 SO₃ \n2) Multiplicamos a Etapa 3 por 8: 8 SO₃ + 8 H₂O → 8 H₂SO₄ \n3) Somando as etapas 1, 2 e 3 ajustadas: \n4 FeS₂ + 15 O₂ + 8 H₂O → 2 Fe₂O₃ + 8 H₂SO₄. \nDividindo todos os coeficientes por 4 para simplificar a relação molar direta: \n1 FeS₂ ---------------------> 2 H₂SO₄ \n120 g de FeS₂ ------------> 2 × 98 g = 196 g de H₂SO₄. \nPara 240 kg de FeS₂ (o dobro de 120): \nmassa de H₂SO₄ = 2 × 196 kg = 392 kg de ácido sulfúrico. \nAlternativa A supõe proporção 1:1 com 120 kg de pirita; B é a massa produzida por 120 kg de pirita; D usa proporção direta de massas sem coeficientes; E multiplica por 3 indevidamente."],"Número de oxidação (NOX) e reações redox":["O número de oxidação (NOX) indica a carga real (em compostos iônicos) ou aparente (em compostos covalentes) de um átomo em uma espécie química. Em substâncias simples (como O₂, Fe, H₂), o NOX é sempre zero. Em íons monoatômicos, o NOX é a própria carga do íon (Na⁺ = +1, Al³⁺ = +3). Em espécies neutras, a soma dos NOX de todos os átomos é zero; em íons compostos, a soma é igual à carga do íon. Oxidação é a perda de elétrons (o NOX aumenta); a espécie que oxida é o agente redutor (provoca a redução do outro). Redução é o ganho de elétrons (o NOX diminui); a espécie que reduz é o agente oxidante (provoca a oxidação do outro).",["Oxidação: perda de elétrons (NOX aumenta)","Redução: ganho de elétrons (NOX diminui)","Agente redutor: a espécie que sofre oxidação","Agente oxidante: a espécie que sofre redução","Mnemônica: D-O-R (Dá elétron → Oxida → Redutor)"],"Cuidado no ENEM: o reagente INTEIRO é o agente! Se o Mn passa de +7 no KMnO₄ para +2, o agente oxidante é o KMnO₄ (a substância inteira), não apenas o átomo de manganês.","No teste do bafômetro clássico, o ar exalado pelo motorista passa por um tubo contendo dicromato de potássio (K₂Cr₂O₇, coloração alaranjada) em meio ácido. Se houver vapor de etanol (C₂H₆O), ocorre a oxidação do etanol a ácido etanoico (CH₃COOH) e a redução dos íons dicromato a íons cromo(III) (Cr³⁺), que possuem coloração verde-esmeralda: \n16 H⁺ + 2 Cr₂O₇²⁻ + 3 C₂H₆O → 4 Cr³⁺ + 3 C₂H₄O₂ + 11 H₂O.","Nessa reação de oxirredução, qual é o agente oxidante e qual a variação do número de oxidação do átomo de cromo, respectivamente?",["O etanol; variação de 0 para +4.","O íon hidrogênio (H⁺); variação de +1 para 0.","O íon cromo(III); variação de +2 para +3.","O íon dicromato (Cr₂O₇²⁻); variação de +6 para +3.","O ácido etanoico; variação de −2 para +2."],3,"Determinação do NOX do cromo no dicromato (Cr₂O₇²⁻): 2·(NOX_Cr) + 7·(−2) = −2 → 2·(NOX_Cr) − 14 = −2 → 2·(NOX_Cr) = +12 → NOX_Cr = +6. No produto, o cromo está como cátion monoatômico Cr³⁺, possuindo NOX = +3. Como o cromo teve seu NOX reduzido de +6 para +3 (ganhou elétrons), o íon dicromato (Cr₂O₇²⁻) sofreu redução, atuando portanto como o agente oxidante da reação. O etanol sofre oxidação e é o agente redutor. Alternativa A inverte os papéis de oxidante e redutor; C cita o produto como agente; D supõe reação do H⁺; E é o produto de oxidação."],"Pilhas eletroquímicas e potenciais-padrão":["Uma pilha eletroquímica (ou célula galvânica) é um dispositivo que converte energia química em energia elétrica de forma espontânea por meio de reações redox separadas em semi-células. O ânodo é o polo negativo, onde ocorre a oxidação (perda de elétrons) e corrosão da placa metálica. O cátodo é o polo positivo, onde ocorre a redução (ganho de elétrons) e deposição de massa metálica. Os elétrons fluem espontaneamente pelo circuito externo sempre do ânodo para o cátodo. A ponte salina contém uma solução eletrolítica e fecha o circuito interno permitindo a migração de íons para manter a neutralidade elétrica das soluções. A diferença de potencial padrão (d.d.p. ou força eletromotriz, ΔE°) é calculada por: ΔE° = E°_red(cátodo) − E°_red(ânodo).",["Ânodo: oxidação, polo negativo (−), perde elétrons, placa diminui","Cátodo: redução, polo positivo (+), ganha elétrons, placa aumenta","Mnemônica CRAO: Cátodo Reduz / Ânodo Oxida","Fluxo de elétrons no fio: Ânodo (−) → Cátodo (+)","d.d.p. padrão: ΔE° = E°_red(maior) − E°_red(menor) > 0"],"Mnemônica infalível do ENEM: vogal com vogal, consoante com consoante! Ânodo = Oxidação (vogais); Cátodo = Redução (consoantes).","O esquema abaixo representa a clássica Pilha de Daniell construída com eletrodos de zinco e cobre:\n  <div style=\"text-align:center;margin:12px 0;\">\n    <svg viewBox=\"0 0 340 140\" style=\"width:100%;max-width:340px;height:auto;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px;\">\n      <text x=\"10\" y=\"16\" fill=\"var(--mu)\" font-size=\"11\" font-family=\"sans-serif\">Esquema da Pilha de Daniell (Zn / Cu)</text>\n      <!-- Beaker 1 -->\n      <rect x=\"30\" y=\"45\" width=\"75\" height=\"70\" rx=\"3\" fill=\"none\" stroke=\"var(--tx)\" stroke-width=\"1.5\"/>\n      <rect x=\"55\" y=\"30\" width=\"16\" height=\"75\" fill=\"var(--mu)\"/>\n      <text x=\"35\" y=\"130\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">ZnSO₄(aq)</text>\n      <text x=\"50\" y=\"25\" fill=\"var(--tx)\" font-weight=\"bold\" font-size=\"11\" font-family=\"sans-serif\">Zn (−)</text>\n      <!-- Beaker 2 -->\n      <rect x=\"235\" y=\"45\" width=\"75\" height=\"70\" rx=\"3\" fill=\"none\" stroke=\"var(--tx)\" stroke-width=\"1.5\"/>\n      <rect x=\"265\" y=\"30\" width=\"16\" height=\"75\" fill=\"var(--M)\"/>\n      <text x=\"245\" y=\"130\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">CuSO₄(aq)</text>\n      <text x=\"260\" y=\"25\" fill=\"var(--tx)\" font-weight=\"bold\" font-size=\"11\" font-family=\"sans-serif\">Cu (+)</text>\n      <!-- Salt Bridge -->\n      <path d=\"M 85 60 L 85 45 L 255 45 L 255 60\" fill=\"none\" stroke=\"var(--am)\" stroke-width=\"8\"/>\n      <text x=\"135\" y=\"40\" fill=\"var(--am)\" font-size=\"10\" font-family=\"sans-serif\">Ponte Salina</text>\n      <!-- Wire -->\n      <path d=\"M 63 30 L 63 15 L 273 15 L 273 30\" fill=\"none\" stroke=\"var(--ac)\" stroke-width=\"2\"/>\n      <circle cx=\"168\" cy=\"15\" r=\"9\" fill=\"var(--cd)\" stroke=\"var(--ac)\" stroke-width=\"1.5\"/>\n      <text x=\"163\" y=\"19\" fill=\"var(--ac)\" font-weight=\"bold\" font-size=\"10\" font-family=\"sans-serif\">V</text>\n      <path d=\"M 100 10 L 125 10\" stroke=\"var(--er)\" stroke-width=\"2\" marker-end=\"url(#arr)\"/>\n      <text x=\"105\" y=\"8\" fill=\"var(--er)\" font-size=\"9\" font-family=\"sans-serif\">e⁻ →</text>\n    </svg>\n  </div>\n  Potenciais-padrão de redução: \nZn²⁺(aq) + 2 e⁻ ⇌ Zn(s)   E° = −0,76 V \nCu²⁺(aq) + 2 e⁻ ⇌ Cu(s)   E° = +0,34 V","Com base nos potenciais dados, durante o funcionamento espontâneo da pilha:",["o eletrodo de cobre é o ânodo e sofre perda contínua de massa.","os elétrons migram pelo circuito metálico do eletrodo de cobre para o eletrodo de zinco.","a ponte salina tem como função transportar elétrons livres entre as duas soluções aquosas.","a concentração de íons Zn²⁺ na solução aquosa diminui gradualmente.","a força eletromotriz padrão (d.d.p.) da pilha é de +1,10 V, ocorrendo redução do íon Cu²⁺ no cátodo."],4,"Comparando os potenciais-padrão de redução: o cobre possui maior potencial de redução (E° = +0,34 V > −0,76 V), portanto sofrerá redução espontânea na placa de cobre, que atua como cátodo (polo positivo): Cu²⁺ + 2 e⁻ → Cu(s) (ganho de massa). O zinco possui menor potencial de redução, logo sofrerá oxidação no ânodo (polo negativo): Zn(s) → Zn²⁺ + 2 e⁻. A d.d.p. padrão da célula é: ΔE° = E°_cátodo − E°_ânodo = +0,34 V − (−0,76 V) = +0,34 + 0,76 = +1,10 V. Alternativa A inverte os polos; B inverte o fluxo de elétrons (que vão do Zn para o Cu); D é falsa porque a oxidação do Zn produz Zn²⁺ aumentando sua concentração; E erra porque a ponte salina transporta íons, nunca elétrons livres."],"Espontaneidade e equação de Nernst qualitativa":["A espontaneidade de uma reação redox em condições termodinâmicas padrão está diretamente correlacionada à diferença de potencial: uma reação é espontânea se sua força eletromotriz padrão for positiva (ΔE° > 0), o que corresponde a uma variação negativa de energia livre de Gibbs (ΔG° = −n·F·ΔE° < 0). Pela equação de Nernst (E = E° − (0,059/n)·log Q), a d.d.p. de uma pilha depende das concentrações dos íons em solução: à medida que a pilha funciona e se aproxima do equilíbrio químico, a concentração de reagentes diminui e a de produtos aumenta (Q cresce), fazendo a d.d.p. real (E) decair até atingir zero no equilíbrio (pilha descarregada, E = 0). Metais com potencial de redução mais negativo têm maior facilidade de doar elétrons e deslocam metais de soluções cujos cátions tenham maior E°_red.",["Reação espontânea: ΔE° > 0 e ΔG° < 0","Equilíbrio da pilha (descarregada): E = 0 e ΔG = 0 (pilha não gera mais corrente)","Fator concentração: aumentar a concentração de reagentes eleva a d.d.p.","Deslocamento metálico: metal A reduz metal B se E°_ox(A) > E°_ox(B)"],"Cuidado no ENEM: pilha 'gasta' ou 'descarregada' é aquela cuja reação atingiu o EQUILÍBRIO químico, momento em que a d.d.p. real chega a ZERO (E = 0)!","Considere os potenciais-padrão de redução: \nMg²⁺ + 2 e⁻ ⇌ Mg(s)    E° = −2,37 V \nFe²⁺ + 2 e⁻ ⇌ Fe(s)    E° = −0,44 V \nAg⁺ + e⁻ ⇌ Ag(s)       E° = +0,80 V \nUm estudante mergulhou uma lâmina de ferro metálico polida em um béquer contendo solução aquosa de nitrato de prata (AgNO₃) e, em outro béquer, mergulhou outra lâmina de ferro em solução de sulfato de magnésio (MgSO₄).","O que se observa experimentalmente após algum tempo nesses dois experimentos?",["Ocorre reação espontânea apenas no béquer com nitrato de prata, com deposição de prata metálica sobre o ferro.","Não ocorre reação em nenhum dos béqueres, pois o ferro é um metal nobre quimicamente inerte.","Ocorre reação espontânea nos dois béqueres, com formação de magnésio e prata metálicos.","Ocorre reação espontânea apenas no béquer com sulfato de magnésio, com liberação de gás hidrogênio.","O ferro reduz o magnésio porque o potencial de redução do magnésio é mais positivo."],0,"Para que ocorra reação espontânea de oxirredução, o oxidante (cátion em solução) deve possuir potencial-padrão de redução MAIOR do que o redutor metálico. Comparando o ferro com a prata: E°_red(Ag⁺) = +0,80 V > E°_red(Fe²⁺) = −0,44 V. Portanto, os íons Ag⁺ têm maior tendência de ganhar elétrons do que o Fe²⁺: Fe(s) + 2 Ag⁺(aq) → Fe²⁺(aq) + 2 Ag(s), com ΔE° = +0,80 − (−0,44) = +1,24 V > 0 (espontâneo, havendo deposição de prata prateada sobre a lâmina de ferro). Já no caso do magnésio: E°_red(Mg²⁺) = −2,37 V < E°_red(Fe²⁺) = −0,44 V, donde ΔE° < 0 (não espontâneo; o ferro não reage com Mg²⁺). Alternativas A, B, D e E contêm erros conceituais diretos sobre a série de reatividade dos metais."],"Baterias recarregáveis e acumulador de chumbo":["Baterias recarregáveis (acumuladores secundários) operam de modo reversível: durante o fornecimento de energia (descarga), funcionam como pilhas galvânicas espontâneas (química → elétrica); durante a recarga, funcionam como células eletrolíticas não espontâneas alimentadas por fonte externa (elétrica → química), regenerando os reagentes originais. A bateria de chumbo-ácido de automóveis (12 V, formada por 6 células de 2 V em série) utiliza ânodo de chumbo esponjoso (Pb) e cátodo de dióxido de chumbo (PbO₂) imersos em solução de ácido sulfúrico (H₂SO₄). Na descarga, ambos os eletrodos convertem-se em sulfato de chumbo(II) insolúvel (PbSO₄) consumindo ácido sulfúrico (o que diminui a densidade da solução). Baterias de íons de lítio (Li-ion) dominam smartphones e carros elétricos por aliarem alta densidade energética, ausência de efeito memória e leveza.",["Descarga: pilha galvânica espontânea (química → elétrica)","Carga: eletrólise não espontânea forçada por fonte externa (elétrica → química)","Bateria de chumbo-ácido na descarga: Pb(s) + PbO₂(s) + 2 H₂SO₄ → 2 PbSO₄(s) + 2 H₂O","Densidade da solução na descarga: diminui (consome H₂SO₄ denso e gera H₂O)","Bateria Li-ion: intercalação reversível de íons Li⁺ entre grafite e óxido de cobalto"],"Mecânicos medem o 'estado de carga' da bateria de chumbo com um densímetro: bateria carregada tem solução densa (rica em H₂SO₄); descarregada tem solução menos densa (ácido consumido, virou água).","A reação global que ocorre no acumulador de chumbo-ácido durante a partida de um automóvel (processo de descarga) é representada pela equação: \nPb(s) + PbO₂(s) + 2 H₂SO₄(aq) → 2 PbSO₄(s) + 2 H₂O(l).","A respeito das transformações químicas e das propriedades do eletrólito durante a descarga da bateria, constata-se que:",["o chumbo metálico (Pb) atua como cátodo e sofre redução ao se converter em PbSO₄.","a densidade da solução eletrolítica diminui em razão do consumo de ácido sulfúrico e produção de água.","o dióxido de chumbo (PbO₂) atua como ânodo sofrendo oxidação com ganho de elétrons.","a concentração de íons sulfato e hidrônio aumenta significativamente na solução.","o processo de descarga é forçado eletroliticamente por um alternador externo de corrente."],1,"Durante a descarga, o ácido sulfúrico (H₂SO₄, substância líquida densa, d ≈ 1,28 g/mL) é continuamente consumido para precipitar PbSO₄ nos eletrodos, enquanto moléculas de água (H₂O, d = 1,00 g/mL) são produzidas. Consequentemente, a concentração de ácido diminui e a densidade da solução ácida cai progressivamente, servindo como indicador do nível de carga. Além disso, o Pb(s) tem NOX 0 e passa a +2 (oxidação no ânodo), enquanto o Pb no PbO₂ tem NOX +4 e passa a +2 (redução no cátodo). Alternativa A e C invertem os polos e NOX; D afirma o inverso da concentração; E confunde a descarga espontânea com a recarga forçada."],"Eletrólise ígnea e eletrólise aquosa":["A eletrólise é um processo eletroquímico não espontâneo no qual uma corrente elétrica contínua fornecida por um gerador externo força a ocorrência de uma reação de oxirredução (energia elétrica → energia química). Na eletrólise: o cátodo é o polo negativo (ocorre redução, atrai cátions) e o ânodo é o polo positivo (ocorre oxidação, atrai ânions). Na eletrólise ígnea, o composto iônico é fundido a altas temperaturas sem água (ex: NaCl fundido produz sódio metálico Na(s) no cátodo e gás cloro Cl₂(g) no ânodo). Na eletrólise aquosa, há competição entre os íons do soluto e os íons H⁺ e OH⁻ provenientes da autoionização da água. Facilidade de descarga no cátodo: metais nobres (Cu²⁺, Ag⁺) > H⁺ (da água) > metais comuns (Zn²⁺, Fe²⁺) > metais alcalinos e alcalinoterrosos (Na⁺, Ca²⁺, Al³⁺, que NÃO descarregam em água). Na descarga no ânodo: haletos (Cl⁻, Br⁻, I⁻) > OH⁻ (da água) > ânions oxigenados (SO₄²⁻, NO₃⁻, que NÃO descarregam em água).",["Cátodo na eletrólise: polo NEGATIVO (−), ocorre REDUÇÃO (atrai cátions)","Ânodo na eletrólise: polo POSITIVO (+), ocorre OXIDAÇÃO (atrai ânions)","Eletrólise ígnea: sal fundido sem solvente (obtém Na, Al, Mg metálicos)","Eletrólise aquosa de NaCl (salmoura): produz Cl₂(g) no ânodo, H₂(g) no cátodo e NaOH(aq)","Cátions de metais alcalinos (Na⁺, K⁺) NUNCA reduzem em água (o H₂O reduz gerando H₂)"],"Cuidado no ENEM: para obter sódio metálico (Naº) ou alumínio metálico (Alº), a eletrólise TEM que ser ÍGNEA (sem água)! Em água, é a água que reduz gerando gás H₂.","Na indústria cloro-álcali, a eletrólise aquosa de uma solução saturada de cloreto de sódio (salmoura: Na⁺, Cl⁻, H₂O) é um dos processos industriais de maior escala no mundo, gerando insumos fundamentais para a fabricação de PVC, desinfetantes e sabões.","Quais são os produtos gasosos liberados no ânodo e no cátodo dessa eletrólise aquosa, respectivamente?",["Gás oxigênio (O₂) e gás hidrogênio (H₂).","Gás hidrogênio (H₂) e gás cloro (Cl₂).","Gás cloro (Cl₂) e gás hidrogênio (H₂).","Gás cloro (Cl₂) e vapor de sódio metálico (Na).","Gás carbônico (CO₂) e gás metano (CH₄)."],2,"Na eletrólise aquosa de salmoura (NaCl + H₂O): 1) No ânodo (polo positivo), competem os ânions Cl⁻ e OH⁻ (da água). Pela fila de prioridade de descarga aniônica, os haletos têm maior facilidade de oxidação que a hidroxila: 2 Cl⁻ → Cl₂(g) + 2 e⁻ (libera gás cloro no ânodo). 2) No cátodo (polo negativo), competem os cátions Na⁺ e H⁺ (da água). O sódio é um metal alcalino de elevadíssima eletropositividade e baixíssimo potencial de redução (−2,71 V), de modo que a água descarrega preferencialmente: 2 H₂O + 2 e⁻ → H₂(g) + 2 OH⁻ (libera gás hidrogênio no cátodo). Na solução restante sobram íons Na⁺ e OH⁻ formando soda cáustica (NaOH). Alternativa A seria a eletrólise da água; C inverte os polos; D supõe descarga de Na⁺ em meio aquoso (o que é termodinamicamente impossível); E cita gases estranhos ao sistema."],"Leis de Faraday e estequiometria da eletrólise":["As leis de Michael Faraday regem os aspectos quantitativos da eletrólise. A carga elétrica total (Q, em coulombs) que atravessa a cuba eletrolítica é o produto da corrente elétrica (i, em amperes) pelo intervalo de tempo (t, em segundos): Q = i · t. A constante de Faraday (F ≈ 96 500 C/mol de elétrons) representa a carga elétrica contida em 1 mol de elétrons (N_A · e = 6,02 × 10²³ × 1,6 × 10⁻¹⁹ C). A massa de substância depositada ou liberada no eletrodo é diretamente proporcional à carga elétrica transferida e inversamente proporcional ao número de elétrons envolvidos na semi-reação: m = (MM · i · t) / (n · F), onde n é a valência (número de elétrons transferidos por átomo ou molécula).",["Carga elétrica: Q = i · t (Q em C, i em A, t em segundos!)","Constante de Faraday: 1 F = 96 500 C ≈ 1 mol de elétrons","Relação molar: n(e⁻) = Q / 96 500","Massa depositada: m = n(mol do metal) · MM","Conversão de tempo: 1 hora = 3 600 s; 1 minuto = 60 s"],"Atenção total ao tempo: se o enunciado der o tempo em minutos ou horas, CONVERTA SEMPRE PARA SEGUNDOS antes de fazer Q = i · t!","A galvanoplastia (niquelação, douração, prateação) é utilizada industrialmente para revestir peças metálicas com camadas finas de metais nobres, aumentando a resistência à corrosão e o brilho estético. Uma joalheria realizou a prateação eletrolítica de uma medalha metálica mergulhada em solução aquosa contendo íons prata (Ag⁺), de acordo com a semi-reação de redução no cátodo: \nAg⁺(aq) + e⁻ → Ag(s). \n(Dados: Massa molar da prata Ag = 108 g/mol; Constante de Faraday = 96 500 C/mol de elétrons). \nO circuito operou com corrente elétrica constante de 9,65 A durante exatamente 1 000 segundos.","Qual a massa de prata metálica depositada sobre a medalha ao final da operação?",["1,08 g","5,40 g","54,0 g","10,8 g","108 g"],3,"Cálculo eletroquímico por Faraday: 1) Carga elétrica total transferida: Q = i · t = 9,65 A × 1 000 s = 9 650 C. 2) Quantidade de matéria de elétrons transferidos: como 1 mol de elétrons equivale a 96 500 C, temos: n(e⁻) = 9 650 C / (96 500 C/mol) = 0,10 mol de elétrons. 3) Pela semi-reação, cada 1 mol de íons Ag⁺ necessita de 1 mol de elétrons para se reduzir a 1 mol de Ag metálica (proporção 1:1): n(Ag) = 0,10 mol. 4) Massa de prata depositada: m = n · MM = 0,10 mol × 108 g/mol = 10,8 g de prata. Alternativa A divide por 10; B divide por 2; D multiplica por 5; E supõe a passagem de 1 mol inteiro de elétrons (96 500 C)."],"Corrosão metálica e proteção catódica":["A corrosão é um processo de oxidação espontâneo e destrutivo sofrido pelos metais quando expostos ao ar atmosférico contendo oxigênio e umidade (água). No caso do ferro, forma-se a ferrugem (Fe₂O₃·nH₂O), um óxido poroso e quebradiço que não adere ao metal, permitindo que a oxidação avance até a destruição total da peça. Para combater a corrosão aplicam-se métodos como: recobrimento superficial (tintas, vernizes ou graxas), galvanização (revestimento com zinco metálico) e a proteção catódica (ou uso de ânodo de sacrifício). Na proteção catódica, conecta-se ao ferro uma placa de um metal que possua MAIOR potencial de oxidação (menor potencial de redução), como o magnésio (Mg) ou zinco (Zn). Esse metal mais reativo oxida preferencialmente no lugar do ferro, doando elétrons para a estrutura e mantendo o ferro como cátodo intacto.",["Ferrugem: Fe₂O₃·nH₂O (oxidação do ferro por O₂ e H₂O)","Fatores que aceleram corrosão: água, oxigênio, sais (eletrólitos como no mar), acidez","Proteção por barreira: pintura, polímeros, óleos isolantes","Ânodo de sacrifício: metal com E°_ox > E°_ox(Fe) ou E°_red < E°_red(Fe)","Metais de sacrifício típicos: Magnésio (Mg) e Zinco (Zn)"],"Cuidado no ENEM: o metal de sacrifício DEVE ter MENOR potencial de redução do que o ferro (como Mg ou Zn). Metais nobres como cobre (Cu) ou prata (Ag) ACELERAM a corrosão do ferro em vez de proteger!","Cascos de navios de aço, oleodutos subterrâneos de ferro e plataformas marítimas de petróleo ficam continuamente expostos à agressividade corrosiva da água e do solo. Para evitar a rápida deterioração do ferro estrutural, os engenheiros fixam blocos de magnésio ou zinco ao longo da estrutura de aço. \nPotenciais-padrão de redução: \nMg²⁺ + 2 e⁻ ⇌ Mg    E° = −2,37 V \nZn²⁺ + 2 e⁻ ⇌ Zn    E° = −0,76 V \nFe²⁺ + 2 e⁻ ⇌ Fe    E° = −0,44 V \nCu²⁺ + 2 e⁻ ⇌ Cu    E° = +0,34 V","O mecanismo eletroquímico pelo qual os blocos de magnésio impedem a corrosão do aço consiste no fato de que o magnésio:",["tem maior potencial de redução que o ferro, atraindo os íons oxigênio para sua superfície.","reage com os elétrons do ferro transformando o ferro em um metal nobre inoxidável.","forma uma camada de óxido de cobre sobre a estrutura que atua como barreira mecânica.","reduz a temperatura local da água do mar impedindo qualquer reação química de transferência eletrônica.","possui menor potencial de redução que o ferro, oxidando-se preferencialmente e fornecendo elétrons para a estrutura de ferro."],4,"O magnésio possui potencial de redução muito menor (E° = −2,37 V) do que o ferro (E° = −0,44 V), o que significa que o magnésio possui potencial de oxidação significativamente maior (+2,37 V contra +0,44 V). Em contato galvânico com o ferro em meio condutor (água do mar), o magnésio atua como ânodo de sacrifício: ele sofre oxidação espontânea preferencial (Mg → Mg²⁺ + 2 e⁻), enviando continuamente elétrons para a estrutura de ferro, que se comporta como cátodo da célula eletroquímica e fica preservada da corrosão. Alternativa A inverte os potenciais; C menciona cobre; D e E inventam fenômenos sem base científica."],"Pilha seca de Leclanché e pilhas alcalinas":["As pilhas primárias são dispositivos galvânicos de uso único que não admitem recarga, amplamente empregados em lanternas, relógios e controles remotos. A Pilha Seca de Leclanché tradicional utiliza um invólucro cilíndrico de zinco metálico que atua como ânodo (Zn → Zn²⁺ + 2 e⁻), um bastão central de grafite inerte que funciona como cátodo, e uma pasta úmida pastosa eletrolítica contendo cloreto de amônio (NH₄Cl), cloreto de zinco (ZnCl₂) e dióxido de manganês (MnO₂, que atua como despolarizante sofrendo redução: 2 MnO₂ + 2 NH₄⁺ + 2 e⁻ → Mn₂O₃ + 2 NH₃ + H₂O). A tensão nominal é de cerca de 1,5 V. Um inconveniente da pilha comum de Leclanché é a acidez do sal NH₄Cl (hidrólise ácida), que corrói lentamente o zinco mesmo sem uso, podendo vazar. Já a Pilha Alcalina é uma evolução tecnológica que substitui o NH₄Cl ácido pelo hidróxido de potássio (KOH), uma base forte que confere meio alcalino: a corrosão do ânodo de zinco é drasticamente reduzida, a resistência interna é menor e a pilha mantém corrente elétrica constante e durabilidade de 4 a 8 vezes superior à pilha comum.",["Pilha de Leclanché (comum): Ânodo de Zn, Cátodo de grafite, pasta com NH₄Cl (meio ácido)","Pilha alcalina: utiliza KOH (meio básico alcalino) no eletrólito","Vantagens da pilha alcalina: maior durabilidade (4 a 8x), menor corrosão do Zn, corrente mais estável","Ambas fornecem d.d.p. nominal de aproximadamente 1,5 V","Descarte ambiental: pilhas não devem ser jogadas em lixo comum para evitar contaminação por metais pesados"],"Cuidado no ENEM: pilha alcalina chama-se assim porque seu eletrólito é uma BASE FORTE (hidróxido de potássio KOH alcalino), e NÃO um sal ácido como na pilha comum!","Pilhas alcalinas e pilhas secas comuns de zinco-carbono (Leclanché) são comercializadas nos mesmos formatos cilíndricos (AA, AAA, C, D) e operam com a mesma força eletromotriz nominal de 1,5 V. Contudo, pilhas alcalinas apresentam durabilidade muito superior e menor propensão a vazamentos corrosivos durante o armazenamento.","A superioridade técnica e a maior durabilidade das pilhas alcalinas decorrem da substituição do eletrólito de cloreto de amônio por:",["hidróxido de potássio, gerando um meio alcalino básico que reduz significativamente a corrosão do invólucro de zinco e estabiliza a descarga.","ácido sulfúrico concentrado que oxida o grafite em alta velocidade.","gás hidrogênio pressurizado que atua como despolarizante radioativo.","cloreto de sódio sólido que bloqueia a passagem de elétrons no repouso.","óxido de mercúrio puro que impede o consumo de elétrons pelo cátodo."],0,"Resolução: Na pilha seca comum de Leclanché, o eletrólito é uma pasta contendo cloreto de amônio (NH₄Cl), um sal de ácido forte e base fraca cuja hidrólise gera íons H⁺, conferindo caráter ácido ao meio. Esse ambiente ácido corrói lentamente o invólucro de zinco metálico mesmo quando o aparelho está desligado, provocando perfurações no metal e vazamento de substâncias corrosivas. Na pilha alcalina, o cloreto de amônio é substituído por uma pasta contendo hidróxido de potássio (KOH), uma base forte muito solúvel. Em meio fortemente alcalino básico (pH > 14), o ânodo de zinco fica menos suscetível à corrosão espontânea por H⁺, a formação de gás hidrogênio polarizador é evitada e a condutividade iônica do eletrólito é consideravelmente superior, o que reduz a resistência interna da pilha e proporciona uma vida útil substancialmente mais longa. Alternativa B cita ácido sulfúrico (usado em baterias automotivas); C cita gás radioativo; D e E mencionam substâncias incongruentes."],"Células a combustível (hidrogênio e oxigênio)":["A célula a combustível (ou pilha a combustível) é um dispositivo eletroquímico galvânico que converte diretamente a energia química de um combustível e de um comburente em energia elétrica de forma contínua, enquanto os reagentes forem ininterruptamente fornecidos ao sistema. O modelo mais limpo e promissor para veículos e geração estacionária é a célula a combustível de hidrogênio e oxigênio (célula H₂/O₂). Nela, o gás hidrogênio (H₂) é alimentado continuamente no ânodo (onde sofre oxidação: 2 H₂ → 4 H⁺ + 4 e⁻), os elétrons percorrem o circuito externo gerando corrente útil, e os prótons H⁺ atravessam uma membrana polimérica condutora de prótons (membrana PEM). No cátodo, o gás oxigênio (O₂) é alimentado continuamente e sofre redução combinando-se com os prótons e elétrons: O₂ + 4 H⁺ + 4 e⁻ → 2 H₂O. A reação global é estritamente a síntese da água: 2 H₂(g) + O₂(g) → 2 H₂O(l) + eletricidade + calor. Apresenta rendimento termodinâmico excepcionalmente alto (~60 a 70%, muito superior aos motores de combustão interna limitados pelo Ciclo de Carnot) e impacto ambiental direto NULO, pois o único subproduto de exaustão é vapor de água pura.",["Célula a combustível H₂/O₂: conversão direta e contínua de química → elétrica","Ânodo: 2 H₂ → 4 H⁺ + 4 e⁻ (oxidação do combustível hidrogênio)","Cátodo: O₂ + 4 H⁺ + 4 e⁻ → 2 H₂O (redução do comburente oxigênio)","Reação global: 2 H₂(g) + O₂(g) → 2 H₂O(l)","Emissão poluente: ZERO! O único produto emitido no escapamento é ÁGUA PURA","Rendimento elevado: não sofre limitação de rendimento térmico do ciclo de Carnot"],"Cuidado no ENEM: o motor de célula a combustível NÃO queima o hidrogênio! Ocorre uma reação eletroquímica de oxirredução a frio que gera eletricidade e água pura como único resíduo.","Veículos modernos movidos a hidrogênio utilizam células a combustível de membrana trocadora de prótons (células PEM) em substituição aos tradicionais motores a combustão interna a gasolina.","Do ponto de vista da sustentabilidade ambiental e da eficiência energética, a grande vantagem da utilização da célula a combustível de hidrogênio e oxigênio é que:",["funciona como um motor a vapor tradicional que necessita queimar carvão para iniciar o ciclo.","emite exclusivamente vapor de água (H₂O) como produto de sua reação eletroquímica global e apresenta rendimento energético superior ao de motores térmicos.","converte o oxigênio atmosférico em monóxido de carbono gasoso facilmente decomponível.","dispensa qualquer circuito elétrico porque o veículo se movimenta puramente por empuxo de gases.","gera eletricidade através da fissão nuclear espontânea dos prótons do hidrogênio."],1,"Resolução: A célula a combustível opera como uma pilha de fluxo contínuo. No ânodo, o hidrogênio sofre oxidação gerando prótons e liberando elétrons livres para o motor elétrico veicular. No cátodo, o oxigênio do ar sofre redução unindo-se aos prótons e elétrons para formar água. A reação global do processo é: 2 H₂(g) + O₂(g) → 2 H₂O(l) + energia elétrica. Por ser um processo eletroquímico isotérmico direto, a célula a combustível não converte energia térmica em mecânica e, portanto, não é limitada pelo rendimento máximo do Ciclo de Carnot, alcançando eficiências de 60% a 70% (contra ~25% a 30% dos motores a combustão). Adicionalmente, por utilizar hidrogênio e oxigênio puros, o veículo tem emissão zero de dióxido de carbono (CO₂), fuligem, óxidos de enxofre ou óxidos de nitrogênio, saindo pelo escapamento apenas vapor de água potável. Alternativas A, C, D e E trazem formulações distorcidas ou absurdas."],"Anodização e galvanoplastia industrial":["A galvanoplastia e a anodização são processos industriais eletrolíticos fundamentais de tratamento superficial de metais: 1) Galvanoplastia (eletrodeposição metálica): utiliza uma cuba eletrolítica para recobrir a superfície de uma peça metálica com uma película delgada de outro metal de maior valor estético ou resistência à corrosão (como niquelação, cromagem, douração e prateação). A peça a ser revestida deve ser conectada obrigatoriamente como o CÁTODO da eletrólise (polo negativo, atraindo os cátions
