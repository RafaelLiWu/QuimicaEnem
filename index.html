<style>
:root{
  --bg:#F4F7FC;--cd:#FFFFFF;--tx:#132039;--mu:#5A6782;--ac:#1E56FF;--am:#E89A00;
  --hi:#E8EEFF;--ht:#1742C9;--ln:#D9E2F0;--gl:#E4EBF6;--A:#C92A2A;--M:#B45309;--B:#475569;
  --ok:#0F766E;--er:#BE123C;--lm:42%;--bt:#FFFFFF;--hd:rgba(244,247,252,.92);--sh:0 3px 0 var(--ln);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;--bg:#0A0F1D;--cd:#121A2C;--tx:#E5EDF9;--mu:#94A3B8;--ac:#688BFF;--am:#F59E0B;
    --hi:#1B274A;--ht:#BACBFF;--ln:#222F47;--gl:#101726;--A:#F87171;--M:#FBBF24;--B:#94A3B8;
    --ok:#2DD4BF;--er:#FB7185;--lm:64%;--bt:#0A0F1D;--hd:rgba(10,15,29,.92)
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0A0F1D;--cd:#121A2C;--tx:#E5EDF9;--mu:#94A3B8;--ac:#688BFF;--am:#F59E0B;
  --hi:#1B274A;--ht:#BACBFF;--ln:#222F47;--gl:#101726;--A:#F87171;--M:#FBBF24;--B:#94A3B8;
  --ok:#2DD4BF;--er:#FB7185;--lm:64%;--bt:#0A0F1D;--hd:rgba(10,15,29,.92)
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:var(--bg) linear-gradient(var(--gl) 1px,transparent 1px) 0 0/30px 30px;
  background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);
  background-size:30px 30px;
  color:var(--tx);
  font:15px/1.6 Figtree,system-ui,sans-serif;
  padding-bottom:100px
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:30}
h1,h2,h3,.lg,.bt,.bd,.nm,.rg b,.stat b,.ch{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
h1{font-size:clamp(25px,4.8vw,36px);line-height:1.15;margin:6px 0 10px;letter-spacing:-.02em}
h2{font-size:19px;margin:24px 0 10px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--hd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1.5px solid var(--ln)}
.lg{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}.lg em{font-style:normal;color:var(--ac)}.sp{flex:1}
.ib{border:1.5px solid var(--ln);background:var(--cd);border-radius:99px;padding:6px 13px;font-weight:600;font-size:13px;cursor:pointer;transition:transform .15s,border-color .2s}
.ib:hover{border-color:var(--ac)}.ib:active{transform:scale(.94)}
.w{max-width:1120px;margin:0 auto;padding:18px 16px}
.mu{color:var(--mu)}.k{font-size:13px;font-weight:600;color:var(--mu)}
.a{animation:up .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{50%{transform:scale(1.025)}}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:var(--cd);border:1.5px solid var(--ln);border-radius:20px;padding:22px;box-shadow:var(--sh)}
.hero p{margin:0 0 14px;color:var(--mu)}
.rg{position:relative;width:118px;height:118px;flex:none}.rg.big{width:150px;height:150px;margin:0 auto 10px}
.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.r0,.r1{fill:none;stroke-width:10}.r0{stroke:var(--ln)}.r1{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bt{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ac);background:var(--ac);color:var(--bt);border-radius:99px;padding:10px 18px;font-weight:700;font-size:13.5px;cursor:pointer;transition:transform .15s,box-shadow .2s}
.bt:hover{box-shadow:0 4px 0 var(--ht);transform:translateY(-2px)}.bt:active{transform:none;box-shadow:none}
.bt.gh{background:var(--cd);color:var(--tx);border-color:var(--ln)}.bt.gh:hover{border-color:var(--ac);box-shadow:0 4px 0 var(--ln)}
.srch input{width:100%;margin:16px 0 4px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--cd);color:var(--tx);font:inherit;transition:border-color .2s}
.srch input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.chs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.ch{border:1.5px solid var(--ln);background:var(--cd);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s;text-decoration:none}
.ch.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cd,.hu{--c:hsl(var(--h,210) 75% var(--lm))}
.cd{position:relative;background:var(--cd);border:1.5px solid var(--ln);border-radius:16px;padding:18px;cursor:pointer;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden}
.cd::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.cd:hover{transform:translate(-2px,-4px);border-color:var(--c);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 30%,var(--ln))}
.ci{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--c) 16%,transparent);margin-bottom:8px}.ci.big{width:64px;height:64px;font-size:32px;flex:none}
.cd h3{margin:8px 0 4px;font-size:17px}
.cd p{color:var(--mu);font-size:13.5px;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ft{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mu);margin-bottom:6px}
.pb{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}
.pb i{display:block;height:100%;width:0;border-radius:9px;background:var(--c,var(--ac));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bd{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.bd.A{--c:var(--A)}.bd.M{--c:var(--M)}.bd.B{--c:var(--B)}
.bc{font-size:13px;color:var(--mu);margin-bottom:6px}.bc a{color:var(--ac);font-weight:600}
.mh,.hd{display:flex;gap:16px;align-items:center;justify-content:space-between}.mh{justify-content:flex-start}.mh p{margin:8px 0 0;color:var(--mu)}
.rw{display:flex;align-items:center;gap:12px;background:var(--cd);border:1.5px solid var(--ln);padding:11px 14px;border-radius:14px;margin-bottom:9px;cursor:pointer;transition:transform .2s,border-color .2s}
.rw:hover{transform:translateX(5px);border-color:var(--ac)}
.rt{flex:1;font-weight:600;display:flex;flex-direction:column;line-height:1.3}.rt small{font-weight:400;color:var(--mu);font-size:12px}
.nm{width:30px;height:30px;border-radius:9px;background:var(--hi);color:var(--ht);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.rw em{color:var(--ok);font-style:normal;font-weight:800}
.fv{border:0;background:none;font-size:20px;color:var(--ln);cursor:pointer;padding:0 4px;transition:transform .2s,color .2s}.fv.big{font-size:30px}
.fv.on{color:var(--am);transform:scale(1.15)}.fv:hover{transform:scale(1.3) rotate(12deg)}
.bx{background:var(--cd);border:1.5px solid var(--ln);border-radius:16px;padding:20px;margin:14px 0;box-shadow:var(--sh)}
.bx h2{margin:0 0 10px;font-size:17px;color:var(--ac)}
.fm{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
code{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:color-mix(in srgb,var(--ac) 10%,transparent);border-left:4px solid var(--ac);padding:7px 12px;border-radius:8px;font-size:14.5px;font-weight:600}
.dc{background:color-mix(in srgb,var(--am) 18%,transparent);border-left:4px solid var(--am);padding:10px 14px;border-radius:8px;font-size:14px;margin-top:10px}
.op{display:flex;gap:12px;width:100%;text-align:left;background:var(--bg);border:2px solid var(--ln);border-radius:12px;padding:10px 14px;margin:8px 0;cursor:pointer;transition:transform .15s,border-color .2s}
.op b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--hi);color:var(--ht);display:grid;place-items:center;font-size:13px}
.op:not(:disabled):hover{border-color:var(--ac);transform:translateX(4px)}.op:disabled{cursor:default}
.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);animation:pop .4s}
.op.er{border-color:var(--er);background:color-mix(in srgb,var(--er) 12%,transparent);animation:shake .4s}
.op.ok b{background:var(--ok);color:var(--bt)}.op.er b{background:var(--er);color:var(--bt)}
.fb{margin-top:14px;padding:14px;border-radius:12px;border-left:5px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);animation:up .4s both}
.fb.erb{border-color:var(--er);background:color-mix(in srgb,var(--er) 9%,transparent)}.fb p{margin:6px 0 0}
.dn{background:var(--cd);color:var(--ac);border:1.5px solid var(--ac);border-radius:99px;padding:11px 24px;font:700 14px "Bricolage Grotesque",sans-serif;cursor:pointer;transition:all .25s}
.dn.on{background:var(--ok);border-color:var(--ok);color:var(--bt)}
.pn{display:flex;justify-content:space-between;gap:10px;margin:18px 0;flex-wrap:wrap}
.qh{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:8px 0}
.res{text-align:center;padding:10px 0}
.stat{text-align:center;margin:0}.stat span{font-size:22px}.stat b{display:block;font-size:26px}.stat small{color:var(--mu)}
.mr{display:grid;grid-template-columns:minmax(130px,1.2fr) 2fr minmax(90px,.8fr);gap:10px;align-items:center;padding:7px 0;font-size:13.5px}
.mr small,.mr2 small{color:var(--mu);text-align:right}.mr2{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--ln);font-size:13.5px}
.sb{display:flex;height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.sb i{display:block;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}.sb .g1{background:var(--ok)}.sb .e1{background:var(--er)}
.sm{text-align:center;display:flex;flex-direction:column;gap:2px;font:inherit}.sm b{font-family:"Bricolage Grotesque",sans-serif;font-size:28px}
.empty{text-align:center;font-size:40px;padding:24px 0}.empty p{font-size:15px;color:var(--mu)}
.fcnt{text-align:center;color:var(--mu);font-size:13px;margin:4px 0 8px}.fcb{justify-content:center}
.fcw{perspective:1200px}.fcard{position:relative;height:300px;transition:transform .6s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d;cursor:pointer}.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:center;text-align:center;background:var(--cd);border:1.5px solid var(--ln);box-shadow:var(--sh);overflow:auto}
.face.bk2{transform:rotateY(180deg);background:var(--hi)}.face h2{font-size:24px;margin:0}

/* Map, Glossary, Traps */
.map-canvas{width:100%;height:auto;background:var(--cd);border:1.5px solid var(--ln);border-radius:18px;box-shadow:var(--sh);padding:14px;margin:12px 0}
.map-node{cursor:pointer;transition:transform .2s,filter .2s}
.map-node:hover{transform:scale(1.04);filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.trap-card{border-left:5px solid var(--am);background:var(--cd);border-radius:14px;padding:16px;margin-bottom:12px;border:1.5px solid var(--ln);border-left-width:5px;box-shadow:var(--sh)}
.trap-card h3{margin:0 0 6px;color:var(--am);font-size:16px}
.glossary-item{background:var(--cd);border:1.5px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh)}
.glossary-item b{color:var(--ac)}
.copy-btn{align-self:flex-start;background:var(--hi);color:var(--ht);border:none;border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700;cursor:pointer;transition:all .15s}
.copy-btn:hover{background:var(--ac);color:var(--bt)}

/* Bottom navigation */
nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:20;
  width:min(100%,720px);display:flex;gap:1px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--hd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1.5px solid var(--ln);border-bottom:0;border-radius:20px 20px 0 0
}
nav a{
  flex:1;display:flex;flex-direction:column;align-items:center;font-size:18px;line-height:1.2;
  padding:5px 1px;border-radius:10px;color:var(--mu);transition:all .2s;text-align:center
}
nav i{font-style:normal;font-size:17px}
nav a span{font-size:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
nav a.on{background:var(--hi);color:var(--ht);transform:translateY(-2px)}
.nt{font-size:12px;color:var(--mu);margin:28px 0 0;text-align:center}

@media(max-width:560px){
  .mr{grid-template-columns:1fr 1fr}.mr .sb{grid-column:1/-1;order:3}
  .hero{padding:16px}
  nav a span{font-size:9.5px}
  .g{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
var M = [{"n":"Química Orgânica","p":18,"l":"A","d":"Cadeias carbônicas, funções orgânicas, isomeria, reações, polímeros e biomoléculas: o tema mais recorrente no ENEM.","s":"Cadeias carbônicas e classificação do carbono|M;Hidrocarbonetos e petróleo|A;Funções oxigenadas I (álcoois, fenóis e éteres)|A;Funções oxigenadas II (aldeídos, cetonas e ácidos carboxílicos)|A;Funções oxigenadas III (ésteres e éteres)|A;Funções nitrogenadas (aminas e amidas)|A;Isomeria plana (constitucional)|M;Isomeria espacial (geométrica e óptica)|A;Reações orgânicas de substituição, adição e eliminação|A;Reações de oxidação, combustão e esterificação|A;Polímeros sintéticos e reciclagem|A;Biomoléculas (carboidratos, lipídios e proteínas)|A;Sabões, detergentes e tensoativos|A;Acidez e basicidade em compostos orgânicos|A;Haletos orgânicos e compostos sulfurados|A;Gorduras trans e hidrogenação catalítica|A;Diastereoisômeros e compostos meso|A"},{"n":"Soluções e Propriedades Coligativas","p":13,"l":"A","d":"Concentrações, solubilidade, diluição, titulação ácido-base e efeitos coligativos em situações cotidianas.","s":"Coeficiente e curvas de solubilidade|A;Concentração comum e densidade|A;Concentração molar (molaridade)|A;Título, porcentagem e ppm|A;Diluição e mistura de soluções|A;Titulação ácido-base|A;Efeitos coligativos (tonoscopia e ebulioscopia)|M;Crioscopia, osmose e pressão osmótica|A;Fração molar e molalidade|A;Coloides e Efeito Tyndall|A;Osmose celular em meios isotônico, hipotônico e hipertônico|A"},{"n":"Estequiometria e Cálculos Químicos","p":12,"l":"A","d":"Relações molares, balanceamento, reagente limitante, pureza, rendimento e comportamento dos gases ideais.","s":"Massa molar, mol e constante de Avogadro|A;Fórmulas mínima e molecular|M;Balanceamento de equações químicas|A;Cálculo estequiométrico fundamental|A;Reagente limitante e reagente em excesso|A;Rendimento e pureza em reações químicas|A;Gases, equação de Clapeyron e misturas gasosas|A;Leis ponderais e volumétricas (Lavoisier, Proust e Gay-Lussac)|A;Densidade dos gases e efusão de Graham|M;Estequiometria de reações sucessivas e em cadeia|A"},{"n":"Eletroquímica","p":11,"l":"A","d":"Reações de oxirredução, potenciais-padrão, pilhas, baterias, eletrólise, leis de Faraday e proteção contra corrosão.","s":"Número de oxidação (NOX) e reações redox|A;Pilhas eletroquímicas e potenciais-padrão|A;Espontaneidade e equação de Nernst qualitativa|M;Baterias recarregáveis e acumulador de chumbo|A;Eletrólise ígnea e eletrólise aquosa|A;Leis de Faraday e estequiometria da eletrólise|A;Corrosão metálica e proteção catódica|A;Pilha seca de Leclanché e pilhas alcalinas|A;Células a combustível (hidrogênio e oxigênio)|A;Anodização e galvanoplastia industrial|A"},{"n":"Termoquímica","p":10,"l":"A","d":"Entalpia, calor de reação, calorimetria, Lei de Hess, energia de ligação e espontaneidade de Gibbs.","s":"Entalpia e reações exotérmicas e endotérmicas|A;Diagramas de entalpia e calor de reação|A;Calorimetria e calor específico (Q = m·c·ΔT)|A;Entalpia padrão de formação e de combustão|A;Lei de Hess|A;Energia de ligação|A;Entropia e energia livre de Gibbs|M;Poder calorífico e eficiência de combustíveis|A;Calor de neutralização ácido-base|A;Ciclo de Born-Haber e energia reticular|M"},{"n":"Equilíbrio Químico e pH","p":9,"l":"A","d":"Equilíbrio dinâmico, Le Chatelier, cálculo de pH e pOH, hidrólise salina, sistemas-tampão e Kps.","s":"Equilíbrio químico dinâmico e constante Kc|A;Deslocamento de equilíbrio (Princípio de Le Chatelier)|A;Produto iônico da água (Kw), pH e pOH|A;Força de ácidos e bases (Ka e Kb)|A;Hidrólise salina e caráter ácido-base de sais|A;Solução-tampão no sangue e sistemas biológicos|A;Produto de solubilidade (Kps) e precipitação|M;Constante de equilíbrio em pressões parciais (Kp)|A;Efeito do íon comum no equilíbrio iônico|A;Indicadores ácido-base e curvas de titulação|A"},{"n":"Química Ambiental","p":8,"l":"M","d":"Ciclos biogeoquímicos, efeito estufa, chuva ácida, camada de ozônio, tratamento de água e Química Verde.","s":"Ciclos biogeoquímicos (carbono, nitrogênio e enxofre)|A;Efeito estufa e gases de aquecimento global|A;Chuva ácida e deposição ácida|A;Destruição da camada de ozônio (CFCs)|M;Tratamento de água para abastecimento público|A;Tratamento de esgoto, lixo e compostagem|A;Princípios da Química Verde|M;Smog fotoquímico e inversão térmica|A;Acidificação dos oceanos por dióxido de carbono|A;Poluição por metais pesados e bioacumulação|A;Agrotóxicos, biomagnificação e persistência ambiental|A"},{"n":"Ligações Químicas e Interações Intermoleculares","p":6,"l":"M","d":"Ligações iônica, covalente e metálica, geometria VSEPR, polaridade, forças intermoleculares e alotropia.","s":"Ligação iônica e propriedades dos compostos iônicos|M;Ligação covalente e regra do octeto|M;Geometria molecular (modelo VSEPR)|A;Polaridade de ligações e de moléculas|A;Forças intermoleculares (London, dipolo-dipolo e lig. H)|A;Propriedades físicas e forças intermoleculares|A;Alotropia (carbono, oxigênio e fósforo)|M;Ligação metálica e ligas metálicas cotidianas|A;Interações íon-dipolo e solvatação|A;Hibridização de orbitais sp, sp² e sp³|A"},{"n":"Cinética Química","p":5,"l":"M","d":"Velocidade de reação, fatores cinéticos, teoria das colisões, energia de ativação e catálise enzimática.","s":"Velocidade média e fatores de influência|A;Teoria das colisões e complexo ativado|A;Energia de ativação e ação de catalisadores|A;Lei da velocidade e ordem de reação|M;Catálise enzimática e inibidores|M;Gráficos cinéticos e velocidade instantânea|A;Inibição enzimática competitiva e alostérica|A;Tempo de meia-vida cinético de reações|A"},{"n":"Funções Inorgânicas","p":4,"l":"M","d":"Ácidos, bases, sais, classificação de óxidos (ácidos, básicos, neutros) e correção de solos por calagem.","s":"Ácidos (classificação, ionização e nomenclatura)|M;Bases (dissociação e classificação)|M;Sais e reações de neutralização total e parcial|M;Óxidos (óxidos ácidos, básicos, neutros e anfóteros)|A;Poluição por óxidos e chuva ácida inorgânica|M;Teorias ácido-base de Brønsted-Lowry e de Lewis|A;Peróxidos, superóxidos e água oxigenada|A;Sais hidratados, eflorescência e deliquescência|A"},{"n":"Atomística e Tabela Periódica","p":3,"l":"B","d":"Modelos atômicos, partículas fundamentais, distribuição eletrônica e propriedades periódicas dos elementos.","s":"Evolução dos modelos atômicos|M;Estrutura atômica (prótons, nêutrons e isótopos)|M;Distribuição eletrônica e tabela periódica moderna|M;Propriedades periódicas (raio, ionização e eletronegatividade)|A;Modelo quântico de orbitais e princípio da incerteza|A;Números quânticos e princípio de Pauli|A;Afinidade eletrônica e eletronegatividade na prática|A"},{"n":"Radioatividade e Química Nuclear","p":1,"l":"B","d":"Emissões alfa, beta e gama, decaimento radioativo, fissão e fusão nuclear, radioterapia e datação por carbono-14.","s":"Emissões radioativas (alfa, beta e gama) e leis de Soddy|M;Tempo de meia-vida e decaimento radioativo|M;Fissão e fusão nuclear (energia e impactos)|M;Aplicações na medicina e datação por carbono-14|M;Séries radioativas naturais e transmutação nuclear|M;Radiofármacos e aplicações na medicina diagnóstica|A;Acidentes nucleares históricos e gestão de rejeitos|A"}];
var C = {"Cadeias carbônicas e classificação do carbono":["O átomo de carbono é tetravalente (faz 4 ligações covalentes) e tem capacidade de formar cadeias estáveis (postulados de Kekulé). Os carbonos são classificados de acordo com o número de outros carbonos diretamente ligados: primário (ligado a 0 ou 1 outro C), secundário (a 2), terciário (a 3) e quaternário (a 4). Quanto à hibridização, o carbono com 4 ligações simples é sp³ (tetraédrico, ângulo ~109,5°); com 1 dupla e 2 simples é sp² (trigonal plano, ~120°); e com 1 tripla (ou 2 duplas) é sp (linear, 180°). As cadeias podem ser abertas (acíclicas) ou fechadas (cíclicas), normais ou ramificadas, homogêneas ou heterogêneas (com heteroátomos como O, N, S entre carbonos), e saturadas ou insaturadas (com duplas ou triplas entre carbonos).",["Tetravalência do C: 4 ligações covalentes","Carbono sp³: 4 ligações simples (tetraédrico)","Carbono sp²: 1 dupla + 2 simples (trigonal plano)","Carbono sp: 1 tripla ou 2 duplas (linear)","Heteroátomo: átomo diferente de C e H situado ENTRE carbonos"],"Cuidado com heteroátomos: um oxigênio ou nitrogênio na ponta da cadeia NÃO torna a cadeia heterogênea. Só é heterogênea se o heteroátomo estiver entre dois carbonos.","A capsaicina (fórmula estrutural esquematizada abaixo) é a substância responsável pela pungência (ardência) das pimentas do gênero <i>Capsicum</i>. Na sua estrutura molecular observam-se anéis aromáticos, cadeias alifáticas e heteroátomos.\n  <div style=\"text-align:center;margin:12px 0;\">\n    <svg viewBox=\"0 0 380 95\" style=\"width:100%;max-width:380px;height:auto;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px;\">\n      <text x=\"10\" y=\"20\" fill=\"var(--mu)\" font-size=\"11\" font-family=\"sans-serif\">Estrutura esquemática parcial da capsaicina</text>\n      <!-- Ring -->\n      <polygon points=\"50,45 70,30 95,45 95,70 70,85 50,70\" fill=\"none\" stroke=\"var(--tx)\" stroke-width=\"2\"/>\n      <circle cx=\"72\" cy=\"57\" r=\"14\" fill=\"none\" stroke=\"var(--tx)\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n      <!-- Substituents on ring -->\n      <line x1=\"50\" y1=\"45\" x2=\"30\" y2=\"35\" stroke=\"var(--tx)\" stroke-width=\"2\"/>\n      <text x=\"5\" y=\"35\" fill=\"var(--tx)\" font-size=\"12\" font-family=\"sans-serif\">HO</text>\n      <line x1=\"50\" y1=\"70\" x2=\"30\" y2=\"80\" stroke=\"var(--tx)\" stroke-width=\"2\"/>\n      <text x=\"2\" y=\"90\" fill=\"var(--tx)\" font-size=\"12\" font-family=\"sans-serif\">H₃CO</text>\n      <!-- Chain -->\n      <line x1=\"95\" y1=\"57\" x2=\"130\" y2=\"57\" stroke=\"var(--tx)\" stroke-width=\"2\"/>\n      <text x=\"135\" y=\"61\" fill=\"var(--tx)\" font-size=\"12\" font-family=\"sans-serif\">NH—CO—(CH₂)₄—CH=CH—CH(CH₃)₂</text>\n    </svg>\n  </div>","Ao analisar a hibridização dos átomos de carbono no anel aromático e na porção alifática saturada, constata-se que os carbonos do anel aromático e os carbonos do grupo -(CH₂)₄- apresentam, respectivamente, geometria e hibridização:",["trigonal plana (sp²) e tetraédrica (sp³).","linear (sp) e trigonal plana (sp²).","tetraédrica (sp³) e linear (sp).","tetraédrica (sp³) e trigonal plana (sp²).","trigonal plana (sp²) e linear (sp)."],0,"Os carbonos do anel benzênico fazem ligações duplas conjugadas (uma dupla e duas simples em ressonância), possuindo hibridização sp² e arranjo trigonal plano (~120°). Já os carbonos da cadeia alquílica saturated -(CH₂)₄- realizam 4 ligações simples do tipo sigma (σ), possuindo hibridização sp³ e geometria tetraédrica (~109,5°). Alternativa B erra ao considerar o anel linear (sp); C inverte ambas as geometrias; D supõe que o anel é sp³; E supõe erroneamente carbonos lineares sp na cadeia alifática."],"Hidrocarbonetos e petróleo":["Hidrocarbonetos contêm exclusivamente átomos de carbono e hidrogênio, sendo compostos predominantemente apolares cujas moléculas interagem por forças de dispersão de London (dipolo induzido). O petróleo é uma mistura complexa de hidrocarbonetos (alcanos, alcenos, cicloalcanos e aromáticos) separada na indústria por destilação fracionada com base na diferença dos pontos de ebulição. Frações com cadeias mais curtas e menor massa molar são mais voláteis e saem no topo da torre (GLP, nafta, gasolina); frações mais longas saem no fundo (óleo diesel, lubrificantes, asfalto). O craqueamento térmico ou catalítico (cracking) quebra moléculas longas em frações de maior valor comercial (como eteno e gasolina).",["Fórmula geral alcanos: CₙH₂ₙ₊₂","Fórmula geral alcenos: CₙH₂ₙ","Fórmula geral alcinos: CₙH₂ₙ₋₂","Destilação fracionada: separa por pontos de ebulição","Craqueamento: quebra de hidrocarbonetos longos em frações menores"],"Cadeia mais longa e com menor ramificação tem maior superfície de contato, maiores forças intermoleculares de London e, portanto, maior ponto de ebulição.","A torre de destilação fracionada do petróleo opera estabelecendo um gradiente decrescente de temperatura da base para o topo. Substâncias com menor ponto de ebulição vaporizam mais facilmente e são recolhidas nos pratos superiores.\n  <div style=\"text-align:center;margin:12px 0;\">\n    <svg viewBox=\"0 0 320 130\" style=\"width:100%;max-width:320px;height:auto;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px;\">\n      <text x=\"10\" y=\"16\" fill=\"var(--mu)\" font-size=\"11\" font-family=\"sans-serif\">Esquema da Torre de Destilação Fracionada</text>\n      <rect x=\"70\" y=\"25\" width=\"70\" height=\"95\" rx=\"5\" fill=\"none\" stroke=\"var(--tx)\" stroke-width=\"2\"/>\n      <line x1=\"70\" y1=\"42\" x2=\"140\" y2=\"42\" stroke=\"var(--ln)\" stroke-dasharray=\"2,2\"/>\n      <line x1=\"70\" y1=\"65\" x2=\"140\" y2=\"65\" stroke=\"var(--ln)\" stroke-dasharray=\"2,2\"/>\n      <line x1=\"70\" y1=\"90\" x2=\"140\" y2=\"90\" stroke=\"var(--ln)\" stroke-dasharray=\"2,2\"/>\n      <path d=\"M 140 35 L 180 35\" stroke=\"var(--ac)\" stroke-width=\"2\" marker-end=\"url(#arr)\"/>\n      <text x=\"185\" y=\"38\" fill=\"var(--tx)\" font-size=\"11\" font-family=\"sans-serif\">Topo (~40°C): GLP (C₁-C₄)</text>\n      <path d=\"M 140 55 L 180 55\" stroke=\"var(--ac)\" stroke-width=\"2\"/>\n      <text x=\"185\" y=\"58\" fill=\"var(--tx)\" font-size=\"11\" font-family=\"sans-serif\">Gasolina (C₅-C₁₀)</text>\n      <path d=\"M 140 80 L 180 80\" stroke=\"var(--ac)\" stroke-width=\"2\"/>\n      <text x=\"185\" y=\"83\" fill=\"var(--tx)\" font-size=\"11\" font-family=\"sans-serif\">Diesel (C₁₂-C₁₈)</text>\n      <path d=\"M 140 110 L 180 110\" stroke=\"var(--ac)\" stroke-width=\"2\"/>\n      <text x=\"185\" y=\"113\" fill=\"var(--tx)\" font-size=\"11\" font-family=\"sans-serif\">Fundo (&gt;350°C): Resíduo / Asfalto</text>\n      <path d=\"M 25 105 L 70 105\" stroke=\"var(--er)\" stroke-width=\"2\"/>\n      <text x=\"10\" y=\"100\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">Petróleo cru</text>\n    </svg>\n  </div>","Considerando o processo físico de separação que ocorre no interior da torre, a gasolina é recolhida em um nível mais elevado do que o óleo diesel porque seus componentes apresentam:",["maiores massas moleculares e ligações de hidrogênio mais fortes.","menores cadeias carbônicas, menor polarizabilidade e menor ponto de ebulição.","maior número de ramificações que tornam as moléculas hidrofílicas.","maior densidade e menor pressão de vapor em qualquer temperatura.","reações químicas endotérmicas espontâneas com os pratos metálicos."],1,"A gasolina é composta por hidrocarbonetos de 5 a 10 carbonos, enquanto o diesel possui cadeias mais longas (12 a 18 carbonos). Moléculas menores possuem menor área superficial e nuvem eletrônica menos deformável (menor polarizabilidade), resultando em forças de dispersão de London mais fracas, menor temperatura de ebulição e maior volatilidade, saindo em pratos mais altos. Distrator A erra porque hidrocarbonetos não fazem ligação de hidrogênio; C erra pois hidrocarbonetos são hidrofóbicos (apolares); D inverte a densidade e a pressão de vapor; E é incorreto porque destilação fracionada é um processo físico, não reação química."],"Funções oxigenadas I (álcoois, fenóis e éteres)":["Álcoois contêm hidroxila (—OH) ligada a carbono saturado (sp³). Por realizarem ligações de hidrogênio intermoleculares, possuem pontos de ebulição consideravelmente mais elevados do que hidrocarbonetos de massa molar similar e são solúveis em água quando a cadeia carbônica é curta (até 3 carbonos). Fenóis contêm hidroxila ligada diretamente a anel aromático; exibem caráter ácido fraco (Ka ~ 10⁻¹⁰) devido à estabilização por ressonância do ânion fenolato. Éteres possuem oxigênio como heteroátomo entre dois carbonos (R—O—R'); como não possuem hidrogênio ligado diretamente ao oxigênio, não fazem ligação de hidrogênio entre si, tendo pontos de ebulição bem mais baixos que os álcoois isômeros.",["Álcool: R—OH (C saturado)","Fenol: Ar—OH (hidroxila em anel benzênico)","Éter: R—O—R' (oxigênio entre dois carbonos)","Ligação de hidrogênio: ocorre em álcoois e fenóis","Acidez relativa: fenol > água > álcool alifático"],"Cuidado: OH em anel aromático é FENOL, não álcool! Fenol reage com bases fortes (NaOH) formando sal e água, mas álcoois comuns não reagem com NaOH.","O eugenol (óleo de cravo) e o vanilina (aroma de baunilha) contêm em suas estruturas anéis aromáticos substituídos por hidroxilas e grupos metóxi (—OCH₃). Um técnico de laboratório deseja diferenciar experimentalmente uma amostra pura de fenol (C₆H₅OH) de uma amostra de ciclo-hexanol (álcool alicíclico) utilizando uma solução aquosa diluída de hidróxido de sódio (NaOH) e um indicador ácido-base.","Qual comportamento químico permite distinguir o fenol do ciclo-hexanol no teste com a base aquosa?",["O fenol não reage com bases, enquanto o ciclo-hexanol neutraliza o hidróxido de sódio.","O ciclo-hexanol sofre desidratação espontânea a frio gerando ácido carboxílico.","O fenol apresenta acidez suficiente para ser desprotonado pelo NaOH, dissolvendo-se na forma de fenolato de sódio.","Ambos reagem identicamente com NaOH liberando gás hidrogênio tóxico.","O ciclo-hexanol forma ligações iônicas espontâneas com o solvente e precipita como óxido."],2,"O fenol tem caráter ácido moderado (pKa ~ 10), bem superior ao dos álcoois comuns (pKa ~ 16 a 18). O ânion fenolato é estabilizado pela deslocalização da carga negativa no anel aromático por ressonância. Por isso, o fenol reage com base forte aquosa (NaOH) formando o sal solúvel fenolato de sódio. Já o ciclo-hexanol, sendo um álcool alifático, não tem acidez suficiente para reagir com NaOH aquoso. Distrator A inverte a reatividade; B cita reação inexistente a frio; D supõe liberação de H₂ com NaOH (isso ocorre com sódio metálico Naº, não NaOH); E inventa precipitação inexistente."],"Funções oxigenadas II (aldeídos, cetonas e ácidos carboxílicos)":["Aldeídos e cetonas contêm o grupo carbonila (C=O). Nos aldeídos, a carbonila é terminal (ligada a pelo menos um H, R—CHO); nas cetonas, a carbonila fica entre dois carbonos (R—CO—R'). Moléculas de aldeídos e cetonas são polares e interagem por dipolo permanente-dipolo permanente; não fazem ligações de hidrogênio entre si, mas podem receber ligações de hidrogênio da água. Ácidos carboxílicos contêm a carboxila (—COOH); suas moléculas formam dímeros por duas ligações de hidrogênio muito fortes, conferindo pontos de ebulição ainda mais altos que os dos álcoois equivalentes. Em água, ionizam-se gerando íons H⁺ (ou H₃O⁺) e ânions carboxilato estabilizados por ressonância.",["Aldeído: R—CHO (carbonila na ponta)","Cetona: R—CO—R' (carbonila secundária)","Ácido carboxílico: R—COOH (carboxila)","Dimerização: ácidos carboxílicos formam 2 ligações de H","Oxidação: álcool 1° → aldeído → ácido carboxílico; álcool 2° → cetona"],"Cuidado no bafômetro: o etanol é oxidado primeiro a etanal (aldeído) e depois a ácido acético (ácido carboxílico). Cetonas não oxidam facilmente.","Em processos biológicos e laboratoriais, a oxidação controlada do etanol (álcool primário) presente no vinho exposto ao oxigênio do ar gera gradualmente o ácido etanoico (ácido acético), responsável pelo sabor avinagrado característico.","Qual composto orgânico intermediário é formado durante a oxidação parcial do etanol antes de sua conversão final a ácido etanoico?",["Propanona (cetona).","Metoxietano (éter).","Acetato de etila (éster).","Etanal (aldeído).","Eteno (alceno)."],3,"A oxidação branda de um álcool primário de 2 carbonos (etanol: CH₃CH₂OH) remove hidrogênios formando a carbonila terminal do aldeído correspondente, o etanal (acetaldeído: CH₃CHO). Com a continuidade do processo oxidativo na presença de oxigênio, insere-se um átomo de oxigênio entre o carbono da carbonila e o hidrogênio, produzindo o ácido etanoico (ácido acético: CH₃COOH). Alternativa A é cetona de 3 carbonos; B é éter; D é éster; E é produto de desidratação, não de oxidação."],"Funções oxigenadas III (ésteres e éteres)":["Ésteres possuem a fórmula geral R—COO—R' e são derivados da reação de esterificação entre um ácido carboxílico e um álcool, com eliminação de água. Ésteres de baixa massa molar são líquidos voláteis com aromas agradáveis de frutas e flores, amplamente utilizados na indústria alimentícia como aromatizantes e flavorizantes artificiais (como o etanoato de etila e o butanoato de etila). Já os triglicerídeos (óleos e gorduras) são triésteres do glicerol com ácidos graxos de cadeia longa. Éteres (R—O—R') são compostos pouco reativos, com ponto de ebulição baixo e amplamente usados como solventes orgânicos apolares/fracamente polares.",["Éster: R—COO—R' (derivado de ácido carboxílico + álcool)","Ésteres de baixa massa molar: flavorizantes / essências","Éteres: R—O—R' (solventes e anestésicos históricos)","Esterificação de Fischer: Ácido carboxílico + Álcool ⇌ Éster + Água (catálise ácida)","Saponificação: Éster + Base forte → Sabão + Álcool"],"Não confunda: éstER tem carbonila ligada ao oxigênio (—COO—); étER tem oxigênio isolado entre carbonos (—O—).","O aroma artificial de banana usado em balas e chicletes é produzido industrialmente pela reação entre o ácido acético (ácido etanoico) e o álcool isopentílico (3-metilbutan-1-ol), em meio aquecido e na presença de algumas gotas de ácido sulfúrico concentrado como catalisador.","A reação descrita pertence à classe da esterificação e produz, além de água, o composto orgânico denominado:",["isopentilamida, que pertence à função amida.","etoxibutano, que pertence à função éter.","pentanoato de etila, que pertence à função anidrido.","ácido isopentanoico, que pertence à função ácido carboxílico.","acetato de isopentila, que pertence à função éster."],4,"A reação entre ácido carboxílico e álcool sob catálise ácida é uma esterificação clássica de Fischer. O ácido acético (etanoico) fornece o grupo acila (etanoato ou acetato) e o álcool 3-metilbutan-1-ol (isopentílico) fornece o grupo alquila (isopentila), gerando o éster acetato de isopentila (ou etanoato de 3-metilbutila) e água. As demais alternativas apresentam funções incorretas (éter, anidrido, ácido, amida)."],"Funções nitrogenadas (aminas e amidas)":["Aminas são derivadas da amônia (NH₃) pela substituição de um ou mais hidrogênios por radicais alquila ou arila (R—NH₂, R₂NH, R₃N). Possuem caráter básico de Lewis e de Brønsted-Lowry devido ao par eletrônico não ligante disponível no átomo de nitrogênio, que pode receber prótons (H⁺). Aminas voláteis são responsáveis pelo odor de peixe podre (como a trimetilamina) e de corpos em decomposição (cadaverina e putrescina), sendo neutralizadas por ácidos como o vinagre ou suco de limão. Amidas possuem o grupo acila ligado ao nitrogênio (R—CO—NH₂); a atração do par eletrônico pelo oxigênio da carbonila por ressonância retira a basicidade da amida, tornando-a praticamente neutra. A ligação peptídica nas proteínas é uma ligação amídica.",["Amina: R—NH₂, R₂NH, R₃N (caráter básico, captura H⁺)","Amida: R—CO—NR'R'' (grupo carbonila ligado ao N, neutra)","Neutralização de aminas: Amina + Ácido → Sal de amônio (sem odor volátil)","Ligação peptídica: amida formada entre aminoácidos","Ordem de basicidade aquosa: amina 2ª > amina 1ª > amina 3ª > NH₃ > anilina"],"Cozinheiros usam limão ou vinagre no peixe porque o ácido cítrico ou acético protona a amina (básica), formando sal de amônio iônico não volátil, eliminando o cheiro de peixe!","A trimetilamina [(CH₃)₃N] é uma substância volátil de odor pungente desagradável, gerada pela ação de microrganismos sobre a carne de peixe durante a estocagem. Donas de casa e chefs utilizam tradicionalmente fatias de limão ou vinagre na higienização do pescado.","O princípio químico que fundamenta a eficácia do uso de suco de limão para atenuar o cheiro de peixe consiste na:",["reação ácido-base em que o ácido cítrico protona a trimetilamina, convertendo-a em cátion amônio não volátil.","oxidação destrutiva dos anéis aromáticos das aminas pelo ácido clorídrico.","esterificação da amina formando um éster aromático de aroma adocicado.","redução eletroquímica do nitrogênio a gás N₂ elementar inodoro.","destruição das ligações peptídicas que formam o esqueleto da amina."],0,"A trimetilamina é uma amina terciária e, como tal, apresenta caráter básico em razão do par de elétrons livres no átomo de nitrogênio. O suco de limão contém ácido cítrico (ácido orgânico tricarboxílico). Na presença de ácido, ocorre uma reação de neutralização: (CH₃)₃N + H⁺ → (CH₃)₃NH⁺. A espécie protonada forma um sal iônico solúvel em água e de baixíssima pressão de vapor (não volátil), impedindo que atinja os receptores olfativos. Distrator A cita ácido clorídrico e aromáticos inexistentes; C confunde com esterificação; D sugere redução química irreal; E cita ligações peptídicas que não existem em aminas simples."],"Isomeria plana (constitucional)":["Isômeros são compostos que possuem a mesma fórmula molecular (mesma quantidade de cada elemento químico), mas fórmulas estruturais distintas, resultando em propriedades físicas e químicas diferentes. Na isomeria plana, a diferença pode ser detectada pela fórmula estrutural plana. Divide-se em: isomeria de cadeia (mesma função, cadeias diferentes: normal vs ramificada, aberta vs fechada), de posição (mesma função e cadeia, difere a posição de ramificação, insaturação ou grupo funcional), de função (funções químicas distintas, como álcool/éter, aldeído/cetona, ácido carboxílico/éster), de compensação ou metameria (posição diferente de heteroátomo) e tautomeria (equilíbrio dinâmico entre isômeros, como ceto-enólica e aldo-enólica).",["Mesma fórmula molecular, diferentes estruturas","Função: álcool e éter (CₙH₂ₙ₊₂O); aldeído e cetona (CₙH₂ₙO)","Função: ácido carboxílico e éster (CₙH₂ₙO₂)","Metameria: difere a posição do heteroátomo","Tautomeria: equilíbrio dinâmico (ex: etanal ⇌ etenol)"],"Álcoois e éteres de mesma fórmula molecular (ex: etanol e metoximetano, C₂H₆O) são isômeros de FUNÇÃO. O álcool tem ponto de ebulição muito maior por fazer ligação de hidrogênio.","Dois frascos sem identificação contêm líquidos incolores puros A e B, ambos de fórmula molecular C₃H₆O. Experimentos mostraram que o líquido A é muito usado como solvente de esmaltes de unhas e reage com hidrazina, mas não se oxida facilmente; enquanto o composto B sofre oxidação fácil por agentes oxidantes brandos formando ácido propanoico.","Considerando as fórmulas estruturais desses dois compostos, conclui-se que os líquidos A e B são isômeros de:",["posição, correspondendo a propan-1-ol e propan-2-ol.","função, correspondendo à propanona (cetona) e ao propanal (aldeído).","cadeia, correspondendo ao ciclopropano e propeno.","compensação (metameria), correspondendo a metoxietano e etoxietano.","óptica, correspondendo a dois enantiômeros quirais."],1,"A fórmula C₃H₆O corresponde à fórmula geral CₙH₂ₙO de aldeídos e cetonas monocíclicos/alifáticos. A propanona (CH₃—CO—CH₃) é a cetona mais simples (acetona comercial, solvente de esmaltes), que não se oxida por oxidantes brandos. O propanal (CH₃—CH₂—CHO) é um aldeído que se oxida facilmente ao ácido carboxílico de mesma cadeia (ácido propanoico). Por pertencerem a classes funcionais distintas com a mesma fórmula molecular, são isômeros de função. Alternativa A cita álcoois (fórmula C₃H₈O); C cita hidrocarbonetos (C₃H₆); D cita éteres; E supõe isomeria óptica inexistente nessas moléculas acíclicas simétricas."],"Isomeria espacial (geométrica e óptica)":["A isomeria espacial (estereoisomeria) ocorre quando as moléculas têm a mesma conectividade átomo a átomo, mas diferem no arranjo tridimensional no espaço. A isomeria geométrica (cis-trans ou Z-E) exige impedimento de rotação (ligação dupla entre carbonos ou ciclo) e ligantes diferentes em cada carbono da insaturação (R₁ ≠ R₂ e R₃ ≠ R₄). O isômero cis tem ligantes iguais ou prioritários no mesmo lado do plano; trans, em lados opostos. A isomeria óptica ocorre quando a molécula possui carbono assimétrico ou quiral (C* ligado a 4 grupos distintos) e não apresenta plano de simetria interno. Moléculas quirais são assimétricas e não sobreponíveis à sua imagem especular (enantiômeros), desviando o plano da luz polarizada para a direita (dextrogiro, d ou +) ou esquerda (levogiro, l ou -). Uma mistura equimolar de enantiômeros é racêmica e opticamente inativa.",["Isomeria geométrica (cis-trans): dupla com ligantes diferentes em cada C","Isômero cis: ligantes de maior massa no mesmo lado","Isômero trans: ligantes em lados opostos (geralmente mais estável)","Carbono quiral (C*): ligado a 4 ligantes completamente distintos","Nº de isômeros ópticos ativos: 2ⁿ (n = nº de C* distintos)"],"Cuidado no ENEM: para ter isomeria óptica, ache um carbono com 4 grupos DIFERENTES ligados a ele. Um carbono com dupla ou com 2 H nunca é quiral!","O ácido láctico (ácido 2-hidroxipropanoico) é produzido nos músculos durante exercícios intensos anaeróbios e também na fermentação láctica do leite. Sua fórmula estrutural está representada a seguir:\n  <div style=\"text-align:center;margin:12px 0;\">\n    <svg viewBox=\"0 0 280 85\" style=\"width:100%;max-width:280px;height:auto;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px;\">\n      <text x=\"10\" y=\"16\" fill=\"var(--mu)\" font-size=\"11\" font-family=\"sans-serif\">Ácido 2-hidroxipropanoico</text>\n      <text x=\"50\" y=\"55\" fill=\"var(--tx)\" font-size=\"16\" font-family=\"sans-serif\">CH₃ — <tspan font-weight=\"bold\" fill=\"var(--ac)\">C*</tspan>H(OH) — COOH</text>\n      <circle cx=\"120\" cy=\"50\" r=\"14\" fill=\"none\" stroke=\"var(--ac)\" stroke-width=\"2\"/>\n    </svg>\n  </div>","Com base na estrutura do ácido láctico, a existência de atividade óptica nessa substância se deve à presença de:",["uma ligação dupla entre carbonos que restringe a rotação molecular.","dois grupamentos carboxila em posições diametralmente opostas gerando plano de simetria.","um átomo de carbono quiral ligado a quatro ligantes distintos: —H, —CH₃, —OH e —COOH.","um átomo de oxigênio com carga formal positiva formando par conjugado.","uma cadeia carbônica aromática condensada com elétrons pi deslocalizados."],2,"O carbono central (C-2) está ligado a quatro grupos distintos entre si: hidrogênio (—H), metila (—CH₃), hidroxila (—OH) e carboxila (—COOH). A presença desse carbono assimétrico (quiral) confere assimetria molecular à espécie, originando dois enantiômeros não sobreponíveis (ácido D-láctico e L-láctico) que desviam a luz polarizada. Distrator A descreve a condição para isomeria geométrica; C é falso pois há apenas 1 carboxila; D e E mencionam conceitos químicos desprovidos de relação com a estrutura em questão."],"Reações orgânicas de substituição, adição e eliminação":["As reações orgânicas fundamentais dividem-se em: adição, substituição e eliminação. Reações de adição ocorrem em compostos insaturados (alcenos e alcinos com ligações pi): a ligação pi se rompe e dois novos átomos ou grupos se ligam aos carbonos. Na adição de haletos de hidrogênio (HX) ou água a alcenos assimétricos, segue-se a regra de Markovnikov (o hidrogênio liga-se preferencialmente ao carbono mais hidrogenado da dupla). Reações de substituição ocorrem tipicamente em alcanos e anéis aromáticos (halogenação, nitração, sulfonação), onde um átomo de H é trocado por outro grupo. Reações de eliminação são o inverso da adição: removem-se átomos de carbonos vizinhos gerando uma insaturação (ex: desidratação de álcoois gerando alcenos).",["Adição: quebra de ligação pi em alcenos/alcinos (A + B → C)","Regra de Markovnikov: o H entra no carbono mais hidrogenado da dupla","Substituição: troca de um ligante (típica de alcanos e anel benzênico)","Eliminação: perda de átomos vizinhos formando dupla ligação","Halogenação de alcenos: teste do bromo (descoloração de Br₂ em CCl₄)"],"Dica clássica do ENEM: descoloração de água de bromo (Br₂ castanho-avermelhado) identifica INSATURAÇÃO (alceno/alcino) por reação de adição rápida a frio!","A indústria química utiliza testes rápidos com solução de bromo (Br₂ dissolvido em tetracloreto de carbono, de coloração castanho-alaranjada) para testar a pureza de óleos vegetais e combustíveis. Quando algumas gotas dessa solução são adicionadas ao propeno, a coloração castanha desaparece instantaneamente.","O desaparecimento da cor do bromo ocorre em razão de uma reação química de:",["substituição eletrofílica no anel benzênico com liberação de H₂.","eliminação intramolecular com formação de propino gasoso.","combustão espontânea do bromo líquido catalisada pelo alceno.","adição de bromo à ligação dupla do alceno, gerando 1,2-dibromopropano incolor.","saponificação do alceno catalisada pelo haleto inorgânico."],3,"O propeno (CH₂=CH—CH₃) possui uma ligação dupla carbono-carbono com elétrons pi ricos. O bromo molecular (Br₂) sofre adição eletrofílica através da quebra da ligação pi: CH₂=CH—CH₃ + Br₂ → CH₂Br—CHBr—CH₃ (1,2-dibromopropano). Como o 1,2-dibromopropano é um líquido incolor e o bromo colorido foi consumido estequiometricamente, a solução descolore. Alternativa A erra a reação e menciona anel inexistente; B sugere eliminação (que geraria insaturação, não consumiria Br₂); D e E citam tipos de reações inteiramente incongruentes com halogenação de alcenos."],"Reações de oxidação, combustão e esterificação":["A combustão é a oxidação total de compostos orgânicos por O₂: a combustão completa produz exclusivamente CO₂ e H₂O, liberando grande quantidade de energia (entalpia de combustão negativa); a combustão incompleta ocorre com suprimento deficiente de oxigênio, produzindo monóxido de carbono (CO, gás altamente tóxico que se liga irreversivelmente à hemoglobina) ou fuligem (carbono C sólido). Oxidações brandas e enérgicas de alcenos geram dióis, aldeídos, cetonas ou ácidos carboxílicos (com clivagem da cadeia). A esterificação é a reação de condensação entre ácido carboxílico e álcool, gerando éster e água sob catálise ácida; seu inverso em meio aquoso alcalino é a hidrólise alcalina ou saponificação.",["Combustão completa: CₙHₘ + (n + m/4)O₂ → n CO₂ + (m/2) H₂O + calor","Combustão incompleta: gera CO (tóxico) ou C (fuligem)","Esterificação: Ácido carboxílico + Álcool ⇌ Éster + H₂O","Saponificação: Triacilglicerol + 3 NaOH → 3 Sabão (carboxilato) + Glicerol","Biodiesel: Transesterificação de óleo com metanol ou etanol"],"Cuidado no ENEM com biodiesel: o biodiesel NÃO é petróleo! É produzido por TRANSESTERIFICAÇÃO de triglicerídeos com álcool de cadeia curta (metanol ou etanol) gerando ésteres etílicos/metílicos e glicerina.","O Programa Nacional de Produção e Uso do Biodiesel (PNPB) incentiva a substituição gradual do diesel fóssil por biodiesel obtido a partir de óleos vegetais (como soja, mamona ou palma) ou gorduras animais. O processo industrial predominante consiste em reagir os triglicerídeos com etanol ou metanol, na presença de catalisador básico.","Esse processo industrial de síntese do biodiesel é denominado:",["hidrogenação catalítica de ligações duplas.","craqueamento térmico de frações pesadas.","fermentação alcoólica anaeróbia por leveduras.","polimerização por adição via radicais livres.","transesterificação, com coprodução de glicerol."],4,"O biodiesel é obtido por transesterificação: um triéster de ácidos graxos com glicerol (triglicerídeo) reage com 3 moléculas de um álcool simples (geralmente metanol ou etanol) na presença de base forte (NaOH ou KOH), convertendo-se em 3 moléculas de monoésteres de ácidos graxos (o biodiesel propriamente dito) e liberando 1 molécula de glicerol (glicerina) como subproduto de grande valor comercial. Alternativas A, B, C e E referem-se a outros processos industriais (produção de margarina, refino de petróleo, produção de bioetanol e fabricação de plásticos)."],"Polímeros sintéticos e reciclagem":["Polímeros são macromoléculas formadas pela união covalente de milhares de unidades repetitivas menores chamadas monômeros. Dividem-se em: polímeros de adição (formados pela quebra de ligações duplas de alcenos sem perda de átomos, como polietileno PE, polipropileno PP, PVC e poliestireno PS) e polímeros de condensação (formados com eliminação de moléculas pequenas como água ou HCl, como PET, náilon e poliuretano). Quanto ao comportamento térmico: termoplásticos (fundem ao aquecer e podem ser remoldados e reciclados mecanicamente, como PE, PP, PET e PVC) e termorrígidos ou termofixos (possuem ligações cruzadas tridimensionais, não fundem ao aquecer, degradando-se termicamente, como baquelite e resinas epóxi). O descarte inadequado de plásticos gera poluição por microplásticos no ecossistema marinho.",["Polímeros de adição: PE (etileno), PP (propileno), PVC (cloreto de vinila), PS (estireno)","Polímeros de condensação: PET (poliéster), Náilon-6,6 (poliamida)","Termoplásticos: cadeias lineares/ramificadas, recicláveis por fusão","Termorrígidos (termofixos): ligações cruzadas tridimensionais, não fundem","Reciclagem mecânica: triagem → moagem → lavagem → extrusão/fusão"],"Cuidado no ENEM: Náilon é uma POLIAMIDA (ligações amídicas semelhantes às proteínas); PET é um POLIÉSTER (ligações éster). Ambos são polímeros de condensação.","Garrafas de refrigerante são amplamente fabricadas com poli(tereftalato de etileno), o PET, produzido pela reação entre o ácido tereftálico (ácido dicarboxílico) e o etilenoglicol (diol), com eliminação contínua de água durante a polimerização.","Quanto ao tipo de reação de síntese e à classe funcional que une os monômeros, o PET é classificado como um polímero de:",["condensação, apresentando grupos funcionais éster ao longo da cadeia.","adição, apresentando grupos funcionais éter interligados.","condensação, apresentando ligações peptídicas do tipo amida.","adição pura, sem qualquer grupo oxigenado na cadeia principal.","reticulação termofixa, que impede qualquer possibilidade de reciclagem."],0,"O PET é formado pela reação entre um diácido carboxílico e um diálcool com eliminação de moléculas de água (H₂O) a cada nova ligação estabelecida, caracterizando uma polimerização por condensação. A união entre a carboxila do ácido e a hidroxila do álcool gera grupos éster (—COO—) repetidos ao longo de toda a macromolécula (poliéster). Além disso, o PET é um termoplástico amplamente reciclado. Distrator B erra o tipo e a função (éter); C confunde com poliamidas (como o náilon); D erra ao dizer adição sem oxigênio (característica do polietileno); E erra ao classificar o PET como termofixo não reciclável."],"Biomoléculas (carboidratos, lipídios e proteínas)":["Biomoléculas são macromoléculas orgânicas vitais para os seres vivos. Carboidratos (glicídios) contêm funções poli-hidroxialdeídos (aldoses, ex: glicose) ou poli-hidroxicetonas (cetoses, ex: frutose); monossacarídeos unem-se por ligações glicosídicas formando polissacarídeos de reserva (amido em vegetais, glicogênio em animais) ou estruturais (celulose). Lipídios são insolúveis em água e solúveis em solventes apolares; os mais abundantes são os triacilgliceróis (óleos vegetais ricos em ácidos graxos insaturados de menor ponto de fusão, e gorduras animais com cadeias saturadas de maior empacotamento). Proteínas são polímeros biológicos de alfa-aminoácidos unidos por ligações peptídicas (função amida); a desnaturação proteica altera as estruturas secundária, terciária e quaternária por rompimento de ligações de hidrogênio e pontes dissulfeto por calor ou pH, sem quebrar as ligações peptídicas primárias.",["Carboidratos: fórmula empírica geral Cₙ(H₂O)ₘ; aldoses e cetoses","Glicose e frutose: C₆H₁₂O₆ (isômeros de função)","Aminoácido: grupo amina (—NH₂) + carboxila (—COOH) no mesmo carbono alfa","Ligação peptídica: amida formada por condensação entre aminoácidos","Desnaturação proteica: perde conformação tridimensional sem quebrar ligação peptídica"],"Glicose e frutose têm a MESMA fórmula molecular (C₆H₁₂O₆): a glicose é uma poli-hidroxialdeído e a frutose é uma poli-hidroxicetona (isômeros de função)!","A ligação peptídica é a unidade química fundamental que mantém unida a cadeia primária de todas as proteínas conhecidas, conforme esquema de reação entre dois aminoácidos genéricos:\n  <div style=\"text-align:center;margin:12px 0;\">\n    <svg viewBox=\"0 0 350 90\" style=\"width:100%;max-width:350px;height:auto;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px;\">\n      <text x=\"10\" y=\"16\" fill=\"var(--mu)\" font-size=\"11\" font-family=\"sans-serif\">Formação da ligação peptídica</text>\n      <text x=\"15\" y=\"45\" fill=\"var(--tx)\" font-size=\"12\" font-family=\"sans-serif\">H₂N—CH(R₁)—<tspan fill=\"var(--er)\">COOH</tspan>  +  <tspan fill=\"var(--ac)\">H</tspan>HN—CH(R₂)—COOH</text>\n      <text x=\"80\" y=\"75\" fill=\"var(--mu)\" font-size=\"11\" font-family=\"sans-serif\">↓ (eliminação de H₂O)</text>\n      <text x=\"150\" y=\"75\" fill=\"var(--tx)\" font-size=\"12\" font-family=\"sans-serif\">...—CH(R₁)—<tspan fill=\"var(--ok)\" font-weight=\"bold\">CO—NH</tspan>—CH(R₂)—... + H₂O</text>\n    </svg>\n  </div>","Ao analisar a estrutura química da ligação indicada em destaque (—CO—NH—), identifica-se que a função orgânica formada corresponde a uma:",["amina secundária cíclica.","amida alifática.","cetona alfa-hidroxilada.","nitrila saturada.","imina protonada."],1,"A ligação peptídica resulta da reação de condensação entre o grupo carboxila (—COOH) de um aminoácido e o grupo amino (—NH₂) do aminoácido vizinho, com perda de uma molécula de água. O grupo funcional resultante —CO—NH— consiste em um átomo de nitrogênio ligado diretamente a um carbono carbonílico, o que caracteriza inequivocamente a função amida. Alternativa A erra porque a amina não possui carbonila diretamente unida ao N; C, D e E citam funções químicas distintas."],"Sabões, detergentes e tensoativos":["Sabões e detergentes são substâncias tensoativas (ou surfactantes) anfifílicas: possuem uma extremidade polar hidrofílica (que interage com a água por ligações de hidrogênio ou interações íon-dipolo) e uma longa cauda carbônica apolar hidrofóbica (que interage com gorduras e óleos por forças de dispersão de London). O sabão tradicional é o sal de sódio ou potássio de ácidos graxos, obtido pela reação de saponificação de triglicerídeos com soda cáustica (NaOH). Em água, os tensoativos formam agregados esféricos denominados micelas: a cauda apolar fica voltada para o interior aprisionando as gotículas de gordura, e a cabeça polar fica voltada para fora interagindo com o solvente aquoso, permitindo a emulsificação e remoção da sujeira. Em águas duras (ricas em íons Ca²⁺ e Mg²⁺), os sabões precipitam na forma de sais insolúveis, enquanto os detergentes sintéticos (sulfonatos) mantêm sua eficácia.",["Molécula anfifílica (anfipática): porção hidrofílica + cauda hidrofóbica","Micela: esferas com interior apolar (lipofílico) e exterior polar","Saponificação: Óleo/Gordura + NaOH → Sabão (R—COO⁻Na⁺) + Glicerina","Água dura: contém Ca²⁺ e Mg²⁺; precipita sabões mas não detergentes sulfonatos","Tensão superficial: tensoativos quebram a coesão das pontes de hidrogênio da água"],"Sabão comum precipita em água dura (Ca²⁺ e Mg²⁺) formando uma 'borra' insolúvel e perde o poder de limpeza. Detergentes sintéticos (com grupo sulfonato —SO₃⁻Na⁺) funcionam bem mesmo em água dura!","Ao lavar um prato engordurado apenas com água, a gordura não se desprende da superfície cerâmica devido à imiscibilidade entre a água polar e os triglicerídeos apolares. Ao adicionar algumas gotas de sabão neutro e esfregar levemente, a gordura é facilmente dispersada e removida pelo enxágue.","A ação de limpeza do sabão ocorre porque suas moléculas:",["agem como catalisadores biológicos que digerem quimicamente os ácidos graxos em gás carbônico e água.","são compostas exclusivamente por hidrocarbonetos apolares que dissolvem a água e a sujeira por igual.","apresentam caráter anfifílico, formando micelas cuja região apolar sequestra a gordura e cuja região polar interage com a água.","reagem com o oxigênio atmosférico liberando calor suficiente para evaporar instantaneamente as moléculas de óleo.","são sais insolúveis que agem por abrasão puramente mecânica sobre a superfície da cerâmica."],2,"As moléculas de sabão possuem comportamento anfifílico (ou anfipático): uma longa cadeia carbônica apolar (hidrofóbica e lipofílica) e uma extremidade iônica carboxilato (hidrofílica). Em contato com a gordura e a água, organizam-se espontaneamente formando micelas esféricas: as caudas apolares interagem com as gotículas de gordura no interior, enquanto as cabeças carregadas ficam voltadas para a água, reduzindo a tensão superficial e estabilizando a emulsão que é arrastada no enxágue. Alternativa A confunde sabão com enzimas; B desconsidera a porção polar iônica; D e E inventam reações ou efeitos sem respaldo na físico-química dos tensoativos."],"Acidez e basicidade em compostos orgânicos":["A acidez e a basicidade em química orgânica dependem diretamente da estabilidade das espécies formadas após a doação ou recebimento de prótons (H⁺), sendo moduladas por efeitos eletrônicos indutivos e de ressonância. A ordem geral decrescente de acidez entre compostos orgânicos oxigenados é: ácidos carboxílicos > fenóis > água > álcoois > alcinos verdadeiros. Ácidos carboxílicos (R—COOH) são os mais ácidos porque o ânion carboxilato (R—COO⁻) deslocaliza a carga negativa simetricamente sobre dois átomos de oxigênio por ressonância; grupos substituintes eletronegativos retiradores de elétrons (como cloro, flúor e NO₂) próximos à carboxila dispersam a carga negativa por efeito indutivo atrativo (−I), aumentando expressivamente a força do ácido (ex: ácido tricloroacético é muito mais forte que o acético). Já a basicidade orgânica é dominada pelas aminas (R—NH₂), devido ao par de elétrons isolado no átomo de nitrogênio capaz de receber prótons. Em meio aquoso, a ordem de basicidade é: aminas secundárias > aminas primárias > aminas terciárias > amônia > anilina (na anilina, o par de elétrons do N deslocaliza-se no anel benzênico por ressonância, reduzindo drasticamente a basicidade).",["Ordem de acidez orgânica: Ácido carboxílico > Fenol > Água > Álcool","Efeito indutivo retirador (−I): halogênios (F, Cl) aumentam a acidez dispersando a carga negativa","Efeito de ressonância: ânions carboxilato e fenolato são estabilizados pela deslocalização eletrônica","Basicidade de aminas: amina 2ª > amina 1ª > amina 3ª > NH₃ > anilina","Anilina é base muito fraca: par eletrônico do N é deslocalizado no anel benzênico"],"Cuidado no ENEM: álcool NÃO tem caráter ácido apreciável em água (seu pKa é ~16-18, menor que o da água!). Quem reage com base forte aquosa (NaOH) é o FENOL e o ÁCIDO CARBOXÍLICO.","Considere quatro frascos contendo soluções aquosas 0,1 mol/L dos seguintes compostos orgânicos: Frasco 1: ácido etanoico (CH₃COOH); Frasco 2: ácido cloroetanoico (ClCH₂COOH); Frasco 3: fenol (C₆H₅OH); Frasco 4: etanol (CH₃CH₂OH).","Qual dessas soluções aquosas apresentará o MENOR valor de pH (maior concentração de íons H⁺ livres)?",["Frasco 4 (etanol).","Frasco 3 (fenol).","Frasco 1 (ácido etanoico).","Frasco 2 (ácido cloroetanoico).","Todos os frascos apresentarão o mesmo pH neutro igual a 7."],3,"Resolução: O menor valor de pH corresponde à solução com maior concentração de íons H⁺, ou seja, ao ácido mais forte da série. Os ácidos carboxílicos (Frascos 1 e 2) são mais ácidos que o fenol (Frasco 3, pKa ~ 10) e muito mais ácidos que o etanol (Frasco 4, pKa ~ 16). Entre o ácido etanoico e o ácido cloroetanoico, o cloro é um halogênio de elevada eletronegatividade que exerce um potente efeito indutivo retirador de elétrons (−I). Esse efeito dispersa a densidade de carga negativa sobre o ânion cloroacetato formado na ionização, aumentando extraordinariamente a estabilidade da base conjugada e facilitando a liberação do próton H⁺. Portanto, o ácido cloroetanoico tem Ka maior (~1,4 × 10⁻³ contra 1,8 × 10⁻⁵ do acético) e atinge o menor pH da série. Alternativas A e B correspondem a compostos menos ácidos; C não possui o efeito indutivo do cloro; E desconsidera a ionização dos ácidos."],"Haletos orgânicos e compostos sulfurados":["Haletos orgânicos são derivados de hidrocarbonetos pela substituição de um ou mais hidrogênios por halogênios (F, Cl, Br, I). São amplamente utilizados como solventes industriais apolares (como clorofórmio CHCl₃ e diclorometano CH₂Cl₂), monômeros na fabricação de polímeros (como o cloreto de vinila para o PVC) e agrotóxicos persistentes como o DDT (diclorodifeniltricloroetano), cujo uso foi banido por causar bioacumulação e biomagnificação ao longo das cadeias alimentares. Já os compostos sulfurados orgânicos contêm enxofre em sua estrutura, destacando-se os tióis ou mercaptanas (R—SH, análogos aos álcoois) e tioéteres (R—S—R'). Os tióis de baixa massa molar possuem odor extremamente forte e característico de gás estragado ou alho podre, detectável pelo olfato humano em concentrações ínfimas de partes por bilhão. Por essa razão, tióis como o etanotiol (ou terc-butiltiol) são adicionados propositalmente ao gás liquefeito de petróleo (GLP, que é naturalmente inodoro) como agentes odorizantes de segurança para alertar moradores sobre vazamentos acidentais.",["Haletos orgânicos: R—X (X = F, Cl, Br, I); solventes, precursores de PVC, pesticidas","DDT: haleto persistente que sofre bioacumulação nos tecidos adiposos","Tióis (mercaptanas): R—SH (presença do grupo sulfidrila —SH)","Odorizante de GLP: etanotiol (CH₃CH₂SH) adicionado ao gás de cozinha para detecção de vazamentos","Pontes dissulfeto (—S—S—): unem cadeias de proteínas contendo cisteína"],"Cuidado no ENEM: o gás de cozinha (GLP: propano + butano) é TOTALMENTE INODORO! O cheiro característico de 'gás vazando' vem do etanotiol adicionado propositalmente como odorizante de segurança.","O gás liquefeito de petróleo (GLP) utilizado em botijões domésticos é uma mistura predominantemente composta pelos hidrocarbonetos propano e butano, que são naturalmente gases incolores e completamente inodoros. Para garantir a segurança dos consumidores contra riscos de explosão e asfixia por vazamentos imperceptíveis, as distribuidoras de gás adicionam obrigatoriamente traços de etanotiol (CH₃CH₂SH) durante o envasamento.","A adição de etanotiol cumpre a função de segurança porque esse composto pertence à função dos tióis e caracteriza-se por:",["reagir instantaneamente com o ar formando chamas coloridas que sinalizam o escape.","agir como catalisador oxidante que absorve o monóxido de carbono liberado no fogão.","aumentar a densidade do GLP fazendo o gás subir rapidamente para a alta atmosfera.","neutralizar a combustão do propano tornando o GLP ininflamável à temperatura ambiente.","possuir odor penetrante e desagradável perceptível pelo olfato humano mesmo em concentrações extremamente baixas."],4,"Resolução: Os hidrocarbonetos alcanos que compõem o GLP (propano C₃H₈ e butano C₄H₁₀) são substâncias apolares e completamente inodoras. O etanotiol (também denominado etilmercaptana, CH₃CH₂SH) pertence à classe orgânica dos tióis (ou mercaptanas), compostos contendo o grupo funcional sulfidrila (—SH) ligado a carbono. Os tióis de baixa massa molar apresentam um odor característico fétido e nauseante (semelhante a repolho podre ou ovos estragados), ao qual o sistema olfativo humano é excepcionalmente sensível, sendo capaz de detectá-lo em concentrações diminutas da ordem de 1 a 2 partes por bilhão (ppb). Assim, ao menor vazamento de GLP, os ocupantes do imóvel sentem imediatamente o cheiro e fecham o registro antes que a mistura atinja o limite inferior de explosividade no ar. Alternativa A cita combustão; C inverte densidade; D e E formulam afirmações incompatíveis com a função dos combustíveis."],"Gorduras trans e hidrogenação catalítica":["Os óleos vegetais comestíveis (como de soja, milho e girassol) são triacilgliceróis ricos em ácidos graxos insaturados de cadeia longa contendo uma ou mais ligações duplas predominantemente na configuração espacial 'cis' (o que introduz dobras nas cadeias carbônicas, dificultando o empacotamento intermolecular e mantendo-os líquidos à temperatura ambiente). Para transformar esses óleos líquidos em gorduras sólidas ou cremosas com maior prazo de validade e textura adequada para a indústria de biscoitos, sorvetes e margarinas, a indústria utiliza o processo de hidrogenação catalítica parcial (adição de gás H₂ sobre níquel metálico como catalisador a altas temperaturas e pressões). Durante a hidrogenação parcial incompleta, além da saturação de duplas, ocorre a isomerização de ligações duplas remanescentes da conformação natural 'cis' para a conformação espacial 'trans'. As gorduras 'trans' possuem cadeias lineares mais empacotadas que se assemelham às gorduras saturadas, mas seu consumo frequente está diretamente correlacionado ao aumento dos níveis de colesterol LDL ('ruim') e à redução do HDL ('bom'), aumentando drasticamente a incidência de aterosclerose e infarto agudo do miocárdio.",["Óleos vegetais: insaturações na configuração natural 'cis' (líquidos em temp. ambiente)","Hidrogenação catalítica: Óleo insaturado + H₂ (cat. Ni) → Gordura saturada/semi-sólida","Isomerização trans: efeito colateral da hidrogenação parcial (geometria trans)","Gordura trans: cadeia mais linear, maior empacotamento, eleva ponto de fusão","Impacto na saúde: eleva colesterol LDL ('ruim') e reduz HDL ('bom'), causando aterosclerose"],"Cuidado no ENEM: ligação 'cis' tem os hidrogênios no mesmo lado e dobra a cadeia (menos empacotamento, líquido); ligação 'trans' tem os hidrogênios em lados opostos e estica a cadeia (mais empacotamento, sólido e prejudicial à saúde).","A indústria alimentícia submete óleos vegetais líquidos ao processo de hidrogenação catalítica sob pressão com gás hidrogênio na presença de níquel metálico como catalisador para a produção de margarinas e gorduras vegetais hidrogenadas para panificação.","Durante esse processamento industrial, a formação indesejável de gorduras trans decorre da:",["isomerização geométrica de ligações duplas não hidrogenadas da conformação espacial cis para a conformação trans.","eliminação de moléculas de água entre os gliceróis formando éteres cíclicos.","substituição de radicais alquila por grupos carboxila aromáticos saturados.","quebra completa das ligações éster com produção de sabões de sódio solúveis.","transformação fotoquímica dos triglicerídeos em hidrocarbonetos parafínicos voláteis."],0,"Resolução: Nos óleos vegetais naturais, os ácidos graxos insaturados apresentam ligações duplas na geometria cis, na qual os átomos de hidrogênio encontram-se do mesmo lado do plano da insaturação, gerando uma flexão rígida na cadeia alifática. Na hidrogenação catalítica industrial com níquel a temperaturas elevadas, nem todas as ligações duplas são saturadas pelo gás H₂: parte das duplas sofre abertura transitória na superfície do catalisador metálico seguida de fechamento em um arranjo termodinamicamente mais estável com os ligantes em lados opostos (isomerização geométrica cis-trans). As moléculas com configuração trans adquirem conformação retilínea que se empacota fortemente por forças de London, elevando o ponto de fusão da gordura. Seu consumo afeta o metabolismo hepático de lipoproteínas, aumentando o risco cardiovascular. Alternativas A, C, D e E citam processos que nada têm a ver com a formação de ácidos graxos trans."],"Diastereoisômeros e compostos meso":["Quando uma molécula orgânica possui dois ou mais carbonos assimétricos (quirais), o número máximo teórico de estereoisômeros ópticos ativos é dado pela regra de van 't Hoff: 2ⁿ, onde n é o número de carbonos quirais diferentes. Enantiômeros são pares de estereoisômeros que são imagens especulares não sobreponíveis entre si (possuem propriedades físicas escalares idênticas como ponto de fusão, ebulição e densidade, diferindo apenas no desvio angular do plano da luz polarizada para a direita ou esquerda). Diastereoisômeros (ou diastereômeros) são estereoisômeros que NÃO são imagens especulares um do outro; diferentemente dos enantiômeros, os diastereoisômeros possuem propriedades físicas e químicas completamente distintas (pontos de fusão, densidade, solubilidade e estabilidade diferentes), podendo ser separados por técnicas físicas comuns como cristalização fracionada. Um caso de grande relevância no ENEM é o composto 'meso': uma molécula que possui dois ou mais carbonos quirais com ligantes idênticos, mas que apresenta um plano interno de simetria molecular, tornando a molécula como um todo opticamente inativa por compensação interna de rotação óptica.",["Fórmula de van 't Hoff: máximo de 2ⁿ isômeros ópticos ativos (n = C* diferentes)","Enantiômeros: imagens especulares não sobreponíveis; mesmas propriedades físicas escalares","Diastereoisômeros: estereoisômeros que NÃO são imagens especulares; propriedades físicas DIFERENTES","Composto meso: possui carbonos quirais mas tem PLANO INTERNO DE SIMETRIA (opticamente inativo)","Mistura racêmica: mistura equimolar de enantiômeros d e l (opticamente inativa por compensação externa)"],"Cuidado no ENEM: o composto MESO é opticamente inativo por compensação INTERNA (ele próprio tem simetria); a mistura RACÊMICA é inativa por compensação EXTERNA (50% de dextrogiro + 50% de levogiro anulam-se no polarímetro).","O ácido tartárico [ácido 2,3-di-hidroxibutanodioico: HOOC—C*H(OH)—C*H(OH)—COOH] foi estudado historicamente por Louis Pasteur em seus célebres experimentos pioneiros de separação de cristais quirais. A molécula possui dois carbonos assimétricos com conjuntos idênticos de quatro ligantes.","A respeito dos estereoisômeros do ácido tartárico, a forma denominada ácido meso-tartárico caracteriza-se por:",["desviar a luz polarizada em ângulo de 180° por possuir carbono quaternário aromático.","apresentar plano interno de simetria que divide a molécula em duas metades especulares, resultando em inatividade óptica por compensação interna.","constituir uma mistura de 50% de enantiômero dextrogiro e 50% de levogiro separável por filtração simples.","possuir cadeia aberta cíclica com ligações triplas entre os carbonos centrais.","ser um isômero de função que se converte espontaneamente em um éster cíclico no escuro."],1,"Resolução: O ácido tartárico possui dois carbonos quirais (C-2 e C-3) com ligantes idênticos: —H, —OH, —COOH e o restante da cadeia. Quando os grupos hidroxila (—OH) estão posicionados no mesmo lado do plano na projeção de Fischer, a molécula adquire um plano de simetria interno que divide o composto exatamente ao meio: a metade superior é a imagem especular da metade inferior. Essa simetria interna faz com que o desvio da luz polarizada provocado por um dos centros quirais seja cancelado exatamente pelo centro quiral simétrico oposto na mesma molécula (compensação interna). Esse estereoisômero simétrico é denominado forma meso (ácido meso-tartárico) e é opticamente inativo (não desvia a luz polarizada), embora possua carbonos assimétricos. Alternativa A diz que desvia luz; C descreve a mistura racêmica (compensação externa, não forma meso); D e E trazem conceitos absurdos."],"Coeficiente e curvas de solubilidade":["O coeficiente de solubilidade (Cs) é a quantidade máxima de soluto capaz de se dissolver em uma quantidade fixa de solvente (geralmente 100 g de água) a uma determinada temperatura e pressão. Uma solução pode ser insaturada (dissolveu menos que o limite), saturada (atingiu exatamente o Cs) ou supersaturada (contém mais soluto que o Cs em estado metaestável). Quando uma solução saturada é resfriada e a dissolução é endotérmica (a solubilidade aumenta com a temperatura), o excesso de soluto cristaliza formando um corpo de fundo (ou precipitado). A dissolução com absorção de calor (ΔH > 0) tem solubilidade crescente com a temperatura; se for exotérmica (ΔH < 0), a solubilidade diminui com o aquecimento.",["Coeficiente de solubilidade (Cs): g de soluto / 100 g de H₂O","Solução saturada: massa dissolvida = Cs na temperatura","Corpo de fundo (precipitado): excesso não dissolvido além do Cs","Dissolução endotérmica (ΔH > 0): aquece → solubilidade aumenta","Dissolução exotérmica (ΔH < 0): aquece → solubilidade diminui (ex: Ce₂(SO₄)₃ e gases)"],"Cuidado no gráfico: calcule sempre a proporção para a quantidade de água fornecida no problema! Se o gráfico indica solubilidade em 100 g de água e o problema usa 200 g de água, todos os valores dobram.","O gráfico a seguir representa esquematicamente a curva de solubilidade do nitrato de potássio (KNO₃) em água em função da temperatura.\n  <div style=\"text-align:center;margin:12px 0;\">\n    <svg viewBox=\"0 0 320 130\" style=\"width:100%;max-width:320px;height:auto;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px;\">\n      <text x=\"10\" y=\"16\" fill=\"var(--mu)\" font-size=\"11\" font-family=\"sans-serif\">Solubilidade do KNO₃ (g de sal / 100 g de H₂O)</text>\n      <!-- Axes -->\n      <line x1=\"45\" y1=\"105\" x2=\"295\" y2=\"105\" stroke=\"var(--tx)\" stroke-width=\"1.5\"/>\n      <line x1=\"45\" y1=\"105\" x2=\"45\" y2=\"25\" stroke=\"var(--tx)\" stroke-width=\"1.5\"/>\n      <text x=\"25\" y=\"30\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">90</text>\n      <text x=\"25\" y=\"65\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">50</text>\n      <text x=\"25\" y=\"90\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">30</text>\n      <text x=\"40\" y=\"118\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">0</text>\n      <text x=\"110\" y=\"118\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">20°C</text>\n      <text x=\"220\" y=\"118\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">50°C</text>\n      <!-- Curve -->\n      <path d=\"M 45 100 Q 120 85, 230 40\" fill=\"none\" stroke=\"var(--ac)\" stroke-width=\"2.5\"/>\n      <circle cx=\"120\" cy=\"88\" r=\"4\" fill=\"var(--ac)\"/>\n      <text x=\"126\" y=\"85\" fill=\"var(--ac)\" font-size=\"10\" font-family=\"sans-serif\">(20°C, 30g)</text>\n      <circle cx=\"230\" cy=\"40\" r=\"4\" fill=\"var(--ac)\"/>\n      <text x=\"210\" y=\"32\" fill=\"var(--ac)\" font-size=\"10\" font-family=\"sans-serif\">(50°C, 80g)</text>\n    </svg>\n  </div>\n  Um estudante preparou uma solução saturada contendo 80 g de KNO₃ completamente dissolvidos em 100 g de água a 50 °C. Em seguida, essa solução foi lentamente resfriada até 20 °C, em repouso.","Qual a massa de nitrato de potássio que se cristalizou e se depositou como corpo de fundo a 20 °C?",["80 g","30 g","50 g","110 g","20 g"],2,"A 50 °C, os 100 g de água dissolviam exatamente 80 g de KNO₃. Ao resfriar o sistema para 20 °C, o coeficiente de solubilidade do sal cai para 30 g de KNO₃ por 100 g de água. Portanto, a água só consegue manter 30 g de sal dissolvidos; o excedente cristaliza: massa precipitada = 80 g − 30 g = 50 g de corpo de fundo. Alternativa A supõe que todo o sal precipitou; B é a massa que permaneceu dissolvida; D soma as massas; E resulta de subtração incorreta."],"Concentração comum e densidade":["A concentração comum (C) expressa a razão entre a massa do soluto dissolvido (m₁) e o volume total da solução (V): C = m₁ / V, habitualmente em g/L. Já a densidade da solução (d) expressa a razão entre a massa TOTAL da solução (massa do soluto + massa do solvente) e o volume da solução: d = m_total / V, comumente em g/mL ou g/cm³. É um erro clássico confundir concentração comum com densidade: a densidade é uma propriedade intensiva de toda a mistura, enquanto a concentração mede unicamente a quantidade de soluto presente por unidade de volume da solução.",["Concentração comum: C = m₁ / V (g/L)","Densidade da solução: d = m_total / V = (m₁ + m₂) / V (g/mL)","Relação fundamental: C = d · τ (em que τ é o título mássico)","Conversão: 1 g/mL = 1 000 g/L"],"Cuidado no ENEM: Concentração (g/L) usa apenas a massa do SOLUTO no numerador. Densidade (g/L) usa a massa TOTAL da solução!","Para preparar o soro caseiro recomendado pela Organização Mundial da Saúde (OMS) contra a desidratação, uma pessoa dissolve completamente 3,5 g de cloreto de sódio (NaCl) e 20 g de sacarose em água mineral limpa, completando o volume final para exatamente 1,0 L de solução.","Considerando exclusivamente o cloreto de sódio como soluto em questão, qual a concentração comum de NaCl nessa solução em g/L?",["23,5 g/L","20,0 g/L","0,35 g/L","3,5 g/L","1,75 g/L"],3,"A concentração comum em relação a um soluto específico é calculada por C = m_soluto / V_solução. Para o NaCl: C(NaCl) = 3,5 g / 1,0 L = 3,5 g/L. A sacarose é outro soluto presente na solução mista, e a soma das massas (3,5 + 20 = 23,5 g/L, como na alternativa A) corresponderia à concentração total de sólidos solúveis, mas não à concentração do cloreto de sódio. Alternativa B é a concentração da sacarose; D e E resultam de divisões errôneas."],"Concentração molar (molaridade)":["A concentração em quantidade de matéria (concentração molar ou molarid
