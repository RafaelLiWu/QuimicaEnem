reação.","gás inerte que apenas resfria a estratosfera impedindo a absorção de luz visível.","solvente apolar que dissolve a água das nuvens polares formando chuvas ácidas alcalinas.","agente quelante de nitrogênio que retém o oxigênio na forma de nitritos sólidos."],1,"Na estratosfera, os fótons ultravioleta de alta frequência quebram a ligação C—Cl dos CFCs liberando átomos neutros de cloro com um elétron desemparelhado (radicais livres Cl•). Esse radical reage com o ozônio: Cl• + O₃ → ClO• + O₂. Em seguida, o radical intermediário óxido de cloro reage com átomos de oxigênio atômico presentes na estratosfera: ClO• + O• → Cl• + O₂. Somando as etapas, a reação global é O₃ + O• → 2 O₂. O radical cloro Cl• acelera essa transformação diminuindo a energia de ativação e sai do ciclo exatamente como entrou (regenerado intacto), desempenhando perfeitamente a definição clássica de um catalisador químico. Por essa razão, um único radical Cl• é capaz de destruir sequencialmente até centenas de milhares de moléculas de O₃. Alternativa A confunde catalisador com reagente estequiométrico consumido; C, D e E formulam hipóteses erradas."],"Tratamento de água para abastecimento público":["O tratamento de água em uma Estação de Tratamento de Água (ETA) converte água bruta captada de rios e represas em água potável, límpida e microbiologicamente segura para o consumo humano através de uma sequência rigorosa de processos físicos e químicos: 1) Coagulação: adição de um agente coagulante, tipicamente sulfato de alumínio [Al₂(SO₄)₃] ou cloreto férrico, associado à cal virgem [CaO ou Ca(OH)₂] para correção do pH; o hidróxido de alumínio insolúvel formado [Al(OH)₃] neutraliza as cargas elétricas das partículas coloidais de argila e sujeira; 2) Floculação: agitação lenta em tanques com pás, fazendo as partículas coloidais colidirem e formarem flocos maiores e mais densos; 3) Decantação: a água repousa em tanques por gravidade e os flocos pesados sedimentam no fundo; 4) Filtração: a água passa por leitos filtrantes constituídos de camadas sucessivas de antracito, areia e cascalho, que retêm as impurezas residuais que não decantaram; 5) Desinfecção/Cloração: adição de cloro gasoso (Cl₂) ou hipoclorito de sódio (NaClO) que age como agente bactericida oxidante eliminando microrganismos patogênicos; 6) Fluoretação: adição de fluoreto (como ácido fluossilícico) para prevenção da cárie dental na população infantil.",["Ordem sequencial da ETA: Coagulação → Floculação → Decantação → Filtração → Cloração → Fluoretação","Coagulante: sulfato de alumínio Al₂(SO₄)₃ gera hidróxido de alumínio Al(OH)₃ gelatinoso","Decantação: processo físico de separação por diferença de DENSIDADE e gravidade","Filtração: processo físico por diferença de TAMANHO de partículas","Cloração: processo químico oxidante bactericida (desinfecção)","Fluoretação: medida de saúde pública contra cáries dentárias"],"Cuidado com a ordem das etapas da ETA no ENEM: primeiro flocos grandes são formados (coagulação + floculação), depois afundam (decantação), o restante é retido na areia (filtração) e por fim adiciona-se cloro e flúor!","Em uma Estação de Tratamento de Água (ETA) convencional, a água bruta de um rio turvo é submetida a adições de sulfato de alumínio e cal hidratada com forte agitação, passando em seguida por tanques de agitação mecânica lenta antes de alcançar os decantadores.","A finalidade específica da etapa de floculação com agitação mecânica suave é:",["esterilizar a água destruindo a membrana lipídica de vírus e protozoários.","evaporar compostos orgânicos voláteis que conferem odor de barro à água.","promover o choque e a aglomeração das partículas coloidais desestabilizadas, formando flocos maiores e mais densos que sedimentem com facilidade.","ajustar o pH para exatamente 2,0 visando a precipitação de carbonatos solúveis.","dissolver o oxigênio atmosférico para impedir a corrosão das tubulações de ferro fundido."],2,"Na etapa prévia de coagulação rápida, o sulfato de alumínio Al₂(SO₄)₃ reage com a cal formando o precipitado gelatinoso de hidróxido de alumínio Al(OH)₃, que desestabiliza eletrostaticamente as partículas coloidais em suspensão (argila, matéria orgânica) que deixam de se repelir. Em seguida, na etapa de floculação, a água é agitada de forma lenta e controlada: a velocidade suave permite que as partículas colidam entre si e se agreguem aos precipitados de Al(OH)₃ formando aglomerados volumosos ('flocos') sem que sejam rompidos pela turbulência. Esses flocos adquirem massa e densidade suficientes para decantar rapidamente por gravidade na etapa subsequente. Alternativa A refere-se à desinfecção/cloração; B refere-se à aeração; D propõe um pH fortemente ácido destrutivo; E refere-se à aeração para fins de controle de gases."],"Tratamento de esgoto, lixo e compostagem":["O tratamento de esgoto doméstico em Estações de Tratamento de Esgoto (ETE) remove poluentes orgânicos e patogênicos antes do descarte no corpo receptor. O tratamento biológico secundário baseia-se em lodos ativados aeróbios: ar é insuflado no esgoto para que bactérias aeróbias degradem a matéria orgânica em CO₂ e água, reduzindo a Demanda Bioquímica de Oxigênio (DBO). Em relação aos resíduos sólidos urbanos (lixo): 1) Lixão a céu aberto: método irregular e poluidor que contamina o lençol freático com chorume (líquido escuro de alta carga poluidora e metais pesados) e prolifera vetores de doenças; 2) Aterro sanitário: técnica de engenharia ambiental onde o solo é impermeabilizado com mantas de PEAD e argila, com captação e tratamento do chorume e drenagem do biogás gerado na digestão anaeróbia (rico em gás metano CH₄ e CO₂), que pode ser queimado ou aproveitado energeticamente para geração de eletricidade; 3) Compostagem: reciclagem biológica de matéria orgânica gerando adubo natural fértil.",["Aterro sanitário: solo impermeabilizado com PEAD + drenagem de chorume + queima/aproveitamento do biogás (CH₄)","Chorume: efluente líquido escuro gerado na decomposição de resíduos orgânicos; contamina lençol freático se não isolado","Biogás de aterro: ~50-60% de metano (CH₄) e 40-50% de CO₂","Compostagem: decomposição biológica aeróbia de resíduos orgânicos gerando húmus/adubo","Tratamento de esgoto (lodos ativados): bactérias aeróbias reduzem a DBO (Demanda Bioquímica de Oxigênio)"],"Cuidado no ENEM: no aterro sanitário, o biogás DEVE ser queimado ou aproveitado para gerar energia porque o gás metano (CH₄) tem potencial de efeito estufa cerca de 25 vezes maior que o CO₂!","Aterros sanitários adequadamente projetados substituem os lixões clandestinos ao evitar a contaminação do subsolo e mitigar as emissões de gases poluentes para a atmosfera através da instalação de tubulações de drenagem de gases no maciço de resíduos.","O principal gás combustível gerado pela digestão anaeróbia da matéria orgânica em aterros sanitários, passível de aproveitamento termelétrico renovável, é o:",["monóxido de carbono (CO).","ozônio atmosférico (O₃).","dióxido de enxofre (SO₂).","gás metano (CH₄).","gás oxigênio (O₂)."],3,"No interior compacto e sem oxigênio de um aterro sanitário (condições anaeróbias estritas), bactérias metanogênicas realizam a digestão anaeróbia de resíduos orgânicos (restos de alimentos, podas, papel), convertendo carboidratos e lipídios em biogás. A composição típica do biogás de aterro é de aproximadamente 50% a 60% de gás metano (CH₄) e 40% a 50% de dióxido de carbono (CO₂), além de traços de gás sulfídrico. O metano possui elevado poder calorífico e pode ser coletado e queimado em geradores para produzir eletricidade limpa ou ser purificado na forma de biometano para a rede de gás natural. Alternativa A é produto de queima incompleta; C é poluente da queima de enxofre; D e E não são produzidos em digestão anaeróbia."],"Princípios da Química Verde":["A Química Verde (Green Chemistry), concebida no início da década de 1990 por Paul Anastas e John Warner, é uma filosofia científica que propõe o projeto, desenvolvimento e aplicação de produtos químicos e processos industriais que reduzam ou eliminem deliberadamente o uso e a geração de substâncias perigosas e tóxicas para a saúde humana e o meio ambiente. É regida por 12 princípios fundamentais, destacando-se: 1) Prevenção: é melhor prevenir a geração de resíduos do que tratar ou despoluir resíduos após serem criados; 2) Economia atômica: as metodologias de síntese devem ser planejadas para incorporar o máximo de átomos dos reagentes no produto final desejado (evitando a geração de coprodutos desnecessários); 3) Síntese menos perigosa e produtos seguros; 4) Uso de solventes e auxiliares mais seguros (como água ou CO₂ supercrítico, reduzindo solventes clorados voláteis); 5) Eficiência energética (reações à temperatura e pressão ambientes); 6) Uso de matérias-primas renováveis (biomassa de cana, óleos vegetais em vez de derivados de petróleo); 7) Catálise: preferir catalisadores seletivos e reutilizáveis em vez de reagentes estequiométricos; 8) Produtos degradáveis após o término da vida útil.",["12 Princípios da Química Verde: prevenir poluição na FONTE do projeto químico","Economia Atômica: % de massa dos reagentes que se transforma no produto útil","Matérias-primas renováveis: uso de biomassa vegetal em vez de fontes fósseis","Catálise: catalisadores aumentam rendimento e diminuem gasto energético e resíduos","Solventes verdes: substituição de solventes orgânicos tóxicos por água ou CO₂ supercrítico"],"Cuidado no ENEM: Química Verde NÃO é apenas limpar a sujeira que a indústria já fez! O conceito central é NÃO CRIAR poluição desde o planejamento da reação na fábrica.","Uma indústria farmacêutica revisou o processo de síntese de um princípio ativo analgésico. No processo original, eram consumidos 500 kg de reagentes estequiométricos e gerados 380 kg de resíduos tóxicos descartados para cada 100 kg de medicamento. A nova rota sintética adotou um catalisador enzimático específico em meio aquoso, gerando 100 kg de medicamento com apenas 15 kg de subprodutos biodegradáveis.","A modificação descrita alinha-se prioritariamente aos princípios da Química Verde conhecidos como:",["geração prioritária de compostos clorados persistentes para prolongar a validade dos frascos.","aumento do uso de reagentes fosforados e eliminação da água como solvente.","substituição de rotas catalíticas por processos estequiométricos de alto consumo de carvão mineral.","condução de reações em fornos nucleares sob radiação ionizante de alta frequência.","maximização da economia atômica, uso de catalisadores e prevenção da geração de resíduos."],4,"A mudança implementada pela indústria ilustra perfeitamente a aplicação dos pilares da Química Verde: 1) Prevenção de resíduos: a quantidade de rejeitos despencou de 380 kg para apenas 15 kg; 2) Uso de catálise: a substituição de reagentes estequiométricos por um catalisador enzimático reutilizável permite atingir taxas reacionais eficientes sob condições brandas; 3) Economia atômica: maior fração da massa dos reagentes foi incorporada no produto útil de interesse; 4) Uso de solventes seguros: emprego de meio aquoso em vez de solventes orgânicos halogenados perigosos. Alternativas A, C, D e E descrevem procedimentos que contrariam frontalmente os 12 princípios da Química Verde."],"Smog fotoquímico e inversão térmica":["O smog fotoquímico (nevoeiro fotoquímico urbano) é uma forma grave de poluição atmosférica típica de grandes metrópoles nos períodos secos com intenso tráfego de veículos automotores e forte radiação solar. Os poluentes primários são os óxidos de nitrogênio (NO e NO₂, formados pela reação entre N₂ e O₂ do ar nas altas temperaturas dos cilindros dos motores) e os compostos orgânicos voláteis (VOCs, hidrocarbonetos não queimados e solventes). Sob a ação dos fótons da luz solar ultravioleta (reações fotoquímicas), o NO₂ sofre fotólise liberando átomos de oxigênio altamente reativos que reagem com o O₂ formando o ozônio troposférico (O₃ ao nível do solo): NO₂ + luz UV → NO + O•; O• + O₂ → O₃. O ozônio na troposfera é um poluente tóxico irritante aos olhos e vias aéreas e um potente oxidante celular. Simultaneamente, formam-se nitratos de peroxiacila (PAN) e aldeídos que compõem uma névoa castanho-amarelada tóxica. O problema é intensificado no inverno pelo fenômeno físico da inversão térmica: em madrugadas frias, uma camada de ar quente sobrepõe-se a uma camada de ar frio aprisionada junto ao solo, bloqueando as correntes de convecção ascendentes e impedindo a dispersão dos poluentes, que se concentram e causam surtos respiratórios na população.",["Smog fotoquímico: poluição urbana formada por luz solar + NO_x + hidrocarbonetos não queimados (VOCs)","Ozônio troposférico (O₃): péssimo na troposfera (poluente oxidante tóxico e irritante respiratório)","Ozônio estratosférico (O₃): ótimo na estratosfera (filtro natural protetor dos raios ultravioleta)","Inversão térmica: camada de ar quente sobre ar frio rente ao solo; bloqueia a convecção e aprisiona poluentes","Catalisadores veiculares: convertem NO_x e CO em N₂ e CO₂ reduzindo os precursores do smog"],"Cuidado no ENEM com o duplo papel do ozônio (O₃): 'Na estratosfera é santo (filtra UV); na troposfera é monstro (poluente tóxico do smog fotoquímico)'!","Em dias frios de inverno em grandes capitais brasileiras como São Paulo, a combinação do fenômeno meteorológico da inversão térmica com o tráfego de milhões de veículos movidos a combustíveis fósseis gera uma névoa densa e acastanhada que provoca ardor nos olhos e picos de internação hospitalar por crises respiratórias infantis.","A respeito da formação do smog fotoquímico e da inversão térmica, constata-se que:",["o ozônio troposférico (ao nível do solo) é um poluente oxidante tóxico formado por reações fotoquímicas entre óxidos de nitrogênio e compostos orgânicos ativadas pela luz solar.","a inversão térmica acelera as correntes de convecção de ar dispersando rapidamente a poluição para o espaço.","o smog é provocado exclusivamente pela queima de madeira em lareiras residenciais sem relação com automóveis.","o ozônio na baixa troposfera é benéfico para a saúde pública por atuar como bactericida inalatório natural.","a névoa acastanhada decorre da evaporação de mercúrio metálico dos termômetros hospitalares."],0,"Resolução: O smog fotoquímico (termo derivado da contração em inglês de 'smoke' [fumaça] e 'fog' [nevoeiro]) é gerado a partir da interação de poluentes primários emitidos pelos canos de escape veiculares (óxidos de nitrogênio NO_x e vapores de hidrocarbonetos não queimados) ativados cataliticamente pela luz solar. A radiação UV solar decompõe o NO₂ gerando radicais livres de oxigênio que se unem ao O₂ formando o ozônio (O₃). Enquanto o ozônio na estratosfera é vital por filtrar a radiação UV, o ozônio presente na troposfera (ao nível do solo) é um poluente secundário altamente reativo e perigoso: sendo um agente oxidante enérgico, ele agride os tecidos celulares dos brônquios e alvéolos pulmonares, provocando inflamação, tosse, irritação ocular e agravamento de asma. O fenômeno da inversão térmica retém uma camada de ar frio e denso colada à superfície sob uma camada superior de ar quente; a ausência de circulação vertical de ar impede a dispersão da névoa tóxica, concentrando os poluentes na zona habitada. Alternativas A, C, D e E contêm erros graves de física e biologia ambiental."],"Acidificação dos oceanos por dióxido de carbono":["Os oceanos cobrem cerca de 71% da superfície da Terra e atuam como gigantescos sumidouros naturais de carbono, tendo absorvido mais de 25% a 30% de todo o dióxido de carbono (CO₂) emitido pela atividade industrial antrópica desde a Revolução Industrial. A dissolução do CO₂ gasoso na água do mar desencadeia uma sequência de equilíbrios químicos: 1) CO₂(g) ⇌ CO₂(aq); 2) CO₂(aq) + H₂O(l) ⇌ H₂CO₃(aq) (ácido carbônico); 3) H₂CO₃(aq) ⇌ H⁺(aq) + HCO₃⁻(aq) (ionização do ácido liberando íons H⁺); 4) O excesso de íons H⁺ reage com os íons carbonato livres dissolvidos na água do mar: H⁺(aq) + CO₃²⁻(aq) ⇌ HCO₃⁻(aq). Essa reação consome os íons carbonato (CO₃²⁻), diminuindo drasticamente sua disponibilidade na água marinha. Como os organismos marinhos calcificadores (corais formadores de recifes, moluscos com conchas, mexilhões, equinodermos e fitoplâncton como cocolitoforídeos) dependem dos íons carbonato para sintetizar suas carapaças e exoesqueletos minerais de carbonato de cálcio [Ca²⁺(aq) + CO₃²⁻(aq) ⇌ CaCO₃(s)], a queda na concentração de CO₃²⁻ desestabiliza e corrói as estruturas de calcário, ameaçando a base de toda a teia trófica marinha mundial.",["Mecanismo: Excesso de CO₂ atmosférico → dissolve no mar → forma H₂CO₃ → libera H⁺ (acidifica o mar)","Consumo de carbonato: H⁺ + CO₃²⁻ ⇌ HCO₃⁻ (reduz os íons CO₃²⁻ livres na água)","Impacto em corais e conchas: Ca²⁺ + CO₃²⁻ ⇌ CaCO₃(s) (dificulta a calcificação e dissolve o esqueleto calcário)","Queda de pH marinho: o pH médio dos oceanos já caiu de 8,2 para 8,1 (aumento de ~30% na acidez pelo logaritmo)","Consequência ecológica: branqueamento de corais e destruição dos berçários da biodiversidade marinha"],"Cuidado no ENEM: o mar NÃO fica com pH abaixo de 7! Ele continua levemente básico, mas seu pH caiu de ~8,2 para ~8,1 (isso é uma ACIDIFICAÇÃO, pois o pH diminuiu e a acidez aumentou 30% na escala logarítmica)!","Relatórios da Organização das Nações Unidas (ONU) e do IPCC alertam que a queima acelerada de combustíveis fósseis não apenas intensifica o efeito estufa na atmosfera, mas provoca simultaneamente a grave acidificação das águas dos oceanos em escala planetária.","O impacto bioquímico direto da acidificação marinha sobre os recifes de corais e moluscos com conchas decorre do fato de que:",["o CO₂ dissolve os metais nobres dos navios envenenando os peixes por eletrólise.","o aumento de íons H⁺ na água do mar reage com os íons carbonato (CO₃²⁻), reduzindo sua disponibilidade e dificultando a formação e manutenção do carbonato de cálcio (CaCO₃) das conchas e esqueletos.","a água do mar atinge pH ácido extremo igual a 1,0, evaporando instantaneamente todos os recifes.","as conchas de moluscos são compostas por proteínas de celulose que sofrem combustão espontânea.","o excesso de gás carbônico impede a fotossíntese do fitoplâncton marinho por congelamento de água."],1,"Resolução: O dióxido de carbono atmosférico dissolve-se na superfície oceânica e reage com a água formando ácido carbônico: CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻. Esse processo libera íons hidrogênio (H⁺), elevando a acidez da água do mar. Na água salgada existem íons carbonato livres (CO₃²⁻), fundamentais para os organismos calcificadores (corais, ostras, mariscos, caracóis marinhos) que os combinam com íons cálcio para precipitar o mineral carbonato de cálcio: Ca²⁺(aq) + CO₃²⁻(aq) ⇌ CaCO₃(s). No entanto, os íons H⁺ excedentes possuem enorme afinidade química pelo carbonato, reagindo com ele: H⁺ + CO₃²⁻ ⇌ HCO₃⁻ (íon bicarbonato). Com isso, a concentração de carbonato livre no oceano despenca vertiginosamente. Pelo Princípio de Le Chatelier, a escassez de CO₃²⁻ desloca o equilíbrio de calcificação no sentido de dissolução do carbonato de cálcio [CaCO₃(s) → Ca²⁺ + CO₃²⁻], tornando as conchas finas, quebradiças e deformadas, além de dissolver a estrutura rochosa dos recifes de corais que abrigam 25% da vida marinha. Alternativa A cita metais; C exagera o pH; D erra a composição da concha (que é CaCO₃ mineral, não celulose); E formula alegação absurda."],"Poluição por metais pesados e bioacumulação":["Metais pesados são elementos químicos metálicos de densidade elevada (geralmente superior a 5 g/cm³) e alta toxicidade mesmo em concentrações minúsculas de traços, destacando-se o mercúrio (Hg), o chumbo (Pb), o cádmio (Cd) e o cromo hexavalente (Cr⁶⁺). Os metais pesados não são biodegradáveis (não sofrem decomposição biológica) e ligam-se avidamente a grupos tiol (—SH) de enzimas e proteínas no organismo humano, inibindo processos metabólicos fundamentais e causando danos neurológicos graves, falência renal e mutações cancerígenas. Dois conceitos ecológicos cruciais frequentemente cobrados no ENEM: 1) Bioacumulação: é a retenção e aumento progressivo da concentração de um poluente no corpo de um único indivíduo ao longo de sua vida, ocorrendo quando a taxa de absorção supera a capacidade de eliminação corporal (ex: acúmulo de mercúrio nos tecidos de um peixe); 2) Biomagnificação trófica (ou amplificação biológica): é o acúmulo crescente do poluente ao longo dos sucessivos níveis de uma cadeia alimentar; os produtores absorvem pequenas concentrações do meio, os herbívoros acumulam ao se alimentar de muitos produtores, e os predadores de topo (como peixes carnívoros maiores e o ser humano) acumulam as maiores concentrações de toxina em seus tecidos, sofrendo os danos mais devastadores (ex: contaminação por metilmercúrio em garimpos de ouro na Amazônia e o histórico Mal de Minamata no Japão).",["Metais pesados tóxicos: Mercúrio (Hg), Chumbo (Pb), Cádmio (Cd), Cromo (Cr)","Não biodegradáveis: persistem indefinidamente no ambiente","Bioacumulação: acúmulo do metal no tecido adiposo e muscular de um indivíduo ao longo do tempo","Biomagnificação trófica: concentração do metal AUMENTA a cada nível trófico da cadeia alimentar","Consumidores de topo (homem, grandes predadores): sofrem a maior contaminação e toxicidade","Garimpo de ouro: uso de mercúrio para formar amálgama com o ouro contamina rios e populações ribeirinhas"],"Cuidado no ENEM: na cadeia alimentar, quem tem a MAIOR concentração de mercúrio ou chumbo é SEMPRE o consumidor do TOPO da cadeia (o predador carnívoro final), devido à biomagnificação trófica!","Em áreas de garimpo clandestino de ouro na bacia amazônica, o mercúrio metálico (Hg) é utilizado para amalgamar o ouro particulado nos sedimentos fluviais e depois queimado com maçarico, sendo despejado nos rios. Bactérias anaeróbias presentes no leito do rio convertem o mercúrio inorgânico no composto lipossolúvel metilmercúrio [CH₃Hg]⁺, altamente tóxico.","Em um ecossistema aquático amazônico composto por fitoplâncton (produtores), pequenos peixes herbívoros, peixes carnívoros e ariranhas (predadores de topo), qual nível trófico apresentará a maior concentração de metilmercúrio por grama de tecido biológico?",["O fitoplâncton, por estar em contato direto com a água do rio.","Os peixes herbívoros, por consumirem diretamente os produtores vegetais.","As ariranhas (predadores de topo), em razão do processo ecológico de biomagnificação trófica.","A água do rio, por ser a fonte primária de onde todo o metal se origina.","Todos os seres vivos da cadeia alimentar apresentarão concentrações rigorosamente idênticas do metal."],2,"Resolução: O metilmercúrio é um composto organometálico lipossolúvel que é facilmente absorvido pelos tecidos biológicos e dificilmente excretado pelos animais, acumulando-se preferencialmente no sistema nervoso e musculatura (bioacumulação). Quando uma substância não biodegradável e persistente entra em uma cadeia alimentar, ocorre o fenômeno ecológico da biomagnificação trófica (ou amplificação biológica): os produtores (fitoplâncton) absorvem pequenas doses da água; cada peixe herbívoro consome milhares de microalgas ao longo da vida, concentrando o mercúrio em seus tecidos; cada peixe carnívoro consome dezenas de peixes herbívoros, amplificando ainda mais a carga tóxica; por fim, a ariranha (ou o ser humano ribeirinho), posicionada no topo da cadeia trófica, ingere centenas de peixes carnívoros, acumulando a dose máxima e mais letal de mercúrio por grama de biomassa. Alternativas A e B ignoram a amplificação trófica; C confunde meio abiótico com tecido biológico; E desconsidera a dinâmica de transferência trófica."],"Agrotóxicos, biomagnificação e persistência ambiental":["Agrotóxicos (pesticidas, defensivos agrícolas) são substâncias químicas sintéticas aplicadas na agricultura para controlar pragas, fungos, ervas daninhas e insetos vetores de doenças. Dividem-se em diferentes classes químicas com comportamentos ambientais contrastantes: 1) Organoclorados (ex: DDT, aldrin, endossulfam): compostos aromáticos clorados extremamente estáveis quimicamente e resistentes à degradação biológica e fotolítica (poluentes orgânicos persistentes, POPs). São apolares e altamente lipossolúveis (armazenam-se no tecido adiposo e gorduras corporais de animais), sofrendo severa biomagnificação trófica ao longo das cadeias alimentares (o DDT provocava o afinamento das cascas de ovos de aves de rapina ameaçando-as de extinção, o que levou ao seu banimento global pela Convenção de Estocolmo); 2) Organofosforados e Carbamatos: compostos biodegradáveis de menor persistência ambiental no solo, porém de elevadíssima toxicidade aguda para os trabalhadores rurais por agirem como potentes inibidores irreversíveis da enzima acetilcolinesterase, causando colapso no sistema nervoso periférico; 3) Piretroides: derivados sintéticos do piretro vegetal de menor toxicidade para mamíferos, porém altamente letais para abelhas e polinizadores vitais. A agricultura sustentável e o Manejo Integrado de Pragas (MIP) priorizam o controle biológico natural para mitigar a dependência de praguicidas sintéticos.",["Organoclorados (como o DDT): alta persistência ambiental, apolares, lipossolúveis, sofrem biomagnificação trófica","Poluentes Orgânicos Persistentes (POPs): proibidos pela Convenção de Estocolmo","Organofosforados: menor persistência no ambiente, mas altíssima toxicidade aguda (inibem acetilcolinesterase)","Contaminação de lençóis freáticos: lixiviação de pesticidas polares pelas chuvas","Manejo Integrado de Pragas (MIP): controle biológico com predadores naturais reduzindo o uso de químicos"],"Cuidado no ENEM: o DDT é um composto APOLAR e LIPOSSOLÚVEL (solúvel em gordura)! Por isso ele não é eliminado na urina (que é aquosa polar) e fica guardado na gordura do animal a vida inteira.","O inseticida sintético diclorodifeniltricloroetano (DDT) foi amplamente pulverizado no mundo na agricultura e no combate ao mosquito da malária em meados do século XX, até ser formalmente banido globalmente após a publicação do livro 'Primavera Silenciosa' de Rachel Carson.","A proibição do uso de inseticidas da classe dos organoclorados como o DDT foi motivada pelo fato de esses compostos apresentarem:",["alta solubilidade em água e degradação microbiológica ultrarrápida em menos de vinte e quatro horas.","caráter alcalino forte que neutraliza o ácido clorídrico dos estômagos dos mamíferos.","comportamento puramente gasoso que destrói a camada de ozônio por fissão atômica.","elevada persistência química no ambiente, caráter lipossolúvel que promove o acúmulo nos tecidos gordurosos e biomagnificação ao longo da cadeia trófica.","capacidade de transformar a água dos rios em petróleo puro não refinado."],3,"Resolução: O DDT e seus análogos organoclorados são substâncias orgânicas sintéticas que possuem grande número de átomos de cloro ligados a anéis aromáticos e cadeias de carbono. Essa estrutura confere duas propriedades ambientais danosas: 1) Elevada estabilidade e persistência química: as ligações carbono-cloro são difíceis de serem quebradas pela luz solar (fotólise) ou por bactérias do solo (biodegradação), fazendo o poluente permanecer ativo no ecossistema por muitas décadas; 2) Alta lipossolubilidade (afinidade por lipídios e gorduras) e baixíssima hidrossolubilidade: ao ser ingerido por animais, o DDT não se dissolve na água e não pode ser excretado pelos rins na urina, acumulando-se cumulativamente no tecido adiposo dos seres vivos (bioacumulação). Ao longo da teia trófica, a ingestão sucessiva de presas contaminadas faz a concentração de DDT multiplicar-se exponencialmente nos predadores de topo (biomagnificação), causando desregulação endócrina, câncer e colapso na reprodução da fauna. Alternativa A cita degradação rápida; C, D e E trazem hipóteses sem fundamento científico."],"Ligação iônica e propriedades dos compostos iônicos":["A ligação iônica se estabelece pela transferência definitiva de um ou mais elétrons de um átomo de baixa eletronegatividade (metal) para um átomo de alta eletronegatividade (ametal ou hidrogênio), resultando em cátions e ânions que se atraem fortemente por forças eletrostáticas em todas as direções espaciais. Os compostos iônicos não formam moléculas isoladas, mas sim um retículo cristalino tridimensional ordenado (como no NaCl). Em razão dessa robusta rede cristalina, os compostos iônicos apresentam pontos de fusão e ebulição bastante elevados, são sólidos e duros à temperatura ambiente, porém quebradiços (o impacto mecânico alinha íons de mesma carga gerando repulsão que fratura o cristal). No estado sólido cristalino, os íons estão presos em posições fixas, não conduzindo eletricidade; no entanto, quando fundidos (líquidos) ou dissolvidos em água (em solução aquosa), os íons ganham livre mobilidade e passam a conduzir brilhantemente a corrente elétrica.",["Ligação iônica: Metal (perde e⁻, cátion) + Ametal (ganha e⁻, ânion)","Estrutura: retículo cristalino tridimensional iônico rígido","Pontos de fusão e ebulição: elevados (> 800 °C no NaCl)","Condutibilidade elétrica: NÃO conduzem no estado sólido!","Conduzem corrente elétrica: FUNDIDOS (líquidos) ou DISSOLVIDOS em água (solução aquosa)"],"Cuidado com o teste de lâmpada no ENEM: sal de cozinha sólido (NaCl seco) NÃO acende a lâmpada! Mas ao jogar o sal na água ou derretê-lo no fogo, a lâmpada acende imediatamente porque os íons ficam livres para migrar.","Em uma aula prática de laboratório, um professor entregou aos alunos uma amostra sólida branca e cristalina da substância X, que apresenta ponto de fusão superior a 750 °C. Ao montar um circuito elétrico com pilha e lâmpada e tocar as pontas de prova no sólido seco, a lâmpada permaneceu apagada. Em seguida, ao dissolver uma colher da substância X em água destilada ou ao fundi-la com auxílio de bico de Bunsen, a lâmpada acendeu com forte intensidade luminosa.","Com base nas propriedades experimentais descritas, a substância X é constituída por:",["moléculas apolares unidas por fracas forças de dispersão de London.","átomos metálicos livres imersos em um mar de elétrons deslocalizados.","uma rede covalente de átomos neutros de silício com ligações sp³.","moléculas orgânicas polares unidas exclusivamente por ligações de hidrogênio.","íons com cargas opostas unidos por fortes ligações eletrostáticas iônicas."],4,"As características experimentais observadas identificam indubitavelmente um composto iônico: 1) Alto ponto de fusão (> 750 °C), típico da energia de rede eletrostática que une cátions e ânions; 2) Ausência de condução de corrente elétrica no estado sólido, pois os íons encontram-se travados em suas posições no retículo cristalino, impedindo o fluxo ordenado de cargas; 3) Elevada condutibilidade elétrica quando fundido ou em solução aquosa, momento em que ocorre a dissociação iônica e os íons adquirem livre mobilidade para transportar carga até os eletrodos. A alternativa A descreveria substâncias com baixo ponto de fusão (como ceras ou iodo); B descreveria sólidos de rede covalente como quartzo (que não conduzem fundidos); D descreveria compostos moleculares como o açúcar (que não conduz em água); E descreveria metais (que conduzem no estado sólido)."],"Ligação covalente e regra do octeto":["A ligação covalente forma-se pelo compartilhamento de um ou mais pares de elétrons entre átomos de elevada eletronegatividade (ametais e hidrogênio). Pela Regra do Octeto (Lewis), os átomos ligam-se tendendo a atingir uma configuração eletrônica estável semelhante à dos gases nobres, completando 8 elétrons na camada de valência (ou 2 elétrons no caso do hidrogênio, que imita o hélio). Cada par compartilhado constitui uma ligação covalente, que pode ser simples (1 par, ligação sigma σ), dupla (2 pares, 1 σ e 1 π) ou tripla (3 pares, 1 σ e 2 π). Existem importantes exceções à regra do octeto: contração do octeto (átomos que se estabilizam com menos de 8 elétrons, como o berílio no BeCl₂ com 4 elétrons e o boro no BF₃ com 6 elétrons) e expansão do octeto (elementos a partir do 3º período que acomodam mais de 8 elétrons na valência utilizando orbitais d vazios, como o fósforo no PCl₅ com 10 elétrons e o enxofre no SF₆ com 12 elétrons).",["Ligação covalente: compartilhamento de pares eletrônicos entre ametais","Ligação simples: 1 par (σ); Dupla: 2 pares (1 σ + 1 π); Tripla: 3 pares (1 σ + 2 π)","Regra do octeto: átomos completam 8 elétrons na camada de valência","Exceções por contração do octeto: Be (estável com 4 e⁻), B (estável com 6 e⁻ no BF₃)","Exceções por expansão do octeto: PCl₅ (10 e⁻ na valência do P), SF₆ (12 e⁻ na valência do S)"],"Cuidado no ENEM: o trifluoreto de boro (BF₃) é o clássico exemplo de contração do octeto: o boro fica estável com apenas 6 elétrons na valência e por isso atua como forte ácido de Lewis (aceita par de elétrons)!","O trifluoreto de boro (BF₃) é um gás incolor e tóxico, amplamente utilizado em síntese orgânica como catalisador de Friedel-Crafts por se comportar como um potente ácido de Lewis capaz de receber pares de elétrons de bases orgânicas.","Considerando a distribuição eletrônica dos átomos (Boro, Z = 5; Flúor, Z = 9), a estrutura de Lewis da molécula de BF₃ evidencia que:",["o átomo central de boro estabiliza-se com apenas seis elétrons na sua camada de valência, constituindo uma exceção por contração do octeto.","o boro transfere integralmente seus três elétrons de valência para os átomos de flúor formando uma ligação puramente iônica.","o átomo de boro segue rigorosamente a regra do octeto formando quatro ligações covalentes duplas.","o átomo de boro sofre expansão de octeto acumulando dez elétrons em orbitais d vazios.","cada átomo de flúor compartilha três pares eletrônicos com o boro formando ligações triplas estáveis."],0,"O átomo de boro (Z = 5) possui 3 elétrons na camada de valência (distribuição 1s² 2s² 2p¹). O átomo de flúor (Z = 9) possui 7 elétrons na valência e necessita de 1 elétron compartilhado para completar seu octeto. Na molécula de BF₃, o boro forma três ligações covalentes simples com três átomos de flúor, compartilhando seus 3 elétrons. Com isso, cada átomo de flúor atinge o octeto (8 elétrons), enquanto o boro atinge um total de 6 elétrons na camada de valência, sem pares eletrônicos não ligantes restantes. Por estabilizar-se com apenas 6 elétrons (e não 8), o BF₃ é uma das exceções clássicas à regra do octeto por deficiência de elétrons, o que justifica sua avidez por receber pares eletrônicos (ácido de Lewis). Alternativas A, C, D e E descrevem ligações ou configurações eletrônicas inexistentes no BF₃."],"Geometria molecular (modelo VSEPR)":["A geometria molecular descreve o arranjo tridimensional dos átomos em uma molécula no espaço e é prevista pela Teoria da Repulsão dos Pares Eletrônicos da Camada de Valência (VSEPR). Os pares de elétrons (ligantes ou não ligantes) ao redor do átomo central comportam-se como nuvens eletrônicas carregadas negativamente que se repelem mutuamente, posicionando-se à máxima distância angular possível. Cada ligação simples, dupla, tripla ou par de elétrons livres conta como 1 única nuvem eletrônica: 1) 2 nuvens: geometria LINEAR (ângulo de 180°, ex: BeCl₂, CO₂, HCN); 2) 3 nuvens: 3 ligantes = TRIGONAL PLANA (120°, ex: BF₃, SO₃, formol); 2 ligantes + 1 par livre = ANGULAR (~118°, ex: SO₂, O₃); 3) 4 nuvens: 4 ligantes = TETRAÉDRICA (109,5°, ex: CH₄, CCl₄); 3 ligantes + 1 par livre = PIRAMIDAL (~107°, ex: NH₃, PCl₃); 2 ligantes + 2 pares livres = ANGULAR (~104,5°, ex: H₂O, H₂S).",["2 nuvens: Linear (180°) → ex: CO₂, BeCl₂","3 nuvens: Trigonal Plana (120°) → ex: BF₃; Angular (1 par livre) → ex: SO₂","4 nuvens: Tetraédrica (109,5°) → ex: CH₄; Piramidal (1 par livre) → ex: NH₃; Angular (2 pares livres) → ex: H₂O","Pares de elétrons livres: exercem maior repulsão comprimindo os ângulos entre as ligações","Diferença vital: CO₂ é LINEAR (sem par livre no C); H₂O é ANGULAR (oxigênio tem 2 pares livres repulsores)"],"Cuidado no ENEM com a água e o gás carbônico: CO₂ tem 2 nuvens no carbono e é LINEAR. H₂O tem 4 nuvens no oxigênio (2 ligações + 2 pares livres) e é ANGULAR!","Observe as representações estruturais das moléculas de dióxido de carbono (CO₂), água (H₂O) e metano (CH₄):\n  <div style=\"text-align:center;margin:12px 0;\">\n    <svg viewBox=\"0 0 350 90\" style=\"width:100%;max-width:350px;height:auto;background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px;\">\n      <text x=\"10\" y=\"16\" fill=\"var(--mu)\" font-size=\"11\" font-family=\"sans-serif\">Geometrias Moleculares (VSEPR)</text>\n      <!-- CO2 -->\n      <text x=\"25\" y=\"55\" fill=\"var(--tx)\" font-size=\"13\" font-family=\"sans-serif\">O = C = O</text>\n      <text x=\"35\" y=\"75\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">Linear (180°)</text>\n      <!-- H2O -->\n      <path d=\"M 135 65 L 150 45 L 165 65\" fill=\"none\" stroke=\"var(--tx)\" stroke-width=\"2\"/>\n      <text x=\"145\" y=\"40\" fill=\"var(--tx)\" font-size=\"12\" font-family=\"sans-serif\">O</text>\n      <text x=\"127\" y=\"75\" fill=\"var(--tx)\" font-size=\"12\" font-family=\"sans-serif\">H</text>\n      <text x=\"165\" y=\"75\" fill=\"var(--tx)\" font-size=\"12\" font-family=\"sans-serif\">H</text>\n      <text x=\"130\" y=\"85\" fill=\"var(--mu)\" font-size=\"9\" font-family=\"sans-serif\">Angular (104,5°)</text>\n      <!-- CH4 -->\n      <text x=\"245\" y=\"55\" fill=\"var(--tx)\" font-size=\"13\" font-family=\"sans-serif\">CH₄</text>\n      <text x=\"225\" y=\"75\" fill=\"var(--mu)\" font-size=\"10\" font-family=\"sans-serif\">Tetraédrica (109,5°)</text>\n    </svg>\n  </div>","De acordo com a teoria da repulsão dos pares eletrônicos (VSEPR), a molécula de água apresenta geometria angular, e não linear como a do CO₂, porque:",["o átomo de oxigênio atrai os hidrogênios por forças de dispersão de London assimétricas.","o oxigênio na água possui dois pares de elétrons não ligantes que repelem fortemente as ligações O—H para baixo.","a ligação O—H é uma ligação iônica pura com atração magnética angular.","o átomo de oxigênio sofre hibridização do tipo sp gerando geometria triangular.","a água possui massa molar muito inferior à do gás carbônico impedindo o alinhamento linear dos átomos."],1,"Na molécula de CO₂ (O=C=O), o carbono central realiza duas ligações duplas e não possui elétrons livres na camada de valência (2 nuvens eletrônicas), adotando arranjo linear com ângulo de 180°. Já na molécula de água (H₂O), o átomo central de oxigênio possui 6 elétrons de valência: 2 elétrons são compartilhados nas duas ligações simples com os hidrogênios e restam 4 elétrons livres não ligantes distribuídos em 2 pares isolados. Portanto, há um total de 4 nuvens eletrônicas ao redor do oxigênio dispostas em arranjo tetraédrico distorcido. Os dois pares de elétrons livres exercem intensa repulsão eletrostática sobre os pares ligantes, empurrando as ligações O—H para baixo e fechando o ângulo para aproximadamente 104,5°, o que confere à água sua indispensável geometria molecular angular. Alternativas A, C, D e E trazem justificativas cientificamente estapafúrdias."],"Polaridade de ligações e de moléculas":["A polaridade de uma ligação covalente decorre da diferença de eletronegatividade entre os átomos ligados: se os átomos forem iguais (como no H₂ ou Cl₂), a diferença é nula e a ligação é APOLAR; se forem elementos diferentes com eletronegatividades distintas (como H—Cl ou C=O), o par de elétrons é atraído mais fortemente pelo átomo mais eletronegativo gerando polos parciais (ligação POLAR, com momento dipolar de ligação não nulo). No entanto, a polaridade da MOLÉCULA COMO UM TODO depende da soma vetorial de todos os momentos dipolares (μ_R) levando em conta a geometria molecular espacial: 1) Molécula APOLAR: os vetores dipolo anulam-se por simetria geométrica, resultando em momento dipolar resultante nulo (μ_R = 0), como em CO₂ (linear simétrico), CCl₄ e CH₄ (tetraédricos simétricos) e BF₃ (trigonal plano); 2) Molécula POLAR: os vetores não se anulam devido à assimetria (μ_R ≠ 0), como em H₂O, NH₃, SO₂ e CHCl₃. A solubilidade segue o princípio: substâncias polares dissolvem substâncias polares, e apolares dissolvem apolares.",["Ligação polar: diferença de eletronegatividade (F > O > N > Cl > Br > I > S > C > P > H)","Vetor momento dipolar resultante (μ_R): soma vetorial no espaço","Molécula apolar (μ_R = 0): vetores cancelam-se por simetria (ex: CO₂, CH₄, CCl₄, BF₃)","Molécula polar (μ_R ≠ 0): vetores não se anulam por assimetria (ex: H₂O, NH₃, CHCl₃)","Regra da solubilidade: 'semelhante dissolve semelhante' (polar com polar; apolar com apolar)"],"Cuidado no ENEM: ligação polar NÃO garante molécula polar! O tetracloreto de carbono (CCl₄) e o CO₂ têm ligações altamente polares, mas as moléculas são APOLARES porque os vetores se anulam por simetria!","O dióxido de carbono (CO₂) e o dióxido de enxofre (SO₂) são dois gases óxidos associados a questões ambientais urbanas. Ambos possuem fórmulas estequiométricas análogas formadas por um átomo central ligado a dois oxigênios por ligações duplas polares. Contudo, em testes de laboratório com campo elétrico entre placas carregadas, os jatos de SO₂ gasoso sofrem desvio perceptível em direção às placas, enquanto o CO₂ não sofre desvio algum.","Essa diferença de comportamento físico em campo elétrico decorre do fato de que:",["o CO₂ é uma molécula angular de momento dipolar permanente elevado.","o SO₂ é uma molécula linear simétrica em que os momentos dipolares se cancelam totalmente.","o CO₂ possui geometria linear e momento dipolar resultante nulo (apolar), enquanto o SO₂ possui geometria angular e momento dipolar resultante diferente de zero (polar).","o enxofre é um metal de alta densidade que atrai elétrons por indução magnética.","o oxigênio no dióxido de carbono é apolar, enquanto no dióxido de enxofre o oxigênio é iônico."],2,"Na molécula de CO₂ (O=C=O), o carbono central tem hibridização sp e geometria linear (180°). Embora cada ligação C=O seja polar, os dois vetores dipolo elétrico apontam em sentidos diametralmente opostos com mesma intensidade, cancelando-se mutuamente (μ_R = 0): o CO₂ é uma molécula apolar que não sofre atração por campos elétricos externos. Já no SO₂, o enxofre central realiza ligações com dois oxigênios e possui um par de elétrons livres não ligantes na camada de valência (3 nuvens eletrônicas). A repulsão exercida pelo par livre curva as ligações conferindo geometria angular (ângulo de ~119°); nessa disposição assimétrica, os momentos dipolares das ligações S=O não se anulam, gerando um momento dipolar resultante não nulo (μ_R ≠ 0): o SO₂ é uma molécula polar e orienta seu dipolo na presença de campo elétrico. Alternativas A e B invertem as geometrias e polaridades; D e E trazem disparates conceituais."],"Forças intermoleculares (London, dipolo-dipolo e lig. H)":["As forças intermoleculares são atrações eletrostáticas que mantêm as moléculas unidas nos estados líquido e sólido. São consideravelmente mais fracas que as ligações intramoleculares iônicas e covalentes, mas determinam propriedades fundamentais como ponto de ebulição, viscosidade e solubilidade. Dividem-se em três tipos principais: 1) Forças de dispersão de London (dipolo induzido-dipolo induzido): ocorrem entre todas as moléculas, mas são a ÚNICA força atuante entre moléculas apolares (como O₂, N₂, CH₄, CO₂ e hidrocarbonetos da gasolina); resultam de flutuações instantâneas na nuvem eletrônica e aumentam de intensidade com o aumento da massa molar e da superfície de contato; 2) Interações dipolo-dipolo (dipolo permanente): ocorrem entre moléculas polares que não possuem hidrogênio ligado a FON (como HCl, H₂S, acetona); 3) Ligações de hidrogênio (antigas pontes de hidrogênio): tipo especial e extremamente intenso de atração dipolo-dipolo que ocorre exclusivamente quando o hidrogênio está covalentemente ligado a átomos muito pequenos e muito eletronegativos: Flúor, Oxigênio ou Nitrogênio (F, O, N), como em H₂O, HF, NH₃, álcoois e ácidos carboxílicos.",["Dipolo induzido (London): em moléculas apolares (O₂, N₂, CₙH₂ₙ₊₂, CO₂)","Dipolo-dipolo permanente: em moléculas polares comuns (HCl, H₂S, éteres)","Ligação de hidrogênio: atração FORTÍSSIMA entre H e F, O, N (FON) de moléculas vizinhas","Ordem de intensidade intermolecular: Ligação de H > Dipolo-dipolo > London (para massas semelhantes)","Massa molar maior: amplia nuvem eletrônica e fortalece as forças de London"],"Mnemônica de ouro para o ENEM: para ter ligação de hidrogênio, o H tem que estar colado em F-O-N (Flúor, Oxigênio ou Nitrogênio). Se o oxigênio não estiver ligado ao H (como em éteres ou cetonas), a molécula NÃO faz ligação de hidrogênio entre si!","A água (H₂O, massa molar = 18 g/mol) e o sulfeto de hidrogênio (H₂S, massa molar = 34 g/mol) são compostos hidrogenados de elementos pertencentes ao mesmo grupo da Tabela Periódica (calcogênios, grupo 16). Apesar de o H₂S possuir quase o dobro da massa molar da água, à temperatura ambiente e 1 atm a água é um líquido de ponto de ebulição anormalmente elevado (100 °C), enquanto o H₂S é um gás que ferve a −60 °C.","Essa expressiva diferença nas temperaturas de ebulição entre a água e o H₂S é explicada pelo fato de que:",["as moléculas de H₂S são apolares e unem-se por fracas forças de dispersão de London.","a água forma ligações covalentes triplas intermoleculares no estado líquido.","as moléculas de água estabelecem entre si intensas ligações de hidrogênio proporcionadas pela alta eletronegatividade do oxigênio, enquanto o H₂S interage por dipolo-dipolo mais fracas.","o enxofre sofre decomposição espontânea no H₂S absorvendo todo o calor do ambiente.","a molécula de H₂O possui estrutura cristalina iônica com transferência de elétrons para o hidrogênio."],3,"Tanto a molécula de água (H₂O) quanto a de sulfeto de hidrogênio (H₂S) possuem geometria angular e são polares. Contudo, o oxigênio é um átomo muito menor e de altíssima eletronegatividade (segundo elemento mais eletronegativo da Tabela), o que polariza intensamente a ligação O—H. Em decorrência disso, as moléculas de água formam entre si uma rede tridimensional contínua de fortíssimas ligações de hidrogênio (antigas pontes de H). O rompimento dessas interações na vaporização exige uma grande quantidade de energia térmica, elevando o ponto de ebulição para 100 °C. O átomo de enxofre no H₂S, por ser maior e menos eletronegativo, não tem densidade de carga suficiente para formar ligações de hidrogênio significativas, interagindo apenas por forças dipolo-dipolo convencionais bem mais fracas, o que faz o H₂S ferver na baixíssima temperatura de −60 °C. Alternativa A afirma erroneamente que H₂S é apolar; B cita ligação covalente intermolecular (inexistente); D e E violam princípios fundamentais da química."],"Propriedades físicas e forças intermoleculares":["As forças intermoleculares explicam e correlacionam as principais propriedades físicas dos compostos moleculares: 1) Ponto de Ebulição (PE) e Fusão (PF): quanto mais intensas as atrações intermoleculares, mais energia térmica é necessária para afastar as moléculas, resultando em maior PE. Comparando moléculas de massa molar similar, a ordem crescente de PE é: dipolo induzido (apolar) < dipolo permanente (polar) < ligação de hidrogênio. Entre moléculas apolares que interagem por dispersão de London, o PE aumenta com o aumento da massa molar (maior nuvem eletrônica) e com a linearidade da cadeia (menor ramificação permite maior superfície de contato); 2) Pressão de vapor e volatilidade: a pressão de vapor é inversamente proporcional às forças intermoleculares; líquidos com atrações fracas evaporam com facilidade (são muito voláteis) e têm alta pressão de vapor; líquidos com ligações de hidrogênio fortes têm baixa pressão de vapor; 3) Viscosidade: a resistência ao escoamento é maior em líquidos com fortes ligações intermoleculares ou cadeias entrelaçadas (como no glicerol/glicerina).",["Forças intermoleculares mais fortes → Ponto de Ebulição MAIOR","Forças intermoleculares mais fortes → Pressão de Vapor MENOR (menos volátil)","Forças intermoleculares mais fortes → Viscosidade MAIOR","Compostos apolares: PE aumenta com a massa molar e com a cadeia linear (menos ramificada)","Isômeros: cadeia linear tem maior superfície de contato → ferve a temperatura superior que o ramificado"],"Cuidado no ENEM: substância VOLÁTIL é aquela que evapora fácil porque tem forças fracas e ALTA pressão de vapor (como acetona e éter). Água evapora devagar porque tem ligações de H e BAIXA pressão de vapor.","Considere os três solventes orgânicos a seguir, com massas molares muito próximas: \n1. Butano (C₄H₁₀, hidrocarboneto apolar, MM = 58 g/mol, PE = −0,5 °C) \n2. Propanona (acetona, CH₃COCH₃, cetona polar sem H ligado a oxigênio, MM = 58 g/mol, PE = 56 °C) \n3. Propan-1-ol (CH₃CH₂CH₂OH, álcool polar com hidroxila, MM = 60 g/mol, PE = 97 °C)","A ordem crescente das temperaturas de ebulição observada (butano < propanona < propan-1-ol) deve-se ao fato de que as forças intermoleculares predominantes entre as moléculas de cada substância pura são, respectivamente:",["ligações de hidrogênio, forças de London e dipolo-dipolo permanente.","ligações iônicas, interações dipolo-dipolo e forças de London.","forças de London (dipolo induzido), forças de London e ligações de hidrogênio.","ligações metálicas, forças de London e ligações de hidrogênio.","forças de London (dipolo induzido), interações dipolo-dipolo permanente e ligações de hidrogênio."],4,"Análise detalhada das interações intermoleculares em cada líquido puro: \n1) O butano (C₄H₁₀) é um hidrocarboneto exclusivamente apolar; suas moléculas interagem apenas por forças fracas de dispersão de London (dipolo induzido-dipolo induzido), razão pela qual se vaporiza com facilíssima facilidade, apresentando ponto de ebulição abaixo de zero (−0,5 °C). \n2) A propanona (acetona) é uma molécula polar em razão da carbonila (C=O); contudo, como não possui átomo de hidrogênio ligado diretamente ao oxigênio, não estabelece ligações de hidrogênio com outras moléculas de acetona, interagindo por forças dipolo permanente-dipolo permanente de intensidade intermediária (PE = 56 °C). \n3) O propan-1-ol possui o grupo hidroxila (—OH) com hidrogênio covalentemente unido a oxigênio eletronegativo; suas moléculas associam-se por fortes ligações de hidrogênio, exigindo muito mais calor para se vaporizarem e apresentando o maior ponto de ebulição da série (97 °C). \nPortanto, a sequência correta é: London < dipolo-dipolo < ligações de hidrogênio. Alternativas A, B, D e E atribuem incorretamente as forças a cada substância."],"Alotropia (carbono, oxigênio e fósforo)":["Alotropia é o fenômeno em que um mesmo elemento químico é capaz de formar duas ou mais substâncias simples diferentes, as quais diferem quanto à estrutura cristalina (arranjo espacial dos átomos) ou quanto à atomicidade (número de átomos na molécula). Como consequência dessa organização estrutural distinta, os alótropos exibem propriedades físicas e químicas marcantemente diferentes: 1) Carbono: o diamante possui átomos de carbono em hibridização sp³ dispostos em uma rígida rede tetraédrica tridimensional compacta, o que lhe confere a maior dureza conhecida na escala de Mohs e caráter isolante elétrico; a grafite possui carbonos com hibridização sp² organizados em camadas planas hexagonais interligadas por elétrons pi deslocalizados, sendo escorregadia e macia (ótimo lubrificante e grafite de lápis) e excelente condutora de eletricidade; outros alótropos modernos incluem os fulerenos (C₆₀), nanotubos de carbono e o grafeno (monocamada bidimensional de espessura atômica); 2) Oxigênio: gás oxigênio (O₂, diatômico, comburente indispensável à respiração aeróbia) e gás ozônio (O₃, triatômico, oxidante enérgico tóxico ao nível do solo e escudo protetor contra UV na estratosfera); 3) Fósforo: fósforo branco (P₄, molecular, extremamente tóxico e inflamável espontaneamente ao ar) e fósforo vermelho (polimérico [P₄]ₙ, estável e usado nas caixas de fósforo).",["Alotropia: mesmo elemento químico formando substâncias simples distintas","Carbono diamante: sp³, rede tetraédrica 3D, isolante, dureza extrema","Carbono grafite: sp², camadas hexagonais planas com elétrons pi livres, conduz eletricidade","Grafeno: folha única bidimensional de grafite, altíssima resistência e condução","Oxigênio: O₂ (gás vital comburente) e O₃ (ozônio, bactericida e filtro UV)"],"Cuidado no ENEM: grafite e diamante são constituídos EXCLUSIVAMENTE por átomos de carbono! Eles são alótropos, não isômeros (isômeros têm a mesma fórmula molecular e são compostos diferentes, enquanto alótropos são formas simples do mesmo elemento).","O grafite e o diamante são duas formas alotrópicas naturais do elemento químico carbono. Embora ambos sejam compostos exclusivamente por átomos de carbono idênticos, o grafite é um sólido escuro, macio e excelente condutor de corrente elétrica, sendo utilizado em eletrodos industriais, enquanto o diamante é um cristal incolor, transparente, o material natural de maior dureza conhecido e isolante elétrico.","A notável capacidade do grafite de conduzir eletricidade, ausente no diamante, fundamenta-se no fato de que no grafite os átomos de carbono:",["possuem hibridização sp² em anéis hexagonais planares, com elétrons pi deslocalizados que possuem livre mobilidade ao longo das camadas.","são unidos por ligações iônicas que se dissociam espontaneamente no estado sólido.","possuem hibridização sp³ formando quatro ligações sigma rígidas e localizadas.","formam uma rede tridimensional contínua sem nenhum elétron livre na valência.","reagem com o oxigênio atmosférico liberando cátions de carbono móveis."],0,"A distinção entre as propriedades elétricas desses dois alótropos do carbono decorre da sua hibridização e arranjo geométrico: no diamante, cada átomo de carbono realiza 4 ligações simples sigma (σ) com outros 4 carbonos através de hibridização sp³, adotando geometria tetraédrica tridimensional contínua em que todos os elétrons de valência estão firmemente presos e localizados nas ligações covalentes, impedindo a passagem de corrente elétrica (isolante). No grafite, cada carbono liga-se a apenas 3 outros carbonos em hibridização sp² formando camadas planas compostas por anéis aromáticos hexagonais de geometria trigonal plana. O quarto elétron de valência de cada carbono ocupa um orbital 'p' puro perpendicular ao plano, deslocalizando-se em um sistema conjugado de elétrons pi (π) por toda a extensão da lâmina hexagonal. Esses elétrons deslocalizados possuem elevada mobilidade quando submetidos a uma diferença de potencial, conferindo ao grafite sua excelente condutibilidade elétrica ao longo dos planos. Alternativa C descreve o diamante; C cita ligação iônica inexistente em alótropos do carbono; D descreve rede sem elétrons livres (diamante); E inventa reação impossível."],"Ligação metálica e ligas metálicas cotidianas":["A ligação metálica ocorre entre átomos de elementos metálicos (baixa eletronegatividade e baixa energia de ionização) e é explicada com sucesso pelo modelo do 'mar de elétrons' (ou nuvem de elétrons livres de Drude-Lorentz): os átomos metálicos cedem seus elétrons de valência mais externos, transformando-se em cátions fixos organizados em um retículo cristalino geométrico ordenado, imersos em uma nuvem deslocalizada de elétrons livres que se movem caoticamente em todas as direções interatômicas. Esse mar de elétrons atua como uma 'cola' eletrostática que mantém a estrutura coesa e explica as notáveis propriedades macroscópicas dos metais: 1) Elevadíssima condutibilidade elétrica e térmica (sob uma d.d.p., os elétrons livres adquirem movimento ordenado instantâneo); 2) Maleabilidade (capacidade de ser conformado em lâminas finas sem se romper, pois as camadas de cátions podem deslizar umas sobre as outras no mar de elétrons) e Ductilidade (conformação em fios finos); 3) Brilho metálico característico (reflexão de todas as frequências de luz visível pelos elétrons livres da superfície). Ligas metálicas são misturas homogêneas de dois ou mais elementos (com pelo menos um metal predominante) preparadas para melhorar propriedades mecânicas: o Aço (ferro + 0,1 a 1,5% de carbono), o Aço Inoxidável (ferro + carbono + cromo e níquel, resistente à oxidação por formação de película passivadora de Cr₂O₃), o Bronze (cobre + estanho) e o Latão (cobre + zinco).",["Ligação metálica: cátions metálicos imersos em um 'mar de elétrons' livres deslocalizados","Propriedades típicas: alta condutibilidade elétrica e térmica no estado sólido e líquido, brilho, densidade","Maleabilidade (lâminas finas) e Ductilidade (fios finos): camadas de cátions deslizam sem romper o mar de elétrons","Aço: liga de Ferro (Fe) + Carbono (C)","Aço Inoxidável: Fe + C + Cromo (Cr) e Níquel (Ni) → camada protetora passivadora de óxido de cromo","Bronze: Cobre (Cu) + Estanho (Sn); Latão: Cobre (Cu) + Zinco (Zn); Amálgama: liga contendo Mercúrio (Hg)"],"Cuidado no ENEM: metais conduzem eletricidade no estado SÓLIDO e LÍQUIDO graças aos elétrons livres deslocalizados! Compostos iônicos só conduzem fundidos ou em solução graças a íons livres.","As panelas e talheres de aço inoxidável utilizados em cozinhas residenciais e industriais destacam-se pela altíssima resistência à corrosão e durabilidade mecânica em comparação com utensílios fabricados com ferro comum.","A resistência à oxidação do aço inoxidável e as características que permitem a conformação das chapas metálicas em panelas por estampagem sem quebra decorrem, respectivamente, da:",["adição de mercúrio líquido que dissolve o ferro e da presença de ligações covalentes direcionadas.","incorporação de cromo que forma uma película microscópica passivadora e protetora de óxido de cromo (Cr₂O₃) e da maleabilidade proporcionada pela mobilidade das camadas no mar de elétrons metálicos.","presença de cloreto de sódio iônico incrustado e da rigidez quebradiça do cristal eletrostático.","eliminação total de todos os elétrons do ferro transformando-o em um gás nobre cristalizado.","pintura com chumbo radioativo que esteriliza os alimentos contra o ataque de bactérias anaeróbias."],1,"Resolução: O aço comum é uma liga metálica de ferro e carbono. Quando exposto ao ar e umidade, o ferro oxida-se facilmente gerando a ferrugem (Fe₂O₃·nH₂O), que é porosa e esfarela, acelerando a corrosão. O aço inoxidável é produzido adicionando-se cromo (geralmente acima de 10,5% a 12%) e níquel à liga. O cromo possui grande afinidade pelo oxigênio do ar: ao reagir na superfície do metal, forma espontaneamente uma camada invisível, ultrafina, contínua e impermeável de óxido de cromo (Cr₂O₃). Essa película é autorregenerável e isola o metal do contato com o ar e a umidade (passivação química), conferindo a notável resistência inoxidável. Por outro lado, a capacidade de conformar o metal em formato de panelas por prensagem mecânica (estampagem) fundamenta-se na maleabilidade da ligação metálica: quando uma força externa é aplicada sobre o metal, planos inteiros de cátions deslizam sobre outros planos sem romper a ligação, pois os elétrons livres do 'mar de elétrons' adaptam-se instantaneamente às novas posições mantendo a atração eletrostática contínua e impedindo a fratura. Alternativas A, C, D e E trazem formulações contrárias à ciência dos materiais."],"Interações íon-dipolo e solvatação":["A interação íon-dipolo é a atração eletrostática que se estabelece entre um íon eletricamente carregado (cátion ou ânion) e uma molécula que possui momento dipolar permanente (molécula polar, como a água). A intensidade da força íon-dipolo é geralmente superior à das interações dipolo-dipolo convencionais e de London, aproximando-se da força das ligações de hidrogênio. Esse fenômeno é o responsável fundamental pelo processo físico-químico da SOLVATAÇÃO (ou hidratação, quando o solvente é a água) e pela dissolução de compostos iônicos em solventes polares. Ao dissolver sal de cozinha (NaCl) em água, as moléculas polares de água cercam e arrancam os íons do retículo cristalino: o polo negativo da água (o átomo de oxigênio de alta densidade eletrônica δ−) orienta-se e atrai os cátions sódio (Na⁺), enquanto os polos positivos da água (os átomos de hidrogênio com carga parcial δ+) orientam-se e atraem os ânions cloreto (Cl⁻), formando esferas de hidratação concêntricas ao redor de cada íon livre, mantendo-os estáveis e dispersos em solução.",["Interação Íon-Dipolo: atração entre íon (cátion ou ânion) e o dipolo de uma molécula polar","Solvatação / Hidratação: moléculas de solvente cercam os íons livres formando uma esfera protetora","Orientação da água: Oxigênio (δ−) atrai cátions (Na⁺, Ca²⁺); Hidrogênios (δ+) atraem ânions (Cl⁻, SO₄²⁻)","Energia de hidratação: compensa a energia reticular permitindo a dissolução do cristal iônico","Regra: 'Semelhante dissolve semelhante' (solventes polares dissolvem sais iônicos e solutos polares)"],"Cuidado no ENEM com o desenho da hidratação dos íons: o oxigênio da água (lado negativo) fica SEMPRE virado para o cátion positivo (Na⁺); os hidrogênios da água (lado positivo) ficam SEMPRE virados para o ânion negativo (Cl⁻)!","Ao adicionar uma colher de cloreto de sódio (NaCl sólido) em um copo de água pura à temperatura ambiente, o sólido dissolve-se rapidamente formando uma solução límpida e condutora de eletricidade.","A dissolução do retículo cristalino do NaCl na água ocorre porque as moléculas de água:",["reagem covalentemente com o sódio formando ligações metálicas insolúveis no copo.","sofre decomposição eletrolítica liberando gás hidrogênio e oxigênio que dissolvem o sal por agitação mecânica.","estabelecem fortes interações do tipo íon-dipolo com os íons do sal, orientando o oxigênio (polo negativo) em direção aos cátions Na⁺ e os hidrogênios (polo positivo) em direção aos ânions Cl⁻.","são apolares e interagem exclusivamente por dispersão de London com os núcleos dos átomos de cloro.","atuam como catalisadores biológicos que digerem as ligações iônicas do cristal."],2,"Resolução: No estado sólido, o cloreto de sódio é mantido coeso pela potente energia reticular eletrostática que atrai os íons Na⁺ e Cl⁻ alternadamente. A água (H₂O) é uma molécula fortemente polar: o átomo de oxigênio, por ser muito mais eletronegativo que o hidrogênio e apresentar geometria angular com pares de elétrons livres, concentra densidade de carga parcial negativa (δ−), enquanto os átomos de hidrogênio apresentam cargas parciais positivas (δ+). Ao entrar em contato com o cristal, as moléculas de água orientam seus polos elétricos de modo favorável: os oxigênios (δ−) interagem eletrostaticamente com os cátions Na⁺ na superfície do cristal, e os hidrogênios (δ+) interagem com os ânions Cl⁻. Essas interações íon-dipolo liberam energia (energia de hidratação) suficiente para vencer a energia reticular do cristal, arrancando os íons e envolvendo-os em uma camada estável de moléculas de água (solvatação/hidratação), impedindo sua recombinação e mantendo-os livres na solução aquosa condutora. Alternativas A, C, D e E trazem explicações incompatíveis com a físico-química das soluções."],"Hibridização de orbitais sp, sp² e sp³":["A teoria da hibridização de orbitais atômicos explica como átomos como o carbono conseguem formar quatro ligações equivalentes e geometrias espaciais bem definidas. O átomo de carbono no estado fundamental possui configuração 1s² 2s² 2p², com apenas 2 orbitais 'p' semipreenchidos (o que permitiria fazer apenas 2 ligações covalentes). Para atingir a tetravalência, um elétron do orbital 2s é promovido para o orbital 2p vazio; em seguida, os orbitais atômicos puros fundem-se e recombinam-se matematicamente gerando novos orbitais híbridos equivalentes com novas orientações geométricas no espaço: 1) Hibridização sp³: fusão de 1 orbital 's' com 3 orbitais 'p' originando 4 orbitais híbridos sp³ idênticos orientados para os vértices de um tetraedro regular (ângulo de 109°28'), característico de carbonos que realizam 4 ligações simples sigma (σ) (ex: metano CH₄, alcanos, diamante); 2) Hibridização sp²: fusão de 1 orbital 's' com 2 orbitais 'p' originando 3 orbitais híbridos sp² planares (ângulo de 120°, geometria trigonal plana) e 1 orbital 'p' puro perpendicular, característico de carbonos que realizam 1 ligação dupla e 2 simples (a dupla é formada por 1 ligação frontal σ_sp² e 1 ligação lateral π_p puro) (ex: eteno, anel benzênico, grafite); 3) Hibridização sp: fusão de 1 orbital 's' com 1 orbital 'p' originando 2 orbitais híbridos sp lineares (ângulo de 180°) e 2 orbitais 'p' puros perpendiculares, característico de carbonos com 1 ligação tripla (1 σ e 2 π) ou 2 ligações duplas acumuladas (ex: etino/acetileno, CO₂).",["Carbono sp³: 4 ligações simples (todas do tipo sigma σ); arranjo TETRAÉDRICO (~109,5°)","Carbono sp²: 1 dupla (1 σ + 1 π) + 2 simples (2 σ); arranjo TRIGONAL PLANO (120°)","Carbono sp: 1 tripla (1 σ + 2 π) + 1 simples (1 σ) OU 2 duplas; arranjo LINEAR (180°)","Ligação Sigma (σ): interpenetração frontal de orbitais ao longo do eixo internuclear (forte)","Ligação Pi (π): interpenetração lateral de orbitais 'p' puros paralelos (mais fraca que a sigma e mais reativa)"],"Mnemônica infalível no ENEM: conte as ligações pi! 0 ligações pi = sp³ (tetraédrico); 1 ligação pi = sp² (trigonal plano); 2 ligações pi = sp (linear).","O gás acetileno (etino, HC≡CH) é um combustível gasoso de alta temperatura amplamente empregado em maçaricos de oxiacetileno para soldagem e corte de trilhos e chapas de aço em virtude da chama azul que atinge mais de 3 000 °C.","Quanto à hibridização dos átomos de carbono e ao tipo de ligações químicas covalentes que unem os dois carbonos na molécula do acetileno, constata-se que os carbonos apresentam hibridização e conjunto de ligações:",["sp³, com quatro ligações sigma (σ) idênticas em geometria tetraédrica.","sp², com duas ligações pi (π) e uma ligação iônica deslocalizada.","sp³d², com seis ligações coordenadas octaédricas.","sp, com uma ligação frontal sigma (σ) e duas ligações laterais pi (π) compondo a ligação tripla linear.","p pura, sem qualquer hibridização, com geometria angular de 90°."],3,"Resolução: Na molécula de acetileno (etino: H—C≡C—H), cada átomo de carbono está ligado a apenas dois átomos (o hidrogênio e o outro carbono), possuindo duas nuvens eletrônicas na camada de valência. Para acomodar essas duas direções com o mínimo de repulsão eletrostática, o carbono sofre hibridização do tipo sp, combinando o orbital atômico 2s com um orbital 2p e gerando dois orbitais híbridos sp que formam um arranjo estritamente linear com ângulo de ligação de 180°. A ligação tripla entre os dois carbonos é constituída por: 1) Uma ligação covalente forte do tipo sigma (σ), formada pela sobreposição frontal ao longo do eixo internuclear entre um orbital híbrido sp de cada carbono; 2) Duas ligações covalentes do tipo pi (π), formadas pela sobreposição lateral e paralela dos dois pares de orbitais atômicos 2p puros que não participaram da hibridização. Cada carbono forma ainda uma ligação sigma (σ) com o orbital 1s do hidrogênio. Alternativas A e B trazem hibridizações e tipos de ligações incorretos para o etino; D cita orbitais d inexistentes no 2º período; E nega a hibridização dos orbitais."],"Velocidade média e fatores de influência":["A cinética química estuda a rapidez com que os reagentes são consumidos e os produtos são formados nas reações químicas, bem como os fatores que controlam essa velocidade. A velocidade média em relação a uma substância é a variação de sua concentração molar dividida pelo intervalo de tempo decorrido: v_m = |Δ[A]| / Δt. Para comparar velocidades entre diferentes espécies de uma mesma reação, divide-se a velocidade de cada substância pelo seu respectivo coeficiente estequiométrico. A velocidade de uma reação depende dos seguintes fatores: 1) Superfície de contato: em sistemas heterogêneos com reagentes sólidos, a trituração aumenta a área superficial exposta, multiplicando os choques intermoleculares por segundo (ex: comprimido efervescente em pó reage muito mais rápido que em pastilha inteira; lascas de lenha queimam mais depressa que uma tora maciça); 2) Temperatura: o aquecimento aumenta a energia cinética média das moléculas, fazendo com que uma fração consideravelmente maior de colisões ocorra com energia superior à energia de ativação (por isso alimentos estragam rápido fora da geladeira); 3) Concentração dos reagentes: maior número de partículas por unidade de volume amplia a frequência de choques efetivos; 4) Catalisador.",["Velocidade média: v_m = |Δ[A]| / (coeficiente estequiométrico · Δt)","Fatores que aumentam a velocidade: ↑ Temperatura, ↑ Concentração, ↑ Superfície de contato, ↑ Pressão (gases), adição de Catalisador","Superfície de contato: pó reage mais rápido que bloco maciço","Temperatura: alimentos duram mais na geladeira porque a baixa temperatura reduz a velocidade das reações de decomposição","Unidades comuns: mol/(L·s), mol/(L·min), g/min"],"Cuidado no ENEM: colocar alimento na geladeira NÃO mata as bactérias! A baixa temperatura apenas REDUZ a velocidade das reações químicas metabólicas de decomposição, retardando o apodrecimento.","Dois estudantes realizaram um experimento no laboratório de química para investigar a cinética de dissolução de comprimidos efervescentes antiácidos de mesma massa e composição em água destilada à mesma temperatura. O estudante 1 utilizou o comprimido inteiro, enquanto o estudante 2 triturou previamente o comprimido até transformá-lo em um pó fino antes de adicioná-lo à água.","O experimento do estudante 2 apresentou velocidade de liberação de bolhas de gás muito superior à do estudante 1 porque a trituração:",["aumentou a energia de ativação da reação química entre o bicarbonato e o ácido orgânico.","atuou como catalisador biológico que alterou a constante de equilíbrio da reação.","diminuiu a temperatura do sistema tornando a reação endotérmica mais rápida.","destruiu a estrutura molecular do bicarbonato convertendo-o em sódio metálico explosivo.","aumentou a superfície de contato do sólido com a água, proporcionando um maior número de colisões por segundo entre as espécies reagentes."],4,"A reação de efervescência de um comprimido antiácido em água é um processo heterogêneo entre reagentes sólidos (como bicarbonato de sódio e ácido cítrico) e a água. No comprimido intacto, apenas as moléculas situadas na superfície externa do comprimido têm contato imediato com a água; as partículas internas só reagem à medida que as camadas externas se dissolvem. Ao triturar o comprimido em pó fino, há uma fragmentação em milhões de micropartículas, o que expande dramaticamente a superfície de contato total exposta ao solvente aquoso. Com uma área interfacial muito maior, a frequência de choques entre as moléculas de água e os reagentes por unidade de tempo se multiplica, acelerando expressivamente a velocidade de consumo e liberação do gás CO₂. Alternativa A afirma que aumentou a energia de ativação (o que tornaria a reação mais lenta); C afirma alteração de temperatura inexistente; D afirma que trituração é catalisador biológico; E formula afirmação absurda."],"Teoria das colisões e complexo ativado":["A Teoria das Colisões estabelece que para que uma reação química ocorra, as partículas dos reagentes (átomos, moléculas ou íons) devem colidir fisicamente entre si. No entanto, nem toda colisão resulta em reação: a esmagadora maioria das colisões moleculares são choques elásticos que se limitam a ricochetear as partículas sem transformá-las. Para que uma colisão seja EFICAZ (ou efetiva) e resulte na formação de produtos, duas condições cumulativas e simultâneas devem ser rigorosamente atendidas: 1) Orientação espacial geometricamente favorável no instante do choque, permitindo a aproximação e interação dos centros atômicos reativos; 2) Energia cinética igual ou superior à energia de ativação (E_cinética ≥ Ea), necessária para vencer as forças de repulsão eletrostática das nuvens eletrônicas e enfraquecer as ligações originais. No ponto culminante da colisão eficaz, forma-se o complexo ativado: uma estrutura molecular intermediária, altamente instável e de máxima energia potencial, na qual as ligações químicas dos reagentes estão parcialmente rompidas e as novas ligações dos produtos estão simultaneamente se estabelecendo.",["Colisão eficaz (efetiva): resulta em reação química","Condição 1: Orientação geométrica espacial favorável","Condição 2: Energia cinética molecular igual ou superior à Energia de Ativação (E ≥ Ea)","Complexo ativado: estado transitório de MÁXIMA energia potencial e mínima estabilidade","Apenas uma minúscula fração das colisões moleculares é eficaz"],"Cuidado no ENEM: ter energia alta NÃO basta para reagir! Se as moléculas baterem com orientação geométrica errada, elas apenas ricocheteiam sem formar o complexo ativado.","Na fase gasosa à temperatura ambiente, bilhões de colisões ocorrem a cada segundo entre moléculas de hidrogênio (H₂) e de iodo (I₂). Apesar do elevadíssimo número de impactos mecânicos, a reação de formação do iodeto de hidrogênio gasoso (H₂ + I₂ → 2 HI) transcorre de forma extremamente lenta à temperatura ambiente.","À luz da Teoria das Colisões, a lentidão observada para essa reação gasosa deve-se ao fato de que:",["apenas uma fração extremamente diminuta das colisões possui orientação espacial favorável e energia cinética suficiente para superar a energia de ativação.","todas as colisões entre os gases são inelásticas convertendo toda a matéria em energia luminosa.","as moléculas de gases ideais não sofrem choques físicos no espaço tridimensional.","o complexo ativado possui menor energia potencial do que os reagentes isolados.","as moléculas de H₂ e I₂ são carregadas positivamente repelindo-se à distância."],0,"Segundo os postulados fundamentais da Teoria das Colisões, a velocidade de uma reação química não depende meramente da frequência total de choques por segundo, mas especificamente da frequência de colisões EFICAZES. Para que o choque rompa as ligações covalentes H—H e I—I e forme o complexo ativado [H···H···I···I], é estritamente necessário que as moléculas colidam com orientação geométrica adequada (paralelismo entre as ligações) e que a energia cinética somada das moléculas seja igual ou superior à barreira da energia de ativação (Ea). À temperatura ambiente, a imensa maioria das moléculas não atinge a velocidade térmica requerida pela distribuição de Maxwell-Boltzmann, de modo que quase todos os choques são ineficazes e elásticos, resultando em uma velocidade reacional quase imperceptível. Alternativa E supõe moléculas neutras com cargas líquidas; B afirma conversão irreal em luz; D erra a termodinâmica do complexo ativado (que tem máxima energia); E desconsidera a teoria cinética dos gases."],"Energia de ativação e ação de catalisadores":["A energia de ativação (Ea) é a quantidade mínima de energia que as moléculas dos reagentes devem possuir para que uma colisão eficaz consiga formar o complexo ativado e iniciar a reação química. Funciona como uma barreira energética: quanto MAIOR for a energia de ativação de uma reação, mais difícil é atingir o complexo ativado, menor a fração de moléculas capazes de reagir e mais LENTA será a reação; inversamente, reações com baixa energia de ativação são rápidas mesmo a temperaturas moderadas. Um catalisador é uma substância química que aumenta a velocidade de uma reação sem ser consumido no processo global. O mecanismo de ação do catalisador consiste em fornecer um caminho reacional alternativo (composto por novas etapas elementares) cuja energia de ativação é substancialmente MENOR do que a da reação não catalisada. O catalisador altera apenas a cinética (Ea e velocidade), mas NUNCA altera a termodinâmica da reação (o ΔH e o rendimento são rigorosamente os mesmos).",["Energia de ativação (Ea): barreira energética mínima para a reação ocorrer","Ea maior → reação mais lenta; Ea menor → reação mais rápida","Função do catalisador: DIMINUI a energia de ativação (Ea) criando um caminho alternativo","Catalisador é REGENERADO: entra e sai da reação na mesma quantidade estequiométrica","Catalisador NÃO altera: ΔH da reação, entalpia inicial/final, rendimento, constante Kc"],"Dica clássica do ENEM: os conversores catalíticos dos carros (catalisadores automotivos) usam platina, paládio e ródio para acelerar a oxidação de CO a CO₂ e de NO_x a N₂ antes que os gases saiam pelo escapamento!","Os conversores catalíticos instalados no sistema de escapamento dos automóveis modernos contêm metais nobres (como platina, paládio e ródio) finamente dispersos sobre suporte cerâmico. Esse dispositivo converte rapidamente poluentes letais e irritantes, como o monóxido de carbono (CO) e óxidos de nitrogênio (NO_x), em gases não tóxicos como CO₂ e N₂ antes de serem lançados na atmosfera.","A atuação dos metais nobres presentes no conversor catalítico automotivo tem como consequência:",["o consumo estequiométrico contínuo da platina que deve ser reposta a cada abastecimento do tanque.","a diminuição da energia de ativação da reação química, acelerando a conversão dos poluentes através de um novo mecanismo de superfície.","o aumento do valor absoluto da variação de entalpia (ΔH) da reação de oxidação do monóxido de carbono.","a eliminação total da necessidade de gás oxigênio na câmara de combustão do motor.","o deslocamento do equilíbrio termodinâmico gerando 100% de hidrogênio gasoso puro."],1,"Os conversores catalíticos veiculares atuam por catálise heterogênea: os gases poluentes (CO, hidrocarbonetos não queimados e NO_x) são adsorvidos na superfície ativa dos metais nobres (Pt, Pd, Rh). Essa adsorção enfraquece as ligações químicas das moléculas reagentes, permitindo a formação de novos complexos ativados com uma barreira de energia de ativação (Ea) expressivamente inferior à da reação homogênea não catalisada. Em consequência da menor barreira de energia de ativação, a taxa de oxidação do CO a CO₂ e a redução dos NO_x a N₂ aceleram-se em milhares de vezes na fração de segundo em que os gases atravessam o escapamento. Como todo catalisador autêntico, os metais nobres participam do mecanismo sem serem consumidos globalmente, saindo quimicamente regenerados. Alternativa C erra porque catalisador não altera ΔH; B afirma consumo de catalisador; D e E formulam hipóteses destituídas de fundamentação química."],"Lei da velocidade e ordem de reação":["A Lei da Velocidade (ou Lei da Ação das Massas, postulada experimentalmente por Guldberg e Waage) expressa a relação matemática direta entre a velocidade instantânea de uma reação e as concentrações molares dos seus reagentes a uma determinada temperatura: v = k · [A]ᵃ · [B]ᵇ, onde k é a constante de velocidade da reação (cujo valor depende da reação e da temperatura). Os expoentes 'a' e 'b' são ordens parciais de reação em relação aos reagentes A e B, e a soma (a + b) define a ordem global da reação. Para reações elementares (que ocorrem em uma única etapa microscópica), os expoentes da lei da velocidade coincidem rigorosamente com os coeficientes estequiométricos da equação química balanceada. No entanto, para reações não elementares (que ocorrem através de um mecanismo composto por múltiplas etapas elementares sucessivas), a velocidade global do processo é determinada e limitada unicamente pela velocidade da sua ETAPA MAIS LENTA (gargalo cinético).",["Lei da velocidade: v = k · [A]ᵃ · [B]ᵇ","k: constante de velocidade (aumenta com a temperatura)","Reação elementar: expoentes = coeficientes estequiométricos da reação","Reação não elementar (em etapas): a velocidade global segue a ETAPA LENTA!","Ordem global: soma dos expoentes (a + b)"],"Cuidado no ENEM: em reações com etapas (não elementares), esqueça a equação global para escrever a lei da velocidade
